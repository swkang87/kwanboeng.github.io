//   + payroll_audit_logs 의 확정·확정 취소 + payroll_transfer_exports(송금내역 내려받기). 함수가 admin 외에는 거부한다.
// 문구·기록 종류 이름은 config.js PAYROLL.ACCESS_LOG.
var ALOG = PCFG.ACCESS_LOG || {};
var ALOG_ACTIONS = ALOG.ACTIONS || {};
var ALOG_KINDS = ALOG.EXCEL_KINDS || {};
var ALOG_BADGE = { run_view: 'bb', slip_view: 'bp', self_slip_view: 'bgr', excel_download: 'ba', confirm: 'bg', unconfirm: 'br', mail_send: 'bb' };
var ALOG_SHOW = 200;
function alogActionLabel(a) { return ALOG_ACTIONS[a] || a; }
function alogPeriod(x) {
  if (!x.period) return '';
  var p = x.period.length === 7 ? fmtPeriodKo(x.period) : x.period + '년';
  return p + (x.run_type ? ' ' + (TYPE_LABELS[x.run_type] || x.run_type) : '');
}
function alogDetail(x) {
  var d = x.detail || {};
  if (x.action === 'excel_download') {
    var t = ALOG_KINDS[d.kind] || d.kind || '';
    if (d.format) t += ' · ' + (d.format === 'xlsx' ? '.xlsx' : '.xls');
    if (d.rows != null) t += ' · ' + d.rows + '건';
    if (d.sheets != null) t += ' · 시트 ' + d.sheets + '개';
    return t;
  }
  if (x.action === 'mail_send') {
    return (d.revised ? '수정 안내 · ' : '') + '대상 ' + (d.targets || 0) + '명 · 발송 ' + (d.sent || 0)
      + (d.failed ? ' · 실패 ' + d.failed : '') + (d.ok ? '' : ' · 오류');
  }
  if (x.action === 'confirm' && d.revision != null) return d.revision + '차 확정';
  if (x.action === 'run_view' && d.has_run === false) return '저장된 묶음 없음';
  if (x.action === 'slip_view' && d.saved === false) return '저장 전 미리보기';
  return '';
}
function dayStart(ds) { var p = ds.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }

function AccessLogTab() {
  var t0 = today();
  var f0 = localDateStr(new Date(Date.now() - (ALOG.DEFAULT_DAYS || 30) * 86400000));
  const [from, setFrom] = useState(f0);
  const [to, setTo] = useState(t0);
  const [actor, setActor] = useState('');
  const [target, setTarget] = useState('');
  const [action, setAction] = useState('');
  const [rows, setRows] = useState(null);
  const [show, setShow] = useState(ALOG_SHOW);
  const [people, setPeople] = useState({ users: [], emps: [] });

  useEffect(function() {
    var sb = getSb();
    Promise.all([
      sb.from('users').select('id,name').order('name'),
      sb.from('payroll_employees').select('id,user_id,name'),
    ]).then(function(r) {
      if (r[0].error) Sysbar.showError(r[0].error, '직원 목록');
      if (r[1].error) Sysbar.showError(r[1].error, '대상자 목록');
      var users = r[0].data || [];
      var um = {}; users.forEach(function(u) { um[u.id] = u; });
      var emps = (r[1].data || []).map(function(e) {
        return { id: e.id, name: e.user_id ? ((um[e.user_id] || {}).name || '') : (e.name || '') };
      }).sort(function(a, b) { return a.name.localeCompare(b.name, 'ko'); });
      setPeople({ users: users, emps: emps });
    });
  }, []);

  // 기간·필터는 서버 함수에서 거른다. 1000건 넘으면 나눠 받는다(fetchAllPaged).
  function load() {
    if (!from || !to || from > to) { setRows([]); return; }
    setRows(null); setShow(ALOG_SHOW);
    var end = dayStart(to); end.setDate(end.getDate() + 1);
    var args = { p_from: dayStart(from).toISOString(), p_to: end.toISOString(),
                 p_actor: actor || null, p_target: target || null, p_action: action || null };
    fetchAllPaged(function() { return getSb().rpc('payroll_access_log_list', args); }, '열람 기록 조회')
      .then(function(list) { setRows(list); })
      .catch(function(e) { reportErr(e); setRows([]); });
  }
  useEffect(function() { load(); }, [from, to, actor, target, action]);

  function downloadExcel() {
    if (!rows || !rows.length || !window.XLSX) return;
    var aoa = [['일시', '행위자', '행동', '대상 직원', '귀속', '내용']];
    rows.forEach(function(x) {
      aoa.push([fmtDateTime(x.at), x.actor_name || '', alogActionLabel(x.action), x.target_name || '', alogPeriod(x), alogDetail(x)]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{ wch: 17 }, { wch: 10 }, { wch: 18 }, { wch: 10 }, { wch: 16 }, { wch: 40 }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, ALOG.TAB_LABEL || 'log');
    var name = String(ALOG.EXCEL_FILE || '{FROM}_{TO}').replace('{FROM}', from).replace('{TO}', to) + '.xlsx';
    XLSX.writeFile(wb, name);
  }

  var sel = { width: 'auto', padding: '5px 8px', fontSize: 12 };
  var list = rows || [];
  return (
    <div className="card">
      <div className="sh">
        <div className="st">{ALOG.TITLE || ALOG.TAB_LABEL}</div>
        <div style={{ display: 'flex', gap: 6 }}>
          <button className="btn btn-s btn-sm" onClick={load}>새로고침</button>
          <button className="btn btn-s btn-sm" disabled={!list.length} onClick={downloadExcel}>📥 엑셀</button>
        </div>
      </div>
      {ALOG.NOTE && <div className="al al-i" style={{ fontSize: 12 }}>{ALOG.NOTE}</div>}
      <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12 }}>
        <input type="date" className="fi" style={sel} value={from} max={to} onChange={function(e){ if (e.target.value) setFrom(e.target.value); }} />
        <span style={{ color: '#94a3b8' }}>~</span>
        <input type="date" className="fi" style={sel} value={to} min={from} onChange={function(e){ if (e.target.value) setTo(e.target.value); }} />
        <select className="fi" style={sel} value={actor} onChange={function(e){ setActor(e.target.value); }}>
          <option value="">행위자 전체</option>
          {people.users.map(function(u) { return <option key={u.id} value={u.id}>{u.name}</option>; })}
        </select>
        <select className="fi" style={sel} value={target} onChange={function(e){ setTarget(e.target.value); }}>
          <option value="">대상 직원 전체</option>
          {people.emps.map(function(e) { return <option key={e.id} value={e.id}>{e.name}</option>; })}
        </select>
        <select className="fi" style={sel} value={action} onChange={function(e){ setAction(e.target.value); }}>
          <option value="">행동 전체</option>
          {Object.keys(ALOG_ACTIONS).map(function(k) { return <option key={k} value={k}>{ALOG_ACTIONS[k]}</option>; })}
        </select>
        {rows && <span style={{ fontSize: 12, color: '#64748b' }}>{list.length}건</span>}
      </div>
      {!rows ? <div className="loading">불러오는 중...</div> : list.length === 0 ? <div className="loading">기록이 없습니다.</div> : (
        <div>
          <div className="tbl-wrap">
            <table>
              <thead><tr><th>일시</th><th>행위자</th><th>행동</th><th>대상 직원</th><th>귀속</th><th>내용</th></tr></thead>
              <tbody>
                {list.slice(0, show).map(function(x) {
                  return (
                    <tr key={x.src + x.id}>
                      <td style={{ whiteSpace: 'nowrap', fontSize: 12 }}>{fmtDateTime(x.at)}</td>
                      <td style={{ whiteSpace: 'nowrap' }}>{x.actor_name || '-'}</td>
                      <td><span className={'badge ' + (ALOG_BADGE[x.action] || 'bgr')}>{alogActionLabel(x.action)}</span></td>
                      <td style={{ whiteSpace: 'nowrap' }}>{x.target_name || '-'}</td>
                      <td style={{ whiteSpace: 'nowrap', fontSize: 12 }}>{alogPeriod(x) || '-'}</td>
                      <td style={{ fontSize: 12, color: '#64748b' }}>{alogDetail(x)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {list.length > show && (
            <div style={{ textAlign: 'center', marginTop: 10 }}>
              <button className="btn btn-s btn-sm" onClick={function(){ setShow(show + ALOG_SHOW); }}>더 보기 ({list.length - show}건 남음)</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── 급여관리 본문 ────────────────────────────────────────────────
function PayrollView({ user }) {
  const [tab, setTab] = useState('edit');
  const [period, setPeriod] = useState(defaultPeriod());
  const [runType, setRunType] = useState('pay');
  var isMobile = useIsMobile();
  // 열람 기록 = admin 전용(DB 함수도 admin 외 거부). 「다른 부서로 보기」 중에는 그 부서처럼 숨긴다.
  var canAccessLog = !!user && user.role === 'admin' && !Sysbar.getViewAs();

  return (
    <div className="page">
      <div className="pr-head">
        <span className="pr-title">💼 급여관리</span>
        {tab !== 'settings' && tab !== 'access' && (
          <div className="pr-period">
            <button className="pr-pbtn" onClick={function(){ setPeriod(shiftPeriod(period, -1)); }}>◀</button>
            <input type="month" className="pr-month" value={period}
              onChange={function(e){ if (/^\d{4}-\d{2}$/.test(e.target.value)) setPeriod(e.target.value); }} />
            <button className="pr-pbtn" onClick={function(){ setPeriod(shiftPeriod(period, 1)); }}>▶</button>
            <span style={{ fontSize: 12, color: '#64748b', marginLeft: 4 }}>귀속연월</span>
          </div>
        )}
        <div className="itabs" style={{ marginLeft: isMobile ? 0 : 'auto' }}>
          <button className={tab === 'edit' ? 'itab active' : 'itab'} onClick={function(){ setTab('edit'); }}>✎ 급여 편집</button>
          <button className={tab === 'allowance' ? 'itab active' : 'itab'} onClick={function(){ setTab('allowance'); }}>📊 월별수당</button>
          <button className={tab === 'settings' ? 'itab active' : 'itab'} onClick={function(){ setTab('settings'); }}>⚙ 설정</button>
          {canAccessLog && <button className={tab === 'access' ? 'itab active' : 'itab'} onClick={function(){ setTab('access'); }}>🔍 {ALOG.TAB_LABEL || '열람 기록'}</button>}
        </div>
      </div>
      <MailSyncNote user={user} />
      {tab === 'edit' && (
        <div className="itabs" style={{ marginBottom: 12 }}>
          <button className={runType === 'pay' ? 'itab active' : 'itab'} onClick={function(){ setRunType('pay'); }}>💵 {TYPE_LABELS.pay}</button>
          <button className={runType === 'report' ? 'itab active' : 'itab'} onClick={function(){ setRunType('report'); }}>🏛 {TYPE_LABELS.report}</button>
        </div>
      )}
      {tab === 'edit' && <EditTab key={period + runType} user={user} period={period} runType={runType} isMobile={isMobile} />}
      {tab === 'allowance' && <AllowanceTab period={period} isMobile={isMobile} />}
      {tab === 'settings' && <SettingsTab user={user} />}
      {tab === 'access' && canAccessLog && <AccessLogTab />}
    </div>
  );
}

// ── 로그인 ───────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [locked, setLocked] = useState(false);
  const [remain, setRemain] = useState(0);

  useEffect(function() {
    var bf = Sysbar.Auth.checkBruteForce();
    if (bf.locked) { setLocked(true); setRemain(bf.remainSec); }
    var timer = setInterval(function() {
      var bf2 = Sysbar.Auth.checkBruteForce();
      if (bf2.locked) { setLocked(true); setRemain(bf2.remainSec); }
      else { setLocked(false); setRemain(0); }
    }, 1000);
    return function() { clearInterval(timer); };
  }, []);

  function doLogin() {
    if (locked) return;
    if (!phone.trim() || !pw) { setErr('아이디와 비밀번호를 입력하세요.'); return; }
    setLoading(true); setErr('');
    Sysbar.Auth.doLogin(getSb(), phone, pw, { allowedRoles: ['admin', 'manager', 'staff', 'employee'] })
      .then(function(result) {
        setLoading(false);
        if (result.ok) { onLogin(result.user); return; }
        if (result.locked) { setLocked(true); setRemain(result.remainSec); }
        setErr(result.reason);
      });
  }

  return (
    <div className="lwrap">
      <div className="lbox">
        <div className="llogo">🏢</div>
        <div className="ltit">{APP_CONFIG.COMPANY_SHORT}</div>
        <div className="lsub">관리포털 · 급여관리 (관리자{ADMIN_TEAM ? ' · ' + ADMIN_TEAM : ''})</div>
        {err && <div className="al al-e">{err}</div>}
        <div style={{ marginBottom: 12 }}>
          <label className="fl">아이디 (전화번호)</label>
          <input className="fi" value={phone} placeholder="전화번호 입력" disabled={locked}
            onChange={function(e){ setPhone(e.target.value); }}
            onKeyDown={function(e){ if (e.key === 'Enter') document.getElementById('ap-pw').focus(); }} />
        </div>
        <div style={{ marginBottom: 20 }}>
          <label className="fl">비밀번호</label>
          <input id="ap-pw" type="password" className="fi" value={pw} placeholder="비밀번호 입력" disabled={locked}
            onChange={function(e){ setPw(e.target.value); }}
            onKeyDown={function(e){ if (e.key === 'Enter') doLogin(); }} />
        </div>
        <button className="btn btn-p" onClick={doLogin} disabled={loading || locked} style={{ width: '100%', justifyContent: 'center', padding: '12px' }}>
          {locked ? ('잠금 ' + remain + '초') : (loading ? '로그인 중...' : '로그인')}
        </button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);

const CURRENT_PAGE = 'py';
const PageView = PayrollView;

// ── 관리포털 페이지 정의 (네비게이션) ──────────────────────────────────────
// 각 페이지 파일은 상단에서 CURRENT_PAGE 를 지정한다.
//   admin-worklog.html  → 'wl'
//   admin-perf.html     → 'pf'
//   admin-payroll.html  → 'py'
//   admin-account.html  → 'ab'
//   admin-staff.html    → 'st'
// 관리포털 하위 화면 목록 · 권한 판정은 sysbar.js 한 곳에서 관리 (PC는 왼쪽 메뉴, 휴대폰은 아래 탭 줄)
const PORTAL_PAGES = Sysbar.PORTAL_PAGES;

function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    if (v && v.id && v.role) return v;
    return null;
  })();
  const [user, setUser] = useState(initialUser);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [teamName, setTeamName] = useState('');
  const [accessChecked, setAccessChecked] = useState(false);

  useEffect(function() {
    if (initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad(getSb());
    if (wasInvalidated) { setUser(null); return; }
    setSsoChecked(true);
  }, []);

  useEffect(function() {
    if (!initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad(getSb());
    if (wasInvalidated) { logout(); return; }
    if (ssoChecked) { Sysbar.SessionManager.onLogin(function() { logout(); }); }
  }, []);

  useEffect(function() {
    if (!user) return;
    // 팀 이름(상단 메뉴 표시용)과 기능 권한(DB my_perms)을 함께 읽은 뒤 화면을 그린다
    var teamP = user.role === 'admin' ? Promise.resolve('관리자')
      : (!user.team_id ? Promise.resolve('')
        : getSb().from('teams').select('name').eq('id', user.team_id).single().then(function(r) { return r.data ? r.data.name : ''; }));
    Promise.all([teamP, Sysbar.loadPerms(getSb())]).then(function(res) {
      setTeamName(res[0]);
      setAccessChecked(true);
    });
  }, [user ? user.id : null]);

  function handleLogin(u) {
    setUser(u);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }

  function logout() {
    Sysbar.Auth.logout(getSb());
    setUser(null); setTeamName('');
  }

  if (!ssoChecked || (user && !accessChecked)) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh', background: 'var(--theme,#0f172a)', color: '#94a3b8', fontSize: 14 }}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  if (!Sysbar.canPortal()) { location.replace('admin-worklog.html'); return null; }

  // 이 화면 권한이 없으면 볼 수 있는 첫 관리포털 화면으로 보낸다 (권한 판정 = Sysbar.can → DB has_perm 과 같은 결과)
  var MY_PAGE = PORTAL_PAGES.filter(function(pg) { return pg.key === CURRENT_PAGE; })[0];
  if (MY_PAGE && !Sysbar.can(MY_PAGE.need)) {
    var firstPage = PORTAL_PAGES.filter(function(pg) { return Sysbar.can(pg.need); })[0];
    location.replace(firstPage ? firstPage.href : 'admin-worklog.html'); return null;
  }

  function canShow(need) { return Sysbar.can(need); }

  return (
    <div>
      <SysBar sb={getSb()} activeKey="admin" user={user} teamName={teamName} onLogout={logout} />
      <div style={{ background: 'var(--theme,#0f172a)', padding: '6px 18px 8px', flexShrink: 0, borderBottom: '2px solid #7c3aed', position: 'sticky', top: 'var(--sysbar-h,38px)', zIndex: 250 }}>
        <p style={{ margin: 0, fontSize: 9, lineHeight: '1.2', color: '#475569', letterSpacing: 1, textTransform: 'uppercase', fontWeight: 600 }}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{ margin: 0, fontSize: 14, lineHeight: '1.3', fontWeight: 800, color: 'white', letterSpacing: -0.3 }}>관리 포털</p>
      </div>
      <div className="top-nav sys-portal-tabs">
        {PORTAL_PAGES.filter(function(pg){ return canShow(pg.need); }).map(function(pg) {
          return (
            <button key={pg.key}
              className={CURRENT_PAGE === pg.key ? 'nav-btn active' : 'nav-btn'}
              onClick={function(){ if (CURRENT_PAGE !== pg.key) location.href = pg.href; }}>
              {pg.tabLabel}
            </button>
          );
        })}
      </div>
      <PageView user={user} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
