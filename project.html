        <h2 style={{ fontSize: 16, fontWeight: 900, color: stopped?'#9ca3af':'var(--theme,#0f172a)', marginBottom: 8 }}>{p.name}</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(140px,1fr))', gap: 8, fontSize: 12 }}>
          <div><span style={{ fontSize: 9, color: '#94a3b8' }}>발주처</span><br/><strong>{p.client}</strong></div>
          {p.client_dept && <div><span style={{ fontSize: 9, color: '#94a3b8' }}>발주부서/담당자</span><br/><strong>{p.client_dept} / {p.client_contact}</strong></div>}
          <div><span style={{ fontSize: 9, color: '#94a3b8' }}>PM</span><br/><strong>{uName(p.pm_id)}</strong></div>
          <div><span style={{ fontSize: 9, color: '#94a3b8' }}>기간</span><br/><strong>{ff(p.start_date)} ~ {ff(p.end_date)}</strong></div>
          <div><span style={{ fontSize: 9, color: '#94a3b8' }}>참여인원</span><br/><strong>{
            (() => {
              const isPM = user?.role === 'admin' || p.pm_id === user?.id;
              const visible = members.filter(m => isPM || m.role !== 'contractor');
              return visible.map(m => uName(m.user_id)).join(', ') || '—';
            })()
          }</strong></div>
          <div><span style={{ fontSize: 9, color: '#94a3b8' }}>현재 공정률</span><br/><PBar pct={lp} w={110} /></div>
        </div>
        {p.memo && <div style={{ marginTop: 8, padding: '6px 10px', background: '#f8fafc', borderRadius: 6, fontSize: 12, color: '#64748b' }}>{p.memo}</div>}
      </div>

      {/* 최신 과업진행사항 */}
      {(() => {
        const lr = reports.length > 0 ? reports[reports.length-1] : null;
        if (!lr) return null;
        const barColor = lr.progress_pct>=80?'#059669':lr.progress_pct>=50?'#2563eb':'#f59e0b';
        return (
          <div className="card card-p" style={{ marginBottom: 10, borderLeft: '4px solid #3b82f6' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
              <span style={{ fontSize: 12, fontWeight: 800, color: '#0f172a' }}>📋 최근 과업진행사항</span>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                  <div style={{ width: 52, height: 6, background: '#e2e8f0', borderRadius: 3, overflow: 'hidden' }}>
                    <div style={{ width: `${lr.progress_pct}%`, height: '100%', background: barColor, borderRadius: 3 }} />
                  </div>
                  <span style={{ fontSize: 12, fontWeight: 700, color: barColor }}>{lr.progress_pct}%</span>
                </div>
                <span style={{ fontSize: 11, color: '#94a3b8' }}>{ff(lr.week_date)} 기준</span>
              </div>
            </div>
            <div style={{ fontSize: 13, color: '#334155', lineHeight: 1.7, wordBreak: 'keep-all' }}>{lr.summary || '—'}</div>
            {lr.issues && <div style={{ fontSize: 11, color: '#dc2626', marginTop: 6, padding: '4px 8px', background: '#fef2f2', borderRadius: 5 }}>⚠ {lr.issues}</div>}
          </div>
        );
      })()}

      {renderChart()}

      {/* Upcoming events */}
      {ue.length > 0 && (
        <div className="card card-p" style={{ marginBottom: 10, border: '1px solid #fde68a' }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: '#92400e', marginBottom: 8 }}>🔜 다가오는 주요 공정</div>
          {ue.map(e => { const s = ec(e.type); return (
            <div key={e.id} style={{ padding: '9px 12px', borderRadius: 8, background: s.bg, borderLeft: `4px solid ${s.bd}`, marginBottom: 6 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                <span style={{ fontSize: 15 }}>{EV_ICON[e.type]}</span>
                <span style={{ fontWeight: 800, fontSize: 13, color: s.tx }}>{e.title}</span>
                <Bd bg={s.bd}>{e.type}</Bd>
                <div style={{ marginLeft:'auto', display:'flex', gap:4, flexShrink:0 }}>
                  <button onClick={() => setEditEvData(e)} style={{ background:'transparent', color:'#3b82f6', border:'1px solid #bfdbfe', borderRadius:4, padding:'2px 7px', fontSize:10, cursor:'pointer', fontFamily:"'Noto Sans KR',sans-serif", fontWeight:600 }}>수정</button>
                  <button onClick={() => deleteEvent(e.id)} style={{ background:delEvId===e.id?'#ef4444':'transparent', color:delEvId===e.id?'#fff':'#94a3b8', border:'1px solid '+(delEvId===e.id?'#ef4444':'#cbd5e1'), borderRadius:4, padding:'2px 7px', fontSize:10, cursor:'pointer', fontFamily:"'Noto Sans KR',sans-serif", fontWeight:600 }}>{delEvId===e.id?'삭제확인':'삭제'}</button>
                </div>
              </div>
              <div style={{ fontSize: 11, color: '#64748b', marginTop: 2 }}>📅 {ff(e.event_date)} · {uName(e.registered_by)}{e.memo ? ' · ' + e.memo : ''}</div>
            </div>
          );})}
        </div>
      )}

      {/* Done events timeline */}
      <div className="card card-p" style={{ marginBottom: 10 }}>
        <div style={{ fontSize: 12, fontWeight: 800, color: '#0f172a', marginBottom: 10 }}>📅 지난 주요 공정</div>
        {de.length === 0 ? <div style={{ fontSize: 12, color: '#94a3b8' }}>없음</div> : (
          <div className="timeline">
            <div className="timeline-line" />
            {de.map(e => { const s = ec(e.type); return (
              <div key={e.id} className="timeline-item">
                <div className="timeline-dot" style={{ background: s.bd, boxShadow: `0 0 0 2px ${s.bd}` }} />
                <div style={{ padding: '6px 10px', borderRadius: 6, background: s.bg, flex:1 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexWrap:'wrap' }}>
                    <span>{EV_ICON[e.type]}</span>
                    <span style={{ fontWeight: 700, fontSize: 12, color: s.tx }}>{e.title}</span>
                    <Bd bg={s.bd}>{e.type}</Bd>
                    <div style={{ marginLeft:'auto', display:'flex', gap:4, flexShrink:0 }}>
                      <button onClick={() => setEditEvData(e)} style={{ background:'transparent', color:'#3b82f6', border:'1px solid #bfdbfe', borderRadius:4, padding:'2px 7px', fontSize:10, cursor:'pointer', fontFamily:"'Noto Sans KR',sans-serif", fontWeight:600 }}>수정</button>
                      <button onClick={() => deleteEvent(e.id)} style={{ background:delEvId===e.id?'#ef4444':'transparent', color:delEvId===e.id?'#fff':'#94a3b8', border:'1px solid '+(delEvId===e.id?'#ef4444':'#cbd5e1'), borderRadius:4, padding:'2px 7px', fontSize:10, cursor:'pointer', fontFamily:"'Noto Sans KR',sans-serif", fontWeight:600 }}>{delEvId===e.id?'삭제확인':'삭제'}</button>
                    </div>
                  </div>
                  <div style={{ fontSize: 10, color: '#64748b', marginTop: 2 }}>{ff(e.event_date)} · {uName(e.registered_by)}{e.memo ? ' · ' + e.memo : ''}</div>
                </div>
              </div>
            );})}
          </div>
        )}
      </div>

      {/* Weekly report history */}
      <div className="card card-p">
        <div style={{ fontSize: 12, fontWeight: 800, color: '#0f172a', marginBottom: 8 }}>📋 주간 보고 이력</div>
        {reports.length === 0 ? <div style={{ fontSize: 12, color: '#94a3b8' }}>보고 이력이 없습니다.</div> :
          reports.slice().reverse().map(r => (
            <div key={r.id} style={{ padding: '7px 10px', borderLeft: '3px solid #3b82f6', marginBottom: 6, borderRadius: '0 6px 6px 0', background: '#f8fafc' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
                <span style={{ fontSize: 11, fontWeight: 700 }}>{ff(r.week_date)}</span>
                <PBar pct={r.progress_pct} w={55} />
                <Delta prev={r.prev_pct} curr={r.progress_pct} />
              </div>
              <div style={{ fontSize: 12, color: '#334155', lineHeight: 1.6 }}>{r.summary}</div>
              {r.issues && <div style={{ fontSize: 11, color: '#dc2626', marginTop: 1 }}>⚠ {r.issues}</div>}
            </div>
          ))
        }
      </div>

      {/* Edit Modals */}
      {editModal === 'report' && (
        <WeeklyReportModal projectId={id} userId={user?.id}
          prevData={reports.slice().reverse()[0]}
          onClose={() => setEditModal(null)}
          onSaved={() => { setEditModal(null); loadAll(); }} />
      )}
      {editModal === 'event' && (
        <EventModal projectId={id} userId={user && user.id}
          onClose={() => setEditModal(null)}
          onSaved={() => { setEditModal(null); loadAll(); }} />
      )}
      {editEvData && (
        <EventModal projectId={id} userId={user && user.id} eventData={editEvData}
          onClose={() => setEditEvData(null)}
          onSaved={() => { setEditEvData(null); loadAll(); }} />
      )}
      {editModal === 'editProject' && project && (
        <EditProjectModal project={project} userId={user?.id}
          users={users}
          onClose={() => setEditModal(null)}
          onSaved={() => { setEditModal(null); loadAll(); }} />
      )}
    </div>
  );
}

// ─── My Projects (PM/Support input) ───
function MyProjects({ user, gp, appData }) {
  const [myProjects, setMyProjects] = useState([]);
  const [users, setUsers] = useState([]);
  const [reports, setReports] = useState([]);
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [msg, setMsg] = useState('');

  const buildSorted = (allProjects, allReports, allUsers, allMembers) => {
    const PM_ORDER_MINE = ['김병용','박호진','장용기','조원범','이규민'];
    // 인덱싱: 이름과 최신 progress_pct
    const userNameMap = new Map();
    for (const u of allUsers) userNameMap.set(u.id, u.name || '');
    const latestPctMap = new Map();
    for (const r of allReports) {
      const cur = latestPctMap.get(r.project_id);
      if (!cur || r.week_date > cur.date) latestPctMap.set(r.project_id, { date: r.week_date, pct: r.progress_pct || 0 });
    }
    const catOrd    = (c)   => c === '사급' ? 0 : c === '관급' ? 1 : 2;
    const pmOrd     = (pid) => { const n = userNameMap.get(pid) || ''; const i = PM_ORDER_MINE.indexOf(n); return i >= 0 ? i : 99; };
    const latestPct = (pid) => latestPctMap.get(pid)?.pct || 0;
    const sortList  = (list) => {
      const active = list.filter(p => p.status !== '완료').sort((a, b) =>
        catOrd(a.category) - catOrd(b.category) ||
        pmOrd(a.pm_id)     - pmOrd(b.pm_id)     ||
        (a.status === '중지' ? 1 : 0) - (b.status === '중지' ? 1 : 0) ||
        latestPct(b.id)    - latestPct(a.id)
      );
      const completed = list.filter(p => p.status === '완료')
        .sort((a, b) => (b.completed_at || b.end_date || '').localeCompare(a.completed_at || a.end_date || ''));
      return [...active, ...completed];
    };
    if (user.role === 'admin') return sortList(allProjects);
    const pmIds = new Set(allProjects.filter(p => p.pm_id === user.id).map(p => p.id));
    const myMemberPids = new Set(allMembers.map(m => String(m.project_id).trim()));
    const mine = allProjects.filter(p => pmIds.has(String(p.id).trim()) || myMemberPids.has(String(p.id).trim()));
    return sortList(mine);
  };

  useEffect(() => { loadAll(); }, []);

  const loadAll = async () => {
    setLoading(true);
    const [memberProjs, us, rp, ev] = await Promise.all([
      sb.from('project_members').select('project_id, role').eq('user_id', user.id),
      sb.from('users').select('id, name'),
      sb.from('weekly_reports').select('*').gte('week_date', sixMonthsAgo()).order('week_date', { ascending: false }),
      sb.from('project_events').select('*').gte('event_date', thirtyDaysAgo()),
    ]);
    const usData = us.data || [];
    const rpData = rp.data || [];
    const mbData = memberProjs.data || [];
    let allMine;
    if (user.role === 'admin') {
      const { data: all } = await sb.from('projects').select('*, completed_at').order('name');
      allMine = buildSorted(all || [], rpData, usData, mbData);
    } else {
      const myPids = mbData.map(m => String(m.project_id).trim());
      let myProjs = [];
      if (myPids.length > 0) {
        const { data } = await sb.from('projects').select('*, completed_at').in('id', myPids);
        myProjs = data || [];
      }
      const { data: pmProjs } = await sb.from('projects').select('*, completed_at').eq('pm_id', user.id);
      const existIds = new Set(myProjs.map(p => p.id));
      const merged = [...myProjs, ...(pmProjs || []).filter(p => !existIds.has(p.id))];
      allMine = buildSorted(merged, rpData, usData, mbData);
    }
    setMyProjects(allMine);
    setUsers(usData);
    setReports(rpData);
    setEvents(ev.data || []);
    setLoading(false);
  };

  const refresh = () => { if (appData?.reload) appData.reload(); else loadAll(); };

  // ── 인덱싱 (렌더 중 find/filter/sort 반복 제거) ──
  const projectPmById = useMemo(() => {
    const m = new Map();
    for (const p of myProjects) m.set(p.id, p.pm_id);
    return m;
  }, [myProjects]);
  const isPM = (pid) => projectPmById.get(pid) === user.id || user.role === 'admin';

  const userNameById = useMemo(() => {
    const m = new Map();
    for (const u of users) m.set(u.id, u.name || '');
    return m;
  }, [users]);
  const uName = (id) => userNameById.get(id) || '';

  const latestReportByProject = useMemo(() => {
    const m = new Map(); // pid -> latest report
    for (const r of reports) {
      const cur = m.get(r.project_id);
      if (!cur || r.week_date > cur.week_date) m.set(r.project_id, r);
    }
    return m;
  }, [reports]);
  const getLatestReport = (pid) => latestReportByProject.get(pid);

  const nextEventByProject = useMemo(() => {
    const todayStr3 = today();
    const m = new Map();
    for (const e of events) {
      if (e.event_date < todayStr3) continue; // 오늘 기준 미래 공정만
      const cur = m.get(e.project_id);
      if (!cur || e.event_date < cur.event_date) m.set(e.project_id, e);
    }
    return m;
  }, [events]);
  const getNextEvent = (pid) => nextEventByProject.get(pid);

  const showMsg = (m) => { setMsg(m); setTimeout(() => setMsg(''), 3000); };

  if (loading) return <Spinner />;

  return (
    <div>
      <h2 className="section-title">📁 내 프로젝트</h2>
      {msg && <div className="alert alert-success">{msg}</div>}
      {myProjects.length === 0 ? (
        <div className="card card-p" style={{ color: '#94a3b8', fontSize: 13 }}>담당 프로젝트가 없습니다.</div>
      ) : myProjects.map(p => {
        const lr = getLatestReport(p.id);
        const ne = getNextEvent(p.id);
        const amPM = isPM(p.id);
        return (
          <div key={p.id} className="my-proj-card" style={{ borderLeftColor: p.status === '완료' ? '#6b7280' : CAT_COLOR[p.category], opacity: p.status === '완료' ? 0.65 : 1 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 6, marginBottom: 8 }}>
              <div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 3 }}>
                  <Bd bg={CAT_COLOR[p.category]}>{p.category}</Bd>
                  <Bd bg={STATUS_COLOR[p.status]}>{p.status}</Bd>
                  {amPM && <Bd bg="var(--theme,#0f172a)">PM</Bd>}
                </div>
                <div style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', marginBottom: 2, cursor: 'pointer' }} onClick={() => gp(p.id)}>{p.name}</div>
                <div style={{ fontSize: 11, color: '#64748b' }}>{p.client} · {fs(p.start_date)} ~ {fs(p.end_date)}</div>
                {ne && <div style={{ fontSize: 11, color: ec(ne.type).tx, marginTop: 2 }}>{EV_ICON[ne.type]} 다음: {ne.title} ({fs(ne.event_date)})</div>}
              </div>
              <PBar pct={lr?.progress_pct || 0} w={110} />
            </div>
            {lr && (
              <div style={{ fontSize: 11, color: '#64748b', padding: '6px 10px', background: '#f8fafc', borderRadius: 6, marginBottom: 8 }}>
                <span style={{ fontWeight: 700 }}>최근 보고 ({ff(lr.week_date)})</span>: {lr.summary}
              </div>
            )}
            <div className="my-proj-actions">
              <button className="btn btn-success btn-sm" onClick={() => setModal({ type: 'report', projectId: p.id, data: lr })}>
                📝 주간보고 입력
              </button>
              {amPM && <>
                <button className="btn btn-secondary btn-sm" onClick={() => setModal({ type: 'event', projectId: p.id })}>
                  📌 주요공정 등록
                </button>
                <button className="btn btn-secondary btn-sm" onClick={() => setModal({ type: 'editProject', projectId: p.id, data: p })}>
                  ✏️ 프로젝트 수정
                </button>
              </>}
              <button className="btn btn-secondary btn-sm" onClick={() => gp(p.id)}>
                🔍 상세보기
              </button>
            </div>
          </div>
        );
      })}

      {/* Modals */}
      {modal?.type === 'report' && (
        <WeeklyReportModal projectId={modal.projectId} userId={user.id} prevData={modal.data}
          onClose={() => setModal(null)} onSaved={() => { setModal(null); refresh(); showMsg('주간 보고가 저장되었습니다.'); }} />
      )}
      {modal?.type === 'event' && (
        <EventModal projectId={modal.projectId} userId={user.id}
          onClose={() => setModal(null)} onSaved={() => { setModal(null); refresh(); showMsg('주요 공정이 등록되었습니다.'); }} />
      )}
      {modal?.type === 'editProject' && (
        <EditProjectModal project={modal.data} userId={user.id}
          users={users}
          onClose={() => setModal(null)} onSaved={() => { setModal(null); refresh(); showMsg('프로젝트 정보가 수정되었습니다.'); }} />
      )}
    </div>
  );
}

// ─── Weekly Report Input Modal ───
function WeeklyReportModal({ projectId, userId, prevData, onClose, onSaved }) {
  const defaultDate = reportMonday();
  const [weekDate, setWeekDate] = useState(defaultDate);
  const [pct, setPct] = useState(prevData?.progress_pct || 0);
  const [prevPct, setPrevPct] = useState(prevData?.progress_pct || 0);
  const [summary, setSummary] = useState('');
  const [oldSummary, setOldSummary] = useState('');
  const [issues, setIssues] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [dateErr, setDateErr] = useState('');

  // 직전 보고 데이터 자동 불러오기
  useEffect(() => {
    if (!projectId) return;
    const fetchPrev = async () => {
      try {
        const { data } = await sb
          .from('weekly_reports')
          .select('summary, progress_pct, issues')
          .eq('project_id', projectId)
          .order('week_date', { ascending: false })
          .limit(1)
          .single();
        if (data) {
          setSummary(data.summary || '');
          setOldSummary(data.summary || '');
          setIssues(data.issues || '');
          setPrevPct(data.progress_pct || 0);
          setPct(data.progress_pct || 0);
        }
      } catch (e) {
        // 이전 보고 없음 - 기본값 유지
      }
    };
    fetchPrev();
  }, [projectId]);

  const handleDateChange = (e) => {
    const val = e.target.value;
    if (!val) return;
    if (!isMonday(val)) {
      setDateErr('보고 기준일은 월요일만 선택 가능합니다.');
      return;
    }
    setDateErr('');
    setWeekDate(val);
  };

  const getRangeLabel = (wd) => {
    if (!wd) return '';
    const mon = new Date(wd + 'T00:00:00');
    const tue = new Date(mon); tue.setDate(tue.getDate() - 6);
    return (tue.getMonth()+1) + '/' + tue.getDate() + '(화) ~ ' + (mon.getMonth()+1) + '/' + mon.getDate() + '(월) 보고분';
  };

  const save = async () => {
    if (!summary) { setErr('과업진행사항을 입력해주세요.'); return; }
    if (!isMonday(weekDate)) { setErr('보고 기준일은 월요일이어야 합니다.'); return; }
    setLoading(true); setErr('');
    const payload = { project_id: projectId, week_date: weekDate, progress_pct: parseInt(pct), prev_pct: parseInt(prevPct), summary, next_plan: '', issues, reported_by: userId, updated_at: new Date().toISOString() };
    const { error } = await sb.from('weekly_reports').upsert(payload, { onConflict: 'project_id,week_date' });
    if (error) { setErr('저장 오류: ' + error.message); setLoading(false); return; }
    const { error: clErr } = await sb.from('change_logs').insert({ project_id: projectId, field_name: '주간보고', old_value: String(prevPct) + '%' + (oldSummary ? ' | ' + oldSummary : ''), new_value: String(parseInt(pct)) + '% | ' + weekDate + (summary ? ' | ' + summary : ''), changed_by: userId, created_at: new Date().toISOString() });
    if (clErr) console.error('change_log insert error:', clErr.message);
    onSaved();
  };

  return (
    <Modal title="주간 공정 보고 입력" onClose={onClose}>
      {err && <div className="alert alert-error">{err}</div>}
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">보고 기준일 (월요일)</label>
          <input type="date" className="form-input" value={weekDate} onChange={handleDateChange} />
          {dateErr && <div style={{ fontSize: 11, color: '#dc2626', marginTop: 2 }}>{dateErr}</div>}
          {!dateErr && weekDate && <div style={{ fontSize: 11, color: '#64748b', marginTop: 2 }}>{getRangeLabel(weekDate)}</div>}
        </div>
        <div className="form-group">
          <label className="form-label">금주 공정률 (%)</label>
          <input type="number" className="form-input" min={0} max={100} value={pct} onChange={e => setPct(e.target.value)} />
        </div>
      </div>
      <div className="form-group">
        <label className="form-label">전주 공정률 (%)</label>
        <input type="number" className="form-input" min={0} max={100} value={prevPct} onChange={e => setPrevPct(e.target.value)} />
      </div>
      <div className="form-group">
        <label className="form-label">과업진행사항 *</label>
        <textarea className="form-input" rows={5} value={summary} onChange={e => setSummary(e.target.value)} placeholder="과업 진행사항을 입력하세요" />
      </div>
      <div className="form-group">
        <label className="form-label">이슈</label>
        <textarea className="form-input" rows={2} value={issues} onChange={e => setIssues(e.target.value)} placeholder="없으면 비워두세요" />
      </div>
      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={onClose}>취소</button>
        <button className="btn btn-primary" onClick={save} disabled={loading}>{loading ? '저장 중...' : '저장'}</button>
      </div>
    </Modal>
  );
}

// ─── Event Modal (등록 + 수정 공용) ───
function EventModal({ projectId, userId, onClose, onSaved, eventData }) {
  const isEdit = !!eventData;
  const [type, setType] = useState(isEdit ? eventData.type : '보고회');
  const [title, setTitle] = useState(isEdit ? eventData.title : '');
  const [eventDate, setEventDate] = useState(isEdit ? eventData.event_date : today());
  const [memo, setMemo] = useState(isEdit ? (eventData.memo || '') : '');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  useEffect(() => { if (!isEdit) setTitle(type); }, [type]);

  const save = async () => {
    if (!eventDate) { setErr('일정일을 입력해주세요.'); return; }
    setLoading(true); setErr('');
    const finalTitle = title.trim() || type; // 제목 없으면 type으로 대체
    const payload = { type: type, title: finalTitle, event_date: eventDate, memo: memo };
    var result;
    if (isEdit) {
      result = await sb.from('project_events').update(payload).eq('id', eventData.id);
      if (!result.error) { const { error: clErr } = await sb.from('change_logs').insert({ project_id: projectId, field_name: '주요공정 수정', old_value: eventData.type + ' | ' + eventData.title + ' | ' + eventData.event_date, new_value: type + ' | ' + finalTitle + ' | ' + eventDate, changed_by: userId, created_at: new Date().toISOString() }); if (clErr) console.error('change_log insert error:', clErr.message); }
    } else {
      result = await sb.from('project_events').insert(Object.assign({}, payload, { project_id: projectId, registered_by: userId }));
      if (!result.error) { const { error: clErr } = await sb.from('change_logs').insert({ project_id: projectId, field_name: '주요공정 등록', old_value: '', new_value: type + ' | ' + finalTitle + ' | ' + eventDate, changed_by: userId, created_at: new Date().toISOString() }); if (clErr) console.error('change_log insert error:', clErr.message); }
    }
    if (result.error) { setErr('저장 중 오류: ' + result.error.message); setLoading(false); return; }
    onSaved();
  };

  return (
    <Modal title={isEdit ? '✏️ 주요 공정 수정' : '📌 주요 공정 등록'} onClose={onClose}>
      {err && <div className="alert alert-error">{err}</div>}
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">유형</label>
          <select className="form-input" value={type} onChange={e => setType(e.target.value)}>
            {EV_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <div className="form-group">
          <label className="form-label">일정일</label>
          <input type="date" className="form-input" value={eventDate} onChange={e => setEventDate(e.target.value)} />
        </div>
      </div>
      <div className="form-group">
        <label className="form-label">제목 <span style={{ fontSize: 10, color: '#94a3b8', fontWeight: 400 }}>(선택 — 비워두면 유형명으로 저장)</span></label>
        <input className="form-input" value={title} onChange={e => setTitle(e.target.value)} placeholder="예: 착수보고회 (선택)" />
      </div>
      <div className="form-group">
        <label className="form-label">메모</label>
        <input className="form-input" value={memo} onChange={e => setMemo(e.target.value)} placeholder="추가 설명 (선택)" />
      </div>

      <div className="modal-footer">
        <button className="btn btn-secondary" onClick={onClose}>취소</button>
        <button className="btn btn-primary" onClick={save} disabled={loading}>{loading ? '저장 중...' : (isEdit ? '수정' : '등록')}</button>
      </div>
    </Modal>
  );
}

// ─── Edit Project Modal ───

      <div className="form-row">

        <div className="form-group">
          <label className="form-label">발주처</label>
          <input className="form-input" value={form.client || ''} onChange={e => set('client', e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">발주부서</label>
          <input className="form-input" value={form.client_dept || ''} onChange={e => set('client_dept', e.target.value)} />
        </div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">발주처 담당자</label>
          <input className="form-input" value={form.client_contact || ''} onChange={e => set('client_contact', e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">상태</label>
          <select className="form-input" value={form.status || '진행중'} onChange={e => set('status', e.target.value)}>
            <option>진행중</option><option>중지</option><option>완료</option>

      <div className="form-row">

// ─── Change Log Panel ───
function ChangeLogPanel({ projects, users }) {
  const [logs, setLogs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [filterUser, setFilterUser] = useState('all');
  const [filterType, setFilterType] = useState('all');
  const [filterFrom, setFilterFrom] = useState('');
  const [filterTo, setFilterTo] = useState('');
  const [page, setPage] = useState(0);
  const [delMode, setDelMode] = useState(false);
  const [delDays, setDelDays] = useState(30);
  const [delMsg, setDelMsg] = useState('');
  const PAGE_SIZE = 50;

  useEffect(() => { loadLogs(); }, []);

  const loadLogs = async () => {
    setLoading(true);
    // created_at 으로 먼저 시도, 실패하면 id로 폴백
    let { data, error } = await sb.from('change_logs').select('*').order('created_at', { ascending: false }).limit(2000);
    if (error) {
      const res2 = await sb.from('change_logs').select('*').order('id', { ascending: false }).limit(2000);
      data = res2.data;
      error = res2.error;
    }
    if (error) setDelMsg('로그 불러오기 오류: ' + error.message);
    setLogs(data || []);
    setLoading(false);
  };

  const uName = (id) => users.find(u => u.id === id)?.name || id || '—';
  const pName = (id) => { const p = projects.find(p => p.id === id); return p ? (p.name.length > 28 ? p.name.slice(0,28)+'…' : p.name) : '—'; };
  const fmtDt = (s) => { if (!s) return '—'; const d = new Date(s); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };

  const TYPE_BADGE = {
    '주간보고':   { bg:'#2563eb', label:'주간보고' },
    '주요공정 등록': { bg:'#059669', label:'공정 등록' },
    '주요공정 수정': { bg:'#d97706', label:'공정 수정' },
    '주요공정 삭제': { bg:'#dc2626', label:'공정 삭제' },
  };

  const allTypes = ['all','주간보고','주요공정 등록','주요공정 수정','주요공정 삭제'];
  const staffUsers = users.filter(u => u.role !== 'admin');

  const filtered = logs.filter(l => {
    if (filterUser !== 'all' && l.changed_by !== filterUser) return false;
    if (filterType !== 'all' && l.field_name !== filterType) return false;
    if (filterFrom && l.created_at && l.created_at < filterFrom) return false;
    if (filterTo && l.created_at && l.created_at > filterTo + 'T23:59:59') return false;
    return true;
  });

  const paged = filtered.slice(page * PAGE_SIZE, (page+1) * PAGE_SIZE);
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

  const handleDelete = async () => {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - delDays);
    const { error } = await sb.from('change_logs').delete().lt('created_at', cutoff.toISOString());
    if (error) { setDelMsg('삭제 오류: ' + error.message + ' (created_at 컬럼이 없으면 Supabase에서 추가 필요)'); return; }
    setDelMsg(`${delDays}일 이전 로그 삭제 완료`);
    setDelMode(false);
    setTimeout(() => setDelMsg(''), 3000);
    loadLogs();
  };

  if (loading) return <Spinner />;

  return (
    <div>
      {/* 필터 */}
      <div className="card card-p" style={{ marginBottom: 12 }}>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap', alignItems:'flex-end' }}>
          <div>
            <div style={{ fontSize:10, fontWeight:700, color:'#94a3b8', marginBottom:3 }}>직원</div>
            <select className="form-input" style={{ fontSize:12, padding:'6px 10px' }} value={filterUser} onChange={e => { setFilterUser(e.target.value); setPage(0); }}>
              <option value="all">전체</option>
              {staffUsers.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, color:'#94a3b8', marginBottom:3 }}>유형</div>
            <select className="form-input" style={{ fontSize:12, padding:'6px 10px' }} value={filterType} onChange={e => { setFilterType(e.target.value); setPage(0); }}>
              {allTypes.map(t => <option key={t} value={t}>{t==='all'?'전체':t}</option>)}
            </select>
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, color:'#94a3b8', marginBottom:3 }}>시작일</div>
            <input type="date" className="form-input" style={{ fontSize:12, padding:'6px 10px' }} value={filterFrom} onChange={e => { setFilterFrom(e.target.value); setPage(0); }} />
          </div>
          <div>
            <div style={{ fontSize:10, fontWeight:700, color:'#94a3b8', marginBottom:3 }}>종료일</div>
            <input type="date" className="form-input" style={{ fontSize:12, padding:'6px 10px' }} value={filterTo} onChange={e => { setFilterTo(e.target.value); setPage(0); }} />
          </div>
          <button className="btn btn-secondary btn-sm" onClick={() => { setFilterUser('all'); setFilterType('all'); setFilterFrom(''); setFilterTo(''); setPage(0); }}>초기화</button>
          <div style={{ marginLeft:'auto' }}>
            <button className="btn btn-sm" style={{ background:'#fef2f2', color:'#dc2626', border:'1px solid #fecaca' }} onClick={() => setDelMode(m => !m)}>🗑 로그 삭제</button>
          </div>
        </div>
        {delMode && (
          <div style={{ marginTop:12, padding:'12px 14px', background:'#fef2f2', borderRadius:8, border:'1px solid #fecaca', display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
            <span style={{ fontSize:12, color:'#dc2626', fontWeight:700 }}>⚠ 오래된 로그 삭제</span>
            <select className="form-input" style={{ fontSize:12, padding:'5px 10px', width:'auto' }} value={delDays} onChange={e => setDelDays(+e.target.value)}>
              <option value={30}>30일 이전</option>
              <option value={60}>60일 이전</option>
              <option value={90}>90일 이전</option>
              <option value={180}>6개월 이전</option>
              <option value={365}>1년 이전</option>
            </select>
            <button className="btn btn-sm" style={{ background:'#dc2626', color:'#fff', border:'none' }} onClick={handleDelete}>삭제 실행</button>
            <button className="btn btn-secondary btn-sm" onClick={() => setDelMode(false)}>취소</button>
          </div>
        )}
        {delMsg && <div className="alert alert-success" style={{ marginTop:10, padding:'6px 12px' }}>{delMsg}</div>}
      </div>

      {/* 통계 */}
      <div style={{ display:'flex', gap:8, marginBottom:12, flexWrap:'wrap' }}>
        {['주간보고','주요공정 등록','주요공정 수정','주요공정 삭제'].map(t => {
          const cnt = filtered.filter(l => l.field_name === t).length;
          const b = TYPE_BADGE[t];
          return (
            <div key={t} style={{ background:'#fff', borderRadius:8, padding:'10px 16px', borderLeft:`3px solid ${b.bg}`, boxShadow:'0 1px 3px rgba(0,0,0,.06)', minWidth:100 }}>
              <div style={{ fontSize:18, fontWeight:900, color:b.bg }}>{cnt}</div>
              <div style={{ fontSize:10, color:'#94a3b8', marginTop:2 }}>{b.label}</div>
            </div>
          );
        })}
        <div style={{ background:'#fff', borderRadius:8, padding:'10px 16px', borderLeft:'3px solid #64748b', boxShadow:'0 1px 3px rgba(0,0,0,.06)', minWidth:100 }}>
          <div style={{ fontSize:18, fontWeight:900, color:'#334155' }}>{filtered.length}</div>
          <div style={{ fontSize:10, color:'#94a3b8', marginTop:2 }}>전체 건수</div>
        </div>
      </div>

      {/* 테이블 */}
      <div className="card" style={{ overflow:'auto' }}>
        {filtered.length === 0 ? (
          <div style={{ padding:24, textAlign:'center', color:'#94a3b8', fontSize:13 }}>조건에 맞는 로그가 없습니다.</div>
        ) : (
          <>
            <table className="tbl" style={{ minWidth:700 }}>
              <thead>
                <tr>
                  <th style={{ width:130, whiteSpace:'nowrap' }}>일시</th>
                  <th style={{ width:60 }}>직원</th>
                  <th style={{ width:80 }}>유형</th>
                  <th>용역명</th>
                  <th style={{ minWidth:120 }}>이전</th>
                  <th style={{ minWidth:160 }}>변경 내용</th>
                </tr>
              </thead>
              <tbody>
                {paged.map((l, i) => {
                  const b = TYPE_BADGE[l.field_name] || { bg:'#94a3b8', label:l.field_name };
                  return (
                    <tr key={l.id || i}>
                      <td style={{ fontSize:11, color:'#64748b', whiteSpace:'nowrap' }}>{fmtDt(l.created_at)}</td>
                      <td style={{ fontSize:12, fontWeight:700 }}>{uName(l.changed_by)}</td>
                      <td><span style={{ display:'inline-block', padding:'2px 7px', borderRadius:4, background:b.bg, color:'#fff', fontSize:10, fontWeight:700, whiteSpace:'nowrap' }}>{b.label}</span></td>
                      <td style={{ fontSize:11, color:'#0f172a', fontWeight:600, wordBreak:'keep-all' }}>{pName(l.project_id)}</td>
                      <td style={{ fontSize:11, color:'#94a3b8' }}>{l.old_value || '—'}</td>
                      <td style={{ fontSize:11, color:'#1e293b', fontWeight:500 }}>{l.new_value || '—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {totalPages > 1 && (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6, padding:'12px 0', borderTop:'1px solid #f1f5f9' }}>
                <button className="btn btn-secondary btn-sm" disabled={page===0} onClick={() => setPage(0)}>«</button>
                <button className="btn btn-secondary btn-sm" disabled={page===0} onClick={() => setPage(p => p-1)}>‹</button>
                <span style={{ fontSize:12, color:'#64748b' }}>{page+1} / {totalPages} 페이지 ({filtered.length}건)</span>
                <button className="btn btn-secondary btn-sm" disabled={page>=totalPages-1} onClick={() => setPage(p => p+1)}>›</button>
                <button className="btn btn-secondary btn-sm" disabled={page>=totalPages-1} onClick={() => setPage(totalPages-1)}>»</button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ─── Admin Panel ───
function AdminPanel({ user }) {
  const [tab, setTab] = useState('editProj');
  const [projects, setProjects] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState('');

  useEffect(() => { loadAll(); }, []);
  const loadAll = async () => {
    const [pj, us] = await Promise.all([
      sb.from('projects').select('*, completed_at').order('name'),
      sb.from('users').select('*').order('name'),
    ]);
    setProjects(pj.data || []);
    setUsers(us.data || []);
    setLoading(false);
  };

  const showMsg = (m) => { setMsg(m); setTimeout(() => setMsg(''), 3000); };
  if (loading) return <Spinner />;

  return (
    <div>
      <h2 className="section-title">⚙ 관리자 메뉴</h2>
      {msg && <div className="alert alert-success">{msg}</div>}
      <div style={{ display: 'flex', gap: 4, marginBottom: 14, background: '#fff', borderRadius: 8, padding: 4, boxShadow: '0 1px 2px rgba(0,0,0,.06)', width: 'fit-content', flexWrap: 'wrap' }}>
        {[{k:'editProj',l:'프로젝트 수정'},{k:'create',l:'새 프로젝트 등록'},{k:'userList',l:'직원 목록'},{k:'logs',l:'📋 수정 로그'}].map(t => (
          <button key={t.k} onClick={() => setTab(t.k)} className="btn btn-sm" style={{ background: tab===t.k?'var(--theme,#0f172a)':'transparent', color: tab===t.k?'#fff':'#64748b', border: 'none' }}>{t.l}</button>
        ))}
      </div>

      {tab === 'create' && <CreateProjectForm userId={user.id} users={users} onSaved={() => { loadAll(); showMsg('프로젝트가 등록되었습니다.'); }} />}
      {tab === 'editProj' && <AdminProjectEdit projects={projects} users={users} onSaved={() => { loadAll(); showMsg('수정되었습니다.'); }} userId={user.id} />}
      {tab === 'userList' && <UserList users={users} onSaved={() => { loadAll(); showMsg('저장되었습니다.'); }} />}
      {tab === 'logs' && <ChangeLogPanel projects={projects} users={users} />}
    </div>
  );
}

        <div className="form-group">

          </select>
        </div>
        <div className="form-group">
          <label className="form-label">PM *</label>
          <select className="form-input" value={form.pm_id} onChange={e => set('pm_id', e.target.value)}>
            <option value="">선택</option>
            {users.filter(u => u.role !== 'contractor').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
          </select>

      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">발주처 *</label>

        <div className="form-group">

      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">발주처 담당자</label>
          <input className="form-input" value={form.client_contact} onChange={e => set('client_contact', e.target.value)} />
        </div>
        <div className="form-group">
          <label className="form-label">상태</label>
          <select className="form-input" value={form.status} onChange={e => set('status', e.target.value)}>
            <option>진행중</option><option>중지</option><option>완료</option>
          </select>

      </div>

        <div className="form-group">

// ─── Member Assign ───
function MemberAssign({ projects, users, onSaved }) {
  const [selPid, setSelPid] = useState('');
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(false);

  const loadMembers = async (pid) => {
    setSelPid(pid);
    if (!pid) { setMembers([]); return; }
    const { data } = await sb.from('project_members').select('*').eq('project_id', pid);
    setMembers(data || []);
  };

  const addMember = async (userId, role) => {
    if (!selPid || !userId) return;
    const exists = members.find(m => m.user_id === userId);
    if (exists) { alert('이미 배정된 인원입니다.'); return; }
    setLoading(true);
    await sb.from('project_members').insert({ project_id: selPid, user_id: userId, role });
    await loadMembers(selPid);
    onSaved();
    setLoading(false);
  };

  const removeMember = async (id) => {
    setLoading(true);
    await sb.from('project_members').delete().eq('id', id);
    await loadMembers(selPid);
    onSaved();
    setLoading(false);
  };

  const uName = (id) => users.find(u => u.id === id)?.name || '';
  const [newUser, setNewUser] = useState('');
  const [newRole, setNewRole] = useState('support');

  return (
    <div className="card card-p">
      <div style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', marginBottom: 14 }}>참여인원 배정</div>
      <div className="form-group">
        <label className="form-label">프로젝트 선택</label>
        <select className="form-input" value={selPid} onChange={e => loadMembers(e.target.value)}>
          <option value="">선택하세요</option>
          {projects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </div>
      {selPid && (
        <>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: '#64748b', marginBottom: 6 }}>현재 참여인원</div>
            {members.length === 0 ? <div style={{ fontSize: 12, color: '#94a3b8' }}>배정된 인원이 없습니다.</div> :
              members.map(m => (
                <div key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '5px 10px', background: '#f8fafc', borderRadius: 6, marginBottom: 4 }}>
                  <span style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{uName(m.user_id)}</span>
                  <Bd bg={m.role==='pm'?'var(--theme,#0f172a)':m.role==='contractor'?'#d97706':'#64748b'}>{m.role==='pm'?'PM':m.role==='support'?'서포트':'기술지원'}</Bd>
                  <button className="btn btn-danger btn-sm" onClick={() => removeMember(m.id)} disabled={loading}>제거</button>
                </div>
              ))
            }
          </div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'flex-end' }}>
            <div style={{ flex: 1, minWidth: 140 }}>
              <label className="form-label">직원 추가</label>

              </select>

              </select>
            </div>
            <button className="btn btn-primary btn-sm" onClick={() => { addMember(newUser, newRole); setNewUser(''); }} disabled={loading || !newUser}>추가</button>
          </div>
        </>
      )}
    </div>
  );
}

// ─── Inline Project Edit ───
function InlineProjectEdit({ project, users, userId, onSaved }) {
  const [form, setForm] = useState({ ...project });
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState('');
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  // Reset form when project changes
  React.useEffect(() => { setForm({ ...project }); setMsg(''); }, [project.id]);

  const save = async () => {
    setLoading(true); setMsg('');
    const oldEndDate = project.end_date, oldContact = project.client_contact;
    const updates = {
      name: form.name, category: form.category, client: form.client, client_dept: form.client_dept,
      client_contact: form.client_contact, start_date: form.start_date,
      end_date: form.end_date || null, status: form.status, memo: form.memo,
      pm_id: form.pm_id || project.pm_id,
      updated_at: new Date().toISOString(),
      completed_at: form.status === '완료' && project.status !== '완료'
        ? today()
        : form.status !== '완료' ? null : (project.completed_at || null),
    };
    const { error } = await sb.from('projects').update(updates).eq('id', project.id);

// ─── Admin Project Edit (with member management) ───
function AdminProjectEdit({ projects, users, onSaved, userId }) {
  const [selPid, setSelPid] = useState('');
  const [filterText, setFilterText] = useState('');
  const [delConfirm, setDelConfirm] = useState(null);
  const [members, setMembers] = useState([]);
  const [newMUser, setNewMUser] = useState('');
  const [newMRole, setNewMRole] = useState('support');
  const [mLoading, setMLoading] = useState(false);

  const uName = (id) => users.find(u => u.id === id)?.name || '';
  const PM_ORDER_A = ['김병용','장용기','박호진','윤종수','이규민'];
  const pmOrderA = (pmId) => { const n = uName(pmId); const i = PM_ORDER_A.indexOf(n); return i >= 0 ? i : 99; };
  const catOrderA = (c) => c === '사급' ? 0 : c === '관급' ? 1 : 2;
  const ROLE_DISPLAY = { pm: 'PM', support: '서포트', contractor: '기술지원' };

  const base = projects.filter(p =>
    filterText === '' || p.name.includes(filterText) ||
    (p.client || '').includes(filterText) || uName(p.pm_id).includes(filterText)
  );
  const activeA = base.filter(p => p.status !== '완료').sort((a,b) =>
    catOrderA(a.category) - catOrderA(b.category) ||
    pmOrderA(a.pm_id) - pmOrderA(b.pm_id) ||
    (a.status === '중지' ? 1 : 0) - (b.status === '중지' ? 1 : 0)
  );
  const completedA = base.filter(p => p.status === '완료')
    .sort((a,b) => (b.completed_at || b.end_date || '').localeCompare(a.completed_at || a.end_date || ''));
  const filtered = [...activeA, ...completedA];
  const selProject = projects.find(p => p.id === selPid);

  const loadMembers = async (pid) => {
    if (!pid) { setMembers([]); return; }
    const { data } = await sb.from('project_members').select('*').eq('project_id', pid);
    setMembers(data || []);
  };
  const selectProject = (pid) => { setSelPid(pid); loadMembers(pid); };
  const addMember = async () => {
    if (!selPid || !newMUser) return;
    if (members.find(m => m.user_id === newMUser)) { alert('이미 배정된 인원입니다.'); return; }
    setMLoading(true);
    await sb.from('project_members').insert({ project_id: selPid, user_id: newMUser, role: newMRole });
    await loadMembers(selPid); setNewMUser(''); setMLoading(false); onSaved();
  };
  const removeMember = async (id) => {
    setMLoading(true);
    await sb.from('project_members').delete().eq('id', id);
    await loadMembers(selPid); setMLoading(false); onSaved();
  };

  return (
    <div className="admin-edit-grid" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, alignItems: 'start' }}>
      {/* 왼쪽: 프로젝트 목록 */}
      <div className="card card-p">
        <div style={{ fontSize: 13, fontWeight: 800, color: '#0f172a', marginBottom: 8 }}>프로젝트 목록 ({projects.length}건)</div>
        <input className="form-input" style={{ marginBottom: 8 }} placeholder="용역명 / 발주처 / PM 검색" value={filterText} onChange={e => setFilterText(e.target.value)} />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, maxHeight: 520, overflowY: 'auto' }}>
          {filtered.map(p => (
            <div key={p.id} onClick={() => selectProject(p.id)}
              style={{ padding: '7px 10px', background: selPid === p.id ? '#eff6ff' : '#f8fafc', borderRadius: 6, borderLeft: `3px solid ${selPid === p.id ? '#2563eb' : (CAT_COLOR[p.category]||'#e2e8f0')}`, opacity: p.status==='중지'?0.65:1, cursor: 'pointer' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: '#0f172a', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</div>
                  <div style={{ fontSize: 10, color: '#94a3b8' }}>{p.client} · {uName(p.pm_id)}</div>
                </div>
                <Bd bg={STATUS_COLOR[p.status]}>{p.status}</Bd>
                <button className="btn btn-danger btn-sm" onClick={e => { e.stopPropagation(); setDelConfirm(p); }}>삭제</button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* 오른쪽: 수정 패널 */}
      {selProject ? (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, maxHeight: 600, overflowY: 'auto' }}>
          {/* 인라인 수정 폼 */}
          <InlineProjectEdit project={selProject} users={users} userId={userId}
            onSaved={() => { onSaved(); }} />

          {/* 참여인원 */}
          <div className="card card-p">
            <div style={{ fontSize: 12, fontWeight: 800, color: '#0f172a', marginBottom: 8 }}>👥 참여인원</div>
            {members.length === 0 && <div style={{ fontSize: 11, color: '#94a3b8', marginBottom: 8 }}>배정된 인원이 없습니다.</div>}
            {members.map(m => (
              <div key={m.id} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 8px', background: '#f8fafc', borderRadius: 5, marginBottom: 4 }}>
                <span style={{ flex: 1, fontSize: 12, fontWeight: 600 }}>{uName(m.user_id)}</span>
                <Bd bg={m.role==='pm'?'var(--theme,#0f172a)':m.role==='contractor'?'#d97706':'#64748b'}>{ROLE_DISPLAY[m.role]||m.role}</Bd>
                <button className="btn btn-danger btn-sm" onClick={() => removeMember(m.id)} disabled={mLoading}>제거</button>
              </div>
            ))}
            <div style={{ display: 'flex', gap: 5, marginTop: 8 }}>
              <select className="form-input" style={{ flex: 1 }} value={newMUser} onChange={e => setNewMUser(e.target.value)}>
                <option value="">직원 선택</option>
                {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
              </select>
              <select className="form-input" style={{ width: 90 }} value={newMRole} onChange={e => setNewMRole(e.target.value)}>
                <option value="pm">PM</option>
                <option value="support">서포트</option>
                <option value="contractor">기술지원</option>
              </select>
              <button className="btn btn-primary btn-sm" onClick={addMember} disabled={mLoading||!newMUser}>추가</button>
            </div>
          </div>
        </div>
      ) : (
        <div className="card card-p" style={{ color: '#94a3b8', fontSize: 13, textAlign: 'center', padding: 40 }}>
          ← 왼쪽에서 프로젝트를 선택하세요
        </div>
      )}
      {delConfirm && (
        <div className="modal-overlay" onClick={() => setDelConfirm(null)}>
          <div className="modal-box" style={{ maxWidth: 420 }} onClick={e => e.stopPropagation()}>
            <div className="modal-title" style={{ color: '#dc2626' }}>⚠ 프로젝트 삭제 확인</div>
            <div style={{ fontSize: 13, color: '#334155', marginBottom: 16, lineHeight: 1.7 }}>
              <strong>{delConfirm.name}</strong>을(를) 삭제하시겠습니까?<br/>
              <span style={{ color: '#dc2626', fontSize: 12 }}>관련 주간보고 및 데이터가 모두 삭제됩니다.</span>
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setDelConfirm(null)}>취소</button>
              <button className="btn btn-danger" onClick={async () => {
                await sb.from('weekly_reports').delete().eq('project_id', delConfirm.id);
                await sb.from('project_events').delete().eq('project_id', delConfirm.id);
                await sb.from('project_members').delete().eq('project_id', delConfirm.id);
                await sb.from('change_logs').delete().eq('project_id', delConfirm.id);
                await sb.from('projects').delete().eq('id', delConfirm.id);
                setDelConfirm(null); setSelPid(''); setMembers([]);
                onSaved();
              }}>삭제 확인</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Change Password Modal ───
function ChangePasswordModal({ user, onClose }) {
  const [curr, setCurr] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState(false);

  const save = async () => {
    if (!curr || !next || !confirm) { setErr('모든 항목을 입력해주세요.'); return; }
    if (next !== confirm) { setErr('새 비밀번호가 일치하지 않습니다.'); return; }
    if (next.length < 6) { setErr('비밀번호는 6자 이상이어야 합니다.'); return; }
    setLoading(true); setErr('');
    // Verify current password via Auth re-login
    const { data: uData } = await sb.from('users').select('phone').eq('id', user.id).single();
    const phoneDigits = uData?.phone ? uData.phone.replace(/\D/g,'') : uData?.phone;
    const emailLocal = phoneDigits && phoneDigits.length > 0 ? phoneDigits : uData?.phone;
    const { error: signInErr } = await sb.auth.signInWithPassword({
      email: (emailLocal || '') + '@' + (APP_CONFIG.AUTH_DOMAIN || 'kwanbo.internal'), password: curr
    });
    if (signInErr) { setErr('현재 비밀번호가 올바르지 않습니다.'); setLoading(false); return; }
    const { error } = await sb.auth.updateUser({ password: next });
    if (error) { setErr('저장 중 오류가 발생했습니다.'); setLoading(false); return; }
    // 비밀번호 변경 기록 (change_logs)
    await sb.from('change_logs').insert({
      project_id: null, field_name: '비밀번호변경', old_value: '', new_value: '변경완료',
      changed_by: user.id, created_at: new Date().toISOString()
    }).catch(() => {});
    setOk(true); setLoading(false);
  };

  return (
    <Modal title="🔒 비밀번호 변경" onClose={onClose}>
      {ok ? (
        <div>
          <div className="alert alert-success">비밀번호가 변경되었습니다.</div>
          <div className="modal-footer"><button className="btn btn-primary" onClick={onClose}>확인</button></div>
        </div>
      ) : (
        <>
          {err && <div className="alert alert-error">{err}</div>}
          <div className="form-group">
            <label className="form-label">현재 비밀번호</label>
            <input type="password" className="form-input" value={curr} onChange={e => setCurr(e.target.value)} placeholder="현재 비밀번호" />
          </div>
          <div className="form-group">
            <label className="form-label">새 비밀번호</label>
            <input type="password" className="form-input" value={next} onChange={e => setNext(e.target.value)} placeholder="새 비밀번호 (6자 이상)" />
          </div>
          <div className="form-group">
            <label className="form-label">새 비밀번호 확인</label>
            <input type="password" className="form-input" value={confirm} onChange={e => setConfirm(e.target.value)} placeholder="새 비밀번호 재입력" onKeyDown={e => e.key === 'Enter' && save()} />
          </div>
          <div className="modal-footer">
            <button className="btn btn-secondary" onClick={onClose}>취소</button>
            <button className="btn btn-primary" onClick={save} disabled={loading}>{loading ? '변경 중...' : '변경'}</button>
          </div>
        </>
      )}
    </Modal>
  );
}

// ─── User List (Admin) ───
function UserList({ users, onSaved }) {
  const [newUser, setNewUser] = useState({ name:'', phone:'', role:'employee' });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const set = (k,v) => setNewUser(f => ({...f,[k]:v}));

  const addUser = async () => {
    if (!newUser.name || !newUser.phone) { setErr('이름과 전화번호는 필수입니다.'); return; }
    setLoading(true); setErr('');
    const { error } = await sb.from('users').insert({ ...newUser, join_date: today(), total_days: 0, used_days: 0 });
    if (error) { setErr('등록 오류: ' + error.message); setLoading(false); return; }
    setNewUser({ name:'', phone:'', role:'employee' });
    onSaved();
    setLoading(false);
  };

  const ROLE_ORDER = { 'admin': 0, 'manager': 1, 'employee': 2, 'contractor': 3 };
  const ROLE_LABEL = { 'admin': '관리자', 'manager': '팀장', 'employee': '팀원', 'contractor': '기술지원' };
  const ROLE_COLOR = { 'admin': 'var(--theme,#0f172a)', 'manager': '#6366f1', 'employee': '#2563eb', 'contractor': '#d97706' };
  const sortedUsers = [...users].sort((a,b) =>
    (ROLE_ORDER[a.role] ?? 9) - (ROLE_ORDER[b.role] ?? 9) ||
    a.name.localeCompare(b.name, 'ko')
  );

  const groups = ['admin','manager','employee','contractor'].map(role => ({
    role, label: ROLE_LABEL[role], color: ROLE_COLOR[role],
    members: sortedUsers.filter(u => u.role === role)
  })).filter(g => g.members.length > 0);

  return (
    <div className="card card-p">
      <div style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', marginBottom: 14 }}>직원 목록 ({users.length}명)</div>
      {groups.map(g => (
        <div key={g.role} style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: g.color, marginBottom: 6, paddingBottom: 4, borderBottom: `2px solid ${g.color}` }}>
            {g.label} ({g.members.length}명)
          </div>
          <table className="tbl" style={{ marginBottom: 4 }}>
            <thead><tr><th>이름</th><th>전화번호(ID)</th><th>권한</th></tr></thead>
            <tbody>
              {g.members.map(u => (
                <tr key={u.id}>
                  <td style={{ fontWeight: 600 }}>{u.name}</td>
                  <td>{u.phone}</td>
                  <td><Bd bg={g.color}>{g.label}</Bd></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      ))}
      <div style={{ fontSize: 13, fontWeight: 700, color: '#0f172a', margin: '16px 0 10px' }}>새 직원 추가</div>
      {err && <div className="alert alert-error">{err}</div>}
      <div className="form-row">
        <div className="form-group"><label className="form-label">이름</label><input className="form-input" value={newUser.name} onChange={e => set('name',e.target.value)} /></div>
        <div className="form-group"><label className="form-label">전화번호 (로그인 ID)</label><input className="form-input" value={newUser.phone} onChange={e => set('phone',e.target.value)} placeholder="010-0000-0000" /></div>
      </div>
      <div className="form-row">
        <div className="form-group">
          <label className="form-label">초기 비밀번호 <span style={{color:'#94a3b8',fontWeight:400}}>(미입력시 전화번호로 설정)</span></label>
          <input className="form-input" value={newUser.password} onChange={e => set('password',e.target.value)} placeholder="비워두면 전화번호로 자동설정" />
        </div>
        <div className="form-group"><label className="form-label">권한</label>
          <select className="form-input" value={newUser.role} onChange={e => set('role',e.target.value)}>
            <option value="employee">팀원</option>
            <option value="manager">팀장</option>
            <option value="admin">관리자</option>
            <option value="contractor">기술지원</option>
          </select>
        </div>
      </div>
      <button className="btn btn-primary btn-sm" onClick={addUser} disabled={loading}>{loading?'추가 중...':'직원 추가'}</button>
    </div>
  );
}

function ProfileView({ user, onLogout }) {
  const [curr, setCurr] = useState('');
  const [next, setNext] = useState('');
  const [confirm, setConfirm] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');
  const [ok, setOk] = useState(false);

  const savePw = async () => {
    if (!curr || !next || !confirm) { setErr('모든 항목을 입력해주세요.'); return; }
    if (next !== confirm) { setErr('새 비밀번호가 일치하지 않습니다.'); return; }
    if (next.length < 6) { setErr('비밀번호는 6자 이상이어야 합니다.'); return; }
    setLoading(true); setErr('');
    // username 있으면 우선, 없으면 phone 사용
    const loginId = user.username
      ? (user.username.replace(/\D/g,'').length > 0 ? user.username.replace(/\D/g,'') : user.username)
      : (user.phone ? user.phone.replace(/\D/g,'') : user.phone);
    const { data: signInData, error: signInErr2 } = await sb.auth.signInWithPassword({
      email: loginId + '@' + (APP_CONFIG.AUTH_DOMAIN || 'kwanbo.internal'), password: curr
    });
    if (signInErr2) { setErr('현재 비밀번호가 올바르지 않습니다.'); setLoading(false); return; }
    // signInWithPassword로 얻은 세션으로 비밀번호 변경
    const authClient = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
    await authClient.auth.setSession({
      access_token: signInData.session.access_token,
      refresh_token: signInData.session.refresh_token,
    });
    const { error } = await authClient.auth.updateUser({ password: next });
    if (error) { setErr('저장 중 오류가 발생했습니다.'); setLoading(false); return; }
    await authClient.auth.signOut();
    // 비밀번호 변경 기록 (change_logs)
    await sb.from('change_logs').insert({
      project_id: null, field_name: '비밀번호변경', old_value: '', new_value: '변경완료',
      changed_by: user.id, created_at: new Date().toISOString()
    }).catch(() => {});
    setOk(true); setCurr(''); setNext(''); setConfirm('');
    setLoading(false);
  };

  const ROLE_LABEL = { admin: '관리자', manager: '팀장', employee: '팀원', contractor: '기술지원' };

  return (
    <div style={{ maxWidth: 480, margin: '0 auto' }}>
      {/* 프로필 카드 */}
      <div className="card card-p" style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 4 }}>
          <div style={{ width: 52, height: 52, borderRadius: '50%', background: user.role === 'admin' ? 'var(--theme,#0f172a)' : user.role === 'contractor' ? '#d97706' : '#2563eb', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontWeight: 900, fontSize: 22, flexShrink: 0 }}>{user.name[0]}</div>
          <div>
            <div style={{ fontSize: 18, fontWeight: 900, color: '#0f172a' }}>{user.name}</div>
            <div style={{ fontSize: 12, color: '#64748b', marginTop: 2 }}>{ROLE_LABEL[user.role] || user.role} · {user.phone}</div>
          </div>
        </div>
      </div>

      {/* 비밀번호 변경 */}
      <div className="card card-p" style={{ marginBottom: 14 }}>
        <div style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', marginBottom: 14 }}>🔒 비밀번호 변경</div>
        {ok && <div className="alert alert-success" style={{ marginBottom: 12 }}>비밀번호가 변경되었습니다.</div>}
        {err && <div className="alert alert-error" style={{ marginBottom: 12 }}>{err}</div>}
        <div className="form-group">
          <label className="form-label">현재 비밀번호</label>
          <input type="password" className="form-input" value={curr} onChange={e => setCurr(e.target.value)} placeholder="현재 비밀번호" />
        </div>
        <div className="form-group">
          <label className="form-label">새 비밀번호</label>
          <input type="password" className="form-input" value={next} onChange={e => setNext(e.target.value)} placeholder="새 비밀번호 (6자 이상)" />
        </div>
        <div className="form-group">
          <label className="form-label">새 비밀번호 확인</label>
          <input type="password" className="form-input" value={confirm} onChange={e => setConfirm(e.target.value)} placeholder="새 비밀번호 재입력" onKeyDown={e => e.key === 'Enter' && savePw()} />
        </div>
        <button className="btn btn-primary" onClick={savePw} disabled={loading} style={{ marginTop: 4 }}>{loading ? '변경 중...' : '비밀번호 변경'}</button>
      </div>

      {/* 로그아웃 */}
      <div className="card card-p">
        <div style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', marginBottom: 10 }}>계정</div>
        <button className="btn btn-secondary" onClick={onLogout} style={{ width: '100%' }}>로그아웃</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
