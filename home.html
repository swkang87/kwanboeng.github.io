<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>메인메뉴</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
<style>
html,body,#app,button,input,textarea,select{font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif!important;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;min-height:100vh;}
/* SYS-BAR → sysbar.js 주입 */
.top-nav{position:sticky;top:83px;z-index:200;background:#1e293b;height:36px;display:flex;align-items:center;padding:0 14px;gap:1px;border-bottom:1px solid #0f172a;}
.nav-btn{display:flex;align-items:center;gap:4px;padding:5px 11px;height:26px;border:none;background:transparent;border-radius:4px;font-size:11px;font-weight:400;color:#94a3b8;cursor:pointer;white-space:nowrap;font-family:inherit;}
.nav-btn.on{background:#1d4ed8;color:#fff;font-weight:700;}
.page{padding:20px;max-width:1100px;margin:0 auto;}
.sec-title{font-size:15px;font-weight:800;color:#0f172a;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.divider{border-top:2px solid #e2e8f0;margin:24px 0;}
/* 공지 */
.ni{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:14px 16px;cursor:pointer;transition:.15s;margin-bottom:8px;}
.ni:hover{border-color:#c7d2fe;}
.ni.pin{border-left:3px solid #1d4ed8;}
.ni-title{font-size:13px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:6px;}
.ni-meta{font-size:11px;color:#94a3b8;margin-top:3px;}
.badge-new{background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:10px;}
/* 공지 폼 */
.nform{background:#fff;border-radius:10px;border:1px solid #e2e8f0;padding:14px 16px;margin-bottom:12px;}
.fi{width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none;}
.fi:focus{border-color:#818cf8;}
.ta{min-height:70px;resize:vertical;}
.fl{font-size:11px;font-weight:600;color:#64748b;margin-bottom:3px;display:block;}
/* 달력 */
.cal-wrap{background:#fff;border-radius:10px;border:1px solid #e2e8f0;overflow:hidden;}
.cal-hdr{display:flex;align-items:center;background:#0f172a;padding:10px 14px;gap:6px;}
.cal-title{font-size:14px;font-weight:800;color:#fff;flex:1;text-align:center;}
.cal-nav{background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:2px 8px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-dh{text-align:center;font-size:10px;font-weight:700;padding:7px 0;color:#64748b;background:#f8fafc;}
.cal-cell{border:0.5px solid #f1f5f9;min-height:78px;padding:3px;cursor:default;background:#fff;}
.cal-cell.today{background:#fef9c3;border:2px solid #f59e0b;}
.cal-cell.holiday{background:#fff1f2;}
.cal-cell.weekend{background:#fafafa;}
.cal-dn{font-size:10px;font-weight:400;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;margin-bottom:1px;}
.cal-dn.t{background:#1d4ed8;color:#fff;font-weight:700;}
.cal-hol{font-size:8px;color:#dc2626;font-weight:600;margin-bottom:1px;overflow:hidden;white-space:nowrap;}
.cal-ev{font-size:8px;padding:1px 3px;border-radius:2px;margin-bottom:1px;overflow:hidden;white-space:nowrap;font-weight:600;}
.cal-ev-badge{font-size:7px;padding:0 3px;border-radius:2px;font-weight:700;white-space:nowrap;display:inline-block;margin-right:2px;border:1px solid;}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;border-top:1px solid #f1f5f9;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b;}
.legend-dot{width:10px;height:10px;border-radius:2px;}
/* 모달 */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #f1f5f9;}
.mht{font-size:15px;font-weight:800;}
.mc{background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;}
.mb{padding:14px 18px;}
.mf{padding:10px 18px;border-top:1px solid #f1f5f9;display:flex;justify-content:flex-end;gap:8px;}
/* 버튼 */
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 13px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-p{background:#1d4ed8;color:#fff;}
.btn-s{background:#f1f5f9;color:#475569;}
.btn-d{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.btn-sm{padding:3px 9px;font-size:11px;}
.empty{padding:32px;text-align:center;color:#94a3b8;font-size:13px;}
/* 로그인 */
.lwrap{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#1e40af 100%);display:flex;align-items:center;justify-content:center;padding:16px;}
.lbox{background:#fff;border-radius:14px;padding:26px;width:100%;max-width:340px;}
@media(max-width:640px){
  .page{padding:10px;}
  .cal-cell{min-height:50px;}
  .cal-ev{display:none;}
}
</style>
<script src="config.js"></script>
<script src="sysbar.js"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useCallback} = React;

// ── 비밀번호 해싱 → sysbar.js Sysbar.Auth.doLogin 으로 일원화 ─

// ── Supabase 클라이언트 ────────────────────────────────────
function makeSb(uid,role){
  const h={};
  if(uid){h['x-user-id']=String(uid);h['x-user-role']=role||'';}
  return supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_KEY,{global:{headers:h}});
}
let sb=null;
function getSb(){if(!sb)sb=makeSb();return sb;}

// ── 공휴일 ──────────────────────────────────────────────
const HOL={
  '2026-01-01':'신정','2026-01-28':'설날연휴','2026-01-29':'설날','2026-01-30':'설날연휴',
  '2026-03-01':'삼일절','2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-03':'임시공휴일','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절','2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날','2026-12-25':'크리스마스',
  '2025-01-01':'신정','2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절','2025-05-05':'어린이날','2025-06-03':'임시공휴일',
  '2025-06-06':'현충일','2025-08-15':'광복절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날','2025-12-25':'크리스마스',
};
const SUB={'2025-05-06':'대체공휴일','2026-03-02':'대체공휴일','2026-05-25':'대체공휴일','2026-08-17':'대체공휴일','2026-09-28':'대체공휴일','2026-10-05':'대체공휴일'};
async function fetchHolidays(){
  const yr=new Date().getFullYear();
  const KO={"New Year's Day":'신정','Seollal':'설날','Seollal Holiday':'설날연휴',"Independence Movement Day":'삼일절',"Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',"Memorial Day":'현충일',"Liberation Day":'광복절',Chuseok:'추석',"Chuseok Holiday":'추석연휴',"National Foundation Day":'개천절',"Hangul Day":'한글날',"Christmas Day":'크리스마스',"Substitute Holiday":'대체공휴일'};
  try{
    const res=await Promise.all([yr-1,yr,yr+1].map(y=>fetch('https://date.nager.at/api/v3/PublicHolidays/'+y+'/KR').then(r=>r.ok?r.json():[]).catch(()=>[])));
    res.flat().forEach(h=>{if(!h.date)return;const n=KO[h.localName]||KO[h.name]||h.localName;if(n==='대체공휴일'){if(!SUB[h.date])SUB[h.date]=n;}else{if(!HOL[h.date])HOL[h.date]=n;}});
  }catch(e){}
}

// ── 유틸 ───────────────────────────────────────────────
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmt=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate();};
const fmtFull=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');};

// ── 공정 이벤트 타입 색상 ────────────────────────────────
const EV_C={
  '착수보고':{bg:'#dbeafe',bd:'#3b82f6',tx:'#1e40af'},
  '중간보고':{bg:'#e0e7ff',bd:'#6366f1',tx:'#4338ca'},
  '최종보고':{bg:'#d1fae5',bd:'#059669',tx:'#065f46'},
  '위원회'  :{bg:'#fce7f3',bd:'#ec4899',tx:'#9d174d'},
  '협의'    :{bg:'#fef3c7',bd:'#f59e0b',tx:'#92400e'},
  '납품'    :{bg:'#f3e8ff',bd:'#a855f7',tx:'#6b21a8'},
  '기타'    :{bg:'#f1f5f9',bd:'#94a3b8',tx:'#334155'},
};
const evc=t=>EV_C[t]||EV_C['기타'];

// ── 팀 색상 ──────────────────────────────────────────
const TCOL={'설계1팀':'#2563eb','설계2팀':'#059669','지반팀':'#d97706','관리팀':'#7c3aed'};

// ── LoginScreen → sysbar.js createLoginComponent 로 일원화 ──
const LoginScreen = Sysbar.createLoginComponent(React);

// ═══════════════════════════════════════════════════════
// NoticeView
// ═══════════════════════════════════════════════════════
function NoticeView({user,teamName,readIds,onRead}){
  const [notices,setNotices]=useState([]);
  const [loading,setLoading]=useState(true);
  const [sel,setSel]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [editItem,setEditItem]=useState(null);
  const [form,setForm]=useState({title:'',content:'',is_pinned:false});
  const [saving,setSaving]=useState(false);
  const [err,setErr]=useState('');
  const canWrite=user.role==='admin'||teamName==='관리팀';

  const load=useCallback(async()=>{
    setLoading(true);
    try{
      const {data}=await getSb().from('notices').select('*').order('is_pinned',{ascending:false}).order('created_at',{ascending:false});
      setNotices(data||[]);
    }catch(e){}
    setLoading(false);
  },[]);

  useEffect(()=>{load();},[load]);

  const openNew=()=>{setEditItem(null);setForm({title:'',content:'',is_pinned:false});setErr('');setShowForm(true);};
  const openEdit=n=>{setEditItem(n);setForm({title:n.title,content:n.content,is_pinned:n.is_pinned});setErr('');setShowForm(true);};

  const save=async()=>{
    if(!form.title.trim()||!form.content.trim()){setErr('제목과 내용을 입력하세요.');return;}
    setSaving(true);
    try{
      if(editItem){await getSb().from('notices').update({title:form.title,content:form.content,is_pinned:form.is_pinned}).eq('id',editItem.id);}
      else{await getSb().from('notices').insert({title:form.title,content:form.content,is_pinned:form.is_pinned,created_by:user.id});}
    }catch(e){}
    setSaving(false);setShowForm(false);load();
  };

  const del=async n=>{
    if(!confirm('"'+n.title+'" 공지를 삭제하시겠습니까?'))return;
    await getSb().from('notices').delete().eq('id',n.id);
    if(sel&&sel.id===n.id)setSel(null);
    load();
  };

  const openNotice=async n=>{
    setSel(n);
    if(!readIds.has(n.id)){
      try{await getSb().from('notice_reads').upsert({notice_id:n.id,user_id:user.id},{onConflict:'notice_id,user_id',ignoreDuplicates:true});}catch(e){}
      onRead(n.id);
    }
  };

  if(loading)return<div className="empty">불러오는 중...</div>;

  return(
    <div>
      {canWrite&&!showForm&&(
        <div style={{marginBottom:10,display:'flex',justifyContent:'flex-end'}}>
          <button className="btn btn-p btn-sm" onClick={openNew}>+ 공지 작성</button>
        </div>
      )}
      {showForm&&(
        <div className="nform">
          <div style={{marginBottom:8}}><label className="fl">제목</label><input className="fi" value={form.title} onChange={e=>setForm(p=>({...p,title:e.target.value}))} placeholder="공지 제목"/></div>
          <div style={{marginBottom:8}}><label className="fl">내용</label><textarea className="fi ta" value={form.content} onChange={e=>setForm(p=>({...p,content:e.target.value}))} placeholder="공지 내용"/></div>
          <div style={{marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
            <input type="checkbox" id="pin" checked={form.is_pinned} onChange={e=>setForm(p=>({...p,is_pinned:e.target.checked}))}/>
            <label htmlFor="pin" style={{fontSize:12,cursor:'pointer'}}>📌 상단 고정</label>
          </div>
          {err&&<div style={{color:'#dc2626',fontSize:12,marginBottom:8}}>{err}</div>}
          <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>setShowForm(false)}>취소</button>
            <button className="btn btn-p btn-sm" onClick={save} disabled={saving}>{saving?'저장 중...':'저장'}</button>
          </div>
        </div>
      )}
      {notices.length===0&&<div className="empty">등록된 공지사항이 없습니다.</div>}
      {notices.map(n=>(
        <div key={n.id} className={'ni'+(n.is_pinned?' pin':'')} onClick={()=>openNotice(n)}>
          <div className="ni-title">
            {n.is_pinned&&<span>📌</span>}
            {n.title}
            {!readIds.has(n.id)&&<span className="badge-new">NEW</span>}
          </div>
          <div className="ni-meta">{fmtFull(n.created_at&&n.created_at.slice(0,10))}</div>
        </div>
      ))}
      {sel&&(
        <div className="mbg" onClick={()=>setSel(null)}>
          <div className="mbox" onClick={e=>e.stopPropagation()}>
            <div className="mh">
              <span className="mht">{sel.is_pinned&&'📌 '}{sel.title}</span>
              <button className="mc" onClick={()=>setSel(null)}>×</button>
            </div>
            <div className="mb">
              <div style={{fontSize:11,color:'#94a3b8',marginBottom:12}}>{fmtFull(sel.created_at&&sel.created_at.slice(0,10))}</div>
              <div style={{fontSize:13,color:'#334155',lineHeight:1.7,whiteSpace:'pre-wrap'}}>{sel.content}</div>
            </div>
            {canWrite&&(
              <div className="mf">
                <button className="btn btn-d btn-sm" onClick={()=>del(sel)}>삭제</button>
                <button className="btn btn-s btn-sm" onClick={()=>{setSel(null);openEdit(sel);}}>수정</button>
                <button className="btn btn-s btn-sm" onClick={()=>setSel(null)}>닫기</button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// CalendarView
// ═══════════════════════════════════════════════════════
const CATS=['일반','회식','워크숍','교육','행사'];
const WD=['일','월','화','수','목','금','토'];

function CalendarView({user,teamName}){
  const now=new Date();
  const [tab,setTab]=useState('month');
  const [yr,setYr]=useState(now.getFullYear());
  const [mo,setMo]=useState(now.getMonth());
  const getSun=d=>{const x=new Date(d);x.setDate(x.getDate()-x.getDay());return x;};
  const [ws,setWs]=useState(()=>getSun(now));
  const [leaves,setLeaves]=useState([]);
  const [pevs,setPevs]=useState([]);
  const [cevs,setCevs]=useState([]);
  const [users,setUsers]=useState([]);
  const [teams,setTeams]=useState([]);
  const [projs,setProjs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showEvF,setShowEvF]=useState(false);
  const [selDay,setSelDay]=useState(null);
  const [evF,setEvF]=useState({title:'',date:'',end_date:'',category:'일반',memo:''});
  const [saving,setSaving]=useState(false);
  const [editEv,setEditEv]=useState(null);
  const canWrite=user.role==='admin'||teamName==='관리팀';
  const td=todayStr();

  const load=async()=>{
    setLoading(true);
    try{
      const [a,b,c,d,e,f]=await Promise.all([
        getSb().from('leave_requests').select('*').in('status',['approved','manager_approved']),
        getSb().from('project_events').select('*,projects(name)'),
        getSb().from('company_events').select('*'),
        getSb().from('users').select('id,name,team_id'),
        getSb().from('teams').select('id,name'),
        getSb().from('projects').select('id,name,start_date,end_date,status'),
      ]);
      setLeaves(a.data||[]);setPevs(b.data||[]);setCevs(c.data||[]);setUsers(d.data||[]);setTeams(e.data||[]);setProjs(f.data||[]);
    }catch(ex){console.error(ex);}
    setLoading(false);
  };

  useEffect(()=>{fetchHolidays();load();},[]);

  const tColor=uid=>{const u=users.find(x=>x.id===uid);const t=teams.find(t=>t.id===u?.team_id);return TCOL[t?.name]||'#94a3b8';};

  const lvLabel=l=>{
    const d=Number(l.days);const u=users.find(x=>x.id===l.user_id);const nm=u?.name||'';
    if(d>=1)return nm;
    const tag=d<=0.25?'2H':'4H';
    return l.type==='공가'?nm+'(공가·'+tag+')':nm+'('+tag+')';
  };

  const buildMap=()=>{
    const m={};
    const add=(ds,ev)=>{if(!m[ds])m[ds]=[];m[ds].push(ev);};
    leaves.forEach(l=>{
      let cur=new Date((l.start_date||l.end_date)+'T00:00:00');
      const end=new Date((l.end_date||l.start_date)+'T00:00:00');
      let n=0;
      while(cur<=end&&n<31){
        const ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        const u2=users.find(x=>x.id===l.user_id);
        const d2=Number(l.days);
        const timeTag=d2>=1?'DAY':d2<=0.25?'2H':'4H';
        const shortLabel=(u2?u2.name.charAt(0):'?')+'('+timeTag+')';
        add(ds,{k:'leave',label:lvLabel(l),shortLabel:shortLabel,fullName:u2?u2.name:'',timeTag:timeTag,type:l.type,bg:tColor(l.user_id),tx:'#fff',raw:l});
        cur.setDate(cur.getDate()+1);n++;
      }
    });
    pevs.forEach(p=>{
      const c=evc(p.type);
      add(p.event_date,{k:'proj',type:p.type,label:p.title||p.type,bg:c.bg,tx:c.tx,bd:c.bd,pname:p.projects&&p.projects.name});
    });
    cevs.forEach(c=>{
      let cur=new Date(c.date+'T00:00:00');
      const end=new Date((c.end_date||c.date)+'T00:00:00');
      let n=0;
      while(cur<=end&&n<31){
        const ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        add(ds,{k:'comp',label:c.title,bg:'#f3e8ff',tx:'#6b21a8',bd:'#a855f7',raw:c});
        cur.setDate(cur.getDate()+1);n++;
      }
    });
    projs.forEach(p=>{
      if(p.start_date) add(p.start_date,{k:'proj',type:'착수일',label:p.name,bg:'#eff6ff',tx:'#1d4ed8',bd:'#3b82f6',pname:p.name});
      if(p.end_date){
        const isDone=p.status==='완료';
        add(p.end_date,{k:'proj',type:'준공일',label:p.name,bg:isDone?'#f1f5f9':'#fdf4ff',tx:isDone?'#64748b':'#7c3aed',bd:isDone?'#94a3b8':'#a855f7',pname:p.name});
      }
    });
    return m;
  };
  const evMap=buildMap();

  // ── 날짜 유틸 ──────────────────────────────────────────
  const mkDs=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const ds2=d=>d?mkDs(yr,mo,d):null;

  // ── 월간 셀 데이터 ─────────────────────────────────────
  const dim=new Date(yr,mo+1,0).getDate();
  const fd=new Date(yr,mo,1).getDay();
  const cells=[];
  for(let i=0;i<fd;i++)cells.push(null);
  for(let d=1;d<=dim;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  // ── 주간 날짜 목록 ─────────────────────────────────────
  const wdays=Array.from({length:7},(_,i)=>{const x=new Date(ws);x.setDate(ws.getDate()+i);return mkDs(x.getFullYear(),x.getMonth(),x.getDate());});
  const wlabel=()=>{const s=new Date(ws),e=new Date(ws);e.setDate(s.getDate()+6);return s.getMonth()===e.getMonth()?s.getFullYear()+'년 '+(s.getMonth()+1)+'월 '+s.getDate()+'~'+e.getDate()+'일':(s.getMonth()+1)+'/'+(s.getDate())+' ~ '+(e.getMonth()+1)+'/'+(e.getDate());};

  // ── 네비게이션 ─────────────────────────────────────────
  const prev=()=>{
    if(tab==='week'){const d=new Date(ws);d.setDate(d.getDate()-7);setWs(d);}
    else if(tab==='year'){setYr(y=>y-1);}
    else if(mo===0){setMo(11);setYr(y=>y-1);}
    else setMo(m=>m-1);
  };
  const next=()=>{
    if(tab==='week'){const d=new Date(ws);d.setDate(d.getDate()+7);setWs(d);}
    else if(tab==='year'){setYr(y=>y+1);}
    else if(mo===11){setMo(0);setYr(y=>y+1);}
    else setMo(m=>m+1);
  };
  const navLbl=tab==='week'?wlabel():tab==='year'?yr+'년':yr+'년 '+(mo+1)+'월';

  // ── 이벤트 모달 ────────────────────────────────────────
  const openDay=ds=>{
    const evs=evMap[ds]||[];
    const h=HOL[ds]||SUB[ds];
    if(!evs.length&&!h)return;
    setSelDay({date:ds,events:evs,hol:h});
  };

  // ── 회사일정 CRUD ──────────────────────────────────────
  const saveEv=async()=>{
    if(!evF.title.trim()||!evF.date)return;
    setSaving(true);
    try{
      let result;
      if(editEv){
        result=await getSb().from('company_events').update({title:evF.title,date:evF.date,end_date:evF.end_date||null,category:evF.category,memo:evF.memo||null}).eq('id',editEv.id);
      }else{
        result=await getSb().from('company_events').insert({title:evF.title,date:evF.date,end_date:evF.end_date||null,category:evF.category,memo:evF.memo||null,created_by:user.id});
      }
      if(result&&result.error){alert('저장 오류: '+result.error.message);setSaving(false);return;}
    }catch(ex){alert('저장 중 오류가 발생했습니다.');}
    setSaving(false);setShowEvF(false);setEditEv(null);setEvF({title:'',date:'',end_date:'',category:'일반',memo:''});load();
  };
  const delEv=async id=>{
    if(!confirm('삭제하시겠습니까?'))return;
    await getSb().from('company_events').delete().eq('id',id);
    setSelDay(null);load();
  };

  // ── 월간 셀 렌더 ───────────────────────────────────────
  const renderCell=(ds,d,dow)=>{
    const allEvs=evMap[ds]||[];
    const h=HOL[ds],s=SUB[ds];
    const isHol=!!(h||s);
    const isTd=ds===td,isSun=dow===0,isSat=dow===6;
    const nc=isHol?'#dc2626':isSun?'#ef4444':isSat?'#3b82f6':'#374151';
    const bg=isTd?'#fef9c3':isHol?'#fff1f2':(isSun||isSat)?'#fafafa':'#fff';
    const projEvs=allEvs.filter(e=>e.k==='proj');
    const compEvs=allEvs.filter(e=>e.k==='comp');
    const lvEvs=allEvs.filter(e=>e.k==='leave');
    return(
      <div key={ds} className={'cal-cell'+(isTd?' today':'')}
        style={{background:bg,border:isTd?'2px solid #f59e0b':'0.5px solid #f1f5f9',cursor:allEvs.length||h||s?'pointer':'default'}}
        onClick={()=>openDay(ds)}>
        <div className={'cal-dn'+(isTd?' t':'')} style={{color:isTd?'#fff':nc,fontWeight:isHol?700:400}}>{d}</div>
        {h&&<div className="cal-hol">{h}</div>}
        {s&&!h&&<div className="cal-hol">대체공휴일</div>}
        {projEvs.map((ev,j)=>{
          const isAuto=ev.type==='착수일'||ev.type==='준공일';
          const dispText=isAuto?(ev.type==='착수일'?'🚀 착수':'📅 준공'):ev.type;
          return(
            <div key={'p'+j} style={{display:'inline-flex',alignItems:'center',gap:2,marginBottom:2,background:ev.bg,border:'1px solid '+ev.bd,borderRadius:4,padding:'2px 6px',maxWidth:'100%'}}>
              <span style={{background:isAuto?'transparent':ev.bd,color:isAuto?ev.tx:'#fff',borderRadius:2,padding:isAuto?'0':'0 4px',fontSize:9,fontWeight:800,whiteSpace:'nowrap'}}>{dispText}</span>
            </div>
          );
        })}
        {compEvs.slice(0,1).map((ev,j)=>(
          <div key={'c'+j} style={{background:'#f3e8ff',border:'1px solid #a855f7',borderRadius:4,padding:'2px 5px',fontSize:9,fontWeight:700,color:'#6b21a8',marginBottom:2,overflow:'hidden',whiteSpace:'nowrap'}}>{ev.label}</div>
        ))}
        {lvEvs.length>0&&(
          <div style={{display:'flex',flexWrap:'wrap',gap:2,marginTop:2}}>
            {lvEvs.slice(0,4).map((ev,j)=>(
              <span key={'l'+j} style={{background:ev.bg,color:'#fff',borderRadius:10,padding:'1px 4px',fontSize:8,fontWeight:800,whiteSpace:'nowrap',flexShrink:0}} title={ev.label}>
                {ev.shortLabel||ev.label}
              </span>
            ))}
            {lvEvs.length>4&&<span style={{fontSize:7,color:'#94a3b8',alignSelf:'center'}}>+{lvEvs.length-4}</span>}
          </div>
        )}
      </div>
    );
  };

  // ── 주간 뷰 ────────────────────────────────────────────
  const renderWeekView=()=>{
    return(
      <div style={{overflowX:'auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,minmax(120px,1fr))',minWidth:700}}>
          {/* 요일 헤더 */}
          {wdays.map((ds,i)=>{
            const dow=new Date(ds+'T12:00:00').getDay();
            const dn=parseInt(ds.split('-')[2]);
            const mm=parseInt(ds.split('-')[1]);
            const h=HOL[ds]||SUB[ds];
            const isHol=!!h;
            const isTd=ds===td,isSun=dow===0,isSat=dow===6;
            const hc=isHol?'#dc2626':isSun?'#ef4444':isSat?'#3b82f6':'#e2e8f0';
            const bg=isTd?'#1d4ed8':isHol?'#7f1d1d':(isSun||isSat)?'#1e293b':'#0f172a';
            const tc=isTd?'#fff':isHol?'#fca5a5':(isSun||isSat)?'#94a3b8':'#e2e8f0';
            return(
              <div key={ds} style={{background:bg,padding:'8px 10px',borderRight:'1px solid #1e293b',textAlign:'center'}}>
                <div style={{fontSize:10,color:hc,fontWeight:600,marginBottom:2}}>{WD[dow]}</div>
                <div style={{fontSize:18,fontWeight:800,color:tc,lineHeight:1}}>{dn}</div>
                <div style={{fontSize:9,color:'#64748b',marginTop:1}}>{mm}월</div>
                {h&&<div style={{fontSize:9,color:'#fca5a5',marginTop:3,fontWeight:700,lineHeight:1.2}}>{h}</div>}
              </div>
            );
          })}
          {/* 이벤트 열 */}
          {wdays.map((ds,i)=>{
            const dow=new Date(ds+'T12:00:00').getDay();
            const allEvs=evMap[ds]||[];
            const h=HOL[ds],s=SUB[ds];
            const isHol=!!(h||s);
            const isTd=ds===td,isSun=dow===0,isSat=dow===6;
            const bg=isTd?'#fffbeb':isHol?'#fff5f5':(isSun||isSat)?'#f8fafc':'#fff';
            const projEvs=allEvs.filter(e=>e.k==='proj');
            const compEvs=allEvs.filter(e=>e.k==='comp');
            const lvEvs=allEvs.filter(e=>e.k==='leave');
            const isEmpty=!allEvs.length&&!h&&!s;
            return(
              <div key={ds} style={{background:bg,borderRight:'1px solid #f1f5f9',borderTop:'2px solid '+(isTd?'#f59e0b':isHol?'#fca5a5':(isSun||isSat)?'#e2e8f0':'#f1f5f9'),padding:'8px 6px',minHeight:160,cursor:isEmpty?'default':'pointer'}}
                onClick={()=>openDay(ds)}>
                {isEmpty&&<div style={{color:'#cbd5e1',fontSize:11,textAlign:'center',marginTop:20}}>—</div>}
                {/* 대체공휴일 */}
                {s&&!h&&(
                  <div style={{background:'#fee2e2',color:'#dc2626',borderRadius:5,padding:'3px 7px',fontSize:10,fontWeight:700,marginBottom:5}}>🎌 대체공휴일</div>
                )}
                {/* 주요공정 — 전부 표시 */}
                {projEvs.map((ev,j)=>{
                  const isAuto=ev.type==='착수일'||ev.type==='준공일';
                  return(
                    <div key={'wp'+j} style={{background:ev.bg,border:'1px solid '+ev.bd,borderRadius:5,padding:'4px 7px',marginBottom:5,display:'flex',alignItems:'flex-start',gap:5}}>
                      <span style={{background:isAuto?ev.bg:ev.bd,color:isAuto?ev.tx:'#fff',border:isAuto?'1px solid '+ev.bd:'none',borderRadius:3,padding:'0 4px',fontSize:9,fontWeight:800,whiteSpace:'nowrap',flexShrink:0,lineHeight:'16px'}}>
                        {isAuto?(ev.type==='착수일'?'🚀착수':'📅준공'):ev.type}
                      </span>
                      {ev.pname&&<span style={{fontSize:10,color:ev.tx,fontWeight:700,lineHeight:'16px',wordBreak:'keep-all'}}>{ev.pname}</span>}
                    </div>
                  );
                })}
                {/* 회사일정 — 전부 표시 */}
                {compEvs.map((ev,j)=>(
                  <div key={'wc'+j} style={{background:'#f3e8ff',border:'1px solid #a855f7',borderRadius:5,padding:'4px 7px',marginBottom:5}}>
                    <div style={{fontSize:10,fontWeight:700,color:'#6b21a8',wordBreak:'keep-all'}}>{ev.label}</div>
                    {ev.raw&&ev.raw.category&&ev.raw.category!=='일반'&&<div style={{fontSize:9,color:'#94a3b8',marginTop:1}}>{ev.raw.category}</div>}
                  </div>
                ))}
                {/* 연차/공가 — 전부 표시 */}
                {lvEvs.map((ev,j)=>(
                  <div key={'wl'+j} style={{background:ev.bg,borderRadius:5,padding:'4px 7px',marginBottom:5,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                    <span style={{color:'#fff',fontSize:10,fontWeight:800}}>{ev.fullName||ev.label}</span>
                    <span style={{background:'rgba(255,255,255,0.25)',color:'#fff',borderRadius:3,padding:'0 4px',fontSize:8,fontWeight:700}}>
                      {ev.type==='공가'?'공가':'연차'}{ev.timeTag!=='DAY'?' · '+ev.timeTag:''}
                    </span>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── 연간 뷰 ────────────────────────────────────────────
  const renderMiniMonth=(y,m)=>{
    const dim2=new Date(y,m+1,0).getDate();
    const fd2=new Date(y,m,1).getDay();
    const cells2=[];
    for(let i=0;i<fd2;i++)cells2.push(null);
    for(let d=1;d<=dim2;d++)cells2.push(d);
    while(cells2.length%7!==0)cells2.push(null);
    return(
      <div key={m} style={{background:'#fff',borderRadius:8,border:'1px solid #e2e8f0',overflow:'hidden',cursor:'default'}}>
        {/* 미니 월 헤더 */}
        <div style={{background:'#0f172a',padding:'6px 10px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontSize:12,fontWeight:800,color:'#fff'}}>{m+1}월</span>
          <span style={{fontSize:10,color:'#64748b'}}>{y}</span>
        </div>
        {/* 요일 헤더 */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',background:'#f8fafc'}}>
          {WD.map((w,i)=>(
            <div key={w} style={{textAlign:'center',fontSize:8,fontWeight:700,padding:'3px 0',color:i===0?'#ef4444':i===6?'#3b82f6':'#94a3b8'}}>{w}</div>
          ))}
        </div>
        {/* 날짜 그리드 */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)'}}>
          {cells2.map((d2,idx)=>{
            if(!d2)return<div key={'me'+idx} style={{padding:'3px 0',minHeight:28}}/>;
            const ds=mkDs(y,m,d2);
            const dow=idx%7;
            const h2=HOL[ds]||SUB[ds];
            const isHol2=!!h2;
            const isTd2=ds===td,isSun2=dow===0,isSat2=dow===6;
            const hasEv=(evMap[ds]||[]).length>0;
            const nc2=isHol2?'#dc2626':isSun2?'#ef4444':isSat2?'#3b82f6':'#374151';
            const bg2=isTd2?'#1d4ed8':isHol2?'#fff1f2':'transparent';
            const tc2=isTd2?'#fff':nc2;
            return(
              <div key={ds} style={{textAlign:'center',padding:'2px 0',minHeight:28,cursor:hasEv||isHol2?'pointer':'default',background:bg2,borderRadius:isTd2?'50%':'0'}}
                onClick={()=>openDay(ds)}>
                <div style={{fontSize:9,fontWeight:isHol2||isTd2?700:400,color:tc2,lineHeight:'16px'}}>{d2}</div>
                {/* 이벤트 점 표시 */}
                {hasEv&&!isTd2&&(
                  <div style={{display:'flex',justifyContent:'center',gap:1,marginTop:1}}>
                    {(evMap[ds]||[]).filter(e=>e.k==='proj').length>0&&<div style={{width:4,height:4,borderRadius:'50%',background:'#3b82f6'}}/>}
                    {(evMap[ds]||[]).filter(e=>e.k==='comp').length>0&&<div style={{width:4,height:4,borderRadius:'50%',background:'#a855f7'}}/>}
                    {(evMap[ds]||[]).filter(e=>e.k==='leave').length>0&&<div style={{width:4,height:4,borderRadius:'50%',background:'#22c55e'}}/>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const renderYearView=()=>(
    <div style={{padding:'14px 14px 10px'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
        {Array.from({length:12},(_,m)=>renderMiniMonth(yr,m))}
      </div>
      {/* 연간 범례 */}
      <div style={{display:'flex',flexWrap:'wrap',gap:10,padding:'12px 2px 0',borderTop:'1px solid #f1f5f9',marginTop:12}}>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#64748b'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#3b82f6'}}/><span>공정</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#64748b'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#a855f7'}}/><span>회사일정</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#64748b'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:'#22c55e'}}/><span>연차</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#64748b'}}>
          <div style={{width:10,height:10,borderRadius:'50%',background:'#1d4ed8',display:'flex',alignItems:'center',justifyContent:'center',fontSize:7,color:'#fff',fontWeight:800}}>오</div><span>오늘</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:4,fontSize:10,color:'#64748b'}}>
          <span style={{color:'#ef4444',fontWeight:700}}>일</span><span>/ 공휴일</span>
        </div>
      </div>
    </div>
  );

  // ── 탭 버튼 스타일 ─────────────────────────────────────
  const tabBtn=(key,label)=>(
    <button key={key} onClick={()=>setTab(key)}
      style={{background:tab===key?'#1d4ed8':'#1e293b',color:tab===key?'#fff':'#94a3b8',border:'none',borderRadius:4,padding:'2px 9px',fontSize:10,fontWeight:700,cursor:'pointer'}}>
      {label}
    </button>
  );

  return(
    <div>
      {canWrite&&!showEvF&&(
        <div style={{marginBottom:10,display:'flex',justifyContent:'flex-end'}}>
          <button className="btn btn-p btn-sm" onClick={()=>{setEditEv(null);setEvF({title:'',date:'',end_date:'',category:'일반',memo:''});setShowEvF(true);}}>+ 회사 일정</button>
        </div>
      )}
      {showEvF&&(
        <div className="nform" style={{marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>{editEv?'일정 수정':'회사 일정 등록'}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
            <div><label className="fl">제목 *</label><input className="fi" value={evF.title} onChange={e=>setEvF(p=>({...p,title:e.target.value}))} placeholder="일정 제목"/></div>
            <div><label className="fl">분류</label><select className="fi" value={evF.category} onChange={e=>setEvF(p=>({...p,category:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select></div>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}}>
            <div><label className="fl">시작일 *</label><input type="date" className="fi" value={evF.date} onChange={e=>setEvF(p=>({...p,date:e.target.value}))}/></div>
            <div><label className="fl">종료일</label><input type="date" className="fi" value={evF.end_date} onChange={e=>setEvF(p=>({...p,end_date:e.target.value}))}/></div>
          </div>
          <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
            <button className="btn btn-s btn-sm" onClick={()=>{setShowEvF(false);setEditEv(null);}}>취소</button>
            <button className="btn btn-p btn-sm" onClick={saveEv} disabled={saving}>{saving?'저장 중...':'저장'}</button>
          </div>
        </div>
      )}

      <div className="cal-wrap">
        {/* 헤더 — 공통 */}
        <div className="cal-hdr">
          <button className="cal-nav" onClick={prev}>‹</button>
          <span className="cal-title">{navLbl}</span>
          <button className="cal-nav" onClick={next}>›</button>
          <div style={{display:'flex',gap:4,marginLeft:8}}>
            {tabBtn('year','연간')}
            {tabBtn('month','월간')}
            {tabBtn('week','주간')}
          </div>
        </div>

        {/* 월간 */}
        {tab==='month'&&(
          <>
            <div className="cal-grid">
              {WD.map((d,i)=><div key={d} className="cal-dh" style={{color:i===0?'#ef4444':i===6?'#3b82f6':'#64748b'}}>{d}</div>)}
              {cells.map((d,i)=>{
                if(!d)return<div key={'e'+i} className="cal-cell" style={{background:'#fafafa',border:'0.5px solid #f1f5f9'}}/>;
                return renderCell(ds2(d),d,i%7);
              })}
            </div>
            <div className="legend">
              <div className="legend-item"><div className="legend-dot" style={{background:'#2563eb'}}/><span>연차/공가(팀색)</span></div>
              <div className="legend-item"><div className="legend-dot" style={{background:'#dbeafe',border:'1px solid #3b82f6'}}/><span>주요공정</span></div>
              <div className="legend-item"><div className="legend-dot" style={{background:'#f3e8ff',border:'1px solid #a855f7'}}/><span>회사일정</span></div>
              <div className="legend-item"><div className="legend-dot" style={{background:'#fee2e2',border:'1px solid #ef4444'}}/><span>공휴일</span></div>
            </div>
          </>
        )}

        {/* 주간 */}
        {tab==='week'&&renderWeekView()}

        {/* 연간 */}
        {tab==='year'&&renderYearView()}
      </div>

      {/* 일별 상세 모달 */}
      {selDay&&(
        <div className="mbg" onClick={()=>setSelDay(null)}>
          <div className="mbox" onClick={e=>e.stopPropagation()}>
            <div className="mh"><span className="mht">{fmtFull(selDay.date)} 일정</span><button className="mc" onClick={()=>setSelDay(null)}>×</button></div>
            <div className="mb">
              {selDay.hol&&<div style={{background:'#fef2f2',color:'#dc2626',padding:'5px 9px',borderRadius:5,fontSize:12,fontWeight:700,marginBottom:8}}>🎌 {selDay.hol}</div>}
              {selDay.events.length===0&&<div style={{color:'#94a3b8',fontSize:13}}>이벤트 없음</div>}
              {selDay.events.map((ev,i)=>(
                <div key={i} style={{borderRadius:7,padding:'8px 12px',marginBottom:8,background:'#fff',border:'1px solid #e2e8f0',borderLeft:'4px solid '+(ev.bd||ev.bg)}}>
                  {ev.k==='proj'&&(
                    <div>
                      <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:ev.pname?4:0}}>
                        <span style={{background:ev.bd,color:'#fff',borderRadius:4,padding:'1px 7px',fontSize:11,fontWeight:800}}>{ev.type}</span>
                        {ev.label!==ev.type&&<span style={{fontSize:12,fontWeight:700,color:'#1e293b'}}>{ev.label}</span>}
                      </div>
                      {ev.pname&&<div style={{fontSize:12,color:'#334155',fontWeight:600,marginTop:2}}>📋 {ev.pname}</div>}
                    </div>
                  )}
                  {ev.k==='leave'&&(
                    <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                      <span style={{background:ev.bg,color:'#fff',borderRadius:10,padding:'2px 10px',fontSize:13,fontWeight:800}}>{ev.fullName||ev.label}</span>
                      <span style={{fontSize:12,color:'#1e293b',fontWeight:700}}>{ev.type==='공가'?'공가':'연차'} · {ev.timeTag==='DAY'?'하루':ev.timeTag}</span>
                      {ev.raw&&ev.raw.start_time&&<span style={{fontSize:11,color:'#64748b'}}>{ev.raw.start_time.slice(0,5)}~{ev.raw.end_time&&ev.raw.end_time.slice(0,5)}</span>}
                    </div>
                  )}
                  {ev.k==='comp'&&(
                    <div>
                      <div style={{fontSize:12,fontWeight:700,color:ev.tx}}>{ev.label}</div>
                      {ev.raw&&ev.raw.category&&ev.raw.category!=='일반'&&<div style={{fontSize:10,color:'#94a3b8',marginTop:2}}>{ev.raw.category}</div>}
                      {ev.raw&&ev.raw.memo&&<div style={{fontSize:11,color:'#64748b',marginTop:3}}>{ev.raw.memo}</div>}
                      {canWrite&&(
                        <div style={{display:'flex',gap:6,marginTop:6}}>
                          <button className="btn btn-s btn-sm" onClick={()=>{setEditEv(ev.raw);setEvF({title:ev.raw.title,date:ev.raw.date,end_date:ev.raw.end_date||'',category:ev.raw.category,memo:ev.raw.memo||''});setSelDay(null);setShowEvF(true);}}>수정</button>
                          <button className="btn btn-d btn-sm" onClick={()=>delEv(ev.raw.id)}>삭제</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
            <div className="mf"><button className="btn btn-s btn-sm" onClick={()=>setSelDay(null)}>닫기</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════
// App
// ═══════════════════════════════════════════════════════
const SysBar=Sysbar.createComponent(React);

function App(){
  const initUser=(()=>{
    try{
      if(Sysbar.SessionManager.checkOnLoad())return null;
      const raw=sessionStorage.getItem('kwanbo_session');
      if(!raw)return null;
      const v=JSON.parse(raw);
      if(v&&v.id&&v.role){
        if(v.password){delete v.password;sessionStorage.setItem('kwanbo_session',JSON.stringify(v));}
        sb=makeSb(v.id,v.role);
        if(v.role==='contractor'){window.location.replace('project.html');return null;}
        return v;
      }
    }catch(e){}
    return null;
  })();

  const [user,setUser]=useState(initUser);
  const [checked,setChecked]=useState(!!initUser);
  const [teamName,setTeamName]=useState('');
  const [readIds,setReadIds]=useState(new Set());
  const [unread,setUnread]=useState(0);
  const [pendingLeaves,setPendingLeaves]=useState([]);

  // 구버전 세션 복원
  useEffect(()=>{
    if(initUser){return;}
    const raw=sessionStorage.getItem('kwanbo_session');
    if(!raw){setChecked(true);return;}
    try{
      const v=JSON.parse(raw);
      const uid=v&&v.userId;
      if(!uid){setChecked(true);return;}
      getSb().from('users').select('id,name,phone,email,position,team_id,role,join_date,total_days').eq('id',uid).single().then(({data})=>{
        if(data){
          if(data.role==='contractor'){window.location.replace('project.html');return;}
          sb=makeSb(data.id,data.role);
          const su={...data};delete su.password;
          sessionStorage.setItem('kwanbo_session',JSON.stringify(su));
          setUser(su);
        }
        setChecked(true);
      }).catch(()=>setChecked(true));
    }catch(e){setChecked(true);}
  },[]);

  // 팀명
  useEffect(()=>{
    if(!user)return;
    if(user.role==='admin'){setTeamName('관리자');return;}
    if(!user.team_id){setTeamName('');return;}
    getSb().from('teams').select('name').eq('id',user.team_id).single().then(({data})=>{if(data)setTeamName(data.name);}).catch(()=>{});
  },[user]);

  // 미결 연차 조회 (팀장: pending / 관리자: manager_approved)
  useEffect(()=>{
    if(!user)return;
    (async()=>{
      try{
        let q=getSb().from('leave_requests').select('*,users(name,team_id)');
        if(user.role==='admin'){
          // 관리자: manager_approved 전체
          q=q.eq('status','manager_approved');
        } else if(user.role==='manager'){
          // 팀장: 본인 팀의 pending만
          q=q.eq('status','pending');
        } else {
          setPendingLeaves([]);return;
        }
        const {data}=await q;
        // 팀장이면 본인 팀 소속만 필터
        if(user.role==='manager'&&user.team_id){
          setPendingLeaves((data||[]).filter(l=>l.users&&l.users.team_id===user.team_id));
        } else {
          setPendingLeaves(data||[]);
        }
      }catch(e){console.error(e);}
    })();
  },[user,teamName]);

  // 미읽음
  useEffect(()=>{
    if(!user)return;
    (async()=>{
      try{
        const [{data:r},{data:a}]=await Promise.all([
          getSb().from('notice_reads').select('notice_id').eq('user_id',user.id),
          getSb().from('notices').select('id'),
        ]);
        const ids=new Set((r||[]).map(x=>x.notice_id));
        setReadIds(ids);
        setUnread((a||[]).filter(n=>!ids.has(n.id)).length);
      }catch(e){}
    })();
  },[user]);

  const handleLogin=u=>{
    // doLogin()이 이미 세션 저장 완료 → sb 재생성 + state 반영만
    if(u.role==='contractor'){window.location.replace('project.html');return;}
    sb=makeSb(u.id,u.role);
    setUser(u);
    Sysbar.SessionManager.onLogin(()=>logout());
  };

  const logout=()=>{
    sb=null;
    Sysbar.Auth.clearSession();
    setUser(null);
  };

  const onRead=id=>{setReadIds(p=>{const s=new Set(p);s.add(id);return s;});setUnread(p=>Math.max(0,p-1));};

  if(!checked)return<div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#94a3b8',fontSize:13}}>로딩 중...</div>;
  if(!user)return<LoginScreen supabaseClient={getSb()} onLogin={handleLogin}/>;

  return(
    <div>
      <SysBar activeKey="home" user={user} teamName={teamName} onLogout={logout}/>
      <div style={{background:'#0f172a',padding:'6px 18px 8px',position:'sticky',top:38,zIndex:250,borderBottom:'2px solid #1d4ed8'}}>
        <p style={{margin:0,fontSize:9,lineHeight:'1.2',color:'#475569',letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{margin:0,fontSize:14,lineHeight:'1.3',fontWeight:800,color:'white',letterSpacing:-0.3}}>통합 홈</p>
      </div>
      <div className="page">
        {/* 결재 대기 알림 배너 */}
        {pendingLeaves.length>0&&(
          <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:10,padding:'12px 16px',marginBottom:20,display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:20}}>⏳</span>
              <div>
                <div style={{fontSize:13,fontWeight:800,color:'#92400e'}}>결재 대기 {pendingLeaves.length}건</div>
                <div style={{fontSize:11,color:'#b45309',marginTop:2}}>
                  {pendingLeaves.slice(0,3).map((l,i)=>(
                    <span key={i} style={{marginRight:8}}>
                      {l.users&&l.users.name} ({l.days>=1?l.days+'일':l.days<=0.25?'2H':'4H'} · {l.start_date})
                      {i<Math.min(pendingLeaves.length,3)-1&&' · '}
                    </span>
                  ))}
                  {pendingLeaves.length>3&&<span>외 {pendingLeaves.length-3}건</span>}
                </div>
              </div>
            </div>
            <a href="leave.html" style={{background:'#f59e0b',color:'#fff',borderRadius:6,padding:'6px 14px',fontSize:12,fontWeight:700,textDecoration:'none',whiteSpace:'nowrap',flexShrink:0}}>
              승인하기 →
            </a>
          </div>
        )}
        <div className="sec-title">
          📢 공지사항
          {unread>0&&<span style={{background:'#ef4444',color:'#fff',fontSize:10,fontWeight:800,padding:'1px 7px',borderRadius:10}}>{unread}개 안 읽음</span>}
        </div>
        <NoticeView user={user} teamName={teamName} readIds={readIds} onRead={onRead}/>
        <div className="divider"/>
        <div className="sec-title">📅 통합 달력</div>
        <CalendarView user={user} teamName={teamName}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
