<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── 업무관리 → 서류작성 (2026-11-09) ─────────────────────────────────────
// 여러 서류를 담는 틀. 서류 종류는 아래 DOC_TYPES 한 곳에 등록한다(준공사진 · 공문). 주소 = docs.html#서류키.
// 권한: 직원 전체(협력업체 제외) — 권한 키 없음(SECTION_TABS.worklog 「서류작성」 show 와 같은 규칙).
// 관리포털 「서류작성」(admin-docs.html, 권한 키 docs)과는 다른 화면이다.
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
const SysBar = Sysbar.createComponent(React);
const LoginScreen = Sysbar.createLoginComponent(React, { subtitle: '서류작성', blockedRoles: ['contractor'] });
const PREFIX = (window.APP_CONFIG && APP_CONFIG.SESSION_PREFIX) || 'kwanbo';
const MOBILE_MAX = (window.APP_CONFIG && APP_CONFIG.MOBILE_MAX_WIDTH) || 768;
const JG_CFG = (window.APP_CONFIG && APP_CONFIG.JUNGONG) || {};
// 준공사진 생성기 파일 묶음 버전 — tools/jungong/make_manifest.py 가 출력한 값(엔진·자산·작업자를 바꾸면 같이 바꾼다)
const JUNGONG_V = '17813b4ff9fb';

function useIsMobile() {
  const q = '(max-width:' + MOBILE_MAX + 'px)';
  const [m, setM] = useState(function() { try { return window.matchMedia(q).matches; } catch (e) { return false; } });
  useEffect(function() {
    var mq; try { mq = window.matchMedia(q); } catch (e) { return; }
    function on() { setM(mq.matches); }
    if (mq.addEventListener) mq.addEventListener('change', on); else mq.addListener(on);
    return function() { if (mq.removeEventListener) mq.removeEventListener('change', on); else mq.removeListener(on); };
  }, []);
  return m;
}
function lsGet(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function thisMonth() { var d = new Date(); return d.getFullYear() + '. ' + String(d.getMonth() + 1).padStart(2, '0') + '.'; }
function downloadBytes(bytes, name, type) {
  var url = URL.createObjectURL(new Blob([bytes], { type: type || 'application/octet-stream' }));
  var a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
}
function pngUrl(bytes) { return bytes ? URL.createObjectURL(new Blob([bytes], { type: 'image/png' })) : null; }

// ── 확인 창(시스템 공통 모양: modal-bg / modal) ───────────────────────
//   ask({title, text, buttons:[{label, value, primary}]}) → Promise(value). Escape = 마지막 버튼(취소)
function useDialog() {
  const [dlg, setDlg] = useState(null);
  function ask(o) { return new Promise(function(res) { setDlg(Object.assign({}, o, { res: res })); }); }
  function close(v) { var d = dlg; setDlg(null); if (d) d.res(v); }
  var node = dlg ? <Dialog dlg={dlg} onClose={close} /> : null;
  return { ask: ask, node: node, info: function(t, x) { return ask({ title: t, text: x, buttons: [{ label: '확인', value: true, primary: true }] }); } };
}
function Dialog({ dlg, onClose }) {
  const first = useRef(null);
  useEffect(function() {
    if (first.current) first.current.focus();
    function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); onClose(dlg.buttons.length > 1 ? dlg.buttons[dlg.buttons.length - 1].value : true); } }
    document.addEventListener('keydown', onKey);
    return function() { document.removeEventListener('keydown', onKey); };
  }, []);
  return (
    <div className="modal-bg" role="dialog" aria-modal="true">
      <div className="modal" style={{ maxWidth: 480 }}>
        <h3>{dlg.title}</h3>
        <p>{dlg.text}</p>
        <div className="acts">
          {dlg.buttons.map(function(b, i) {
            return <button key={i} ref={b.primary ? first : null} className={'jg-b' + (b.primary ? ' p' : '')} onClick={function() { onClose(b.value); }}>{b.label}</button>;
          })}
        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
//  준공사진 생성기 (원본: 준공사진 생성기 v2.2 — engine.py 무수정, 화면 동작은 app.py 기준)
// ═════════════════════════════════════════════════════════════════════
// 작업자(Web Worker) 하나를 이 화면 동안 쓴다. 파이썬(Pyodide)은 작업자 안에서만 돈다(화면 멈춤 없음).
const JG = (function() {
  var w = null, meta = null, seq = 0, pend = {}, subs = [];
  var st = { phase: 'idle', text: '', pct: 0, error: '' };
  var t0 = 0;
  window.__jgTimes = { boot: null, calls: [] };   // 시험·안내용 측정값(화면 동작과 무관)
  function emit(n) { st = n; subs.forEach(function(f) { f(st); }); }
  function boot() {
    if (w) return;
    t0 = performance.now();
    emit({ phase: 'loading', text: '생성기 준비 중… 처음 한 번은 시간이 걸립니다', pct: 1, error: '' });
    try { w = new Worker('tools/jungong/jungong-worker.js?v=' + JUNGONG_V); }
    catch (e) { emit({ phase: 'failed', error: '이 브라우저에서는 생성기를 실행할 수 없습니다. (' + ((e && e.message) || e) + ')' }); return; }
    w.onmessage = function(ev) {
      var m = ev.data || {};
      if (m.type === 'progress') {
        if (m.id != null) { var p = pend[m.id]; if (p && p.onProgress) p.onProgress(m.text); }
        else emit({ phase: 'loading', text: m.text, pct: m.pct || st.pct, error: '' });
      } else if (m.type === 'ready') {
        meta = m.meta; window.__jgTimes.boot = Math.round(performance.now() - t0);
        emit({ phase: 'ready', text: '', pct: 100, error: '' });
      } else if (m.type === 'failed') {
        emit({ phase: 'failed', text: '', pct: 0, error: m.message || '알 수 없는 오류' });
      } else if (m.type === 'result') {
        var q = pend[m.id]; delete pend[m.id];
        if (!q) return;
        window.__jgTimes.calls.push({ cmd: q.cmd, ms: Math.round(performance.now() - q.t), py_ms: m.ms });
        if (m.ok) q.resolve(m.result);
        else { var err = new Error(m.error || '오류'); err.detail = m.detail; q.reject(err); }
      }
    };
    w.onerror = function(e) {
      if (e && e.preventDefault) e.preventDefault();
      emit({ phase: 'failed', error: (e && e.message) || '생성기 작업자 오류' });
    };
    w.postMessage({ cmd: 'boot' });
  }
  function call(cmd, args, onProgress) {
    return new Promise(function(resolve, reject) {
      if (!w || !meta) { reject(new Error('생성기가 아직 준비되지 않았습니다.')); return; }
      var id = ++seq;
      pend[id] = { resolve: resolve, reject: reject, onProgress: onProgress, cmd: cmd, t: performance.now() };
      var tr = (args && args.bytes && args.bytes.buffer) ? [args.bytes.buffer] : [];
      w.postMessage({ id: id, cmd: cmd, args: args || {} }, tr);
    });
  }
  return {
    boot: boot, call: call,
    meta: function() { return meta; }, state: function() { return st; },
    subscribe: function(f) { subs.push(f); f(st); return function() { subs = subs.filter(function(x) { return x !== f; }); }; }
  };
})();

function JungongDoc({ user }) {
  const [jg, setJg] = useState(JG.state());
  useEffect(function() { JG.boot(); return JG.subscribe(setJg); }, []);
  if (jg.phase === 'failed') return (
    <div className="dc-card jg-load">
      <h3>생성기를 시작하지 못했습니다</h3>
      <div className="dc-al e" style={{ margin: '12px 0', textAlign: 'left' }}>{jg.error}</div>
      <p className="dc-note">인터넷 연결을 확인한 뒤 새로고침해 주세요. 계속되면 관리자에게 알려 주세요.</p>
      <button className="jg-b p" style={{ marginTop: 12 }} onClick={function() { location.reload(); }}>새로고침</button>
    </div>
  );
  if (jg.phase !== 'ready') return (
    <div className="dc-card jg-load">
      <h3>생성기 준비 중…</h3>
      <p className="dc-note">처음 한 번은 시간이 걸립니다(파이썬 실행기와 사진 자산 약 45MB). 다음부터는 브라우저에 저장된 파일을 써서 빨라집니다.</p>
      <div className="jg-prog"><div style={{ width: Math.max(2, jg.pct || 0) + '%' }} /></div>
      <p className="dc-note">{jg.text}</p>
      <p className="dc-note" style={{ marginTop: 10 }}>사진 합성은 이 PC 브라우저 안에서 합니다. 입력값·로고·결과물은 서버로 보내지 않습니다.</p>
    </div>
  );
  return <JungongEditor user={user} meta={JG.meta()} />;
}

const VIEW_TABS = [['photo', '합성사진'], ['page', '준공사진 페이지'], ['cover', 'A3 표지'], ['binder', '바인더 라벨'], ['cd', 'CD 표지']];

function JungongEditor({ user, meta }) {
  const recentKey = PREFIX + '_jungong_recent_' + user.id;
  const dialog = useDialog();
  const [, setRev] = useState(0);
  const stRef = useRef(null);
  const [ready, setReady] = useState(false);
  // 미리보기 결과
  const [pv, setPv] = useState(null);        // {photoUrl, imageUrl, size, hits, H, Hinv, pages, page, tab}
  const [rendering, setRendering] = useState(false);
  const [status, setStatus] = useState('준비 중');
  const [summary, setSummary] = useState('');
  const [autoTitle, setAutoTitle] = useState('');
  const [logo, setLogo] = useState({ url: null, text: '' });
  const [busy, setBusy] = useState(false);
  const [tab, setTab] = useState('photo');
  const [pageDlg, setPageDlg] = useState(null);   // 장수 확인창
  const [addDlg, setAddDlg] = useState(false);
  const [siteDlg, setSiteDlg] = useState(null);   // {index, value}
  // app.py 와 같은 판단 상태
  const timerRef = useRef(null), reqRef = useRef(0), inflightRef = useRef(false), pendingRef = useRef(false), busyRef = useRef(false);
  const pageRef = useRef(0), tabRef = useRef('photo');
  const ackRef = useRef(null), cancelRef = useRef(null), promptRef = useRef(false);
  const openRef = useRef(null), logoRef = useRef(null);
  const urlsRef = useRef([]);

  const st = stRef.current;
  function setSt(next, silent) { stRef.current = next; setRev(function(x) { return x + 1; }); if (!silent) changed(); }
  function patch(p, silent) { setSt(Object.assign({}, stRef.current, p), silent); }
  function sj() { return JSON.stringify(stRef.current); }

  // ── 처음: 최근 입력값(이 PC · 이 계정) 또는 새 입력 ──
  useEffect(function() {
    var recent = lsGet(recentKey);
    var start = recent
      ? JG.call('load_project', { text: JSON.stringify(recent) }).catch(function() { return null; })
      : Promise.resolve(null);
    start.then(function(loaded) {
      var s = loaded || newState();
      setSt(s, true); setReady(true);
      setStatus(loaded ? '최근 입력값을 불러왔습니다.' : '용역명과 성과품을 입력하세요.');
      changed(10);
    });
    return function() { clearTimeout(timerRef.current); urlsRef.current.forEach(function(u) { URL.revokeObjectURL(u); }); };
  }, []);

  function newState() {
    var d = JSON.parse(JSON.stringify(meta.default_state));
    delete d.version;
    d.service_title = ''; d.cover_title = ''; d.auto_cover_title = true;
    d.authority = JG_CFG.DEFAULT_AUTHORITY || ''; d.binder_authority = '';
    d.date = JG_CFG.DEFAULT_DATE || thisMonth();
    d.font = '나눔고딕';      // 웹은 나눔고딕 고정(동봉 글꼴). 화면에서 고르지 않는다
    d.custom_logo = ''; d.offsets = {};
    return d;
  }

  // ── 입력이 바뀌면 잠깐 쉬었다가 미리보기(app.py changed: 650ms) ──
  function changed(delay) {
    reqRef.current++;
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(requestPreview, delay == null ? 650 : delay);
  }
  function finish() {
    inflightRef.current = false; setRendering(false);
    if (pendingRef.current && !busyRef.current) { pendingRef.current = false; requestPreview(); }
  }
  function requestPreview() {
    timerRef.current = null;
    if (!stRef.current) return;
    if (busyRef.current || inflightRef.current) { pendingRef.current = true; return; }
    inflightRef.current = true;
    JG.call('check', { state: sj() }).then(function(chk) {
      setAutoTitle(chk.auto_title || '');
      if (!chk.ok) { setStatus(chk.error); return null; }
      setSummary(chk.summary);
      setLogo(function(old) { if (old.url) URL.revokeObjectURL(old.url); return { url: pngUrl(chk.logo), text: chk.logo_status }; });
      return preparePagination(chk, false, false).then(function(go) {
        if (!go) return null;
        reqRef.current++;
        var rid = reqRef.current;
        pendingRef.current = false;
        setStatus('사진 합성 중…'); setRendering(true);
        var want = tabRef.current;
        return JG.call('preview', { state: sj(), page: pageRef.current, width: 1200, tab: want }).then(function(res) {
          if (rid !== reqRef.current) return;   // 그 사이 입력이 바뀜 → 버림(다시 그림)
          var photoUrl = pngUrl(res.photo), imageUrl = pngUrl(res.image);
          urlsRef.current.forEach(function(u) { URL.revokeObjectURL(u); });
          urlsRef.current = [photoUrl, imageUrl].filter(Boolean);
          pageRef.current = res.page;
          setPv({ photoUrl: photoUrl, imageUrl: imageUrl, size: res.photo_size, hits: res.hits, H: res.H, Hinv: res.Hinv, pages: res.pages, page: res.page, tab: want });
          window.__jgPreview = { hits: res.hits, size: res.photo_size, pages: res.pages, page: res.page, tab: want, n: (window.__jgPreview ? window.__jgPreview.n : 0) + 1 };   // 시험용(읽기만)
          setStatus('완료 · ' + (res.warnings.length ? res.warnings.join(' / ') : '입력값 변경 시 자동 갱신됩니다.'));
          lsSet(recentKey, res.state);   // app.py save_recent(st) — 최근 입력값
        });
      });
    }).catch(function(e) { setStatus('오류: ' + e.message); }).then(finish);
  }

  // ── 장수 확인창 판단(app.py _prepare_pagination 과 같은 조건) ──
  function preparePagination(chk, force, explicit) {
    var sig = chk.sig, s = stRef.current;
    if (!force && sig === ackRef.current) return Promise.resolve(true);
    if (!force && chk.rec <= 1 && s.page_policy === 'single') { ackRef.current = sig; return Promise.resolve(true); }
    if (!force && !explicit && sig === cancelRef.current) return Promise.resolve(false);
    if (promptRef.current) return Promise.resolve(false);
    promptRef.current = true;
    return new Promise(function(res) {
      setPageDlg({ total: chk.total, recommended: chk.rec, current: s.page_policy === 'split' ? s.split_pages : 1, res: res });
    }).then(function(result) {
      promptRef.current = false;
      if (!result) {
        cancelRef.current = sig; pendingRef.current = false;
        setStatus('배치 선택을 취소했습니다. 수량을 조정하거나 [장수 / 분할 선택]을 누르세요. 기존 미리보기를 유지합니다.');
        return false;
      }
      var cur = stRef.current, p = { page_policy: result[0], split_pages: result[1] };
      if (cur.page_policy !== result[0] || cur.split_pages !== result[1]) { p.offsets = {}; pageRef.current = 0; }
      patch(p, true);
      ackRef.current = sig; cancelRef.current = null;
      return true;
    });
  }
  function checkNow() {
    return JG.call('check', { state: sj() }).then(function(chk) {
      if (!chk.ok) { dialog.info('입력 확인', chk.error); return null; }
      return chk;
    });
  }
  function keepSingle() {
    if (busyRef.current) return;
    checkNow().then(function(chk) {
      if (!chk) return;
      var p = { page_policy: 'single', split_pages: 1 };
      if (stRef.current.page_policy !== 'single') { p.offsets = {}; pageRef.current = 0; }
      ackRef.current = chk.sig; cancelRef.current = null;
      patch(p);
    });
  }
  function configurePagination() {
    if (busyRef.current) return;
    checkNow().then(function(chk) {
      if (!chk) return;
      preparePagination(chk, true, true).then(function(go) { if (go) changed(); });
    });
  }

  // ── 저장(app.py _export_job) ──
  function runExport(mode) {
    if (busyRef.current) { dialog.info('작업 중', '현재 저장 작업이 끝난 후 실행하세요.'); return; }
    checkNow().then(function(chk) {
      if (!chk) return;
      return (mode !== 'pdf' ? preparePagination(chk, false, true) : Promise.resolve(true)).then(function(go) {
        if (!go) return;
        return JG.call('export_check', { state: sj(), mode: mode }).then(function(r) {
          var ask = r.warnings.length
            ? dialog.ask({ title: '저장 전 확인', text: r.warnings.join('\n') + '\n\n계속 저장할까요?', buttons: [{ label: '계속 저장', value: true, primary: true }, { label: '취소', value: false }] })
            : Promise.resolve(true);
          return ask.then(function(ok) {
            if (!ok) return;
            busyRef.current = true; setBusy(true); setStatus('저장 중…');
            var cmd = mode === 'pdf' ? 'export_print_pdfs' : mode === 'layouts' ? 'export_layouts' : 'export_bundle';
            return JG.call(cmd, { state: sj() }, function(t) { setStatus(t); }).then(function(res) {
              downloadBytes(res.zip, res.name, 'application/zip');
              lsSet(recentKey, res.state);
              setStatus('저장 완료: ' + res.name);
              dialog.info('저장 완료', res.name + '\n\n' + res.note + '\n\n내려받기 폴더에 ZIP 파일로 저장했습니다(파일 ' + res.files.length + '개).');
            }, function(e) {
              setStatus('저장 오류: ' + e.message); dialog.info('저장 오류', e.message);
            }).then(function() { busyRef.current = false; setBusy(false); changed(50); });
          });
        });
      });
    }).catch(function(e) { dialog.info('입력 확인', e.message); });
  }

  // ── 프로젝트 열기 / 저장 (JSON 파일) ──
  function onOpenFile(e) {
    var files = Sysbar.pickedFiles(e);
    if (!files.length) { setStatus('고른 파일을 받지 못했어요. 다시 골라 주세요.'); return; }
    var f = files[0];
    f.text().then(function(text) { return JG.call('load_project', { text: text }); }).then(function(s) {
      // app.py set_state: 쪽 0, 장수 확인 기록 초기화, 이동 좌표는 파일 값
      pageRef.current = 0; ackRef.current = null; cancelRef.current = null;
      setSt(s);
      setStatus('프로젝트를 열었습니다: ' + f.name);
    }).catch(function(err) { dialog.info('불러오기 오류', err.message); });
  }
  function saveProject() {
    JG.call('save_project', { state: sj() }).then(function(r) {
      downloadBytes(new TextEncoder().encode(r.text), r.name, 'application/json');
      setStatus('프로젝트 저장 완료: ' + r.name);
    }).catch(function(err) { dialog.info('입력 확인', err.message); });
  }
  function onLogoFile(e) {
    var files = Sysbar.pickedFiles(e);
    Sysbar.checkFiles(files, { kinds: ['png', 'jpg'], maxMB: 10 }).then(function(r) {
      if (r.errors.length) { dialog.info('로고 오류', r.errors[0].message); return; }
      var it = r.ok[0];
      return JG.call('import_logo', { bytes: new Uint8Array(it.body), name: it.file.name || ('logo.' + it.ext) }).then(function(b64) {
        patch({ custom_logo: b64 });
      });
    }).catch(function(err) { dialog.info('로고 오류', err.message); });
  }

  if (!ready || !st) return <div className="dc-card dc-note">불러오는 중…</div>;

  var items = st.items || [];
  function setItem(i, p) { var arr = items.slice(); arr[i] = Object.assign({}, arr[i], p); patch({ items: arr }); }
  function removeItem(i) { var arr = items.slice(); arr.splice(i, 1); patch({ items: arr, offsets: {} }); }
  var bgIndex = st.background, layIndex = st.layout;
  var canDrag = pv && pv.tab === 'photo' && tab === 'photo' && !busy;
  var help = [
    '사진 속 글자는 합성 이미지의 일부라 PPT에서 글자만 따로 고칠 수 없습니다. 입력값을 바꾸고 다시 저장하세요. (PPT 상단 제목·용역명은 고칠 수 있음)',
    '출력물은 준비된 사진과 입력 정보로 만든 성과품 구성 합성물입니다. 사진 촬영 각도·두께·그림자 때문에 실제 사물과 오차가 있을 수 있습니다.',
    '사진 장수: 수량을 보고 임의로 나누지 않습니다. 기본은 한 장이고, 수량이 많으면 확인창에서 한 장 유지 / 지정 장수 분할 / 취소를 고릅니다.',
    '[매듭 다시 배정]은 배치·수량·문구는 그대로 두고 바인더 사진(실물 매듭 4종) 배정만 바꿉니다. [새 각도]는 각도만 바꿉니다.',
    '3부 묶음: 같은 성과품 행을 최대 3부씩 묶습니다(4부 = 3+1, 5부 = 3+2). 수량을 바꾸지 않고, 다른 개소 행은 다른 묶음입니다.',
    '합성사진에서 바인더를 끌어 옮길 수 있습니다. [같은 3부 묶음을 함께 이동]을 끄면 한 권씩 움직입니다. 묶음 방식을 바꾸면 이동 좌표가 초기화됩니다.',
    '인쇄용 PDF는 실제 크기(100%)로 인쇄하세요: 설계도 A3 표지 · A4 가로 바인더 라벨(한 장 3세트) · 책자 표지 · CD 케이스 120×120mm.',
    '표지 글꼴은 나눔고딕(동봉, OFL)으로 고정입니다. PC 프로그램(맑은 고딕)으로 만든 결과와 글자 모양이 조금 다를 수 있습니다.',
    '프로젝트 저장 = 입력값 JSON 내려받기, 프로젝트 열기 = 그 파일 올리기(PC 프로그램 v2.1·v2.2 프로젝트도 열림). 최근 입력값은 이 PC 브라우저에 자동 저장됩니다.'
  ];

  return (
    <div>
      {dialog.node}
      {pageDlg && <PaginationDialog d={pageDlg} onDone={function(v) { var d = pageDlg; setPageDlg(null); d.res(v); }} />}
      {addDlg && (
        <AddItemDialog meta={meta} onDone={function(kind) {
          setAddDlg(false);
          if (!kind) return;
          patch({ items: items.concat([{ kind: kind, name: meta.default_names[kind], count: 1, selected: true, construction_name: '' }]) });
        }} />
      )}
      {siteDlg && (
        <SiteDialog value={siteDlg.value} onDone={function(v) {
          var i = siteDlg.index; setSiteDlg(null);
          if (v == null) return;
          setItem(i, { construction_name: v.trim() });
        }} />
      )}
      <input ref={openRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={onOpenFile} />
      <input ref={logoRef} type="file" accept="image/png,image/jpeg" style={{ display: 'none' }} onChange={onLogoFile} />

      <div className="jg-head">
        <h2>준공사진 생성기</h2>
        <span className="sub">실물 매듭 4종 | 3부 묶음 배치 | 사용자 확인 후 분할 · 엔진 v{meta.version}</span>
        <div className="r">
          <button className="jg-b" onClick={function() { openRef.current.click(); }}>프로젝트 열기</button>
          <button className="jg-b" onClick={saveProject}>프로젝트 저장</button>
        </div>
      </div>

      <div className="jg-wrap">
        {/* ── 왼쪽 입력 ── */}
        <div className="jg-left">
          <div className="jg-sec">
            <h3>1. 용역 / 공사 정보</h3>
            <div className="jg-small" style={{ marginTop: 0 }}>용역명 — 준공사진 페이지 상단</div>
            <textarea className="jg-ta" rows={3} value={st.service_title} placeholder="예: ○○길 일원 도로정비공사 실시설계용역"
              onChange={function(e) { patch({ service_title: e.target.value }); }} />
            <label className="jg-ck">
              <input type="checkbox" checked={!!st.auto_cover_title} onChange={function(e) {
                var on = e.target.checked;
                // app.py auto_change: 끄면 칸에 자동 공사명이 남아 그대로 고칠 수 있다
                patch(on ? { auto_cover_title: true } : { auto_cover_title: false, cover_title: st.cover_title || autoTitle });
              }} />
              끝의 설계용역 명칭을 빼고 표지 공사명 자동 생성
            </label>
            <input className="jg-in" value={st.auto_cover_title ? autoTitle : st.cover_title} readOnly={!!st.auto_cover_title}
              placeholder="표지 공사명" onChange={function(e) { patch({ cover_title: e.target.value }); }} />
            <div className="jg-small">사진 속 모든 성과품에는 공사명 + 문서명만 들어갑니다.</div>
          </div>

          <div className="jg-sec">
            <h3>2. 발주처 / 날짜 / 로고</h3>
            <div className="jg-row"><label>발주처</label>
              <div className="f"><input className="jg-in" list="jg-logos" value={st.authority} onChange={function(e) { patch({ authority: e.target.value }); }} />

// 합성사진 + 끌어 옮기기(app.py drag_start / drag_end): 사진 좌표 → 보드 mm(역원근) 차이를 이동 좌표(offsets)에 더한다
function proj(M, x, y) {
  var w = M[2][0] * x + M[2][1] * y + M[2][2];
  return [(M[0][0] * x + M[0][1] * y + M[0][2]) / w, (M[1][0] * x + M[1][1] * y + M[1][2]) / w];
}
function inPoly(q, x, y) {
  var c = false;
  for (var i = 0, j = q.length - 1; i < q.length; j = i++) {
    var xi = q[i][0], yi = q[i][1], xj = q[j][0], yj = q[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) c = !c;
  }
  return c;
}
function PhotoView({ pv, canDrag, groupDrag, offsets, onMoved, onStatus }) {
  const imgRef = useRef(null);
  const [drag, setDrag] = useState(null);   // {same, originals, start(mm), cur(px)}
  function toPhoto(ev) {
    var r = imgRef.current.getBoundingClientRect();
    return [(ev.clientX - r.left) * pv.size[0] / r.width, (ev.clientY - r.top) * pv.size[1] / r.height];
  }
  function down(ev) {
    if (!canDrag || ev.button !== 0) return;
    var pt = toPhoto(ev);
    for (var i = pv.hits.length - 1; i >= 0; i--) {
      var p = pv.hits[i];
      if (inPoly(p.quad, pt[0], pt[1])) {
        var same = (groupDrag && p.stack_id) ? pv.hits.filter(function(h) { return h.stack_id === p.stack_id; }) : [p];
        var originals = {};
        same.forEach(function(h) { originals[h.id] = (offsets[h.id] || [0, 0]).slice(); });
        ev.preventDefault();
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {}
        setDrag({ same: same, originals: originals, start: proj(pv.Hinv, pt[0], pt[1]), cur: pt });
        onStatus(p.name + (same.length > 1 ? ' ' + same.length + '부 묶음' : '') + ' 위치 이동 중');
        return;
      }
    }
  }
  function move(ev) { if (drag) setDrag(Object.assign({}, drag, { cur: toPhoto(ev) })); }
  function up(ev) {
    if (!drag) return;
    var pt = toPhoto(ev), pos = proj(pv.Hinv, pt[0], pt[1]);
    var dx = pos[0] - drag.start[0], dy = pos[1] - drag.start[1];
    var next = Object.assign({}, offsets);
    Object.keys(drag.originals).forEach(function(id) { var o = drag.originals[id]; next[id] = [o[0] + dx, o[1] + dy]; });
    setDrag(null);
    if (Math.abs(dx) + Math.abs(dy) < 0.01) { onStatus('이동하지 않았습니다.'); return; }
    onMoved(next);
  }
  var outline = null;
  if (drag) {
    var pos = proj(pv.Hinv, drag.cur[0], drag.cur[1]);
    var dx = pos[0] - drag.start[0], dy = pos[1] - drag.start[1];
    outline = drag.same.map(function(h) {
      return h.quad.map(function(c) { var b = proj(pv.Hinv, c[0], c[1]); var q = proj(pv.H, b[0] + dx, b[1] + dy); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');
    });
  }
  return (
    <div className={'jg-pic' + (canDrag ? ' drag' : '') + (drag ? ' dragging' : '')}
      onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={function() { setDrag(null); }}>
      <img ref={imgRef} src={pv.photoUrl} alt="합성사진" draggable={false} />
      <svg viewBox={'0 0 ' + pv.size[0] + ' ' + pv.size[1]} preserveAspectRatio="none">
        {outline && outline.map(function(pts, i) { return <polygon key={i} points={pts} fill="rgba(22,136,160,.12)" stroke="#1688a0" strokeWidth="3" strokeDasharray="10 6" />; })}
        {drag && <circle cx={drag.cur[0]} cy={drag.cur[1]} r="9" fill="#1688a0" stroke="#fff" strokeWidth="3" />}
      </svg>
    </div>
  );
}

// 장수 확인창(pagination_dialog.py choose_pagination 과 같은 조건·선택지) → ['single',1] / ['split',n] / null(취소)
function PaginationDialog({ d, onDone }) {
  var maximum = Math.max(2, Math.min(d.total, 999));
  const [val, setVal] = useState(String(Math.min(maximum, Math.max(2, d.current, d.recommended))));
  const [err, setErr] = useState('');
  const primary = useRef(null);
  useEffect(function() {
    if (primary.current) primary.current.focus();
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); onDone(null); }
      else if (e.key === 'Enter' && e.target && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { e.preventDefault(); onDone(['single', 1]); }
    }
    document.addEventListener('keydown', onKey);
    return function() { document.removeEventListener('keydown', onKey); };
  }, []);
  function split() {
    var n = Number(val);
    if (!/^\s*\d+\s*$/.test(val) || n < 2 || n > maximum) { setErr('2~' + maximum + ' 사이의 정수를 입력하세요.'); return; }
    onDone(['split', n]);
  }
  return (
    <div className="modal-bg" role="dialog" aria-modal="true" aria-label="성과품 배치 방법 확인">
      <div className="modal" style={{ maxWidth: 520 }}>
        <h3>성과품 배치 방법 확인 — 자동으로 나누지 않습니다</h3>
        <p style={{ fontSize: 15, fontWeight: 800, color: '#0f172a' }}>선택한 성과품은 총 {d.total}개입니다.</p>
        <p style={{ margin: '8px 0 12px' }}>한 장에 겹쳐 놓을 수 있습니다. 프로그램이 임의로 나누지 않습니다.{'\n'}공사명과 문서명이 가려지는 정도를 보고 배치 방법을 선택하세요.</p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13 }}>
          분할을 선택할 경우 사진 장수:
          <input className="jg-in" type="number" min={2} max={maximum} value={val} style={{ width: 80 }}
            onChange={function(e) { setVal(e.target.value); setErr(''); }}
            onKeyDown={function(e) { if (e.key === 'Enter') { e.preventDefault(); split(); } }} />
        </div>
        <p className="dc-note" style={{ marginTop: 8 }}>분할 추천은 {Math.max(2, d.recommended)}장입니다. 추천은 자동 적용되지 않습니다.</p>
        {err && <div className="dc-al e" style={{ marginTop: 8 }}>{err}</div>}
        <div className="stack">
          <button ref={primary} className="jg-b p" onClick={function() { onDone(['single', 1]); }}>한 장에 계속 배치 (겹침 허용)</button>
          <button className="jg-b" disabled={d.total < 2} onClick={split}>선택한 장수로 나누기</button>
          <button className="jg-b" onClick={function() { onDone(null); }}>취소 후 수량 / 배치 직접 조정</button>
        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
//  공문 (2026-11-13, v2.9.0) — 우리 회사 전용(화이트라벨 아님). 회사 고정값·배치는 letter-doc.js(LetterDoc) 한 곳
//  탭: 공문 작성 · 번호만 받기 · 공문 대장. 번호는 DB issue_letter_numbers()(연도별 잠금)로만 받는다
//  권한: 보기·번호 받기 = 직원 전체(협력업체 제외), 남의 공문 수정·취소 = letter_admin(기본 관리자 + 관리팀), 삭제 없음
//  결재란 이름 = DB letter_depts(관리부 고정), 설계부·지반부는 이 PC 에 부서별로 기억. 직인 = DB 회사 도장(직인) 그림
// ═════════════════════════════════════════════════════════════════════
const LT_HON = ['청', '공사', '본부', '공단', '원', '사업소', '사'];
const LT_SIGN_KEY = PREFIX + '_letter_sign_';      // + 부서 → [{pos,name}] (칸 수 그대로, 최대 LetterDoc.SIGN_MAX)
const LT_HEAD_MSG = '수신이 기관의 장인지 확인해 주세요.';
const LT_COLS = 'id,year,seq,doc_no,issued_date,kind,recipient,via,title,body,attachments,opts,dept,sign_lines,cooperation,disclosure,project_id,author_id,author_name,note,status,cancel_reason,imported,created_at,updated_at';

// 글꼴·서식·로고·직인 — 한 번만 받는다(화면이 바뀌어도 그대로)
const LT_RES = (function() {
  var p = null, seal = null;
  function fetchBytes(url) {
    return fetch(url, { cache: 'no-cache' }).then(function(r) {
      if (!r.ok) throw new Error(url + ' (' + r.status + ')');
      return r.arrayBuffer();
    }).then(function(b) { return new Uint8Array(b); });
  }
  function load() {
    if (p) return p;
    p = Promise.all([
      fetchBytes('tools/jungong/fonts/NanumGothic.ttf'),
      fetchBytes('tools/jungong/fonts/NanumGothicBold.ttf'),
      fetchBytes(LetterDoc.CO.TEMPLATE + '?v=2026111301')
    ]).then(function(r) {
      var fkReg = fontkit.create(r[0]), fkBold = fontkit.create(r[1]);
      return JSZip.loadAsync(r[2]).then(function(z) { return z.file('BinData/image1.png').async('uint8array'); }).then(function(logo) {
        var sz = LetterDoc.pngSize(logo) || { w: 1, h: 1 };
        return {
          fontReg: r[0], fkBold: fkBold, template: r[2], logo: logo,
          measure: LetterDoc.makeMeasure(fkReg, fkBold),
          logoImg: { url: pngUrl(logo), w: sz.w, h: sz.h }
        };
      });
    });
    p.catch(function() { p = null; });
    return p;
  }
  // 직인: DB 가 알려 준 경로 하나만(그 밖의 도장 파일은 볼 수 없다). 배경 투명·여백 자르기(SealPrep)
  function loadSeal() {
    if (seal) return seal;
    seal = sb.rpc('letter_seal_path').then(function(r) {
      if (r.error) throw r.error;
      if (!r.data) return null;
      var bucket = (APP_CONFIG.DOCS && APP_CONFIG.DOCS.SEAL_BUCKET) || 'seals';
      return sb.storage.from(bucket).createSignedUrl(r.data, 60).then(function(s) {
        if (s.error || !s.data) throw (s.error || new Error('직인 주소를 받지 못했습니다.'));
        return fetch(s.data.signedUrl, { cache: 'no-store' });
      }).then(function(res) { if (!res.ok) throw new Error('직인 그림 (' + res.status + ')'); return res.arrayBuffer(); })
        .then(function(b) { return SealPrep.toPng(new Uint8Array(b), { clean: true }); })
        .then(function(x) { return { bytes: x.bytes, url: pngUrl(x.bytes), w: x.w, h: x.h }; });
    });
    seal.catch(function() { seal = null; });
    return seal;
  }
  return { load: load, loadSeal: loadSeal };
})();

function ltNorm(s) { return String(s || '').replace(/\s+/g, '').toLowerCase(); }
function ltYear(iso) { var m = /^(\d{4})/.exec(String(iso || '')); return m ? Number(m[1]) : new Date().getFullYear(); }
function ltEmptyForm() {
  return { id: null, docNo: '', date: LetterDoc.todayIso(), recipient: '', via: '', title: '', greet: true, hon: '', honAuto: true,
    body: [{ t: '', lv: 1 }], attachments: [], dept: LetterDoc.CO.DEPTS[0], signLines: [], coop: '', disclosure: LetterDoc.DEFAULT_DISCLOSURE,
    authorId: null, status: 'issued' };
}
function ltFromRow(row, copy) {
  var o = row.opts || {};
  var f = {
    id: copy ? null : row.id, docNo: copy ? '' : (row.doc_no || ''), date: copy ? LetterDoc.todayIso() : (row.issued_date || LetterDoc.todayIso()),
    recipient: row.recipient || '', via: row.via || '', title: row.title || '', greet: o.greet !== false, hon: o.hon || '', honAuto: !o.hon,
    body: (row.body && row.body.length) ? row.body.map(function(p) { return Object.assign({}, p); }) : [{ t: '', lv: 1 }],
    attachments: (row.attachments || []).map(function(a) { return Object.assign({}, a); }),
    dept: row.dept || LetterDoc.CO.DEPTS[0], signLines: (row.sign_lines || []).map(function(a) { return Object.assign({}, a); }),
    coop: row.cooperation || '', disclosure: row.disclosure || LetterDoc.DEFAULT_DISCLOSURE,
    authorId: copy ? null : row.author_id, status: copy ? 'issued' : row.status
  };
  if (!f.hon) f.hon = LetterDoc.guessHonorific(f.recipient);
  return f;
}
// 화면 값 → LetterDoc 이 쓰는 공문 값
function ltLetter(f) {
  return { docNo: f.docNo, date: f.date, recipient: f.recipient.trim(), via: f.via.trim(), title: f.title.trim(), greet: f.greet,
    hon: f.hon || LetterDoc.guessHonorific(f.recipient), body: f.body.filter(function(p) { return p.arae || String(p.t || '').trim(); }),
    attachments: f.attachments.filter(function(a) { return String(a.name || '').trim(); }), dept: f.dept,
    signLines: f.signLines.filter(function(q) { return q && (String(q.pos || '').trim() || String(q.name || '').trim()); })
      .slice(0, LetterDoc.SIGN_MAX).map(function(q) { return { pos: String(q.pos || '').trim(), name: String(q.name || '').trim() }; }),
    coop: f.coop.trim(), disclosure: f.disclosure };
}
function ltRowLetter(row) { return ltLetter(ltFromRow(row, false)); }
function ltPayload(f) {
  var l = ltLetter(f);
  return { kind: 'letter', issued_date: f.date, recipient: l.recipient, via: l.via, title: l.title, body: l.body, attachments: l.attachments,
    opts: { greet: f.greet, hon: f.honAuto ? '' : f.hon }, dept: f.dept, sign_lines: l.signLines, cooperation: l.coop,
    disclosure: f.disclosure, project_id: null };   // v2.9.1 용역 선택 없앰 — 칸은 DB 에 남기고 늘 비움
}
// PDF · HWPX 만들기(같은 배치)
function ltBuild(letter, res, seal) {
  return Promise.all([
    LetterDoc.buildPdf({ letter: letter, measure: res.measure, PDFLib: PDFLib, fontkit: fontkit, fontReg: res.fontReg, fkBold: res.fkBold,
      logo: res.logo, seal: seal ? seal.bytes : null }),
    LetterDoc.buildHwpx({ letter: letter, template: res.template, seal: seal ? seal.bytes : null, JSZip: JSZip, measure: res.measure, type: 'uint8array' })
  ]);
}
function ltDownload(letter, res, seal, which) {
  return ltBuild(letter, res, seal).then(function(r) {
    if (which !== 'hwpx') downloadBytes(r[0], LetterDoc.fileName(letter.docNo, letter.title, 'pdf'), 'application/pdf');
    if (which !== 'pdf') setTimeout(function() { downloadBytes(r[1], LetterDoc.fileName(letter.docNo, letter.title, 'hwpx'), 'application/hwp+zip'); }, which ? 0 : 400);
  });
}
function ltErr(e) {
  var m = (e && (e.message || e.msg)) || String(e || '');
  if (e && e.code === '42501') return '권한이 없습니다. ' + m;
  return m || '알 수 없는 오류';
}
function ltCopy(text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text); } catch (e) {}
  return new Promise(function(ok) {
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e) {} t.remove(); ok();
  });
}

function LetterView({ user }) {
  const [tab, setTab] = useState('write');
  const [res, setRes] = useState(null);         // 글꼴·서식·로고
  const [resErr, setResErr] = useState('');
  const [seal, setSeal] = useState(undefined);  // undefined = 받는 중, null = 없음
  const [sealErr, setSealErr] = useState('');
  const [canAdmin, setCanAdmin] = useState(Sysbar.can('letter_admin'));
  const [depts, setDepts] = useState([]);
  const [book, setBook] = useState([]);          // 수신처록 + 예전 대장 수신처
  const [editRow, setEditRow] = useState(null);  // 대장에서 「고치기」·「복사」 → 작성 탭 {row, copy, n}
  const [ledgerRev, setLedgerRev] = useState(0);
  const dlg = useDialog();

  useEffect(function() {
    LT_RES.load().then(setRes, function(e) { setResErr('글꼴·서식을 불러오지 못했습니다. (' + ltErr(e) + ')'); });
    LT_RES.loadSeal().then(function(s) { setSeal(s); }, function(e) { setSeal(null); setSealErr(ltErr(e)); });
    Sysbar.loadPerms(sb).then(function() { setCanAdmin(Sysbar.can('letter_admin')); });
    sb.from('letter_depts').select('name,fixed,sign_lines,sort_order').order('sort_order').then(function(r) { if (!r.error) setDepts(r.data || []); });
    loadBook();
  }, []);
  function loadBook() {
    Promise.all([
      sb.from('letter_recipients').select('name,via_default,honorific,use_count').order('use_count', { ascending: false }).limit(1000),
      sb.from('official_letters').select('recipient').not('recipient', 'is', null).order('created_at', { ascending: false }).limit(1000)
    ]).then(function(r) {
      var seen = {}, out = [];
      // 수신처록은 모두, 예전 대장 수신처는 기관의 장으로 끝나는 것만(「강서구」「시청」 같은 약칭은 뺀다)
      ((r[0] && r[0].data) || []).forEach(function(b) { var k = ltNorm(b.name); if (!seen[k]) { seen[k] = 1; out.push(b); } });
      ((r[1] && r[1].data) || []).forEach(function(x) { var k = ltNorm(x.recipient); if (k && !seen[k] && LetterDoc.isAgencyHead(x.recipient)) { seen[k] = 1; out.push({ name: x.recipient.trim(), via_default: null, honorific: null }); } });
      setBook(out);
    });
  }
  function canEdit(row) { return !!row && (row.author_id === user.id || canAdmin); }
  function openEdit(row, copy) { setEditRow({ row: row, copy: copy, n: Date.now() }); setTab('write'); }

  return (
    <div>
      <div className="lt-tabs" role="tablist" aria-label="공문">
        {[['write', '✏️ 공문 작성'], ['number', '🔢 번호만 받기'], ['ledger', '📒 공문 대장']].map(function(t) {
          return <button key={t[0]} role="tab" aria-selected={tab === t[0]} className={tab === t[0] ? 'on' : ''} onClick={function() { setTab(t[0]); }}>{t[1]}</button>;
        })}
      </div>
      {resErr && <div className="dc-al e" style={{ marginBottom: 10 }}>{resErr}</div>}
      {tab === 'write' && <LetterWrite user={user} res={res} seal={seal} sealErr={sealErr} depts={depts} book={book}
        editRow={editRow} canEdit={canEdit} dlg={dlg} onSaved={function() { loadBook(); setLedgerRev(ledgerRev + 1); }} />}
      {tab === 'number' && <LetterNumbers book={book} dlg={dlg} onSaved={function() { loadBook(); setLedgerRev(ledgerRev + 1); }} />}
      {tab === 'ledger' && <LetterLedger user={user} res={res} seal={seal} canEdit={canEdit} rev={ledgerRev} dlg={dlg} onEdit={openEdit} />}
      {dlg.node}
    </div>
  );
}

// ── ① 공문 작성 ─────────────────────────────────────────────────
function LetterWrite({ user, res, seal, sealErr, depts, book, editRow, canEdit, dlg, onSaved }) {
  const [f, setF] = useState(ltEmptyForm);
  const [saved, setSaved] = useState(null);      // 마지막으로 저장한 행(같은 번호로 다시 내려받기)
  const [dirty, setDirty] = useState(false);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);          // {k:'i'|'w'|'e', t}

  // 대장에서 넘어온 공문
  useEffect(function() {
    if (!editRow) return;
    var nf = ltFromRow(editRow.row, editRow.copy);
    if (nf.dept && depts.length) applyDeptLines(nf, nf.dept, true);
    setF(nf); setSaved(editRow.copy ? null : editRow.row); setDirty(false);
    setMsg(editRow.copy ? { k: 'i', t: editRow.row.doc_no + ' 내용을 복사했습니다. 저장하면 새 번호를 받습니다.' }
      : { k: 'i', t: editRow.row.doc_no + ' 을(를) 고칩니다. 저장하면 같은 번호로 다시 만듭니다.' });
  }, [editRow && editRow.n]);
  // 결재 부서 목록이 오면 처음 부서의 결재란 채우기 — 대장에서 연 공문(위 effect 가 채움)은 건드리지 않는다
  //   (탭을 다시 열면 두 effect 가 같이 돌아 저장된 결재 칸을 덮어쓰던 문제, v2.9.1)
  useEffect(function() {
    if (!depts.length || f.id || editRow) return;
    setF(function(o) { var n = Object.assign({}, o); applyDeptLines(n, n.dept, false); return n; });
  }, [depts.length]);

  function deptRow(name) { return depts.filter(function(d) { return d.name === name; })[0] || null; }
  // 결재 칸(최대 LetterDoc.SIGN_MAX). 고정 부서(관리부) = DB 칸은 고정 + 뒤에 추가 칸만, 그 밖 = 이 PC 에 기억한 칸(칸 수 포함) → 기본 2칸
  //   keep = 대장에서 연 공문: 저장된 칸을 그대로(고정 부서면 고정 칸 뒤의 추가 칸만 살림)
  function applyDeptLines(n, dept, keep) {
    var d = deptRow(dept), MAX = LetterDoc.SIGN_MAX;
    function cp(a) { return (Array.isArray(a) ? a : []).filter(function(x) { return x && typeof x === 'object'; }).slice(0, MAX)
      .map(function(x) { return { pos: String(x.pos || ''), name: String(x.name || '') }; }); }
    if (d && d.fixed) {
      var fx = cp(d.sign_lines);
      n.signLines = fx.concat(keep ? cp(n.signLines).slice(fx.length) : []).slice(0, MAX);
      return;
    }
    if (keep && n.signLines && n.signLines.length) { n.signLines = cp(n.signLines); return; }
    var mem = cp(lsGet(LT_SIGN_KEY + dept));
    n.signLines = mem.length ? mem : ((d && d.sign_lines && d.sign_lines.length) ? cp(d.sign_lines) : [{ pos: '', name: '' }, { pos: '', name: '' }]);
  }
  function set(patch) { setF(function(o) { return Object.assign({}, o, patch); }); setDirty(true); }
  function setRecipient(v) {
    setF(function(o) {
      var n = Object.assign({}, o, { recipient: v });
      var hit = book.filter(function(b) { return ltNorm(b.name) === ltNorm(v); })[0];
      if (hit && hit.via_default && !o.via) n.via = hit.via_default;
      if (o.honAuto) n.hon = (hit && hit.honorific) || LetterDoc.guessHonorific(v);
      return n;
    });
    setDirty(true);
  }
  function setDept(d) {
    setF(function(o) { var n = Object.assign({}, o, { dept: d }); applyDeptLines(n, d, false); return n; });
    setDirty(true);
  }
  function setSign(i, k, v) {
    setF(function(o) {
      var sl = o.signLines.slice();
      sl[i] = Object.assign({}, sl[i]); sl[i][k] = v;
      return Object.assign({}, o, { signLines: sl });
    });
    setDirty(true);
  }
  function addSign() {
    setF(function(o) { return o.signLines.length >= LetterDoc.SIGN_MAX ? o : Object.assign({}, o, { signLines: o.signLines.concat([{ pos: '', name: '' }]) }); });
    setDirty(true);
  }
  function delSign(i) { setF(function(o) { var sl = o.signLines.slice(); sl.splice(i, 1); return Object.assign({}, o, { signLines: sl }); }); setDirty(true); }
  function setPara(i, patch) { setF(function(o) { var b = o.body.slice(); b[i] = Object.assign({}, b[i], patch); return Object.assign({}, o, { body: b }); }); setDirty(true); }
  function addPara(at, p) { setF(function(o) { var b = o.body.slice(); b.splice(at, 0, p); return Object.assign({}, o, { body: b }); }); setDirty(true); }
  function delPara(i) { setF(function(o) { var b = o.body.slice(); b.splice(i, 1); if (!b.length) b.push({ t: '', lv: 1 }); return Object.assign({}, o, { body: b }); }); setDirty(true); }
  function movePara(i, d) {
    setF(function(o) { var b = o.body.slice(), j = i + d; if (j < 0 || j >= b.length) return o; var t = b[i]; b[i] = b[j]; b[j] = t; return Object.assign({}, o, { body: b }); });
    setDirty(true);
  }
  function setAtt(i, k, v) { setF(function(o) { var a = o.attachments.slice(); a[i] = Object.assign({}, a[i]); a[i][k] = v; return Object.assign({}, o, { attachments: a }); }); setDirty(true); }
  function addAtt() { setF(function(o) { return Object.assign({}, o, { attachments: o.attachments.concat([{ name: '', qty: '1부' }]) }); }); setDirty(true); }
  function delAtt(i) { setF(function(o) { var a = o.attachments.slice(); a.splice(i, 1); return Object.assign({}, o, { attachments: a }); }); setDirty(true); }
  function newLetter() {
    var go = dirty ? dlg.ask({ title: '새 공문', text: '지금 쓰던 내용을 지우고 새로 쓸까요?', buttons: [{ label: '새로 쓰기', value: true, primary: true }, { label: '취소', value: false }] }) : Promise.resolve(true);
    go.then(function(ok) {
      if (!ok) return;
      var n = ltEmptyForm(); applyDeptLines(n, n.dept, false);
      setF(n); setSaved(null); setDirty(false); setMsg(null);
    });
  }

  var letter = ltLetter(f);
  var lay = null;
  try { lay = res ? LetterDoc.layout(letter, res.measure) : null; } catch (e) { lay = null; }
  var paras = LetterDoc.composeParas(Object.assign({}, letter, { body: f.body.map(function(p) { return p.arae ? p : Object.assign({}, p, { t: p.t || ' ' }); }) }));
  var labels = [], pi = f.greet !== false ? 1 : 0;
  f.body.forEach(function(p) { labels.push(p.arae ? '' : ((paras[pi] && paras[pi].label) || '')); pi++; });
  var fixedDept = (deptRow(f.dept) || {}).fixed;
  var year = ltYear(f.date), curY = new Date().getFullYear();
  var editing = !!f.id;
  var mayEdit = !editing || canEdit({ author_id: f.authorId });
  var warns = [];
  if (lay) lay.warnings.forEach(function(w) { warns.push(w); });
  if (seal === null) warns.push('직인 그림이 없어 직인 없이 만듭니다' + (sealErr ? ' (' + sealErr + ')' : '') + '. 관리포털 → 서류작성 → 회사 도장에 「직인」을 등록해 주세요.');
  if (!letter.signLines.length) warns.push('결재란(직급·이름)이 비어 있습니다.');
  var notHead = !!letter.recipient && !LetterDoc.isAgencyHead(letter.recipient);
  if (notHead) warns.push(LT_HEAD_MSG);
  if (year !== curY && year !== curY - 1) warns.push('발송일은 올해나 작년이어야 번호를 받을 수 있습니다.');

  function save() {
    if (!letter.recipient) { setMsg({ k: 'e', t: '수신처를 적어 주세요.' }); return; }
    if (!letter.title) { setMsg({ k: 'e', t: '제목을 적어 주세요.' }); return; }
    if (!res) { setMsg({ k: 'e', t: '글꼴·서식을 아직 불러오는 중입니다.' }); return; }
    if (editing && !mayEdit) { setMsg({ k: 'e', t: '이 공문은 작성자나 관리 권한이 있는 사람만 고칠 수 있습니다.' }); return; }
    if (editing && f.status === 'canceled') { setMsg({ k: 'e', t: '취소된 공문은 고칠 수 없습니다. 대장에서 취소를 되돌린 뒤 고쳐 주세요.' }); return; }
    if (!fixedDept) lsSet(LT_SIGN_KEY + f.dept, f.signLines.slice(0, LetterDoc.SIGN_MAX));   // 칸 수까지 기억
    setBusy(true); setMsg({ k: 'i', t: editing ? '저장하는 중…' : '번호를 받는 중…' });
    var pay = ltPayload(f), p;
    if (editing) {
      if (ltYear(f.date) !== ltYear(saved && saved.issued_date)) { setBusy(false); setMsg({ k: 'e', t: '번호를 받은 해(' + ltYear(saved && saved.issued_date) + '년) 안의 날짜만 고를 수 있습니다.' }); return; }
      delete pay.kind; delete pay.project_id;   // 예전 값이 있으면 그대로 둔다
      p = sb.from('official_letters').update(pay).eq('id', f.id).select(LT_COLS).then(function(r) {
        if (r.error) throw r.error;
        if (!r.data || !r.data.length) throw new Error('저장되지 않았습니다(고칠 권한이 없거나 지워진 공문).');
        return r.data[0];
      });
    } else {
      p = sb.rpc('issue_letter_numbers', { p_year: year, p_rows: [pay] }).then(function(r) {
        if (r.error) throw r.error;
        var row = (r.data || [])[0];
        if (!row) throw new Error('번호를 받지 못했습니다.');
        return row;
      });
    }
    p.then(function(row) {
      setSaved(row); setDirty(false);
      setF(function(o) { return Object.assign({}, o, { id: row.id, docNo: row.doc_no, authorId: row.author_id, status: row.status }); });
      onSaved();
      setMsg({ k: notHead ? 'w' : 'i', t: (editing ? '고쳐서 저장했습니다: ' : '번호를 받았습니다: ') + row.doc_no + ' — PDF·HWPX 를 내려받습니다.' + (notHead ? ' ' + LT_HEAD_MSG : '') });
      return ltDownload(ltRowLetter(row), res, seal);
    }).catch(function(e) { setMsg({ k: 'e', t: '저장하지 못했습니다. ' + ltErr(e) }); })
      .then(function() { setBusy(false); });
  }
  function redownload(which) {
    if (!saved || !res) return;
    setBusy(true);
    ltDownload(ltRowLetter(saved), res, seal, which).catch(function(e) { setMsg({ k: 'e', t: '파일을 만들지 못했습니다. ' + ltErr(e) }); }).then(function() { setBusy(false); });
  }

  var deptNames = depts.length ? depts.map(function(d) { return d.name; }) : LetterDoc.CO.DEPTS;
  var fixedN = fixedDept ? ((deptRow(f.dept) || {}).sign_lines || []).length : 0, minSign = fixedDept ? fixedN : 1;
  return (
    <div className="lt-wrap">
      <div className="jg-left">
        <div className="jg-sec">
          <h3 style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            {editing ? <span>✏️ {f.docNo} 고치기{f.status === 'canceled' && <span className="lt-badge c">취소됨</span>}</span> : <span>✏️ 새 공문</span>}
            <span style={{ marginLeft: 'auto' }}><button className="jg-b" onClick={newLetter}>＋ 새 공문</button></span>
          </h3>
          <div className="jg-row"><label>수신</label>
            <div className="f"><input className="jg-in" list="lt-book" value={f.recipient} placeholder="기관의 장으로 적어 주세요 (예: 부산광역시 강서구청장, 한국철도공사 부산경남본부장, ○○(주) 대표이사)"
              onChange={function(e) { setRecipient(e.target.value); }} />
              <datalist id="lt-book">{book.slice(0, 500).map(function(b) { return <option key={b.name} value={b.name} />; })}</datalist></div>
          </div>
          <div className="jg-row"><label>(경유)</label><div className="f"><input className="jg-in" value={f.via} placeholder="없으면 비움" onChange={function(e) { set({ via: e.target.value }); }} /></div></div>
          <div className="jg-row"><label>제목</label><div className="f"><input className="jg-in" value={f.title} onChange={function(e) { set({ title: e.target.value }); }} /></div></div>
          <div className="jg-row"><label>발송일</label>
            <div className="f" style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
              <input className="jg-in" type="date" style={{ width: 160 }} value={f.date} onChange={function(e) { set({ date: e.target.value || LetterDoc.todayIso() }); }} />
              <span className="jg-small">시행 {f.docNo || (LetterDoc.CO.DOC_PREFIX + String(year).slice(2) + '-(저장할 때 받음)')}</span>
            </div>
          </div>
        </div>

        <div className="jg-sec">
          <h3>본문</h3>
          <label className="jg-ck"><input type="checkbox" checked={f.greet} onChange={function(e) { set({ greet: e.target.checked }); }} />
            <span>첫 문단 인사 「{LetterDoc.greeting(f.hon)}」</span></label>
          {f.greet && <div className="jg-row" style={{ marginLeft: 22 }}><label style={{ width: 'auto' }}>호칭</label>
            <select className="jg-sel" style={{ width: 120 }} value={f.honAuto ? '' : f.hon}
              onChange={function(e) { var v = e.target.value; set(v ? { hon: v, honAuto: false } : { hon: LetterDoc.guessHonorific(f.recipient), honAuto: true }); }}>
              <option value="">자동 ({LetterDoc.guessHonorific(f.recipient) || '사'})</option>
              {LT_HON.map(function(h) { return <option key={h} value={h}>{h}</option>; })}
            </select></div>}
          {f.body.map(function(p, i) {
            return (
              <div key={i} className="lt-para">
                <span className="lab" style={{ paddingLeft: p.arae ? 0 : (Math.max(1, p.lv || 1) - 1) * 8 }}>{p.arae ? '' : (p.nn ? '·' : labels[i])}</span>
                {p.arae
                  ? <div className="lt-arae">{LetterDoc.ARAE}</div>
                  : <textarea className="jg-ta ta" rows={Math.min(8, Math.max(2, Math.ceil(String(p.t || '').length / 34)))} value={p.t || ''}
                      placeholder={i === 0 ? '문단 내용 — 번호는 자동으로 붙습니다' : ''}
                      onChange={function(e) { setPara(i, { t: e.target.value }); }}
                      onKeyDown={function(e) {
                        if (e.key === 'Tab') { e.preventDefault(); setPara(i, { lv: Math.min(4, Math.max(1, (p.lv || 1) + (e.shiftKey ? -1 : 1))) }); }
                      }} />}
                <div className="ctl">
                  {!p.arae && <button className="jg-b" title="한 단계 바깥(Shift+Tab)" disabled={(p.lv || 1) <= 1} onClick={function() { setPara(i, { lv: (p.lv || 1) - 1 }); }}>◀</button>}
                  {!p.arae && <button className="jg-b" title="한 단계 안쪽(Tab)" disabled={(p.lv || 1) >= 4} onClick={function() { setPara(i, { lv: (p.lv || 1) + 1 }); }}>▶</button>}
                  {!p.arae && <button className={'jg-b' + (p.nn ? ' on' : '')} title="번호 없이(앞 문단에 이어 쓰기)" onClick={function() { setPara(i, { nn: !p.nn }); }}>번호</button>}
                </div>
                <div className="ctl">
                  <button className="jg-b" title="위로" disabled={i === 0} onClick={function() { movePara(i, -1); }}>▲</button>
                  <button className="jg-b" title="아래로" disabled={i === f.body.length - 1} onClick={function() { movePara(i, 1); }}>▼</button>
                  <button className="jg-b" title="빼기" onClick={function() { delPara(i); }}>✕</button>
                </div>
              </div>
            );
          })}
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 4 }}>
            <button className="jg-b" onClick={function() { var last = f.body[f.body.length - 1]; addPara(f.body.length, { t: '', lv: (last && !last.arae && last.lv) || 1 }); }}>＋ 문단</button>
            <button className="jg-b" onClick={function() { addPara(f.body.length, { arae: true }); addPara(f.body.length + 1, { t: '', lv: 2 }); }}>＋ {LetterDoc.ARAE}</button>
          </div>
          <p className="jg-small" style={{ marginTop: 6 }}>번호는 1. → 가. → 1) → 가) 순서로 자동입니다. ◀ ▶(또는 Tab · Shift+Tab)로 단계를 바꿉니다.
            붙임이 없으면 마지막 문단 끝에 「끝.」, 있으면 붙임 마지막 줄 끝에 「끝.」이 붙습니다.</p>
        </div>

        <div className="jg-sec">
          <h3>붙임</h3>
          <div className="jg-items">
            {f.attachments.map(function(a, i) {
              return (
                <div key={i} className="jg-item">
                  <input className="jg-in nm" value={a.name} placeholder="서류 이름" onChange={function(e) { setAtt(i, 'name', e.target.value); }} />
                  <input className="jg-in ct" value={a.qty} onChange={function(e) { setAtt(i, 'qty', e.target.value); }} />
                  <button className="jg-b" onClick={function() { delAtt(i); }}>✕</button>
                </div>
              );
            })}
          </div>
          <button className="jg-b" style={{ marginTop: 6 }} onClick={addAtt}>＋ 붙임</button>
        </div>

        <div className="jg-sec">
          <h3>결재 · 하단</h3>
          <div className="jg-row"><label>부서</label>
            <div className="f"><select className="jg-sel" value={f.dept} onChange={function(e) { setDept(e.target.value); }}>
              {deptNames.map(function(d) { return <option key={d} value={d}>{d}</option>; })}
            </select></div>
          </div>
          {f.signLines.map(function(q, i) {
            var locked = i < fixedN;
            return (
              <div key={i} className="jg-row lt-sign"><label>결재 {i + 1}</label>
                <div className="f" style={{ display: 'flex', gap: 4 }}>
                  <input className="jg-in" style={{ width: 90 }} placeholder="직급" readOnly={locked} value={q.pos || ''} onChange={function(e) { setSign(i, 'pos', e.target.value); }} />
                  <input className="jg-in" placeholder="이름" readOnly={locked} value={q.name || ''} onChange={function(e) { setSign(i, 'name', e.target.value); }} />
                  {(!locked && f.signLines.length > minSign)
                    ? <button className="jg-b" title="이 결재 칸 빼기" onClick={function() { delSign(i); }}>✕</button>
                    : <span style={{ width: 30, flex: 'none' }} />}
                </div>
              </div>
            );
          })}
          {f.signLines.length < LetterDoc.SIGN_MAX && <button className="jg-b" style={{ marginBottom: 6 }} onClick={addSign}>＋ 결재 추가</button>}
          <p className="jg-small">{fixedDept ? f.dept + ' 앞 ' + fixedN + '칸은 고정입니다. 뒤에 칸을 더할 수 있습니다(최대 ' + LetterDoc.SIGN_MAX + '칸).'
              : f.dept + ' 결재란(칸 수 포함)은 저장할 때 이 PC 에 기억해 두고 다음에 채웁니다. 최대 ' + LetterDoc.SIGN_MAX + '칸.'}</p>
          <div className="jg-row"><label>협조</label><div className="f"><input className="jg-in" value={f.coop} placeholder="없으면 비움" onChange={function(e) { set({ coop: e.target.value }); }} /></div></div>
          <div className="jg-row"><label>공개 구분</label>
            <div className="f"><select className="jg-sel" style={{ width: 140 }} value={f.disclosure} onChange={function(e) { set({ disclosure: e.target.value }); }}>
              {LetterDoc.DISCLOSURE.map(function(d) { return <option key={d} value={d}>{d}</option>; })}
            </select></div>
          </div>
        </div>

        {msg && <div className={'dc-al ' + msg.k}>{msg.t}</div>}
        <div className="jg-exp">
          <button className="jg-b p" disabled={busy || !res || (editing && (!mayEdit || f.status === 'canceled'))} onClick={save}>
            {busy ? '처리 중…' : (editing ? (dirty ? '💾 고쳐서 저장 (같은 번호) · 내려받기' : '💾 다시 저장 · 내려받기') : '💾 저장 · 번호 받기 · 내려받기')}
          </button>
        </div>
        {saved && !dirty && <div className="jg-exp">
          <button className="jg-b" disabled={busy} onClick={function() { redownload('pdf'); }}>⬇ PDF</button>
          <button className="jg-b" disabled={busy} onClick={function() { redownload('hwpx'); }}>⬇ HWPX</button>
        </div>}
      </div>

      <div className="lt-right">
        {warns.length > 0 && <div className="dc-al w">{warns.map(function(w, i) { return <div key={i}>⚠ {w}</div>; })}</div>}
        <div className="lt-paper">
          {!lay
            ? <div className="jg-empty">{res ? '미리보기를 만들 수 없습니다.' : '글꼴·서식을 불러오는 중…'}</div>
            : lay.pages.map(function(items, i) {
                return <div key={i} className="lt-page" dangerouslySetInnerHTML={{ __html: LetterDoc.pageSvg(items, { logo: res.logoImg, seal: seal || null }, 'LetterNanum') }} />;
              })}
        </div>
        <p className="jg-small">미리보기는 PDF 와 같은 배치입니다. HWPX 는 한글에서 같은 서식으로 열립니다(줄 바꿈 위치는 조금 다를 수 있어요).</p>
      </div>
    </div>
  );
}

// ── ② 번호만 받기 ───────────────────────────────────────────────
function LetterNumbers({ book, dlg, onSaved }) {
  const [date, setDate] = useState(LetterDoc.todayIso());
  const [rows, setRows] = useState([{ recipient: '', title: '', note: '' }]);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [got, setGot] = useState(null);
  function setRow(i, k, v) { setRows(function(o) { var n = o.slice(); n[i] = Object.assign({}, n[i]); n[i][k] = v; return n; }); }
  function submit() {
    var list = rows.filter(function(r) { return r.title.trim() || r.recipient.trim(); });
    if (!list.length) { setErr('제목을 적어 주세요.'); return; }
    if (list.some(function(r) { return !r.title.trim(); })) { setErr('줄마다 제목을 적어 주세요.'); return; }
    setErr(''); setBusy(true);
    var pay = list.map(function(r) { return { kind: 'number_only', issued_date: date, recipient: r.recipient.trim(), title: r.title.trim(), note: r.note.trim() }; });
    sb.rpc('issue_letter_numbers', { p_year: ltYear(date), p_rows: pay }).then(function(r) {
      if (r.error) throw r.error;
      setGot(r.data || []); setRows([{ recipient: '', title: '', note: '' }]); onSaved();
    }).catch(function(e) { setErr('번호를 받지 못했습니다. ' + ltErr(e)); }).then(function() { setBusy(false); });
  }
  return (
    <div style={{ maxWidth: 900 }}>
      <div className="jg-sec">
        <h3>🔢 공문 번호만 받기</h3>
        <p className="jg-small" style={{ marginBottom: 8 }}>한글 등에서 직접 쓰는 공문의 번호만 받습니다. 여러 줄이면 이어진 번호를 한꺼번에 받습니다(최대 20건). 받은 번호는 대장에 바로 올라갑니다.</p>
        <div className="jg-row"><label>발송일</label><div className="f"><input className="jg-in" type="date" style={{ width: 160 }} value={date} onChange={function(e) { setDate(e.target.value || LetterDoc.todayIso()); }} /></div></div>
        <table className="lt-tbl" style={{ marginTop: 6 }}>
          <thead><tr><th style={{ width: 28, position: 'static' }}>#</th><th style={{ position: 'static' }}>수신처</th><th style={{ position: 'static' }}>제목</th><th style={{ position: 'static' }}>비고</th><th style={{ position: 'static' }}></th></tr></thead>
          <tbody>
            {rows.map(function(r, i) {
              return (
                <tr key={i}>
                  <td style={{ paddingTop: 12 }}>{i + 1}</td>
                  <td><input className="jg-in" list="lt-book2" value={r.recipient} onChange={function(e) { setRow(i, 'recipient', e.target.value); }} /></td>
                  <td><input className="jg-in" value={r.title} onChange={function(e) { setRow(i, 'title', e.target.value); }}
                    onKeyDown={function(e) { if (e.key === 'Enter' && e.ctrlKey) submit(); }} /></td>
                  <td><input className="jg-in" value={r.note} onChange={function(e) { setRow(i, 'note', e.target.value); }} /></td>
                  <td><button className="jg-b" disabled={rows.length < 2} onClick={function() { setRows(rows.filter(function(x, j) { return j !== i; })); }}>✕</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <datalist id="lt-book2">{book.slice(0, 500).map(function(b) { return <option key={b.name} value={b.name} />; })}</datalist>
        <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
          <button className="jg-b" disabled={rows.length >= 20} onClick={function() { setRows(rows.concat([{ recipient: '', title: '', note: '' }])); }}>＋ 줄 추가</button>
          <button className="jg-b p" style={{ marginLeft: 'auto', padding: '8px 18px', fontSize: 13 }} disabled={busy} onClick={submit}>{busy ? '받는 중…' : '번호 받기'}</button>
        </div>
        {err && <div className="dc-al e" style={{ marginTop: 8 }}>{err}</div>}
      </div>
      {got && got.length > 0 && (
        <div className="jg-sec" style={{ marginTop: 10 }}>
          <h3 style={{ display: 'flex', alignItems: 'center' }}>받은 번호 {got.length}건
            <button className="jg-b" style={{ marginLeft: 'auto' }} onClick={function() { ltCopy(got.map(function(r) { return r.doc_no + '\t' + (r.title || ''); }).join('\n')); }}>📋 모두 복사</button></h3>
          <div className="lt-res">
            {got.map(function(r) {
              return (
                <div key={r.id} className="r">
                  <span className="no">{r.doc_no}</span>
                  <span className="t">{r.recipient ? r.recipient + ' · ' : ''}{r.title}</span>
                  <button className="jg-b" onClick={function(e) { var b = e.currentTarget; ltCopy(r.doc_no).then(function() { b.textContent = '✓ 복사됨'; setTimeout(function() { b.textContent = '📋 복사'; }, 1500); }); }}>📋 복사</button>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// ── ③ 공문 대장 ─────────────────────────────────────────────────
function LetterLedger({ user, res, seal, canEdit, rev, dlg, onEdit }) {
  var curY = new Date().getFullYear();
  const [year, setYear] = useState(curY);
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState('');
  const [q, setQ] = useState('');
  const [noteEd, setNoteEd] = useState(null);   // {id, v}
  const [cancel, setCancel] = useState(null);   // row
  const [busyId, setBusyId] = useState(null);
  var years = []; for (var y = curY; y >= 2024; y--) years.push(y);

  function load() {
    setRows(null); setErr('');
    var all = [], from = 0, PAGE = 1000;
    function next() {
      return sb.from('official_letters').select(LT_COLS).eq('year', year).order('created_at').range(from, from + PAGE - 1).then(function(r) {
        if (r.error) throw r.error;
        all = all.concat(r.data || []);
        if ((r.data || []).length === PAGE) { from += PAGE; return next(); }
        return all;
      });
    }
    next().then(function(a) { setRows(a); }, function(e) { setErr('대장을 불러오지 못했습니다. ' + ltErr(e)); setRows([]); });
  }
  useEffect(load, [year, rev]);

  function key(r) { var n = LetterDoc.ledgerNo(r); return [n === '' ? 1e9 : n, r.issued_date || '9999', r.created_at || '']; }
  function cmp(a, b) { var x = key(a), z = key(b); for (var i = 0; i < 3; i++) { if (x[i] < z[i]) return -1; if (x[i] > z[i]) return 1; } return 0; }
  var sorted = (rows || []).slice().sort(cmp);
  var ql = q.trim().toLowerCase();
  var shown = sorted.slice().reverse().filter(function(r) {
    if (!ql) return true;
    return [r.doc_no, r.recipient, r.title, r.author_name, r.note, r.via, r.cancel_reason].some(function(v) { return v && String(v).toLowerCase().indexOf(ql) >= 0; });
  });
  function patchRow(row) { setRows(function(o) { return (o || []).map(function(x) { return x.id === row.id ? row : x; }); }); }
  function saveNote() {
    var ed = noteEd; if (!ed) return;
    setNoteEd(null);
    var row = (rows || []).filter(function(x) { return x.id === ed.id; })[0];
    if (!row || (row.note || '') === ed.v.trim()) return;
    sb.from('official_letters').update({ note: ed.v.trim() || null }).eq('id', ed.id).select(LT_COLS).then(function(r) {
      if (r.error || !r.data || !r.data.length) { dlg.info('비고 저장 실패', r.error ? ltErr(r.error) : '고칠 권한이 없습니다.'); return; }
      patchRow(r.data[0]);
    });
  }
  function doCancel(reason) {
    var row = cancel; setCancel(null);
    if (!row) return;
    sb.from('official_letters').update({ status: 'canceled', cancel_reason: reason }).eq('id', row.id).select(LT_COLS).then(function(r) {
      if (r.error || !r.data || !r.data.length) { dlg.info('취소하지 못했습니다', r.error ? ltErr(r.error) : '취소할 권한이 없습니다.'); return; }
      patchRow(r.data[0]);
    });
  }
  function undoCancel(row) {
    dlg.ask({ title: '취소 되돌리기', text: row.doc_no + ' 의 취소를 되돌릴까요?', buttons: [{ label: '되돌리기', value: true, primary: true }, { label: '닫기', value: false }] }).then(function(ok) {
      if (!ok) return;
      sb.from('official_letters').update({ status: 'issued' }).eq('id', row.id).select(LT_COLS).then(function(r) {
        if (r.error || !r.data || !r.data.length) { dlg.info('되돌리지 못했습니다', r.error ? ltErr(r.error) : '권한이 없습니다.'); return; }
        patchRow(r.data[0]);
      });
    });
  }
  function download(row, which) {
    if (!res) { dlg.info('준비 중', '글꼴·서식을 불러오는 중입니다. 잠시 뒤 다시 눌러 주세요.'); return; }
    setBusyId(row.id + which);
    ltDownload(ltRowLetter(row), res, seal, which).catch(function(e) { dlg.info('파일을 만들지 못했습니다', ltErr(e)); }).then(function() { setBusyId(null); });
  }
  function excel() {
    var ws = XLSX.utils.aoa_to_sheet(LetterDoc.ledgerAoa(sorted));
    ws['!cols'] = [{ wch: 9 }, { wch: 11 }, { wch: 22 }, { wch: 50 }, { wch: 9 }, { wch: 20 }];
    ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: 5 } }];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '공문발송대장(' + year + ')');
    XLSX.writeFile(wb, '공문발송대장_' + year + '.xlsx');
  }

  var nIssued = (rows || []).filter(function(r) { return r.status !== 'canceled'; }).length;
  var maxNo = (rows || []).reduce(function(m, r) { return r.seq != null && r.seq > m ? r.seq : m; }, 0);
  return (
    <div>
      <div className="jg-bar" style={{ marginBottom: 8 }}>
        <select className="jg-sel" style={{ width: 110 }} value={year} onChange={function(e) { setYear(Number(e.target.value)); }}>
          {years.map(function(y) { return <option key={y} value={y}>{y}년</option>; })}
        </select>
        <input className="jg-in" style={{ width: 260 }} placeholder="번호·수신처·제목·작성자·비고 찾기" value={q} onChange={function(e) { setQ(e.target.value); }} />
        <span className="jg-small">{rows ? (shown.length + '건' + (ql ? ' / ' + rows.length + '건' : '') + ' · 마지막 번호 ' + (maxNo ? LetterDoc.docNo(year, maxNo) : '없음') + (rows.length !== nIssued ? ' · 취소 ' + (rows.length - nIssued) + '건' : '')) : '불러오는 중…'}</span>
        <div className="r"><button className="jg-b" disabled={!rows || !rows.length} onClick={excel}>📥 엑셀 (예전 대장 모양)</button></div>
      </div>
      {err && <div className="dc-al e" style={{ marginBottom: 8 }}>{err}</div>}
      <div className="dc-card" style={{ padding: 0, overflowX: 'auto' }}>
        <table className="lt-tbl">
          <thead><tr><th>번호</th><th>일자</th><th>수신처</th><th>제목</th><th>작성자</th><th>비고</th><th></th></tr></thead>
          <tbody>
            {rows && !shown.length && <tr><td colSpan={7} className="dc-note" style={{ padding: 20, textAlign: 'center' }}>{ql ? '찾는 공문이 없습니다.' : '이 해에는 공문이 없습니다.'}</td></tr>}
            {shown.map(function(r) {
              var cx = r.status === 'canceled', ed = canEdit(r);
              return (
                <tr key={r.id} className={cx ? 'cx' : ''}>
                  <td className="no st">{r.doc_no || '(번호 없음)'}</td>
                  <td className="st" style={{ whiteSpace: 'nowrap' }}>{LetterDoc.ledgerDate(r.issued_date)}</td>
                  <td className="st">{r.recipient || ''}{r.via ? <span className="jg-small"> (경유 {r.via})</span> : null}</td>
                  <td><span className="st">{r.title || ''}</span>
                    {r.kind === 'letter' && <span className="lt-badge l">공문 작성</span>}
                    {cx && <span className="lt-badge c" title={r.cancel_reason || ''}>취소{r.cancel_reason ? ': ' + r.cancel_reason : ''}</span>}</td>
                  <td style={{ whiteSpace: 'nowrap' }}>{r.author_name || ''}</td>
                  <td>{noteEd && noteEd.id === r.id
                    ? <input className="jg-in" autoFocus value={noteEd.v} onChange={function(e) { setNoteEd({ id: r.id, v: e.target.value }); }}
                        onBlur={saveNote} onKeyDown={function(e) { if (e.key === 'Enter') saveNote(); if (e.key === 'Escape') setNoteEd(null); }} />
                    : <span className={'lt-note' + (ed ? ' ed' : '')} title={ed ? '눌러서 비고 고치기' : ''}
                        onClick={function() { if (ed) setNoteEd({ id: r.id, v: r.note || '' }); }}>{r.note || (ed ? <span style={{ color: '#cbd5e1' }}>＋</span> : '')}</span>}</td>
                  <td className="act">
                    {r.kind === 'letter' && <button className="jg-b" disabled={busyId === r.id + 'pdf'} onClick={function() { download(r, 'pdf'); }}>PDF</button>}
                    {r.kind === 'letter' && <button className="jg-b" disabled={busyId === r.id + 'hwpx'} onClick={function() { download(r, 'hwpx'); }}>HWPX</button>}
                    {r.kind === 'letter' && ed && !cx && <button className="jg-b" onClick={function() { onEdit(r, false); }}>고치기</button>}
                    {r.kind === 'letter' && <button className="jg-b" title="이 내용으로 새 공문 쓰기" onClick={function() { onEdit(r, true); }}>복사</button>}
                    {ed && !cx && <button className="jg-b" onClick={function() { setCancel(r); }}>취소</button>}
                    {ed && cx && <button className="jg-b" onClick={function() { undoCancel(r); }}>되돌리기</button>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="jg-small" style={{ marginTop: 6 }}>공문은 지우지 않고 「취소」로 남깁니다(줄이 그어져 보이고 엑셀 비고에 사유가 들어갑니다). 고치기·취소는 작성자와 관리 권한이 있는 사람만 할 수 있습니다.
        「공문 작성」 표시가 없는 줄은 번호만 받은 공문(예전 대장 포함)이라 파일이 없습니다.</p>
      {cancel && <LetterCancelDialog row={cancel} onDone={function(v) { if (v) doCancel(v); else setCancel(null); }} />}
    </div>
  );
}
function LetterCancelDialog({ row, onDone }) {
  const [v, setV] = useState('');
  return (
    <div className="modal-bg" role="dialog" aria-modal="true">
      <div className="modal" style={{ maxWidth: 460 }}>
        <h3>{row.doc_no} 취소</h3>
        <p>번호는 그대로 남고 대장에 「취소」로 표시됩니다. 취소 사유를 적어 주세요.</p>
        <input className="jg-in" style={{ marginTop: 10 }} autoFocus value={v} maxLength={300} placeholder="예: 발송하지 않음, 다른 번호로 다시 발송"
          onChange={function(e) { setV(e.target.value); }} onKeyDown={function(e) { if (e.key === 'Enter' && v.trim()) onDone(v.trim()); if (e.key === 'Escape') onDone(null); }} />
        <div className="acts">
          <button className="jg-b p" disabled={!v.trim()} onClick={function() { onDone(v.trim()); }}>취소 처리</button>
          <button className="jg-b" onClick={function() { onDone(null); }}>닫기</button>
        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
//  서류 종류 등록 — 새 서류는 여기에 한 줄 + 그 화면 컴포넌트. 빈 「준비 중」 항목은 두지 않는다
//  pcOnly = 휴대폰 폭에서는 「PC에서 사용해 주세요」 안내만
// ═════════════════════════════════════════════════════════════════════
//  첫 항목 = 해시 없이 열 때의 기본(v2.9.1 부터 공문)
const DOC_TYPES = [
  { key: 'letter', label: '공문', icon: '✉️', View: LetterView },
  { key: 'jungong', label: '준공사진', icon: '📷', pcOnly: true, View: JungongDoc,
    mobileWhy: '바인더를 끌어 옮기고 큰 미리보기를 봐야 해서 PC 화면이 필요합니다.' },
];
function docFromHash() {
  var h = Sysbar.hashTab();
  return DOC_TYPES.some(function(d) { return d.key === h; }) ? h : DOC_TYPES[0].key;
}

function DocsPage({ user }) {
  const mobile = useIsMobile();
  const [docKey, setDocKey] = useState(docFromHash);
  useEffect(function() {
    if (location.hash !== '#' + docKey) history.replaceState(Object.assign({}, history.state, { doc: docKey }), '', '#' + docKey);
    function onPop() { setDocKey(docFromHash()); }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);
  function pick(k) { if (k === docKey) return; history.pushState({ doc: k }, '', '#' + k); setDocKey(k); }
  var doc = DOC_TYPES.filter(function(d) { return d.key === docKey; })[0] || DOC_TYPES[0];
  var View = doc.View;
  return (
    <div className="dc-page">
      <div className="dc-kinds" role="tablist" aria-label="서류 종류">
        <span className="lb">서류 종류</span>
        {DOC_TYPES.map(function(d) {
          return <button key={d.key} role="tab" aria-selected={d.key === doc.key} className={'dc-kind' + (d.key === doc.key ? ' on' : '')}
            onClick={function() { pick(d.key); }}>{d.icon} {d.label}</button>;
        })}
      </div>
      {(doc.pcOnly && mobile)
        ? <div className="dc-card" style={{ textAlign: 'center', padding: '28px 18px' }}>
            <div style={{ fontSize: 36, marginBottom: 8 }}>🖥️</div>
            <p style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>PC에서 사용해 주세요</p>
            <p className="dc-note">{doc.label} 만들기는 PC 브라우저(또는 데스크탑 앱)에서 할 수 있습니다. {doc.mobileWhy}</p>
          </div>
        : <View user={user} />}
    </div>
  );
}

function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    return (v && v.id && v.role) ? v : null;
  })();
  const [user, setUser] = useState(initialUser);
  const [checked, setChecked] = useState(false);
  const [teamName, setTeamName] = useState('');
  const [denied, setDenied] = useState(false);

  useEffect(function() {
    if (!user || !user.team_id) { setTeamName(''); return; }
    sb.from('teams').select('name').eq('id', user.team_id).single()
      .then(function(r) { setTeamName((r.data && r.data.name) || ''); });
  }, [user && user.team_id]);

  // 열 때 만료 확인 + 캐시된 세션의 role 은 서버 값으로 다시 확인(me.html 과 같은 순서)
  useEffect(function() {
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad(sb);
    if (wasInvalidated || !initialUser) { if (wasInvalidated) setUser(null); setChecked(true); return; }
    Sysbar.Auth.verifySession(sb).then(function(res) {
      if (res && res.ok && res.user) setUser(res.user);
      else if (res && !res.hold) { Sysbar.Auth.logout(sb); setUser(null); }
      setChecked(true);
    });
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }, []);

  function handleLogin(u) { setUser(u); setChecked(true); Sysbar.SessionManager.onLogin(function() { logout(); }); }
  function logout() { Sysbar.Auth.logout(sb); setUser(null); }

  if (!user) return <LoginScreen supabaseClient={sb} onLogin={handleLogin} />;
  if (!checked) return <div className="dc-page"><div className="dc-card dc-note">확인 중...</div></div>;

  // 협력업체는 업무관리를 쓸 수 없다(메뉴도 막힘) — 주소로 직접 와도 같은 안내
  if (user.role === 'contractor') {
    return (
      <div style={{ minHeight: '100vh', background: 'linear-gradient(135deg,var(--theme,#0f172a) 0%,#1e3a5f 50%,#1d4ed8 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
        <div style={{ background: '#fff', borderRadius: 18, padding: '40px 32px', width: '100%', maxWidth: 360, boxShadow: '0 25px 70px rgba(0,0,0,.45)', textAlign: 'center' }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>🚫</div>
          <p style={{ margin: '0 0 8px', fontSize: 17, fontWeight: 800, color: '#0f172a' }}>접근 권한 없음</p>
          <p style={{ margin: '0 0 24px', fontSize: 13, color: '#64748b', lineHeight: 1.6 }}>기술지원 계정은 서류작성을<br />이용할 수 없습니다.</p>
          <a href="project.html" style={{ display: 'inline-block', padding: '11px 28px', background: 'var(--theme,#0f172a)', color: '#fff', borderRadius: 8, fontSize: 13, fontWeight: 700, textDecoration: 'none' }}>공정관리로 돌아가기</a>
        </div>
      </div>
    );
  }

  var wtabs = Sysbar.sectionTabs('worklog', user);
  return (
    <div>
      <SysBar sb={sb} activeKey="worklog" activeSub="docs" user={user} teamName={teamName} onLogout={logout}
        onDisabledClick={function() { setDenied(true); }} />
      <div className="dc-title">
        <p className="en">{APP_CONFIG.COMPANY_EN}</p>
        <p className="ko">서류작성</p>
      </div>
      {/* 휴대폰: 업무관리 하위 항목 줄(PC 는 왼쪽 메뉴) */}
      <nav className="dc-tabs sys-page-tabs" aria-label="업무관리">
        {wtabs.map(function(t) {
          return t.key === 'docs'
            ? <span key={t.key} className="sys-tab-on">{t.icon} {t.label}</span>
            : <a key={t.key} href={t.url || ('worklog.html#' + t.key)}>{t.icon} {t.label}</a>;
        })}
      </nav>
      {denied && <div className="dc-page" style={{ paddingBottom: 0 }}><div className="dc-al e" onClick={function() { setDenied(false); }}>이 메뉴는 이용할 수 없습니다.</div></div>}
      <DocsPage user={user} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
