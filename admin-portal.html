<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { createClient } = supabase;
// RLS용: 로그인 후 user 헤더를 포함한 Supabase 클라이언트 생성
function _makeSb(userId, userRole) {
  const extraHeaders = {};
  if (userId) {
    extraHeaders['x-user-id'] = String(userId);
    extraHeaders['x-user-role'] = userRole || '';
  }
  return createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY, {
    global: { headers: extraHeaders }
  });
}
// ─── 비밀번호 해싱 → sysbar.js Sysbar.Auth에 위임 ──────────
const { hashPassword, verifyPassword, isPlainPassword } = Sysbar.Auth;


let sb = _makeSb();

const VIEWS = { WL:'wl', PF:'pf', SL:'sl', ST:'st' };
const TODAY = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDateKo = (ds) => { const d = new Date(ds + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const DAY_KO = ['일','월','화','수','목','금','토'];

// ── 공휴일 (하드코딩 + Nager.Date API 조합) ──────────────────────────────
const HOLIDAYS = {
  '2025-01-01':'신정',
  '2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날',
  '2025-06-03':'임시공휴일','2025-06-06':'현충일',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날',
  '2025-12-25':'크리스마스',
  '2026-01-01':'신정',
  '2026-01-28':'설날연휴','2026-01-29':'설날','2026-01-30':'설날연휴',
  '2026-03-01':'삼일절',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-06':'현충일',
  '2026-08-15':'광복절',
  '2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날',
  '2026-12-25':'크리스마스',
};
const SUBSTITUTE = {
  '2025-05-06':'대체공휴일',
  '2025-10-08':'대체공휴일',
  '2026-03-02':'대체공휴일',
  '2026-05-25':'대체공휴일',
  '2026-06-08':'대체공휴일',
  '2026-08-17':'대체공휴일',
  '2026-09-28':'대체공휴일',
  '2026-10-05':'대체공휴일',
};
const NAGER_KO = {
  "New Year's Day":'신정',"Seollal":'설날',"Seollal Holiday":'설날연휴',
  "Independence Movement Day":'삼일절',"Labor Day":'근로자의날',
  "Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',
  "Memorial Day":'현충일',"Liberation Day":'광복절',
  "Chuseok":'추석',"Chuseok Holiday":'추석연휴',
  "National Foundation Day":'개천절',"Hangul Day":'한글날',
  "Christmas Day":'크리스마스',"Substitute Holiday":'대체공휴일',
};
function isHolidayDate(ds) { return !!(HOLIDAYS[ds] || SUBSTITUTE[ds]); }
function getHolidayName(ds) { return HOLIDAYS[ds] || SUBSTITUTE[ds] || null; }

const _holCache = {};
async function fetchHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const set = new Set([...Object.keys(HOLIDAYS), ...Object.keys(SUBSTITUTE)]
    .filter(d => d.startsWith(String(year))));
  try {
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const data = await r.json();
    data.forEach(h => {
      if (!h.date) return;
      const name = NAGER_KO[h.localName] || NAGER_KO[h.name] || h.localName || h.name;
      set.add(h.date);
      if (name === '대체공휴일') SUBSTITUTE[h.date] = '대체공휴일';
      else if (!HOLIDAYS[h.date]) HOLIDAYS[h.date] = name;
    });
  } catch(e) {}
  _holCache[year] = set;
  return set;
}

// 직전 근무일 계산 (주말·공휴일 건너뜀)
function prevWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() - 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}
// 다음 근무일 계산
function nextWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() + 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}

// ── MiniCalendar ──────────────────────────────────────────────────────────────
function MiniCalendar({ value, onChange, maxDate }) {
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(() => new Date((value || TODAY()) + 'T00:00:00'));
  const [holidays, setHolidays] = useState(new Set());
  const wrapRef = useRef(null);

  useEffect(function() {
    if (!open) return;
    fetchHolidays(viewDate.getFullYear()).then(function(h) { setHolidays(h); });
  }, [open, viewDate.getFullYear()]);

  useEffect(function() {
    if (!open) return;
    function handler(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return function() { document.removeEventListener('mousedown', handler); };
  }, [open]);

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const startWd = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const today = TODAY();

  function prevM() { const d = new Date(viewDate); d.setMonth(d.getMonth() - 1); setViewDate(d); }
  function nextM() { const d = new Date(viewDate); d.setMonth(d.getMonth() + 1); setViewDate(d); }

  function select(ds) {
    if (maxDate && ds > maxDate) return;
    onChange(ds);
    setOpen(false);
  }

  return (
    <div className="mcal-wrap" ref={wrapRef}>
      <button className="mcal-btn" title="달력 선택"
        onClick={function() { setViewDate(new Date((value || TODAY()) + 'T00:00:00')); setOpen(function(v) { return !v; }); }}>📅</button>
      {open && (
        <div className="mcal-popup">
          <div className="mcal-nav">
            <button className="mcal-nav-btn" onClick={prevM}>◀</button>
            <span className="mcal-title">{year}년 {month + 1}월</span>
            <button className="mcal-nav-btn" onClick={nextM}>▶</button>
          </div>
          <div className="mcal-grid">
            {DAY_KO.map(function(d, i) {
              return <div key={d} className={'mcal-dh' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>{d}</div>;
            })}
            {Array.from({ length: startWd }, function(_, i) { return <div key={'e' + i} className="mcal-day empty" />; })}
            {Array.from({ length: lastDay }, function(_, i) {
              const day = i + 1;
              const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
              const wd = new Date(ds + 'T00:00:00').getDay();
              const isHol = holidays.has(ds);
              const isFuture = maxDate && ds > maxDate;
              const cls = ['mcal-day',
                (wd === 0 || isHol) ? 'sun' : wd === 6 ? 'sat' : '',
                ds === today && ds !== value ? 'today' : '',
                ds === value ? 'selected' : '',
                isFuture ? 'future' : '',
              ].filter(Boolean).join(' ');
              return <div key={day} className={cls} onClick={function() { if (!isFuture) select(ds); }}>{day}</div>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}
const fmtN = (n) => n ? Number(n).toLocaleString('ko-KR') : '0';
const fmtD = (d) => {
  if (!d) return '-';
  const dt = new Date(d + 'T00:00:00');
  return dt.getFullYear() + '.' + String(dt.getMonth()+1).padStart(2,'0') + '.' + String(dt.getDate()).padStart(2,'0');
};
const genId = () => Math.random().toString(36).slice(2, 10);
const WSTATUS = ['완료','진행중','보류'];
const SCLS = { '완료':'bg','진행중':'bb','보류':'ba' };
const CAT_COLOR = { '관급': '#2563eb', '사급': '#059669', '기술지원': '#d97706' };
const CAT_BG    = { '관급': '#dbeafe', '사급': '#dcfce7', '기술지원': '#fef3c7' };
const CAT_TX    = { '관급': '#1e40af', '사급': '#15803d', '기술지원': '#92400e' };

const fmtShort = (ds) => { const d = new Date(ds + 'T00:00:00'); return (d.getMonth()+1) + '/' + d.getDate(); };

const getWeekDates = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return Array.from({ length: 5 }, function(_, i) {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return localDateStr(dd);
  });
};

const getMonthInfo = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  return {
    year, month,
    days: last.getDate(),
    startWeekday: first.getDay(),
    firstDate: localDateStr(first),
    lastDate:  localDateStr(last),
  };
};

// ── 인풋 컴포넌트 ─────────────────────────────────────────────────────────
function FI({ label, field, form, set, type }) {
  return (
    <div className="sal-frow">
      <label className="fl">{label}</label>
      <input
        className="fi"
        type={type || 'text'}
        value={form[field] || ''}
        placeholder="0"
        onChange={function(e) { set(function(p) { var o = {}; Object.assign(o, p); o[field] = e.target.value; return o; }); }}
      />
    </div>
  );
}

// ── 업무일지 ──────────────────────────────────────────────────────────────
function WorklogView({ user }) {
  const { useCallback } = React;
  const [tab, setTab]         = useState('my');
  const [allMode, setAllMode] = useState('day');
  // 내 업무일지
  const [date, setDate]       = useState(TODAY());
  const [tasks, setTasks]     = useState([]);
  const [issues, setIssues]   = useState('');
  const [saving, setSaving]   = useState(false);
  const [msg, setMsg]         = useState('');
  const [loading, setLoading] = useState(false);
  // 전체 조회
  const [selDate, setSelDate]     = useState(TODAY());
  const [allUsers, setAllUsers]   = useState([]);
  const [allLogs, setAllLogs]     = useState([]);
  const [allLoading, setAllLoading] = useState(false);

  // 하위탭 전환 — pushState
  function changeTab(newTab) {
    history.pushState({ wlTab: newTab, allMode: allMode, selDate: selDate }, '', '');
    setTab(newTab);
  }

  // 전체조회 모드 전환 — pushState
  function changeAllMode(newMode, date) {
    history.pushState({ wlTab: 'all', allMode: newMode, selDate: date || selDate }, '', '');
    if (date) setSelDate(date);
    setAllMode(newMode);
  }

  // 뒤로가기 감지
  useEffect(function() {
    history.replaceState({ wlTab: tab, allMode: allMode, selDate: selDate }, '', '');
    function onPop(e) {
      if (e.state && e.state.wlTab !== undefined) {
        setTab(e.state.wlTab);
        if (e.state.allMode) setAllMode(e.state.allMode);
        if (e.state.selDate) setSelDate(e.state.selDate);
      }
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);

  // ── 내 업무일지 로드 ──────────────────────────────────────────────────────
  const loadMyLog = useCallback(async function(d) {
    setLoading(true);
    const { data } = await sb.from('admin_work_logs')
      .select('*').eq('user_id', user.id).eq('log_date', d).maybeSingle();
    if (data) {
      setTasks(data.tasks || []);
      setIssues(data.issues || '');
    } else {
      // 빈 날짜 → 직전 근무일 진행중 업무 자동 불러오기
      const prevDs = prevWorkday(d);
      const { data: pd } = await sb.from('admin_work_logs')
        .select('tasks').eq('user_id', user.id).eq('log_date', prevDs).maybeSingle();
      const pending = pd
        ? (pd.tasks || []).filter(function(t) { return t.status === '진행중'; })
            .map(function(t) { return Object.assign({}, t, { id: genId() }); })
        : [];
      setTasks(pending);
      setIssues('');
    }
    setLoading(false);
  }, [user.id]);

  useEffect(function() {
    if (tab === 'my') loadMyLog(date);
  }, [date, tab]);

  // ── 전체 조회 로드 ────────────────────────────────────────────────────────
  useEffect(function() {
    if (tab !== 'all') return;
    setAllLoading(true);
    sb.from('teams').select('id,name').then(function(tr) {
      const teams = tr.data || [];
      const mgmt = teams.find(function(t) { return t.name === '관리팀'; });
      sb.from('users').select('id,name,team_id').then(function(ur) {
        const filtered = (ur.data || []).filter(function(u) {
          return mgmt && u.team_id === mgmt.id;
        });
        setAllUsers(filtered);
        var start, end;
        if (allMode === 'day') { start = end = selDate; }
        else if (allMode === 'week') { const w = getWeekDates(selDate); start = w[0]; end = w[4]; }
        else { const m = getMonthInfo(selDate); start = m.firstDate; end = m.lastDate; }
        sb.from('admin_work_logs').select('*').gte('log_date', start).lte('log_date', end).then(function(lr) {
          setAllLogs(lr.data || []);
          setAllLoading(false);
        });
      });
    });
  }, [tab, selDate, allMode]);

  // ── 저장 ──────────────────────────────────────────────────────────────────
  function save() {
    setSaving(true);
    sb.from('admin_work_logs').upsert({
      user_id: user.id, log_date: date,
      tasks: tasks, tomorrow_tasks: [], issues: issues,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id,log_date' }).then(function(r) {
      setSaving(false);
      if (!r.error) { setMsg('저장됐습니다'); setTimeout(function() { setMsg(''); }, 2500); }
    });
  }

  // ── 날짜 이동 헬퍼 ────────────────────────────────────────────────────────
  function shiftDate(ds, dir, setter, max) {
    const next = dir < 0 ? prevWorkday(ds) : nextWorkday(ds);
    if (max && next > max) return;
    setter(next);
  }
  function shiftAllDate(dir) {
    const d = new Date(selDate + 'T00:00:00');
    if (allMode === 'day')        d.setDate(d.getDate() + dir);
    else if (allMode === 'week')  d.setDate(d.getDate() + dir * 7);
    else                          d.setMonth(d.getMonth() + dir);
    setSelDate(localDateStr(d));
  }
  function allRangeLabel() {
    if (allMode === 'day')  return fmtDateKo(selDate) + ' (' + DAY_KO[new Date(selDate+'T00:00:00').getDay()] + ')';
    if (allMode === 'week') { const w = getWeekDates(selDate); return fmtShort(w[0]) + ' ~ ' + fmtShort(w[4]); }
    const m = getMonthInfo(selDate); return m.year + '년 ' + (m.month+1) + '월';
  }

  const dayNameOf = (ds) => DAY_KO[new Date(ds + 'T00:00:00').getDay()];

  return (
    <div className="page">
      <div className="ph">
        <div className="pt">📝 관리팀 업무일지</div>
        <div className="ps">관리팀 전용 업무 기록</div>
      </div>
      <div className="itabs">
        <button className={tab === 'my' ? 'itab active' : 'itab'} onClick={function() { changeTab('my'); }}>내 업무일지</button>
        <button className={tab === 'all' ? 'itab active' : 'itab'} onClick={function() { changeTab('all'); }}>전체 조회</button>
      </div>

      {/* ── 내 업무일지 ── */}
      {tab === 'my' && (
        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:15,fontWeight:800}}>✏️ {user.name}님 · {fmtDateKo(date)} ({dayNameOf(date)})</span>
            <div className="wl-date-nav">
              <button className="wl-date-btn" onClick={function() { shiftDate(date, -1, setDate, null); }}>◀</button>
              <input type="date" className="fi" value={date} max={TODAY()}
                onChange={function(e) { setDate(e.target.value); }}
                style={{width:'auto',maxWidth:140}} />
              <MiniCalendar value={date} maxDate={TODAY()} onChange={setDate} />
              <button className="wl-date-btn" onClick={function() { shiftDate(date, 1, setDate, TODAY()); }}
                disabled={date >= TODAY()}>▶</button>
              {date !== TODAY() && (
                <button className="wl-today-btn" onClick={function() { setDate(TODAY()); }}>오늘</button>
              )}
            </div>
          </div>

          {loading ? <div className="loading">불러오는 중...</div> : (
            <div>
              {/* 오늘 한 일 */}
              <div className="sh">
                <span className="st">오늘 한 일</span>
                <button className="btn btn-s btn-sm" onClick={function() {
                  setTasks(function(p) { return p.concat([{id:genId(),content:'',status:'진행중'}]); });
                }}>+ 추가</button>
              </div>
              {tasks.length === 0 && <div style={{color:'#94a3b8',fontSize:13,marginBottom:12}}>업무를 추가하세요.</div>}
              {tasks.map(function(t) {
                return (
                  <div key={t.id} className="tr-row">
                    <select className="ss" value={t.status} onChange={function(e) {
                      setTasks(function(p) { return p.map(function(x) { return x.id === t.id ? Object.assign({},x,{status:e.target.value}) : x; }); });
                    }}>
                      {WSTATUS.map(function(s) { return <option key={s}>{s}</option>; })}
                    </select>
                    <input className="ti" value={t.content} placeholder="업무 내용"
                      onChange={function(e) {
                        setTasks(function(p) { return p.map(function(x) { return x.id === t.id ? Object.assign({},x,{content:e.target.value}) : x; }); });
                      }} />
                    <button className="btn btn-d btn-sm" onClick={function() {
                      setTasks(function(p) { return p.filter(function(x) { return x.id !== t.id; }); });
                    }}>✕</button>
                  </div>
                );
              })}

              {/* 이슈 / 공유사항 */}
              <div style={{marginTop:16}}>
                <div className="st" style={{marginBottom:8}}>💬 공유 사항 / 이슈</div>
                <textarea className="fi" rows={3} value={issues}
                  placeholder="공유할 사항이나 이슈를 입력하세요"
                  onChange={function(e) { setIssues(e.target.value); }}
                  style={{resize:'vertical'}} />
              </div>

              <div className="sr">
                {msg && <span style={{fontSize:12,color:'#059669',fontWeight:600}}>✓ {msg}</span>}
                <button className="btn btn-p" onClick={save} disabled={saving}>
                  {saving ? '저장 중...' : '💾 저장'}
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── 전체 조회 ── */}
      {tab === 'all' && (
        <div className="card">
          {/* 모드 탭 */}
          <div className="wl-mode-tabs">
            {[['day','일별'],['week','주별'],['month','월별']].map(function(m) {
              return (
                <button key={m[0]} className={'wl-mode-tab' + (allMode===m[0]?' active':'')}
                  onClick={function(){changeAllMode(m[0]);}}>
                  {m[1]}
                </button>
              );
            })}
          </div>

          {/* 날짜 네비 */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:14,fontWeight:800,color:'#1e293b'}}>👥 관리팀 전체 · {allRangeLabel()}</span>
            <div className="wl-date-nav">
              <button className="wl-date-btn" onClick={function(){shiftAllDate(-1);}}>◀</button>
              {allMode === 'week' ? (function(){
                var d = new Date(selDate+'T00:00:00');
                var y = d.getFullYear();
                var m = d.getMonth();
                // 해당 월의 몇 번째 주인지 계산 (월요일 기준)
                var firstDay = new Date(y, m, 1);
                var weekNum = Math.ceil((d.getDate() + ((firstDay.getDay()+6)%7)) / 7);
                return (
                  <span style={{fontSize:13,fontWeight:700,color:'#1e293b',padding:'4px 10px',
                    background:'#f1f5f9',borderRadius:6,whiteSpace:'nowrap'}}>
                    {y}년 {m+1}월 {weekNum}주
                  </span>
                );
              })() : allMode === 'day' ? (
                <input type="date" className="fi" value={selDate} max={TODAY()}
                  onChange={function(e){setSelDate(e.target.value);}}
                  style={{width:'auto',maxWidth:140}} />
              ) : null}
              {allMode !== 'month' && <MiniCalendar value={selDate} maxDate={TODAY()} onChange={setSelDate} />}
              <button className="wl-date-btn" onClick={function(){shiftAllDate(1);}}>▶</button>
              <button className="wl-today-btn" onClick={function(){setSelDate(TODAY());}}>오늘</button>
            </div>
          </div>

          {allLoading ? <div className="loading">불러오는 중...</div> : (
            <div>

              {/* ── 일별 ── */}
              {allMode === 'day' && allUsers.map(function(u) {
                const log = allLogs.find(function(l) { return l.user_id === u.id; });
                return (
                  <div key={u.id} className="lc">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div className="lu">
                        <div className="lav">{u.name[0]}</div>
                        <div>
                          <div className="ln">{u.name}</div>
                          <div className="lm">{log ? '업무 ' + (log.tasks||[]).length + '건' : '미작성'}</div>
                        </div>
                      </div>
                      <span className={log ? 'badge bg' : 'badge bgr'}>{log ? '작성완료' : '미작성'}</span>
                    </div>
                    {log && (
                      <div className="lb">
                        {(log.tasks||[]).map(function(t, i) {
                          return (
                            <div key={i} className="tr-row">
                              <span className={'badge ' + (SCLS[t.status] || 'bgr')}>{t.status}</span>
                              <span style={{flex:1,fontSize:13}}>{t.content}</span>
                            </div>
                          );
                        })}
                        {log.issues && (
                          <div style={{marginTop:8,padding:'6px 10px',background:'#fef3c7',borderRadius:6,fontSize:12,color:'#92400e'}}>
                            💬 {log.issues}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              {allMode === 'day' && !allLoading && allUsers.length === 0 && (
                <div style={{color:'#94a3b8',fontSize:13,textAlign:'center',padding:'20px 0'}}>관리팀 직원 정보를 불러오는 중...</div>
              )}

              {/* ── 주별 ── */}
              {allMode === 'week' && (function() {
                const weekDates = getWeekDates(selDate);
                return (
                  <div>
                    {allUsers.map(function(u) {
                      const weekLogs = weekDates.map(function(d) {
                        return { date: d, log: allLogs.find(function(l) { return l.user_id === u.id && l.log_date === d; }) };
                      }).filter(function(x) { return x.log; });
                      if (weekLogs.length === 0) return (
                        <div key={u.id} className="lc" style={{marginBottom:8}}>
                          <div className="lu">
                            <div className="lav" style={{opacity:.5}}>{u.name[0]}</div>
                            <div>
                              <div className="ln">{u.name}</div>
                              <div className="lm">이번 주 미작성</div>
                            </div>
                          </div>
                        </div>
                      );
                      return (
                        <div key={u.id} className="lc" style={{marginBottom:12}}>
                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                            <div className="lu">
                              <div className="lav">{u.name[0]}</div>
                              <div>
                                <div className="ln">{u.name}</div>
                                <div className="lm">{weekLogs.length}일 작성</div>
                              </div>
                            </div>
                          </div>
                          {weekLogs.map(function(item) {
                            const dt = new Date(item.date + 'T00:00:00');
                            const dayLabel = (dt.getMonth()+1) + '/' + dt.getDate() + '(' + DAY_KO[dt.getDay()] + ')';
                            return (
                              <div key={item.date} style={{marginBottom:10}}>
                                {/* 날짜 헤더 - 클릭 시 일별로 이동 */}
                                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5,
                                  padding:'4px 8px',background:'#f8fafc',borderRadius:6,cursor:'pointer'}}
                                  onClick={function(){changeAllMode('day', item.date);}}>
                                  <span style={{fontSize:12,fontWeight:700,color:'#475569'}}>{dayLabel}</span>
                                  <span style={{fontSize:11,color:'#94a3b8'}}>업무 {(item.log.tasks||[]).length}건</span>
                                  <span style={{fontSize:11,color:'#7c3aed',marginLeft:'auto'}}>상세보기 →</span>
                                </div>
                                {/* 업무 목록 전체 */}
                                {(item.log.tasks||[]).map(function(t, i) {
                                  var sColor = t.status==='완료'?'#059669':t.status==='진행중'?'#2563eb':'#d97706';
                                  return (
                                    <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,
                                      padding:'4px 0',borderBottom:'1px solid #f1f5f9',fontSize:13}}>
                                      <span style={{flexShrink:0,fontSize:11,fontWeight:700,
                                        color:sColor,background:sColor+'18',
                                        padding:'1px 6px',borderRadius:4}}>{t.status}</span>
                                      <span style={{color:'#334155',lineHeight:1.5}}>{t.content}</span>
                                    </div>
                                  );
                                })}
                                {item.log.issues && (
                                  <div style={{marginTop:4,padding:'4px 8px',background:'#fef3c7',
                                    borderRadius:5,fontSize:12,color:'#92400e'}}>
                                    💬 {item.log.issues}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

              {/* ── 월별 ── */}
              {allMode === 'month' && (function() {
                const mInfo = getMonthInfo(selDate);
                return (
                  <div className="wl-month-grid">
                    {DAY_KO.map(function(d, i) {
                      return <div key={d} className={'wl-month-hdr' + (i===0?' sun':i===6?' sat':'')}>{d}</div>;
                    })}
                    {Array.from({length:mInfo.startWeekday}, function(_,i) {
                      return <div key={'e'+i} className="wl-month-day empty" />;
                    })}
                    {Array.from({length:mInfo.days}, function(_,i) {
                      const day = i + 1;
                      const ds  = mInfo.year + '-' + String(mInfo.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
                      const wd  = new Date(ds + 'T00:00:00').getDay();
                      const cnt = allLogs.filter(function(l){ return l.log_date === ds; }).length;
                      const isToday = ds === TODAY();
                      return (
                        <div key={day} className={'wl-month-day' + (isToday?' today':'')}
                          onClick={function(){changeAllMode('day', ds);}}>
                          <div className={'wl-month-num' + (wd===0?' sun':wd===6?' sat':'') + (isToday?' today':'')}>{day}</div>
                          {cnt > 0 && <div className="wl-month-cnt">{cnt}명</div>}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── 기여율 모달 (프로젝트 선택 시 PM+참여직원 자동 등록) ─────────────────
function PerfModal({ projects, users, year, editItem, initForm, onClose, onSaved }) {
  const [selProjId, setSelProjId] = useState(editItem ? editItem.project_id : '');
  const [rows, setRows]           = useState([]); // [{user_id, name, rate, existing}]
  const [loading, setLoading]     = useState(false);
  const [saving, setSaving]       = useState(false);
  const [err, setErr]             = useState('');

  function uName(id) { var u = users.find(function(x){return x.id===id;}); return u?u.name:'-'; }

  // 프로젝트 선택 시 PM + 참여직원 자동 로드
  function onProjChange(pid) {
    setSelProjId(pid);
    setErr('');
    if (!pid) { setRows([]); return; }
    setLoading(true);
    var proj = projects.find(function(p){return p.id===pid;});
    // project_members 조회
    sb.from('project_members').select('user_id').eq('project_id', pid).then(function(r) {
      var memberIds = (r.data||[]).map(function(m){return m.user_id;});
      // PM이 members에 없으면 추가
      if (proj && proj.pm_id && memberIds.indexOf(proj.pm_id) === -1) {
        memberIds = [proj.pm_id].concat(memberIds);
      }
      // 기존 저장된 기여율 조회
      sb.from('performance').select('*').eq('project_id', pid).eq('year', year).then(function(pr) {
        var existing = pr.data || [];
        var newRows = memberIds
          .filter(function(uid) { return users.find(function(u){return u.id===uid;}); })
          .map(function(uid) {
            var ex = existing.find(function(e){return e.user_id===uid;});
            var isPm = proj && proj.pm_id === uid;
            return {
              user_id: uid,
              name: uName(uid),
              rate: ex ? ex.contribution_rate : (isPm ? 100 : 0),
              existing: !!ex,
            };
          });
        setRows(newRows);
        setLoading(false);
      });
    });
  }

  // 수정 모드일 때 초기 로드
  useEffect(function() {
    if (editItem && editItem.project_id) onProjChange(editItem.project_id);
  }, []);

  function updRate(uid, val) {
    setRows(function(prev) {
      return prev.map(function(r) { return r.user_id === uid ? Object.assign({},r,{rate:val}) : r; });
    });
  }

  function addUser(uid) {
    if (!uid || rows.find(function(r){return r.user_id===uid;})) return;
    setRows(function(prev) { return prev.concat([{user_id:uid, name:uName(uid), rate:0, existing:false}]); });
  }

  function removeRow(uid) {
    setRows(function(prev) { return prev.filter(function(r){return r.user_id!==uid;}); });
  }

  function save() {
    if (!selProjId) { setErr('프로젝트를 선택하세요.'); return; }
    if (rows.length === 0) { setErr('직원이 없습니다.'); return; }
    for (var i=0; i<rows.length; i++) {
      var r = rows[i];
      var v = Number(r.rate);
      if (isNaN(v) || v < 0 || v > 100) { setErr(r.name + '의 기여율은 0~100 사이여야 합니다.'); return; }
    }
    setSaving(true); setErr('');
    var payload = rows.map(function(r) {
      return { project_id: selProjId, user_id: r.user_id, contribution_rate: Number(r.rate), year: year };
    });
    sb.from('performance')
      .upsert(payload, { onConflict: 'project_id,user_id,year' })
      .then(function(res) {
        setSaving(false);
        if (res.error) { setErr('저장 오류: ' + res.error.message); return; }
        onSaved();
      });
  }

  var unselected = users.filter(function(u) { return !rows.find(function(r){return r.user_id===u.id;}); });

  return (
    <div className="mbg" onClick={onClose}>
      <div className="mbox" style={{maxWidth:520}} onClick={function(e){e.stopPropagation();}}>
        <div className="mh">
          <span className="mht">📐 기여율 입력</span>
          <button className="mc" onClick={onClose}>×</button>
        </div>
        <div className="mb">
          {err && <div className="al al-e">{err}</div>}
          <div style={{marginBottom:14}}>
            <label className="fl">프로젝트 *</label>
            <select className="fi" value={selProjId} onChange={function(e){onProjChange(e.target.value);}}>
              <option value="">선택하세요</option>
              {projects.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
            </select>
          </div>

          {loading && <div className="loading">직원 정보 로딩 중...</div>}

          {!loading && selProjId && (
            <>
              <div style={{fontSize:12,color:'#64748b',marginBottom:10}}>
                PM은 기본 100%로 설정됩니다. 기여율을 조정하세요.
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',marginBottom:12}}>
                <thead>
                  <tr style={{background:'#f8fafc'}}>
                    <th style={{padding:'8px 10px',textAlign:'left',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'1px solid #e2e8f0'}}>직원</th>
                    <th style={{padding:'8px 10px',textAlign:'center',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'1px solid #e2e8f0',width:120}}>기여율 (%)</th>
                    <th style={{width:36,borderBottom:'1px solid #e2e8f0'}}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(function(r) {
                    var proj = projects.find(function(p){return p.id===selProjId;});
                    var isPm = proj && proj.pm_id === r.user_id;
                    return (
                      <tr key={r.user_id} style={{borderBottom:'1px solid #f1f5f9'}}>
                        <td style={{padding:'8px 10px',fontSize:13}}>
                          {r.name}
                          {isPm && <span className="badge bp" style={{marginLeft:6,fontSize:10}}>PM</span>}
                          {r.existing && <span style={{fontSize:10,color:'#94a3b8',marginLeft:4}}>기존</span>}
                        </td>
                        <td style={{padding:'4px 10px'}}>
                          <input type="number" min="0" max="100" className="fi"
                            value={r.rate}
                            style={{textAlign:'center',margin:0}}
                            onChange={function(e){updRate(r.user_id, e.target.value);}} />
                        </td>
                        <td style={{padding:'4px 6px'}}>
                          {!isPm && (
                            <button className="btn btn-d btn-sm" onClick={function(){removeRow(r.user_id);}}>✕</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {unselected.length > 0 && (
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <select className="fi" style={{flex:1}} defaultValue=""
                    onChange={function(e){ if(e.target.value){addUser(e.target.value);e.target.value='';} }}>
                    <option value="">+ 직원 추가</option>
                    {unselected.map(function(u){ return <option key={u.id} value={u.id}>{u.name}</option>; })}
                  </select>
                </div>
              )}
            </>
          )}
        </div>
        <div className="mf">
          <button className="btn btn-s" onClick={onClose}>취소</button>
          <button className="btn btn-p" onClick={save} disabled={saving||!selProjId||rows.length===0}>
            {saving?'저장 중...':'저장'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── 실적 관리 ─────────────────────────────────────────────────────────────
// ── 실적 관리 ─────────────────────────────────────────────────────────────
function PerfView({ user }) {
  var [tab, setTab] = useState('col');
  var [projects, setProjects] = useState([]);

  // 하위탭 전환 — pushState
  function changeTab(newTab) {
    history.pushState({ pfTab: newTab }, '', '');
    setTab(newTab);
    setCatFilter('전체');
  }

  // 뒤로가기 감지
  useEffect(function() {
    history.replaceState({ pfTab: 'col' }, '', '');
    function onPop(e) {
      if (e.state && e.state.pfTab) setTab(e.state.pfTab);
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);
  var [users, setUsers] = useState([]);
  var [cols, setCols] = useState([]);
  var [perfs, setPerfs] = useState([]);
  var [contracts, setContracts] = useState([]);
  var [expectedCols, setExpectedCols] = useState([]);
  var [loading, setLoading] = useState(true);
  var [modal, setModal] = useState('');
  var [editItem, setEditItem] = useState(null);
  var [form, setForm] = useState({});
  var [saving, setSaving] = useState(false);
  var [err, setErr] = useState('');
  var [year, setYear] = useState(String(new Date().getFullYear()));

  // ── 탭별 정렬 상태 ──
  var [colSort,  setColSort]  = useState({ col: null, dir: 'asc' });
  var [projSort, setProjSort] = useState({ col: null, dir: 'asc' });
  var [pfSort,   setPfSort]   = useState({ col: null, dir: 'asc' });
  var [ctSort,   setCtSort]   = useState({ col: null, dir: 'asc' });

  // ── 카테고리 필터 ──
  var [catFilter, setCatFilter] = useState('전체');
  var CAT_FILTERS = ['전체','기술지원','관급','사급','감리'];

  function CatFilterBar() {
    return (
      <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
        {CAT_FILTERS.map(function(c) {
          var active = catFilter === c;
          var bg = active ? (c==='전체'?'#1e293b':c==='기술지원'?'#f59e0b':c==='관급'?'#3b82f6':c==='사급'?'#8b5cf6':'#059669') : '#f1f5f9';
          var color = active ? '#fff' : '#64748b';
          return (
            <button key={c} onClick={function(){ setCatFilter(c); }}
              style={{padding:'3px 10px',borderRadius:20,fontSize:11,fontWeight:700,border:'none',cursor:'pointer',
                background:bg,color:color,transition:'all 0.15s'}}>
              {c}
            </button>
          );
        })}
      </div>
    );
  }

  function filterByCat(list, getCat) {
    if (catFilter === '전체') return list;
    return list.filter(function(x){ return getCat(x) === catFilter; });
  }

  function mkSortHandler(state, setter) {
    return function(col) {
      setter(function(prev) {
        if (prev.col === col) return { col: col, dir: prev.dir === 'asc' ? 'desc' : 'asc' };
        return { col: col, dir: 'asc' };
      });
    };
  }

  function sortRows(rows, state, getVal) {
    if (!state.col) return rows;
    return rows.slice().sort(function(a, b) {
      var av = getVal(a, state.col);
      var bv = getVal(b, state.col);
      if (av == null) av = '';
      if (bv == null) bv = '';
      var cmp = typeof av === 'number' && typeof bv === 'number'
        ? av - bv
        : String(av).localeCompare(String(bv), 'ko');
      return state.dir === 'asc' ? cmp : -cmp;
    });
  }

  function SortTh({ label, col, state, onSort, className, style }) {
    var active = state.col === col;
    return (
      <th className={className} style={Object.assign({ cursor:'pointer', userSelect:'none', whiteSpace:'nowrap' }, style||{})}
        onClick={function(){ onSort(col); }}>
        {label}
        <span style={{ marginLeft:4, fontSize:10, color: active ? '#7c3aed' : '#cbd5e1' }}>
          {active ? (state.dir === 'asc' ? '▲' : '▼') : '⇅'}
        </span>
      </th>
    );
  }

  function load() {
    setLoading(true);
    Promise.all([
      sb.from('projects').select('id,name,client,pm_id,status,category,end_date').order('name'),
      sb.from('users').select('id,name').neq('role','contractor').order('name'),
      sb.from('collections').select('*').order('collected_at', { ascending: false }),
      sb.from('performance').select('*'),
      sb.from('contracts').select('*'),
      sb.from('expected_collections').select('*').order('expected_date', { ascending: true }),
    ]).then(function(results) {
      setProjects(results[0].data || []);
      setUsers(results[1].data || []);
      setCols(results[2].data || []);
      setPerfs(results[3].data || []);
      setContracts(results[4].data || []);
      setExpectedCols(results[5].data || []);
      setLoading(false);
    });
  }

  useEffect(function() { load(); }, []);

  function uName(id) { var u = users.find(function(x) { return x.id === id; }); return u ? u.name : '-'; }
  function pName(id) { var p = projects.find(function(x) { return x.id === id; }); return p ? p.name : '-'; }

  var yCols = cols.filter(function(c) { return c.collected_at && c.collected_at.startsWith(year); });
  var totCol = yCols.filter(function(c){ return c.entry_type !== 'outsource_only'; }).reduce(function(s,c) { return s + (c.amount||0); }, 0);
  var totOut = yCols.reduce(function(s,c) { return s + (c.outsource_cost||0); }, 0);
  var totNet = yCols.reduce(function(s,c) { return s + (c.amount||0) - (c.outsource_cost||0); }, 0);

  // 필터 적용 수금액 계산 (요약 박스용)
  var filteredYCols = (function() {
    if (catFilter === '전체') return yCols;
    if (catFilter === '감리') return yCols.filter(function(c){ return c.entry_type === 'supervision'; });
    return yCols.filter(function(c){
      var proj = projects.find(function(p){ return p.id === c.project_id; });
      return proj && proj.category === catFilter;
    });
  })();
  var filtTotCol = filteredYCols.filter(function(c){ return c.entry_type !== 'outsource_only'; }).reduce(function(s,c){ return s+(c.amount||0); }, 0);
  var filtTotOut = filteredYCols.reduce(function(s,c){ return s+(c.outsource_cost||0); }, 0);
  var filtTotNet = filteredYCols.reduce(function(s,c){ return s+(c.amount||0)-(c.outsource_cost||0); }, 0);

  // 일반 프로젝트 실적
  var projSummary = projects.map(function(p) {
    var pc = yCols.filter(function(c) { return c.project_id === p.id; });
    var tc = pc.reduce(function(s,c) { return s + (c.amount||0); }, 0);
    var to = pc.reduce(function(s,c) { return s + (c.outsource_cost||0); }, 0);
    return { id:p.id, name:p.name, client:p.client, pm_id:p.pm_id, category:p.category, tc:tc, to:to, net:tc-to };
  }).filter(function(p) { return p.tc > 0; }).sort(function(a,b) { return b.net - a.net; });

  // 감리 실적 집계 (project_id=NULL, entry_type='supervision')
  var supvCols = yCols.filter(function(c){ return c.entry_type === 'supervision'; });
  var supvByName = supvCols.reduce(function(acc, c) {
    var parsed = (typeof parseSupvMemo === 'function') ? parseSupvMemo(c.memo) : { name: c.memo||'', client:'', note:'' };
    var key = parsed.name || c.memo || '(감리)';
    if (!acc[key]) acc[key] = { name:key, client:parsed.client, tc:0, to:0 };
    acc[key].tc += (c.amount||0);
    return acc;
  }, {});
  var supvSummary = Object.values(supvByName).map(function(s){
    return { id:'supv_'+s.name, name:s.name, client:s.client, pm_id:null, category:'감리', tc:s.tc, to:0, net:s.tc };
  }).sort(function(a,b){ return b.net - a.net; });

  // 프로젝트별 + 감리 합산
  var allProjSummary = projSummary.concat(supvSummary);

  // PM 자동 100% 포함한 유효 기여율 목록 생성
  var effectivePerfs = (function() {
    var result = perfs.slice();
    projects.forEach(function(proj) {
      if (!proj.pm_id) return;
      var hasEntry = perfs.some(function(pf) {
        return pf.project_id === proj.id && pf.user_id === proj.pm_id && pf.year === Number(year);
      });
      var hasCols = yCols.some(function(c) { return c.project_id === proj.id; });
      if (!hasEntry && hasCols) {
        result.push({ project_id: proj.id, user_id: proj.pm_id, contribution_rate: 100, year: Number(year), _auto: true });
      }
    });
    return result;
  })();

  var userSummary = users.map(function(u) {
    var myP = effectivePerfs.filter(function(p) { return p.user_id === u.id && p.year === Number(year); });
    var total = myP.reduce(function(s, pf) {
      var net = yCols.filter(function(c) { return c.project_id === pf.project_id; })
        .reduce(function(a,c) { return a + (c.amount||0) - (c.outsource_cost||0); }, 0);
      return s + net * (pf.contribution_rate||0) / 100;
    }, 0);
    return { id:u.id, name:u.name, total:total, cnt:myP.length };
  }).filter(function(u) { return u.total > 0; }).sort(function(a,b) { return b.total - a.total; });

  var maxPerf = userSummary.length > 0 ? userSummary[0].total : 1;

  function numV(v) { return Number(String(v||0).replace(/,/g,'')) || 0; }

  function onAmountChange(key, e) {
    var raw = e.target.value.replace(/[^0-9]/g,'');
    var fmt = raw ? Number(raw).toLocaleString('ko-KR') : '';
    setForm(function(p) { var o = Object.assign({}, p); o[key] = fmt; return o; });
  }

  function deleteCol(id) {
    if (!window.confirm('이 수금 내역을 삭제하시겠습니까?')) return;
    sb.from('collections').delete().eq('id', id).then(function(r) {
      if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
      load();
    });
  }

  function deletePerf(pf) {
    if (!window.confirm('이 기여율을 삭제하시겠습니까?')) return;
    sb.from('performance').delete()
      .eq('project_id', pf.project_id).eq('user_id', pf.user_id).eq('year', pf.year)
      .then(function(r) {
        if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
        load();
      });
  }

  // 감리 memo 파싱: "프로젝트명|발주처|메모" 형식
  function parseSupvMemo(memo) {
    if (!memo) return { name:'', client:'', note:'' };
    var parts = memo.split('|');
    return { name: parts[0]||'', client: parts[1]||'', note: parts[2]||'' };
  }
  function buildSupvMemo(name, client, note) {
    // 뒤쪽 빈값 trim
    var arr = [name||'', client||'', note||''];
    while (arr.length > 1 && !arr[arr.length-1]) arr.pop();
    return arr.join('|');
  }

  function saveCol() {
    var isOut  = form.entry_type === 'outsource_only';
    var isSupv = form.entry_type === 'supervision';
    if (isSupv) {
      if (!form.supv_name || !form.supv_name.trim()) { setErr('감리 프로젝트명을 입력해주세요.'); return; }
      if (!form.collected_at) { setErr('수금일을 입력해주세요.'); return; }
      if (!form.amount) { setErr('수금액을 입력해주세요.'); return; }
    } else {
      if (!form.project_id || !form.collected_at) { setErr('프로젝트와 날짜는 필수입니다.'); return; }
      if (!isOut && !form.amount) { setErr('수금액을 입력해주세요.'); return; }
      if (isOut && !form.outsource_cost) { setErr('외주비를 입력해주세요.'); return; }
    }
    setSaving(true); setErr('');
    var payload = {
      project_id: isSupv ? null : form.project_id,
      amount: isOut ? 0 : numV(form.amount),
      outsource_cost: isSupv ? 0 : numV(form.outsource_cost),
      collected_at: form.collected_at,
      memo: isSupv ? buildSupvMemo(form.supv_name, form.supv_client, form.supv_note) : (form.memo || ''),
      entry_type: form.entry_type || 'both',
    };
    var isNew = !editItem;
    var colYear = Number(form.collected_at.slice(0, 4));
    var p = isNew
      ? sb.from('collections').insert(payload)
      : sb.from('collections').update(payload).eq('id', editItem.id);
    p.then(function(r) {
      setSaving(false);
      if (r.error) { setErr('저장 오류: ' + r.error.message); return; }

      // ── 최초 등록 시만 PM 기여율 100% 자동 등록 후 기여율 탭으로 이동 ──
      if (isNew) {
        var proj = projects.find(function(p) { return p.id === form.project_id; });
        if (proj && proj.pm_id) {
          sb.from('performance')
            .select('id')
            .eq('project_id', form.project_id)
            .eq('user_id', proj.pm_id)
            .eq('year', colYear)
            .then(function(chk) {
              if (!chk.data || chk.data.length === 0) {
                sb.from('performance').insert({
                  project_id: form.project_id,
                  user_id: proj.pm_id,
                  contribution_rate: 100,
                  year: colYear,
                }).then(function() {
                  setModal(''); setEditItem(null); setForm({});
                  load();
                });
              } else {
                setModal(''); setEditItem(null); setForm({});
                load();
              }
            });
        } else {
          setModal(''); setEditItem(null); setForm({});
          load();
        }
      } else {
        setModal(''); setEditItem(null); setForm({});
        load();
      }
    });
  }

  if (loading) return <div className="page"><div className="loading">로딩 중...</div></div>;

  return (
    <div className="page">
      <div className="ph" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="pt">📊 실적 관리</div>
          <div className="ps">수금 내역 및 직원별 성과급 기초 데이터</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <label className="fl" style={{margin:0}}>연도</label>
          <select className="fi" value={year} onChange={function(e) { setYear(e.target.value); }} style={{width:100}}>

                </div>
              ) : (
                <div>
                  <div style={{marginBottom:12}}>
                    <label className="fl">프로젝트 *</label>
                    <select className="fi" value={form.project_id||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{project_id:e.target.value});});}}>
                      <option value="">선택하세요</option>
                      {projects.map(function(p) { return <option key={p.id} value={p.id}>{p.name}</option>; })}
                    </select>
                  </div>
                  <div className="g2">
                    <div>
                      <label className="fl">{form.entry_type==='outsource_only' ? '외주비 발생일 *' : '수금일 *'}</label>
                      <input type="date" className="fi" value={form.collected_at||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{collected_at:e.target.value});});}} />
                    </div>
                    {form.entry_type !== 'outsource_only' && (
                      <div>
                        <label className="fl">수금액 (원) *</label>
                        <input className="fi" value={form.amount||''} placeholder="0" style={{textAlign:'right'}}
                          onChange={function(e){onAmountChange('amount',e);}} />
                      </div>
                    )}
                  </div>
                  <div className="g2">
                    <div>
                      <label className="fl">외주비 (원) {form.entry_type==='outsource_only'?'*':''}</label>
                      <input className="fi" value={form.outsource_cost||''} placeholder="0" style={{textAlign:'right'}}
                        onChange={function(e){onAmountChange('outsource_cost',e);}} />
                    </div>
                    <div>
                      <label className="fl">메모</label>
                      <input className="fi" value={form.memo||''} placeholder="계약금, 중도금, 외주처 등" onChange={function(e){setForm(function(p){return Object.assign({},p,{memo:e.target.value});});}} />
                    </div>
                  </div>
                </div>
              )}

              {(numV(form.amount) > 0 || numV(form.outsource_cost) > 0) && (
                <div style={{marginTop:12,padding:'10px 14px',background:'#f8fafc',borderRadius:8,fontSize:13}}>
                  {form.entry_type !== 'outsource_only' && (
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{color:'#64748b'}}>수금액</span>
                      <span style={{color:'#1d4ed8',fontWeight:700}}>{fmtN(numV(form.amount))}원</span>
                    </div>
                  )}
                  {form.entry_type !== 'supervision' && numV(form.outsource_cost) > 0 && (
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                      <span style={{color:'#64748b'}}>외주비</span>
                      <span style={{color:'#dc2626',fontWeight:700}}>-{fmtN(numV(form.outsource_cost))}원</span>
                    </div>
                  )}
                  {form.entry_type !== 'supervision' && (
                    <div style={{display:'flex',justifyContent:'space-between',borderTop:'1px solid #e2e8f0',paddingTop:4}}>
                      <span style={{fontWeight:700}}>순 실적</span>
                      <span style={{fontWeight:800,color: numV(form.amount)-numV(form.outsource_cost) < 0 ? '#dc2626':'#7c3aed'}}>
                        {fmtN(numV(form.amount)-numV(form.outsource_cost))}원
                      </span>
                    </div>
                  )}
                </div>
              )}
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setModal('');}}>취소</button>
              <button className="btn btn-p" onClick={saveCol} disabled={saving}>{saving?'저장 중...':'저장'}</button>
            </div>
          </div>
        </div>
      )}

      {/* ── 계약/잔금 탭 ── */}
      {tab === 'contract' && (function() {
        var activeProjects = projects.filter(function(p) { return p.status !== '완료'; });
        var allProjects = projects;

        function getContract(pid) { return contracts.find(function(c){ return c.project_id === pid; }); }
        function getTotalCol(pid) {
          return cols.filter(function(c){ return c.project_id === pid; })
            .reduce(function(s,c){ return s + (c.amount||0); }, 0);
        }
        function getTotalOut(pid) {
          return cols.filter(function(c){ return c.project_id === pid; })
            .reduce(function(s,c){ return s + (c.outsource_cost||0); }, 0);
        }

        var rows = sortRows(allProjects
          .filter(function(p){ return getContract(p.id) || p.status !== '완료'; })
          .map(function(p){
            var ct = getContract(p.id);
            var contractAmt = ct ? (ct.amount||0) : 0;
            var totalCol = getTotalCol(p.id);
            var totalOut = getTotalOut(p.id);
            var netCol   = totalCol - totalOut;
            var remain   = contractAmt - netCol;
            var pct      = contractAmt > 0 ? Math.min(100, Math.round(netCol / contractAmt * 100)) : 0;
            return { p:p, ct:ct, contractAmt:contractAmt, netCol:netCol, remain:remain, pct:pct, startDate:ct?ct.start_date:null };
          })
          .sort(function(a,b){
            var catOrd = function(c){ return c==='사급'?0:c==='관급'?1:2; };
            return catOrd(a.p.category) - catOrd(b.p.category) || a.p.name.localeCompare(b.p.name, 'ko');
          }), ctSort, function(r, col) {
            if (col==='name')      return r.p.name;
            if (col==='startDate') return r.startDate||'';
            if (col==='status')    return r.p.status;
            if (col==='contract')  return r.contractAmt;
            if (col==='netCol')    return r.netCol;
            if (col==='remain')    return r.remain;
            if (col==='pct')       return r.pct;
            return '';
          });

        var totalContract = rows.reduce(function(s,r){ return s + r.contractAmt; }, 0);
        var totalNetCol   = rows.reduce(function(s,r){ return s + r.netCol; }, 0);
        var totalRemain   = rows.reduce(function(s,r){ return s + r.remain; }, 0);

        return (
          <div className="card">
            <div className="sh">
              <span className="st">계약/잔금 현황</span>
              <span style={{fontSize:12,color:'#94a3b8'}}>계약금액 클릭 시 입력/수정</span>
            </div>
            {/* 요약 */}
            <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#eff6ff',border:'1px solid #bfdbfe',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#1d4ed8',whiteSpace:'nowrap'}}>총 계약금액</span>
                <span style={{fontSize:13,fontWeight:800,color:'#1d4ed8',whiteSpace:'nowrap'}}>{fmtN(totalContract)}원</span>
              </div>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#f0fdf4',border:'1px solid #bbf7d0',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#15803d',whiteSpace:'nowrap'}}>누적 순수금</span>
                <span style={{fontSize:13,fontWeight:800,color:'#15803d',whiteSpace:'nowrap'}}>{fmtN(totalNetCol)}원</span>
              </div>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#f5f3ff',border:'1px solid #ddd6fe',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#7c3aed',whiteSpace:'nowrap'}}>총 잔금</span>
                <span style={{fontSize:13,fontWeight:800,color:'#7c3aed',whiteSpace:'nowrap'}}>{fmtN(totalRemain)}원</span>
              </div>
            </div>
            <div className="tbl-wrap">
              <CatFilterBar />
              <table>
                <thead>
                  <tr>
                    <SortTh label="용역명"   col="name"      state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} />
                    <SortTh label="착수일"   col="startDate" state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} />
                    <SortTh label="상태"     col="status"    state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} />
                    <SortTh label="계약금액" col="contract"  state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} className="tr" />
                    <SortTh label="순 수금액" col="netCol"   state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} className="tr" />
                    <SortTh label="잔금"     col="remain"    state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} className="tr" />
                    <SortTh label="수금률"   col="pct"       state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} style={{width:90}} />
                  </tr>
                </thead>
                <tbody>
                  {filterByCat(rows, function(r){ return r.p.category; }).map(function(r) {
                    var p = r.p;
                    var isCompleted = p.status === '완료';
                    return (
                      <tr key={p.id} style={{opacity: isCompleted ? 0.6 : 1, background: isCompleted ? '#fafafa' : ''}}>
                        <td>
                          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                            {p.category && (
                              <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                background:CAT_BG[p.category]||'#f1f5f9',color:CAT_TX[p.category]||'#475569',
                                border:'1px solid '+(CAT_COLOR[p.category]||'#e2e8f0')}}>{p.category}</span>
                            )}
                            <span style={{display:'flex',flexDirection:'column',gap:1}}>
                              {p.client && <span style={{fontSize:'80%',color:'#94a3b8',fontWeight:500,lineHeight:1.2}}>{p.client}</span>}
                              <span style={{fontWeight:600,fontSize:13}}>{p.name}</span>
                            </span>
                          </div>
                        </td>
                        <td style={{fontSize:12,color:'#475569',whiteSpace:'nowrap'}}>{r.startDate ? fmtD(r.startDate) : <span style={{color:'#cbd5e1'}}>—</span>}</td>
                        <td>
                          <span className={p.status==='완료'?'badge bg':p.status==='중지'?'badge ba':'badge bb'}
                            style={{fontSize:10}}>{p.status}</span>
                        </td>
                        <td className="tr">
                          <span style={{fontWeight:700,color:'#1d4ed8',cursor:'pointer',textDecoration:'underline',textUnderlineOffset:2}}
                            onClick={function(){
                              setEditItem(r.ct || {project_id:p.id});
                              setForm({project_id:p.id, amount:r.ct?fmtN(r.ct.amount):'', memo:r.ct?r.ct.memo:'', start_date:r.ct?r.ct.start_date:''});
                              setModal('contract');
                            }}>
                            {r.contractAmt > 0 ? fmtN(r.contractAmt)+'원' : '+ 입력'}
                          </span>
                        </td>
                        <td className="tr" style={{color:'#059669',fontWeight:600}}>{fmtN(r.netCol)}원</td>
                        <td className="tr" style={{fontWeight:700,color:r.remain<0?'#dc2626':r.remain===0?'#94a3b8':'#7c3aed'}}>
                          {r.remain < 0 ? '초과 '+fmtN(Math.abs(r.remain)) : fmtN(r.remain)}원
                        </td>
                        <td>
                          {r.contractAmt > 0 ? (
                            <div style={{display:'flex',alignItems:'center',gap:6}}>
                              <div style={{flex:1,height:6,background:'#e2e8f0',borderRadius:3,overflow:'hidden'}}>
                                <div style={{width:r.pct+'%',height:'100%',background:r.pct>=100?'#059669':'#7c3aed',borderRadius:3}}></div>
                              </div>
                              <span style={{fontSize:11,fontWeight:700,color:r.pct>=100?'#059669':'#7c3aed',minWidth:28}}>{r.pct}%</span>
                            </div>
                          ) : <span style={{color:'#cbd5e1',fontSize:12}}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        );
      })()}

      {/* ── 예상수금 탭 ── */}
      {tab === 'expected' && (function() {
        var today = TODAY();
        var upcoming = expectedCols.filter(function(e){ return !e.is_done; })
          .sort(function(a,b){ return a.expected_date.localeCompare(b.expected_date); });
        var done = expectedCols.filter(function(e){ return e.is_done; })
          .sort(function(a,b){ return b.expected_date.localeCompare(a.expected_date); });
        var totalUpcoming = upcoming.reduce(function(s,e){ return s + (e.amount||0); }, 0);
        var overdueList = upcoming.filter(function(e){ return e.expected_date < today; });
        var overdueAmt  = overdueList.reduce(function(s,e){ return s + (e.amount||0); }, 0);

        // 용역 종료일 기반 자동 잔금 예상
        var autoExpected = projects
          .filter(function(p){ return p.end_date && p.status !== '완료' && p.status !== '중지'; })
          .map(function(p){
            var ct = contracts.find(function(c){ return c.project_id === p.id; });
            if (!ct || !ct.amount) return null;
            var totalCol = cols.filter(function(c){ return c.project_id === p.id; })
              .reduce(function(s,c){ return s+(c.amount||0); }, 0);
            var totalOut = cols.filter(function(c){ return c.project_id === p.id; })
              .reduce(function(s,c){ return s+(c.outsource_cost||0); }, 0);
            var remain = ct.amount - (totalCol - totalOut);
            if (remain <= 0) return null;
            return { p:p, remain:remain, endDate:p.end_date, isPast: p.end_date < today };
          })
          .filter(Boolean)
          .sort(function(a,b){ return a.endDate.localeCompare(b.endDate); });
        var autoTotal = autoExpected.reduce(function(s,r){ return s+r.remain; }, 0);

        function markDone(e) {
          if (!window.confirm('수금 완료로 처리하시겠습니까?')) return;
          sb.from('expected_collections').update({is_done:true, updated_at:new Date().toISOString()})
            .eq('id', e.id).then(function(r){ if (!r.error) load(); });
        }
        function markUndo(e) {
          sb.from('expected_collections').update({is_done:false, updated_at:new Date().toISOString()})
            .eq('id', e.id).then(function(r){ if (!r.error) load(); });
        }
        function deleteExp(id) {
          if (!window.confirm('삭제하시겠습니까?')) return;
          sb.from('expected_collections').delete().eq('id', id).then(function(r){ if (!r.error) load(); });
        }

        return (
          <div className="card">
            <div className="sh">
              <span className="st">예상수금 일정</span>
              <button className="btn btn-p btn-sm" onClick={function(){
                setEditItem(null);
                setForm({expected_date:TODAY(), is_done:false});
                setModal('expected');
              }}>+ 예상수금 입력</button>
            </div>

            {/* 요약 카드 */}
            <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#eff6ff',border:'1px solid #bfdbfe',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#1d4ed8',whiteSpace:'nowrap'}}>예상 수금 합계</span>
                <span style={{fontSize:13,fontWeight:800,color:'#1d4ed8',whiteSpace:'nowrap'}}>{fmtN(totalUpcoming)}원</span>
              </div>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#fff5f5',border:'1px solid #fecaca',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#dc2626',whiteSpace:'nowrap'}}>연체 금액</span>
                <span style={{fontSize:13,fontWeight:800,color:'#dc2626',whiteSpace:'nowrap'}}>{fmtN(overdueAmt)}원 <span style={{fontSize:10,fontWeight:500}}>({overdueList.length}건)</span></span>
              </div>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#f0fdf4',border:'1px solid #bbf7d0',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#15803d',whiteSpace:'nowrap'}}>수금완료</span>
                <span style={{fontSize:13,fontWeight:800,color:'#15803d',whiteSpace:'nowrap'}}>{done.length}건</span>
              </div>
            </div>

            {/* 용역 종료일 기반 자동 잔금 예상 */}
            {autoExpected.length > 0 && (
              <div style={{marginBottom:20}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <span className="st">📅 용역 종료일 기준 예상 잔금 ({autoExpected.length}건)</span>
                  <span style={{fontSize:11,color:'#94a3b8'}}>계약금액 - 누적순수금</span>
                  <span style={{marginLeft:'auto',fontSize:13,fontWeight:800,color:'#7c3aed'}}>{fmtN(autoTotal)}원</span>
                </div>
                <div className="tbl-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>용역명</th>
                        <th>종료일</th>
                        <th>D-day</th>
                        <th className="tr">예상 잔금</th>
                        <th className="tr">수금률</th>
                      </tr>
                    </thead>
                    <tbody>
                      {autoExpected.map(function(r) {
                        var daysLeft = Math.round((new Date(r.endDate+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
                        var ct = contracts.find(function(c){ return c.project_id === r.p.id; });
                        var totalCol = cols.filter(function(c){ return c.project_id === r.p.id; })
                          .reduce(function(s,c){ return s+(c.amount||0); }, 0);
                        var totalOut = cols.filter(function(c){ return c.project_id === r.p.id; })
                          .reduce(function(s,c){ return s+(c.outsource_cost||0); }, 0);
                        var netCol = totalCol - totalOut;
                        var pct = ct && ct.amount > 0 ? Math.min(100, Math.round(netCol / ct.amount * 100)) : 0;
                        return (
                          <tr key={r.p.id} style={{background: r.isPast ? '#fff5f5' : ''}}>
                            <td>
                              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                                {r.p.category && (
                                  <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                    background:CAT_BG[r.p.category]||'#f1f5f9',color:CAT_TX[r.p.category]||'#475569',
                                    border:'1px solid '+(CAT_COLOR[r.p.category]||'#e2e8f0')}}>{r.p.category}</span>
                                )}
                                <span style={{display:'flex',flexDirection:'column',gap:1}}>
                                  {r.p.client && <span style={{fontSize:'80%',color:'#94a3b8',fontWeight:500,lineHeight:1.2}}>{r.p.client}</span>}
                                  <span style={{fontWeight:600}}>{r.p.name}</span>
                                </span>
                              </div>
                            </td>
                            <td style={{whiteSpace:'nowrap',color: r.isPast?'#dc2626':'#475569',fontWeight: r.isPast?700:400}}>
                              {fmtD(r.endDate)}{r.isPast && <span style={{fontSize:10,marginLeft:4}}>⚠ 종료</span>}
                            </td>
                            <td style={{whiteSpace:'nowrap',fontSize:12,color: r.isPast?'#dc2626':daysLeft<=30?'#f59e0b':'#64748b',fontWeight:600}}>
                              {r.isPast ? '+'+Math.abs(daysLeft)+'일 경과' : 'D-'+daysLeft}
                            </td>
                            <td className="tr" style={{fontWeight:800,color:'#7c3aed'}}>{fmtN(r.remain)}원</td>
                            <td className="tr">
                              <div style={{display:'flex',alignItems:'center',gap:6,justifyContent:'flex-end'}}>
                                <div style={{width:50,height:5,background:'#e2e8f0',borderRadius:3,overflow:'hidden'}}>
                                  <div style={{width:pct+'%',height:'100%',background:pct>=100?'#059669':'#7c3aed',borderRadius:3}}></div>
                                </div>
                                <span style={{fontSize:11,fontWeight:700,color:pct>=100?'#059669':'#7c3aed',minWidth:28}}>{pct}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 수동 입력 미수금 목록 */}
            {upcoming.length > 0 && (
              <div style={{marginBottom:20}}>
                <div className="st" style={{marginBottom:8}}>📋 예정 수금 ({upcoming.length}건)</div>
                <div className="tbl-wrap">
                  <table>
                    <thead>
                      <tr><th>용역명</th><th>예상 수금일</th><th className="tr">예상 금액</th><th>메모</th><th></th></tr>
                    </thead>
                    <tbody>
                      {upcoming.map(function(e) {
                        var p = projects.find(function(x){ return x.id === e.project_id; });
                        var isOverdue = e.expected_date < today;
                        var daysLeft = Math.round((new Date(e.expected_date+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
                        return (
                          <tr key={e.id} style={{background: isOverdue ? '#fff5f5' : ''}}>
                            <td>
                              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                                {p && p.category && (
                                  <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                    background:CAT_BG[p.category]||'#f1f5f9',color:CAT_TX[p.category]||'#475569',
                                    border:'1px solid '+(CAT_COLOR[p.category]||'#e2e8f0')}}>{p.category}</span>
                                )}
                                <span style={{fontWeight:600,fontSize:13}}>{p ? p.name : '-'}</span>
                              </div>
                            </td>
                            <td>
                              <div style={{fontWeight:600,color: isOverdue?'#dc2626':'#0f172a'}}>{fmtD(e.expected_date)}</div>
                              <div style={{fontSize:11,color: isOverdue?'#dc2626':'#94a3b8'}}>
                                {isOverdue ? '⚠ '+Math.abs(daysLeft)+'일 초과' : 'D-'+daysLeft}
                              </div>
                            </td>
                            <td className="tr" style={{fontWeight:700,color:'#7c3aed'}}>{fmtN(e.amount)}원</td>
                            <td style={{color:'#64748b',fontSize:12}}>{e.memo||'-'}</td>
                            <td style={{display:'flex',gap:4}}>
                              <button className="btn btn-s btn-sm" onClick={function(){
                                setEditItem(e);
