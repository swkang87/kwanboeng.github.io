// ── 직원 관리 ─────────────────────────────────────────────────────────────
function StaffView({ user }) {
  const [users, setUsers] = useState([]);
  const [teams, setTeams] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [editU, setEditU] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [q, setQ] = useState('');
  const [sortBy, setSortBy] = useState('team');
  const [sortDir, setSortDir] = useState(1);
  const [delConfirm, setDelConfirm] = useState(null); // 삭제 확인용 user

  var ROLE_ORDER = {admin:0, manager:1, employee:2, staff:2, contractor:3};

  function load() {
    setLoading(true);
    Promise.all([
      sb.from('users').select('*').order('name'),
      sb.from('teams').select('*').order('name'),
    ]).then(function(r) {
      setUsers(r[0].data||[]);
      setTeams(r[1].data||[]);
      setLoading(false);
    });
  }

  useEffect(function() { load(); }, []);

  const TEAM_ORDER = {'관리팀':0,'설계1팀':1,'설계2팀':2,'지반팀':3,'기술지원':4};
  const ROLE_ORDER2 = {admin:0, manager:1, employee:2, staff:2, contractor:3};

  function tName(u) {
    if (u.role === 'contractor') return '기술지원';
    var t = teams.find(function(x){return x.id===u.team_id;});
    return t ? t.name : '-';
  }
  function roleL(r) { return ({admin:'관리자',manager:'팀장',staff:'팀원',employee:'팀원',contractor:'기술지원'})[r]||r; }
  function roleCls(r) { return ({admin:'bp',manager:'bb',staff:'bg',employee:'bg',contractor:'ba'})[r]||'bgr'; }

  function openEdit(u) {
    setEditU(u);
    setForm({name:u.name,phone:u.phone,email:u.email||'',position:u.position||'',team_id:u.team_id||'',role:u.role,memo:u.memo||''});
    setErr(''); setModal(true);
  }
  function openNew() {
    setEditU(null);
    setForm({name:'',phone:'',email:'',position:'',team_id:'',role:'staff',memo:''});
    setErr(''); setModal(true);
  }

  async function save() {
    if (!form.name||!form.phone) { setErr('이름과 전화번호는 필수입니다.'); return; }
    setSaving(true); setErr('');
    try {
      // memo는 users 테이블에 없는 컬럼이므로 제외
      var { memo: _memo, ...formWithoutMemo } = form;
      var p;
      if (editU) {
        p = sb.from('users').update(formWithoutMemo).eq('id', editU.id);
      } else {
        var hashedPw = await hashPassword(form.phone);
        p = sb.from('users').insert(Object.assign({}, formWithoutMemo, {password: hashedPw}));
      }
      var r = await p;
      setSaving(false);
      if (r.error) { setErr('저장 오류: ' + r.error.message); return; }
      setModal(false); load();
    } catch (e) {
      setSaving(false);
      setErr('저장 중 오류가 발생했습니다.');
    }
  }

  var filtered = users.filter(function(u) { return (u.name||'').includes(q)||(u.phone||'').includes(q); });

  function handleSort(key) {
    if (sortBy === key) setSortDir(function(d){return d*-1;});
    else { setSortBy(key); setSortDir(1); }
  }
  function sortIcon(key) { return sortBy===key ? (sortDir===1?' ▲':' ▼') : ' ↕'; }

  filtered = filtered.slice().sort(function(a, b) {
    var av, bv, tc;
    if (sortBy === 'role') {
      av = ROLE_ORDER2[a.role] ?? 9;
      bv = ROLE_ORDER2[b.role] ?? 9;
      if (av !== bv) return (av - bv) * sortDir;
      return (a.name||'').localeCompare(b.name||'', 'ko');
    }
    if (sortBy === 'name') {
      return (a.name||'').localeCompare(b.name||'', 'ko') * sortDir;
    }
    if (sortBy === 'team') {
      av = tName(a); bv = tName(b);
      var ta = TEAM_ORDER[av] ?? 9, tb = TEAM_ORDER[bv] ?? 9;
      tc = (ta - tb) * sortDir;
      return tc !== 0 ? tc : (a.name||'').localeCompare(b.name||'', 'ko');
    }
    if (sortBy === 'position') {
      av = a.position||''; bv = b.position||'';
      tc = av.localeCompare(bv, 'ko') * sortDir;
      return tc !== 0 ? tc : (a.name||'').localeCompare(b.name||'', 'ko');
    }
    return 0;
  });

  function deleteUser(u) {
    if (delConfirm && delConfirm.id === u.id) {
      sb.from('users').delete().eq('id', u.id).then(function() { setDelConfirm(null); load(); });
    } else {
      setDelConfirm(u);
      setTimeout(function() { setDelConfirm(null); }, 3000);
    }
  }

  if (loading) return <div className="page"><div className="loading">로딩 중...</div></div>;

  return (
    <div className="page">
      <div className="ph"><div className="pt">👥 직원 관리</div><div className="ps">전체 직원 정보 조회 및 관리</div></div>
      <div className="card">
        <div className="sh">
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input className="fi" value={q} onChange={function(e){setQ(e.target.value);}} placeholder="이름 또는 전화번호 검색" style={{width:220}} />
            <span style={{fontSize:12,color:'#94a3b8'}}>총 {filtered.length}명</span>
          </div>
          {user.role === 'admin' && <button className="btn btn-p btn-sm" onClick={openNew}>+ 직원 등록</button>}
        </div>
        <div className="tbl-wrap">
          <table>
            <thead><tr>
              <th style={{cursor:'pointer',userSelect:'none'}} onClick={function(){handleSort('name');}}>이름{sortIcon('name')}</th>
              <th style={{cursor:'pointer',userSelect:'none'}} onClick={function(){handleSort('team');}}>팀{sortIcon('team')}</th>
              <th style={{cursor:'pointer',userSelect:'none'}} onClick={function(){handleSort('position');}}>직책{sortIcon('position')}</th>
              <th style={{cursor:'pointer',userSelect:'none'}} onClick={function(){handleSort('role');}}>역할{sortIcon('role')}</th>
              <th>전화번호</th><th>이메일</th>{user.role==='admin'&&<th className="tc">관리</th>}
            </tr></thead>
            <tbody>
              {filtered.map(function(u) {
                return (
                  <tr key={u.id}>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:'#1e293b',color:'#fff',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{u.name ? u.name[0] : ''}</div>
                        <span style={{fontWeight:600}}>{u.name}</span>
                      </div>
                    </td>
                    <td>{tName(u)}</td>
                    <td style={{color:'#475569'}}>{u.position||'-'}</td>
                    <td><span className={'badge ' + roleCls(u.role)}>{roleL(u.role)}</span></td>
                    <td style={{color:'#64748b'}}>{u.phone}</td>
                    <td style={{color:'#64748b',fontSize:12}}>{u.email||'-'}</td>
                    {user.role==='admin'&&<td className="tc" style={{whiteSpace:'nowrap'}}>
                      <button className="btn btn-s btn-sm" onClick={function(){openEdit(u);}}>수정</button>
                      {' '}
                      <button className="btn btn-sm" onClick={function(){deleteUser(u);}}
                        style={{background: delConfirm&&delConfirm.id===u.id ? '#ef4444':'transparent', color: delConfirm&&delConfirm.id===u.id ? '#fff':'#ef4444', border:'1px solid #ef4444', borderRadius:4, padding:'3px 8px', fontSize:11, cursor:'pointer', fontFamily:"'Noto Sans KR',sans-serif", fontWeight:600}}>
                        {delConfirm&&delConfirm.id===u.id ? '확인(삭제)' : '삭제'}
                      </button>
                    </td>}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
      {modal && (
        <div className="mbg" onClick={function(){setModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}}>
            <div className="mh"><span className="mht">{editU?'직원 정보 수정':'직원 등록'}</span><button className="mc" onClick={function(){setModal(false);}}>×</button></div>
            <div className="mb">
              {err && <div className="al al-e">{err}</div>}
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">이름 *</label><input className="fi" value={form.name||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{name:e.target.value});});}} /></div>
                <div><label className="fl">전화번호 *</label><input className="fi" value={form.phone||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{phone:e.target.value});});}} /></div>
              </div>
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">팀</label>
                  <select className="fi" value={form.team_id||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{team_id:e.target.value});});}}>
                    <option value="">선택</option>
                    {teams.map(function(t){return <option key={t.id} value={t.id}>{t.name}</option>;})}
                  </select>
                </div>
                <div><label className="fl">직책</label><input className="fi" value={form.position||''} placeholder="실장, 팀장 등" onChange={function(e){setForm(function(p){return Object.assign({},p,{position:e.target.value});});}} /></div>
              </div>
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">역할</label>
                  <select className="fi" value={form.role||'staff'} onChange={function(e){setForm(function(p){return Object.assign({},p,{role:e.target.value});});}}>
                    <option value="staff">팀원</option><option value="manager">팀장</option>
                    <option value="admin">관리자</option><option value="contractor">기술지원</option>
                  </select>
                </div>
                <div><label className="fl">이메일</label><input className="fi" type="email" value={form.email||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{email:e.target.value});});}} /></div>
              </div>
              {!editU && <div className="al al-i" style={{fontSize:12}}>초기 비밀번호는 전화번호로 설정됩니다.</div>}
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setModal(false);}}>취소</button>
              <button className="btn btn-p" onClick={save} disabled={saving}>{saving?'저장 중...':'저장'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── 로그인 ────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);

  async function doLogin() {
    if (!phone.trim()||!pw) { setErr('아이디와 비밀번호를 입력하세요.'); return; }
    setLoading(true); setErr('');
    try {
      const r = await sb.from('users').select('*').eq('phone', phone.trim()).single();
      if (r.error||!r.data) { setErr('아이디 또는 비밀번호가 올바르지 않습니다.'); setLoading(false); return; }
      const ok = await verifyPassword(pw, r.data.password);
      if (!ok) { setErr('아이디 또는 비밀번호가 올바르지 않습니다.'); setLoading(false); return; }
      // Lazy migration: 평문이면 해시로 업그레이드
      if (isPlainPassword(r.data.password)) {
        try {
          const h = await hashPassword(pw);
          const tmpSb = _makeSb(r.data.id, r.data.role);
          await tmpSb.from('users').update({ password: h }).eq('id', r.data.id);
        } catch (e) { console.error('pw migration failed', e); }
      }
      setLoading(false);
      onLogin(r.data);
    } catch (e) {
      setLoading(false);
      setErr('로그인 중 오류가 발생했습니다.');
    }
  }

  return (
    <div className="lwrap">
      <div className="lbox">
        <div className="llogo">🏢</div>
        <div className="ltit">{APP_CONFIG.COMPANY_SHORT}</div>
        <div className="lsub">관리포털 · 관리팀/관리자 전용</div>
        {err && <div className="al al-e">{err}</div>}
        <div style={{marginBottom:12}}>
          <label className="fl">아이디 (전화번호)</label>
          <input className="fi" value={phone} placeholder="전화번호 입력" onChange={function(e){setPhone(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')document.getElementById('ap-pw').focus();}} />
        </div>
        <div style={{marginBottom:20}}>
          <label className="fl">비밀번호</label>
          <input id="ap-pw" type="password" className="fi" value={pw} placeholder="비밀번호 입력" onChange={function(e){setPw(e.target.value);}} onKeyDown={function(e){if(e.key==='Enter')doLogin();}} />
        </div>
        <button className="btn btn-p" onClick={doLogin} disabled={loading} style={{width:'100%',justifyContent:'center',padding:'12px'}}>
          {loading?'로그인 중...':'로그인'}
        </button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);
function App() {
  var initialUser = (function() {
    try {
      var raw = localStorage.getItem('kwanbo_session');
      if (!raw) return null;
      var v = JSON.parse(raw);
      if (v && v.id && v.role) {
        if (v.password) { delete v.password; localStorage.setItem('kwanbo_session', JSON.stringify(v)); }
        sb = _makeSb(v.id, v.role);
        return v;
      }
      return null;
    } catch(e) { return null; }
  })();
  const [user, setUser] = useState(initialUser);
  const [view, setView] = useState(VIEWS.WL);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [teamName, setTeamName] = useState('');
  const [hasAccess, setHasAccess] = useState(false);
  const [accessChecked, setAccessChecked] = useState(false);

  // 상위탭 전환 — pushState로 히스토리 기록
  function nv(v) {
    history.pushState({ apView: v }, '', '');
    setView(v);
  }

  // 뒤로가기 — 상위탭 복원
  useEffect(function() {
    history.replaceState({ apView: VIEWS.WL }, '', '');
    function onPop(e) {
      if (e.state && e.state.apView) setView(e.state.apView);
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);

  useEffect(function() {
    if (initialUser) return;
    // checkOnLoad: 렌더 후 실행 (Babel 컴파일 완료 이후 → NAV_WINDOW 오인 방지)
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { setUser(null); return; }
    var raw = localStorage.getItem('kwanbo_session');
    if (!raw) { setSsoChecked(true); return; }
    try {
      var v = JSON.parse(raw);
      var userId = v && v.userId;
      if (!userId) { setSsoChecked(true); return; }
      sb.from('users').select('*').eq('id', userId).single().then(function(r) {
        if (r.data) {
          sb = _makeSb(r.data.id, r.data.role);
          var safeU = Object.assign({}, r.data); delete safeU.password;
          localStorage.setItem('kwanbo_session', JSON.stringify(safeU));
          localStorage.removeItem('kwanbo_pm_user');
          setUser(safeU);
          Sysbar.SessionManager.onLogin(function() { logout(); });
        }
        setSsoChecked(true);
      }).catch(function() { setSsoChecked(true); });
    } catch(e) { setSsoChecked(true); }
  }, []);

  // localStorage에서 바로 복원된 경우 checkOnLoad + SessionManager 시작
  useEffect(function() {
    if (!initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { logout(); return; }
    if (ssoChecked) { Sysbar.SessionManager.onLogin(function() { logout(); }); }
  }, []);

  useEffect(function() {
    if (!user) return;
    if (user.role === 'admin') { setTeamName('관리자'); setHasAccess(true); setAccessChecked(true); return; }
    if (!user.team_id) { setHasAccess(false); setAccessChecked(true); return; }
    sb.from('teams').select('name').eq('id', user.team_id).single().then(function(r) {
      var name = r.data ? r.data.name : '';
      setTeamName(name);
      setHasAccess(name === '관리팀');
      setAccessChecked(true);
    });
  }, [user ? user.id : null]);

  function handleLogin(u) {
    sb = _makeSb(u.id, u.role);
    var safeU = Object.assign({}, u); delete safeU.password;
    localStorage.setItem('kwanbo_session', JSON.stringify(safeU));
    localStorage.removeItem('kwanbo_pm_user');
    sessionStorage.removeItem('kwanbo_uid');
    setUser(safeU);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }

  function logout() {
    Sysbar.SessionManager.onLogout();
    sb = _makeSb();
    localStorage.removeItem('kwanbo_session');
    localStorage.removeItem('kwanbo_pm_user');
    sessionStorage.removeItem('kwanbo_uid');
    setUser(null); setTeamName(''); setHasAccess(false);
  }

  if (!ssoChecked || (user && !accessChecked)) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'#0f172a',color:'#94a3b8',fontSize:14}}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  if (user.role !== 'admin' && !hasAccess) return (
    <div className="lwrap">
      <div className="lbox" style={{textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>🚫</div>
        <div className="ltit" style={{marginBottom:8}}>접근 권한 없음</div>
        <p style={{fontSize:13,color:'#64748b',lineHeight:1.6,marginBottom:24}}>관리포털은 관리팀 및 관리자만<br/>이용할 수 있습니다.</p>
        <a href="project.html" className="btn btn-s" style={{justifyContent:'center'}}>공정관리로 돌아가기</a>
      </div>
    </div>
  );

  var canSal = user.role === 'admin';

  return (
    <div>
      <SysBar
        activeKey="admin"
        user={user}
        teamName={teamName}
        onLogout={logout}
      />
      {/* 시스템 제목 바 */}
      <div style={{background:'#0f172a',padding:'6px 18px 8px',flexShrink:0,borderBottom:'2px solid #7c3aed',position:'sticky',top:38,zIndex:250}}>
        <p style={{margin:0,fontSize:9,lineHeight:'1.2',color:'#475569',letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{margin:0,fontSize:14,lineHeight:'1.3',fontWeight:800,color:'white',letterSpacing:-0.3}}>관리 포털</p>
      </div>
      <div className="top-nav">
        <button className={view===VIEWS.WL?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.WL);}}>📝 업무일지</button>
        <button className={view===VIEWS.PF?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.PF);}}>📊 실적관리</button>
        {canSal && <button className={view===VIEWS.SL?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.SL);}}>💼 급여대장</button>}
        <button className={view===VIEWS.ST?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.ST);}}>👥 직원관리</button>
      </div>
      {view === VIEWS.WL && <WorklogView user={user} />}
      {view === VIEWS.PF && <PerfView user={user} />}
      {view === VIEWS.SL && canSal && <SalaryView user={user} />}
      {view === VIEWS.ST && <StaffView user={user} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
