<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { createClient } = supabase;
// RLS용: 로그인 후 user 헤더를 포함한 Supabase 클라이언트 생성
function _makeSb(userId, userRole) {
  const extraHeaders = {};
  if (userId) {
    extraHeaders['x-user-id'] = String(userId);
    extraHeaders['x-user-role'] = userRole || '';
  }
  return createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY, {
    global: { headers: extraHeaders }
  });
}
// ─── 비밀번호 해싱 (PBKDF2 + SHA-256, 100k iter, Web Crypto API) ──
async function hashPassword(plain){
  const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>b.toString(16).padStart(2,'0')).join('');
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(plain),{name:'PBKDF2'},false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},km,256);
  const hash=Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
  return 'pbkdf2$'+salt+'$'+hash;
}
async function verifyPassword(plain,stored){
  if(!stored||plain==null)return false;
  if(!String(stored).startsWith('pbkdf2$'))return plain===stored;
  const parts=stored.split('$');if(parts.length!==3)return false;
  const salt=parts[1];const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(plain),{name:'PBKDF2'},false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},km,256);
  const hash=Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,'0')).join('');
  return stored==='pbkdf2$'+salt+'$'+hash;
}
function isPlainPassword(stored){return stored&&!String(stored).startsWith('pbkdf2$');}

let sb = _makeSb();

const VIEWS = { WL:'wl', PF:'pf', SL:'sl', ST:'st' };
const TODAY = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDateKo = (ds) => { const d = new Date(ds + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const DAY_KO = ['일','월','화','수','목','금','토'];

// ── 공휴일 캐시 ──────────────────────────────────────────────────────────────
const _holCache = {};
async function fetchHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  try {
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const data = await r.json();
    _holCache[year] = new Set(data.map(h => h.date));
  } catch { _holCache[year] = new Set(); }
  return _holCache[year];
}

// ── MiniCalendar ──────────────────────────────────────────────────────────────
function MiniCalendar({ value, onChange, maxDate }) {
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(() => new Date((value || TODAY()) + 'T00:00:00'));
  const [holidays, setHolidays] = useState(new Set());
  const wrapRef = useRef(null);

  useEffect(function() {
    if (!open) return;
    fetchHolidays(viewDate.getFullYear()).then(function(h) { setHolidays(h); });
  }, [open, viewDate.getFullYear()]);

  useEffect(function() {
    if (!open) return;
    function handler(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return function() { document.removeEventListener('mousedown', handler); };
  }, [open]);

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const startWd = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const today = TODAY();

  function prevM() { const d = new Date(viewDate); d.setMonth(d.getMonth() - 1); setViewDate(d); }
  function nextM() { const d = new Date(viewDate); d.setMonth(d.getMonth() + 1); setViewDate(d); }

  function select(ds) {
    if (maxDate && ds > maxDate) return;
    onChange(ds);
    setOpen(false);
  }

  return (
    <div className="mcal-wrap" ref={wrapRef}>
      <button className="mcal-btn" title="달력 선택"
        onClick={function() { setViewDate(new Date((value || TODAY()) + 'T00:00:00')); setOpen(function(v) { return !v; }); }}>📅</button>
      {open && (
        <div className="mcal-popup">
          <div className="mcal-nav">
            <button className="mcal-nav-btn" onClick={prevM}>◀</button>
            <span className="mcal-title">{year}년 {month + 1}월</span>
            <button className="mcal-nav-btn" onClick={nextM}>▶</button>
          </div>
          <div className="mcal-grid">
            {DAY_KO.map(function(d, i) {
              return <div key={d} className={'mcal-dh' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>{d}</div>;
            })}
            {Array.from({ length: startWd }, function(_, i) { return <div key={'e' + i} className="mcal-day empty" />; })}
            {Array.from({ length: lastDay }, function(_, i) {
              const day = i + 1;
              const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
              const wd = new Date(ds + 'T00:00:00').getDay();
              const isHol = holidays.has(ds);
              const isFuture = maxDate && ds > maxDate;
              const cls = ['mcal-day',
                (wd === 0 || isHol) ? 'sun' : wd === 6 ? 'sat' : '',
                ds === today && ds !== value ? 'today' : '',
                ds === value ? 'selected' : '',
                isFuture ? 'future' : '',
              ].filter(Boolean).join(' ');
              return <div key={day} className={cls} onClick={function() { if (!isFuture) select(ds); }}>{day}</div>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}
const fmtN = (n) => n ? Number(n).toLocaleString('ko-KR') : '0';
const fmtD = (d) => {
  if (!d) return '-';
  const dt = new Date(d + 'T00:00:00');
  return dt.getFullYear() + '.' + String(dt.getMonth()+1).padStart(2,'0') + '.' + String(dt.getDate()).padStart(2,'0');
};
const genId = () => Math.random().toString(36).slice(2, 10);
const WSTATUS = ['완료','진행중','보류'];
const SCLS = { '완료':'bg','진행중':'bb','보류':'ba' };
const CAT_COLOR = { '관급': '#2563eb', '사급': '#059669', '기술지원': '#d97706' };
const CAT_BG    = { '관급': '#dbeafe', '사급': '#dcfce7', '기술지원': '#fef3c7' };
const CAT_TX    = { '관급': '#1e40af', '사급': '#15803d', '기술지원': '#92400e' };

const fmtShort = (ds) => { const d = new Date(ds + 'T00:00:00'); return (d.getMonth()+1) + '/' + d.getDate(); };

const getWeekDates = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return Array.from({ length: 5 }, function(_, i) {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return localDateStr(dd);
  });
};

const getMonthInfo = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  return {
    year, month,
    days: last.getDate(),
    startWeekday: first.getDay(),
    firstDate: localDateStr(first),
    lastDate:  localDateStr(last),
  };
};

// ── 인풋 컴포넌트 ─────────────────────────────────────────────────────────
function FI({ label, field, form, set, type }) {
  return (
    <div className="sal-frow">
      <label className="fl">{label}</label>
      <input
        className="fi"
        type={type || 'text'}
        value={form[field] || ''}
        placeholder="0"
        onChange={function(e) { set(function(p) { var o = {}; Object.assign(o, p); o[field] = e.target.value; return o; }); }}
      />
    </div>
  );
}

// ── 업무일지 ──────────────────────────────────────────────────────────────
function WorklogView({ user }) {
  const { useCallback } = React;
  const [tab, setTab]       = useState('my');
  const [allMode, setAllMode] = useState('day');

  // 하위탭 전환 — pushState
  function changeTab(newTab) {
    history.pushState({ wlTab: newTab, allMode: allMode, selDate: selDate }, '', '');
    setTab(newTab);
  }

  // 전체조회 모드 전환 — pushState
  function changeAllMode(newMode, date) {
    history.pushState({ wlTab: 'all', allMode: newMode, selDate: date || selDate }, '', '');
    if (date) setSelDate(date);
    setAllMode(newMode);
  }

  // 뒤로가기 감지
  useEffect(function() {
    history.replaceState({ wlTab: tab, allMode: allMode, selDate: selDate }, '', '');
    function onPop(e) {
      if (e.state && e.state.wlTab !== undefined) {
        setTab(e.state.wlTab);
        if (e.state.allMode) setAllMode(e.state.allMode);
        if (e.state.selDate) setSelDate(e.state.selDate);
      }
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);

  // 내 업무일지
  const [date, setDate]     = useState(TODAY());
  const [tasks, setTasks]   = useState([]);
  const [issues, setIssues] = useState('');
  const [saving, setSaving] = useState(false);
  const [msg, setMsg]       = useState('');
  const [loading, setLoading] = useState(false);
  // 전체 조회
  const [selDate, setSelDate] = useState(TODAY());
  const [allUsers, setAllUsers] = useState([]);
  const [allLogs, setAllLogs]   = useState([]);
  const [allLoading, setAllLoading] = useState(false);

  // ── 내 업무일지 로드 ──────────────────────────────────────────────────────
  const loadMyLog = useCallback(async function(d) {
    setLoading(true);
    const { data } = await sb.from('work_logs')
      .select('*').eq('user_id', user.id).eq('log_date', d).maybeSingle();
    if (data) {
      setTasks(data.tasks || []);
      setIssues(data.issues || '');
    } else {
      // 빈 날짜 → 전날 진행중 업무 자동 불러오기
      const prev = new Date(d + 'T00:00:00');
      prev.setDate(prev.getDate() - 1);
      const prevDs = localDateStr(prev);
      const { data: pd } = await sb.from('work_logs')
        .select('tasks').eq('user_id', user.id).eq('log_date', prevDs).maybeSingle();
      const pending = pd
        ? (pd.tasks || []).filter(function(t) { return t.status === '진행중'; })
            .map(function(t) { return Object.assign({}, t, { id: genId() }); })
        : [];
      setTasks(pending);
      setIssues('');
    }
    setLoading(false);
  }, [user.id]);

  useEffect(function() {
    if (tab === 'my') loadMyLog(date);
  }, [date, tab]);

  // ── 전체 조회 로드 ────────────────────────────────────────────────────────
  useEffect(function() {
    if (tab !== 'all') return;
    setAllLoading(true);
    sb.from('teams').select('id,name').then(function(tr) {
      const teams = tr.data || [];
      const mgmt = teams.find(function(t) { return t.name === '관리팀'; });
      sb.from('users').select('id,name,team_id').then(function(ur) {
        const filtered = (ur.data || []).filter(function(u) {
          return mgmt && u.team_id === mgmt.id;
        });
        setAllUsers(filtered);
        var start, end;
        if (allMode === 'day') { start = end = selDate; }
        else if (allMode === 'week') { const w = getWeekDates(selDate); start = w[0]; end = w[4]; }
        else { const m = getMonthInfo(selDate); start = m.firstDate; end = m.lastDate; }
        sb.from('work_logs').select('*').gte('log_date', start).lte('log_date', end).then(function(lr) {
          setAllLogs(lr.data || []);
          setAllLoading(false);
        });
      });
    });
  }, [tab, selDate, allMode]);

  // ── 저장 ──────────────────────────────────────────────────────────────────
  function save() {
    setSaving(true);
    sb.from('work_logs').upsert({
      user_id: user.id, log_date: date,
      tasks: tasks, tomorrow_tasks: [], issues: issues,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id,log_date' }).then(function(r) {
      setSaving(false);
      if (!r.error) { setMsg('저장됐습니다'); setTimeout(function() { setMsg(''); }, 2500); }
    });
  }

  // ── 날짜 이동 헬퍼 ────────────────────────────────────────────────────────
  function shiftDate(ds, dir, setter, max) {
    const d = new Date(ds + 'T00:00:00');
    d.setDate(d.getDate() + dir);
    const next = localDateStr(d);
    if (max && next > max) return;
    setter(next);
  }
  function shiftAllDate(dir) {
    const d = new Date(selDate + 'T00:00:00');
    if (allMode === 'day')        d.setDate(d.getDate() + dir);
    else if (allMode === 'week')  d.setDate(d.getDate() + dir * 7);
    else                          d.setMonth(d.getMonth() + dir);
    setSelDate(localDateStr(d));
  }
  function allRangeLabel() {
    if (allMode === 'day')  return fmtDateKo(selDate) + ' (' + DAY_KO[new Date(selDate+'T00:00:00').getDay()] + ')';
    if (allMode === 'week') { const w = getWeekDates(selDate); return fmtShort(w[0]) + ' ~ ' + fmtShort(w[4]); }
    const m = getMonthInfo(selDate); return m.year + '년 ' + (m.month+1) + '월';
  }

  const dayNameOf = (ds) => DAY_KO[new Date(ds + 'T00:00:00').getDay()];

  return (
    <div className="page">
      <div className="ph">
        <div className="pt">📝 관리팀 업무일지</div>
        <div className="ps">관리팀 전용 업무 기록</div>
      </div>
      <div className="itabs">
        <button className={tab === 'my' ? 'itab active' : 'itab'} onClick={function() { changeTab('my'); }}>내 업무일지</button>
        <button className={tab === 'all' ? 'itab active' : 'itab'} onClick={function() { changeTab('all'); }}>전체 조회</button>
      </div>

      {/* ── 내 업무일지 ── */}
      {tab === 'my' && (
        <div className="card">
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:15,fontWeight:800}}>✏️ {user.name}님 · {fmtDateKo(date)} ({dayNameOf(date)})</span>
            <div className="wl-date-nav">
              <button className="wl-date-btn" onClick={function() { shiftDate(date, -1, setDate, null); }}>◀</button>
              <input type="date" className="fi" value={date} max={TODAY()}
                onChange={function(e) { setDate(e.target.value); }}
                style={{width:'auto',maxWidth:140}} />
              <MiniCalendar value={date} maxDate={TODAY()} onChange={setDate} />
              <button className="wl-date-btn" onClick={function() { shiftDate(date, 1, setDate, TODAY()); }}
                disabled={date >= TODAY()}>▶</button>
              {date !== TODAY() && (
                <button className="wl-today-btn" onClick={function() { setDate(TODAY()); }}>오늘</button>
              )}
            </div>
          </div>

          {loading ? <div className="loading">불러오는 중...</div> : (
            <div>
              {/* 오늘 한 일 */}
              <div className="sh">
                <span className="st">오늘 한 일</span>
                <button className="btn btn-s btn-sm" onClick={function() {
                  setTasks(function(p) { return p.concat([{id:genId(),content:'',status:'진행중'}]); });
                }}>+ 추가</button>
              </div>
              {tasks.length === 0 && <div style={{color:'#94a3b8',fontSize:13,marginBottom:12}}>업무를 추가하세요.</div>}
              {tasks.map(function(t) {
                return (
                  <div key={t.id} className="tr-row">
                    <select className="ss" value={t.status} onChange={function(e) {
                      setTasks(function(p) { return p.map(function(x) { return x.id === t.id ? Object.assign({},x,{status:e.target.value}) : x; }); });
                    }}>
                      {WSTATUS.map(function(s) { return <option key={s}>{s}</option>; })}
                    </select>
                    <input className="ti" value={t.content} placeholder="업무 내용"
                      onChange={function(e) {
                        setTasks(function(p) { return p.map(function(x) { return x.id === t.id ? Object.assign({},x,{content:e.target.value}) : x; }); });
                      }} />
                    <button className="btn btn-d btn-sm" onClick={function() {
                      setTasks(function(p) { return p.filter(function(x) { return x.id !== t.id; }); });
                    }}>✕</button>
                  </div>
                );
              })}

              {/* 이슈 / 공유사항 */}
              <div style={{marginTop:16}}>
                <div className="st" style={{marginBottom:8}}>💬 공유 사항 / 이슈</div>
                <textarea className="fi" rows={3} value={issues}
                  placeholder="공유할 사항이나 이슈를 입력하세요"
                  onChange={function(e) { setIssues(e.target.value); }}
                  style={{resize:'vertical'}} />
              </div>

              <div className="sr">
                {msg && <span style={{fontSize:12,color:'#059669',fontWeight:600}}>✓ {msg}</span>}
                <button className="btn btn-p" onClick={save} disabled={saving}>
                  {saving ? '저장 중...' : '💾 저장'}
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ── 전체 조회 ── */}
      {tab === 'all' && (
        <div className="card">
          {/* 모드 탭 */}
          <div className="wl-mode-tabs">
            {[['day','일별'],['week','주별'],['month','월별']].map(function(m) {
              return (
                <button key={m[0]} className={'wl-mode-tab' + (allMode===m[0]?' active':'')}
                  onClick={function(){changeAllMode(m[0]);}}>
                  {m[1]}
                </button>
              );
            })}
          </div>

          {/* 날짜 네비 */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:14,fontWeight:800,color:'#1e293b'}}>👥 관리팀 전체 · {allRangeLabel()}</span>
            <div className="wl-date-nav">
              <button className="wl-date-btn" onClick={function(){shiftAllDate(-1);}}>◀</button>
              {allMode !== 'month' && (
                <input type="date" className="fi" value={selDate} max={TODAY()}
                  onChange={function(e){setSelDate(e.target.value);}}
                  style={{width:'auto',maxWidth:140}} />
              )}
              {allMode !== 'month' && <MiniCalendar value={selDate} maxDate={TODAY()} onChange={setSelDate} />}
              <button className="wl-date-btn" onClick={function(){shiftAllDate(1);}}>▶</button>
              <button className="wl-today-btn" onClick={function(){setSelDate(TODAY());}}>오늘</button>
            </div>
          </div>

          {allLoading ? <div className="loading">불러오는 중...</div> : (
            <div>

              {/* ── 일별 ── */}
              {allMode === 'day' && allUsers.map(function(u) {
                const log = allLogs.find(function(l) { return l.user_id === u.id; });
                return (
                  <div key={u.id} className="lc">
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div className="lu">
                        <div className="lav">{u.name[0]}</div>
                        <div>
                          <div className="ln">{u.name}</div>
                          <div className="lm">{log ? '업무 ' + (log.tasks||[]).length + '건' : '미작성'}</div>
                        </div>
                      </div>
                      <span className={log ? 'badge bg' : 'badge bgr'}>{log ? '작성완료' : '미작성'}</span>
                    </div>
                    {log && (
                      <div className="lb">
                        {(log.tasks||[]).map(function(t, i) {
                          return (
                            <div key={i} className="tr-row">
                              <span className={'badge ' + (SCLS[t.status] || 'bgr')}>{t.status}</span>
                              <span style={{flex:1,fontSize:13}}>{t.content}</span>
                            </div>
                          );
                        })}
                        {log.issues && (
                          <div style={{marginTop:8,padding:'6px 10px',background:'#fef3c7',borderRadius:6,fontSize:12,color:'#92400e'}}>
                            💬 {log.issues}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              {allMode === 'day' && !allLoading && allUsers.length === 0 && (
                <div style={{color:'#94a3b8',fontSize:13,textAlign:'center',padding:'20px 0'}}>관리팀 직원 정보를 불러오는 중...</div>
              )}

              {/* ── 주별 ── */}
              {allMode === 'week' && (function() {
                const weekDates = getWeekDates(selDate);
                return (
                  <div>
                    {allUsers.map(function(u) {
                      const weekLogs = weekDates.map(function(d) {
                        return { date: d, log: allLogs.find(function(l) { return l.user_id === u.id && l.log_date === d; }) };
                      }).filter(function(x) { return x.log; });
                      if (weekLogs.length === 0) return (
                        <div key={u.id} className="lc" style={{marginBottom:8}}>
                          <div className="lu">
                            <div className="lav" style={{opacity:.5}}>{u.name[0]}</div>
                            <div>
                              <div className="ln">{u.name}</div>
                              <div className="lm">이번 주 미작성</div>
                            </div>
                          </div>
                        </div>
                      );
                      return (
                        <div key={u.id} className="lc" style={{marginBottom:12}}>
                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                            <div className="lu">
                              <div className="lav">{u.name[0]}</div>
                              <div>
                                <div className="ln">{u.name}</div>
                                <div className="lm">{weekLogs.length}일 작성</div>
                              </div>
                            </div>
                          </div>
                          {weekLogs.map(function(item) {
                            const dt = new Date(item.date + 'T00:00:00');
                            const dayLabel = (dt.getMonth()+1) + '/' + dt.getDate() + '(' + DAY_KO[dt.getDay()] + ')';
                            return (
                              <div key={item.date} style={{marginBottom:10}}>
                                {/* 날짜 헤더 - 클릭 시 일별로 이동 */}
                                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5,
                                  padding:'4px 8px',background:'#f8fafc',borderRadius:6,cursor:'pointer'}}
                                  onClick={function(){changeAllMode('day', item.date);}}>
                                  <span style={{fontSize:12,fontWeight:700,color:'#475569'}}>{dayLabel}</span>
                                  <span style={{fontSize:11,color:'#94a3b8'}}>업무 {(item.log.tasks||[]).length}건</span>
                                  <span style={{fontSize:11,color:'#7c3aed',marginLeft:'auto'}}>상세보기 →</span>
                                </div>
                                {/* 업무 목록 전체 */}
                                {(item.log.tasks||[]).map(function(t, i) {
                                  var sColor = t.status==='완료'?'#059669':t.status==='진행중'?'#2563eb':'#d97706';
                                  return (
                                    <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,
                                      padding:'4px 0',borderBottom:'1px solid #f1f5f9',fontSize:13}}>
                                      <span style={{flexShrink:0,fontSize:11,fontWeight:700,
                                        color:sColor,background:sColor+'18',
                                        padding:'1px 6px',borderRadius:4}}>{t.status}</span>
                                      <span style={{color:'#334155',lineHeight:1.5}}>{t.content}</span>
                                    </div>
                                  );
                                })}
                                {item.log.issues && (
                                  <div style={{marginTop:4,padding:'4px 8px',background:'#fef3c7',
                                    borderRadius:5,fontSize:12,color:'#92400e'}}>
                                    💬 {item.log.issues}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

              {/* ── 월별 ── */}
              {allMode === 'month' && (function() {
                const mInfo = getMonthInfo(selDate);
                return (
                  <div className="wl-month-grid">
                    {DAY_KO.map(function(d, i) {
                      return <div key={d} className={'wl-month-hdr' + (i===0?' sun':i===6?' sat':'')}>{d}</div>;
                    })}
                    {Array.from({length:mInfo.startWeekday}, function(_,i) {
                      return <div key={'e'+i} className="wl-month-day empty" />;
                    })}
                    {Array.from({length:mInfo.days}, function(_,i) {
                      const day = i + 1;
                      const ds  = mInfo.year + '-' + String(mInfo.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
                      const wd  = new Date(ds + 'T00:00:00').getDay();
                      const cnt = allLogs.filter(function(l){ return l.log_date === ds; }).length;
                      const isToday = ds === TODAY();
                      return (
                        <div key={day} className={'wl-month-day' + (isToday?' today':'')}
                          onClick={function(){changeAllMode('day', ds);}}>
                          <div className={'wl-month-num' + (wd===0?' sun':wd===6?' sat':'') + (isToday?' today':'')}>{day}</div>
                          {cnt > 0 && <div className="wl-month-cnt">{cnt}명</div>}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── 기여율 모달 (프로젝트 선택 시 PM+참여직원 자동 등록) ─────────────────
function PerfModal({ projects, users, year, editItem, initForm, onClose, onSaved }) {
  const [selProjId, setSelProjId] = useState(editItem ? editItem.project_id : '');
  const [rows, setRows]           = useState([]); // [{user_id, name, rate, existing}]
  const [loading, setLoading]     = useState(false);
  const [saving, setSaving]       = useState(false);
  const [err, setErr]             = useState('');

  function uName(id) { var u = users.find(function(x){return x.id===id;}); return u?u.name:'-'; }

  // 프로젝트 선택 시 PM + 참여직원 자동 로드
  function onProjChange(pid) {
    setSelProjId(pid);
    setErr('');
    if (!pid) { setRows([]); return; }
    setLoading(true);
    var proj = projects.find(function(p){return p.id===pid;});
    // project_members 조회
    sb.from('project_members').select('user_id').eq('project_id', pid).then(function(r) {
      var memberIds = (r.data||[]).map(function(m){return m.user_id;});
      // PM이 members에 없으면 추가
      if (proj && proj.pm_id && memberIds.indexOf(proj.pm_id) === -1) {
        memberIds = [proj.pm_id].concat(memberIds);
      }
      // 기존 저장된 기여율 조회
      sb.from('performance').select('*').eq('project_id', pid).eq('year', year).then(function(pr) {
        var existing = pr.data || [];
        var newRows = memberIds
          .filter(function(uid) { return users.find(function(u){return u.id===uid;}); })
          .map(function(uid) {
            var ex = existing.find(function(e){return e.user_id===uid;});
            var isPm = proj && proj.pm_id === uid;
            return {
              user_id: uid,
              name: uName(uid),
              rate: ex ? ex.contribution_rate : (isPm ? 100 : 0),
              existing: !!ex,
            };
          });
        setRows(newRows);
        setLoading(false);
      });
    });
  }

  // 수정 모드일 때 초기 로드
  useEffect(function() {
    if (editItem && editItem.project_id) onProjChange(editItem.project_id);
  }, []);

  function updRate(uid, val) {
    setRows(function(prev) {
      return prev.map(function(r) { return r.user_id === uid ? Object.assign({},r,{rate:val}) : r; });
    });
  }

  function addUser(uid) {
    if (!uid || rows.find(function(r){return r.user_id===uid;})) return;
    setRows(function(prev) { return prev.concat([{user_id:uid, name:uName(uid), rate:0, existing:false}]); });
  }

  function removeRow(uid) {
    setRows(function(prev) { return prev.filter(function(r){return r.user_id!==uid;}); });
  }

  function save() {
    if (!selProjId) { setErr('프로젝트를 선택하세요.'); return; }
    if (rows.length === 0) { setErr('직원이 없습니다.'); return; }
    for (var i=0; i<rows.length; i++) {
      var r = rows[i];
      var v = Number(r.rate);
      if (isNaN(v) || v < 0 || v > 100) { setErr(r.name + '의 기여율은 0~100 사이여야 합니다.'); return; }
    }
    setSaving(true); setErr('');
    var payload = rows.map(function(r) {
      return { project_id: selProjId, user_id: r.user_id, contribution_rate: Number(r.rate), year: year };
    });
    sb.from('performance')
      .upsert(payload, { onConflict: 'project_id,user_id,year' })
      .then(function(res) {
        setSaving(false);
        if (res.error) { setErr('저장 오류: ' + res.error.message); return; }
        onSaved();
      });
  }

  var unselected = users.filter(function(u) { return !rows.find(function(r){return r.user_id===u.id;}); });

  return (
    <div className="mbg" onClick={onClose}>
      <div className="mbox" style={{maxWidth:520}} onClick={function(e){e.stopPropagation();}}>
        <div className="mh">
          <span className="mht">📐 기여율 입력</span>
          <button className="mc" onClick={onClose}>×</button>
        </div>
        <div className="mb">
          {err && <div className="al al-e">{err}</div>}
          <div style={{marginBottom:14}}>
            <label className="fl">프로젝트 *</label>
            <select className="fi" value={selProjId} onChange={function(e){onProjChange(e.target.value);}}>
              <option value="">선택하세요</option>
              {projects.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
            </select>
          </div>

          {loading && <div className="loading">직원 정보 로딩 중...</div>}

          {!loading && selProjId && (
            <>
              <div style={{fontSize:12,color:'#64748b',marginBottom:10}}>
                PM은 기본 100%로 설정됩니다. 기여율을 조정하세요.
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',marginBottom:12}}>
                <thead>
                  <tr style={{background:'#f8fafc'}}>
                    <th style={{padding:'8px 10px',textAlign:'left',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'1px solid #e2e8f0'}}>직원</th>
                    <th style={{padding:'8px 10px',textAlign:'center',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'1px solid #e2e8f0',width:120}}>기여율 (%)</th>
                    <th style={{width:36,borderBottom:'1px solid #e2e8f0'}}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(function(r) {
                    var proj = projects.find(function(p){return p.id===selProjId;});
                    var isPm = proj && proj.pm_id === r.user_id;
                    return (
                      <tr key={r.user_id} style={{borderBottom:'1px solid #f1f5f9'}}>
                        <td style={{padding:'8px 10px',fontSize:13}}>
                          {r.name}
                          {isPm && <span className="badge bp" style={{marginLeft:6,fontSize:10}}>PM</span>}
                          {r.existing && <span style={{fontSize:10,color:'#94a3b8',marginLeft:4}}>기존</span>}
                        </td>
                        <td style={{padding:'4px 10px'}}>
                          <input type="number" min="0" max="100" className="fi"
                            value={r.rate}
                            style={{textAlign:'center',margin:0}}
                            onChange={function(e){updRate(r.user_id, e.target.value);}} />
                        </td>
                        <td style={{padding:'4px 6px'}}>
                          {!isPm && (
                            <button className="btn btn-d btn-sm" onClick={function(){removeRow(r.user_id);}}>✕</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {unselected.length > 0 && (
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <select className="fi" style={{flex:1}} defaultValue=""
                    onChange={function(e){ if(e.target.value){addUser(e.target.value);e.target.value='';} }}>
                    <option value="">+ 직원 추가</option>
                    {unselected.map(function(u){ return <option key={u.id} value={u.id}>{u.name}</option>; })}
                  </select>
                </div>
              )}
            </>
          )}
        </div>
        <div className="mf">
          <button className="btn btn-s" onClick={onClose}>취소</button>
          <button className="btn btn-p" onClick={save} disabled={saving||!selProjId||rows.length===0}>
            {saving?'저장 중...':'저장'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── 실적 관리 ─────────────────────────────────────────────────────────────
// ── 실적 관리 ─────────────────────────────────────────────────────────────
function PerfView({ user }) {
  var [tab, setTab] = useState('col');
  var [projects, setProjects] = useState([]);

  // 하위탭 전환 — pushState
  function changeTab(newTab) {
    history.pushState({ pfTab: newTab }, '', '');
    setTab(newTab);
  }

  // 뒤로가기 감지
  useEffect(function() {
    history.replaceState({ pfTab: 'col' }, '', '');
    function onPop(e) {
      if (e.state && e.state.pfTab) setTab(e.state.pfTab);
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);
  var [users, setUsers] = useState([]);
  var [cols, setCols] = useState([]);
  var [perfs, setPerfs] = useState([]);
  var [loading, setLoading] = useState(true);
  var [modal, setModal] = useState('');
  var [editItem, setEditItem] = useState(null);
  var [form, setForm] = useState({});
  var [saving, setSaving] = useState(false);
  var [err, setErr] = useState('');
  var [year, setYear] = useState(String(new Date().getFullYear()));

  function load() {
    setLoading(true);
    Promise.all([
      sb.from('projects').select('id,name,client,pm_id,status,category').order('name'),
      sb.from('users').select('id,name').neq('role','contractor').order('name'),
      sb.from('collections').select('*').order('collected_at', { ascending: false }),
      sb.from('performance').select('*'),
    ]).then(function(results) {
      setProjects(results[0].data || []);
      setUsers(results[1].data || []);
      setCols(results[2].data || []);
      setPerfs(results[3].data || []);
      setLoading(false);
    });
  }

  useEffect(function() { load(); }, []);

  function uName(id) { var u = users.find(function(x) { return x.id === id; }); return u ? u.name : '-'; }
  function pName(id) { var p = projects.find(function(x) { return x.id === id; }); return p ? p.name : '-'; }

  var yCols = cols.filter(function(c) { return c.collected_at && c.collected_at.startsWith(year); });
  var totCol = yCols.filter(function(c){ return c.entry_type !== 'outsource_only'; }).reduce(function(s,c) { return s + (c.amount||0); }, 0);
  var totOut = yCols.reduce(function(s,c) { return s + (c.outsource_cost||0); }, 0);
  var totNet = yCols.reduce(function(s,c) { return s + (c.amount||0) - (c.outsource_cost||0); }, 0);

  var projSummary = projects.map(function(p) {
    var pc = yCols.filter(function(c) { return c.project_id === p.id; });
    var tc = pc.reduce(function(s,c) { return s + (c.amount||0); }, 0);
    var to = pc.reduce(function(s,c) { return s + (c.outsource_cost||0); }, 0);
    return { id:p.id, name:p.name, client:p.client, pm_id:p.pm_id, tc:tc, to:to, net:tc-to };
  }).filter(function(p) { return p.tc > 0; }).sort(function(a,b) { return b.net - a.net; });

  var userSummary = users.map(function(u) {
    var myP = perfs.filter(function(p) { return p.user_id === u.id && p.year === Number(year); });
    var total = myP.reduce(function(s, pf) {
      var net = yCols.filter(function(c) { return c.project_id === pf.project_id; })
        .reduce(function(a,c) { return a + (c.amount||0) - (c.outsource_cost||0); }, 0);
      return s + net * (pf.contribution_rate||0) / 100;
    }, 0);
    return { id:u.id, name:u.name, total:total, cnt:myP.length };
  }).filter(function(u) { return u.total > 0; }).sort(function(a,b) { return b.total - a.total; });

  var maxPerf = userSummary.length > 0 ? userSummary[0].total : 1;

  function numV(v) { return Number(String(v||0).replace(/,/g,'')) || 0; }

  function onAmountChange(key, e) {
    var raw = e.target.value.replace(/[^0-9]/g,'');
    var fmt = raw ? Number(raw).toLocaleString('ko-KR') : '';
    setForm(function(p) { var o = Object.assign({}, p); o[key] = fmt; return o; });
  }

  function deleteCol(id) {
    if (!window.confirm('이 수금 내역을 삭제하시겠습니까?')) return;
    sb.from('collections').delete().eq('id', id).then(function(r) {
      if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
      load();
    });
  }

  function deletePerf(pf) {
    if (!window.confirm('이 기여율을 삭제하시겠습니까?')) return;
    sb.from('performance').delete()
      .eq('project_id', pf.project_id).eq('user_id', pf.user_id).eq('year', pf.year)
      .then(function(r) {
        if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
        load();
      });
  }

  function saveCol() {
    var isOut = form.entry_type === 'outsource_only';
    if (!form.project_id || !form.collected_at) { setErr('프로젝트와 날짜는 필수입니다.'); return; }
    if (!isOut && !form.amount) { setErr('수금액을 입력해주세요.'); return; }
    if (isOut && !form.outsource_cost) { setErr('외주비를 입력해주세요.'); return; }
    setSaving(true); setErr('');
    var payload = {
      project_id: form.project_id,
      amount: isOut ? 0 : numV(form.amount),
      outsource_cost: numV(form.outsource_cost),
      collected_at: form.collected_at,
      memo: form.memo || '',
      entry_type: form.entry_type || 'both',
    };
    var isNew = !editItem;
    var colYear = Number(form.collected_at.slice(0, 4));
    var p = isNew
      ? sb.from('collections').insert(payload)
      : sb.from('collections').update(payload).eq('id', editItem.id);
    p.then(function(r) {
      setSaving(false);
      if (r.error) { setErr('저장 오류: ' + r.error.message); return; }

      // ── 최초 등록 시만 PM 기여율 100% 자동 등록 후 기여율 탭으로 이동 ──
      if (isNew) {
        var proj = projects.find(function(p) { return p.id === form.project_id; });
        if (proj && proj.pm_id) {
          sb.from('performance')
            .select('id')
            .eq('project_id', form.project_id)
            .eq('user_id', proj.pm_id)
            .eq('year', colYear)
            .then(function(chk) {
              if (!chk.data || chk.data.length === 0) {
                sb.from('performance').insert({
                  project_id: form.project_id,
                  user_id: proj.pm_id,
                  contribution_rate: 100,
                  year: colYear,
                }).then(function() {
                  setModal(''); setEditItem(null); setForm({});
                  load();
                });
              } else {
                setModal(''); setEditItem(null); setForm({});
                load();
              }
            });
        } else {
          setModal(''); setEditItem(null); setForm({});
          load();
        }
      } else {
        setModal(''); setEditItem(null); setForm({});
        load();
      }
    });
  }

  if (loading) return <div className="page"><div className="loading">로딩 중...</div></div>;

  return (
    <div className="page">
      <div className="ph" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="pt">📊 실적 관리</div>
          <div className="ps">수금 내역 및 직원별 성과급 기초 데이터</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <label className="fl" style={{margin:0}}>연도</label>
          <select className="fi" value={year} onChange={function(e) { setYear(e.target.value); }} style={{width:100}}>
            {[2023,2024,2025,2026].map(function(y) { return <option key={y}>{y}</option>; })}
          </select>
        </div>
      </div>

      <div className="g3">
        <div className="stat blue"><div className="stat-l">총 수금액</div><div className="stat-v">{fmtN(totCol)}</div><div className="stat-s">원 ({year}년)</div></div>
        <div className="stat red" style={{background:'#fff5f5',borderColor:'#fecaca'}}><div className="stat-l" style={{color:'#dc2626'}}>총 외주비</div><div className="stat-v" style={{color:'#dc2626'}}>{fmtN(totOut)}</div><div className="stat-s" style={{color:'#f87171'}}>원</div></div>
        <div className="stat purple"><div className="stat-l">순 실적금액</div><div className="stat-v">{fmtN(totNet)}</div><div className="stat-s">원 (수금-외주비)</div></div>
      </div>

      <div className="itabs">
        <button className={tab==='col'?'itab active':'itab'} onClick={function(){changeTab('col');}}>수금 내역</button>
        <button className={tab==='proj'?'itab active':'itab'} onClick={function(){changeTab('proj');}}>프로젝트별</button>
        <button className={tab==='user'?'itab active':'itab'} onClick={function(){changeTab('user');}}>직원별 실적</button>
        <button className={tab==='pf'?'itab active':'itab'} onClick={function(){changeTab('pf');}}>기여율 관리</button>
      </div>

      {tab === 'col' && (
        <div className="card">
          <div className="sh">
            <span className="st">수금 내역 ({year}년)</span>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-p btn-sm" onClick={function(){setModal('col');setEditItem(null);setForm({collected_at:TODAY(),entry_type:'both'});}}>+ 수금 입력</button>
              <button className="btn btn-d btn-sm" style={{background:'#fee2e2',color:'#dc2626',border:'1px solid #fecaca'}} onClick={function(){setModal('col');setEditItem(null);setForm({collected_at:TODAY(),entry_type:'outsource_only'});}}>+ 외주비만</button>
            </div>
          </div>
          {yCols.length === 0 ? (
            <div className="empty"><div className="ei">💰</div><div className="et">수금 내역이 없습니다</div></div>
          ) : (
            <div className="tbl-wrap">
              <table>
                <thead><tr><th>프로젝트</th><th>날짜</th><th>유형</th><th className="tr">수금액</th><th className="tr">외주비</th><th className="tr">순 실적</th><th>메모</th><th></th></tr></thead>
                <tbody>
                  {yCols.map(function(c) {
                    var isOut = c.entry_type === 'outsource_only';
                    var net   = (c.amount||0) - (c.outsource_cost||0);
                    return (
                      <tr key={c.id} style={{background: isOut ? '#fff5f5' : ''}}>
                        <td>
                          {(function(){
                            var proj = projects.find(function(p){ return p.id === c.project_id; });
                            var cat  = proj ? proj.category : '';
                            return (
                              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                                {cat && (
                                  <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                    background: CAT_BG[cat]||'#f1f5f9', color: CAT_TX[cat]||'#475569',
                                    border:'1px solid '+(CAT_COLOR[cat]||'#e2e8f0')}}>
                                    {cat}
                                  </span>
                                )}
                                <span style={{fontWeight:600}}>{pName(c.project_id)}</span>
                              </div>
                            );
                          })()}
                        </td>
                        <td>{fmtD(c.collected_at)}</td>
                        <td>
                          {isOut
                            ? <span className="badge bgr" style={{fontSize:10}}>외주비만</span>
                            : <span className="badge bg" style={{fontSize:10}}>수금</span>
                          }
                        </td>
                        <td className="tr" style={{fontWeight:700,color: isOut ? '#94a3b8' : '#1d4ed8'}}>
                          {isOut ? '—' : fmtN(c.amount)+'원'}
                        </td>
                        <td className="tr" style={{color:'#dc2626'}}>{c.outsource_cost > 0 ? fmtN(c.outsource_cost)+'원' : '-'}</td>
                        <td className="tr" style={{fontWeight:700,color: net < 0 ? '#dc2626' : '#7c3aed'}}>{fmtN(net)}원</td>
                        <td style={{color:'#64748b',fontSize:12}}>{c.memo||'-'}</td>
                        <td style={{display:'flex',gap:4}}>
                          <button className="btn btn-s btn-sm" onClick={function(){setEditItem(c);setForm(Object.assign({},c,{amount:c.amount?fmtN(c.amount):'',outsource_cost:c.outsource_cost?fmtN(c.outsource_cost):'',entry_type:c.entry_type||'both'}));setModal('col');}}>수정</button>
                          <button className="btn btn-d btn-sm" onClick={function(){deleteCol(c.id);}}>삭제</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'proj' && (
        <div className="card">
          <div className="st" style={{marginBottom:14}}>프로젝트별 실적 ({year}년)</div>
          {projSummary.length === 0 ? (
            <div className="empty"><div className="ei">📁</div><div className="et">수금 데이터가 없습니다</div></div>
          ) : (
            <div className="tbl-wrap">
              <table>
                <thead><tr><th>프로젝트</th><th>발주처</th><th>PM</th><th className="tr">수금액</th><th className="tr">외주비</th><th className="tr">순 실적</th></tr></thead>
                <tbody>
                  {projSummary.map(function(p) {
                    return (
                      <tr key={p.id}>
                        <td style={{fontWeight:600}}>
                          <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                            {p.category && (
                              <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                background: CAT_BG[p.category]||'#f1f5f9', color: CAT_TX[p.category]||'#475569',
                                border:'1px solid '+(CAT_COLOR[p.category]||'#e2e8f0')}}>
                                {p.category}
                              </span>
                            )}
                            {p.name}
                          </div>
                        </td>
                        <td style={{color:'#64748b',fontSize:12}}>{p.client||'-'}</td>
                        <td>{uName(p.pm_id)}</td>
                        <td className="tr">{fmtN(p.tc)}원</td>
                        <td className="tr" style={{color:'#dc2626'}}>{p.to > 0 ? fmtN(p.to)+'원' : '-'}</td>
                        <td className="tr" style={{fontWeight:700,color:'#7c3aed'}}>{fmtN(p.net)}원</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === 'user' && (
        <div className="card">
          <div className="st" style={{marginBottom:14}}>직원별 실적 ({year}년)</div>
          {userSummary.length === 0 ? (
            <div className="empty"><div className="ei">👥</div><div className="et">기여율 데이터가 없습니다</div></div>
          ) : userSummary.map(function(u, i) {
            return (
              <div key={u.id} style={{marginBottom:14}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{width:28,height:28,borderRadius:'50%',background:'#7c3aed',color:'#fff',fontSize:12,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{i+1}</div>
                    <span style={{fontWeight:700}}>{u.name}</span>
                    <span style={{fontSize:11,color:'#94a3b8'}}>{u.cnt}개 프로젝트</span>
                  </div>
                  <span style={{fontWeight:800,color:'#7c3aed',fontSize:15}}>{fmtN(Math.round(u.total))}원</span>
                </div>
                <div className="pb"><div className="pbf" style={{width: Math.round(u.total/maxPerf*100) + '%'}}></div></div>
              </div>
            );
          })}
        </div>
      )}

      {tab === 'pf' && (
        <div className="card">
          <div className="sh">
            <span className="st">기여율 입력 ({year}년)</span>
            <button className="btn btn-p btn-sm" onClick={function(){setModal('pf');setEditItem(null);setForm({year:Number(year)});}}>+ 기여율 입력</button>
          </div>
          {perfs.filter(function(p) { return p.year === Number(year); }).length === 0 ? (
            <div className="empty"><div className="ei">📐</div><div className="et">입력된 기여율이 없습니다</div></div>
          ) : (
            <div className="tbl-wrap">
              <table>
                <thead><tr><th>프로젝트</th><th>직원</th><th className="tr">기여율</th><th className="tr">적용 실적</th><th></th></tr></thead>
                <tbody>
                  {perfs.filter(function(p) { return p.year === Number(year); }).map(function(pf) {
                    var net = yCols.filter(function(c) { return c.project_id === pf.project_id; })
                      .reduce(function(s,c) { return s + (c.amount||0) - (c.outsource_cost||0); }, 0);
                    var my = Math.round(net * (pf.contribution_rate||0) / 100);
                    return (
                      <tr key={pf.project_id + '-' + pf.user_id}>
                        <td style={{fontWeight:600}}>{pName(pf.project_id)}</td>
                        <td>{uName(pf.user_id)}</td>
                        <td className="tr"><span className="badge bp">{pf.contribution_rate}%</span></td>
                        <td className="tr" style={{fontWeight:700,color:'#7c3aed'}}>{fmtN(my)}원</td>
                        <td style={{display:'flex',gap:4}}>
                          <button className="btn btn-s btn-sm" onClick={function(){setEditItem(pf);setForm(Object.assign({},pf));setModal('pf');}}>수정</button>
                          <button className="btn btn-d btn-sm" onClick={function(){deletePerf(pf);}}>삭제</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {modal === 'col' && (
        <div className="mbg" onClick={function(){setModal('');}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}}>
            <div className="mh">
              <span className="mht">{form.entry_type==='outsource_only' ? '💸 외주비 입력' : '💰 수금 입력'}</span>
              <button className="mc" onClick={function(){setModal('');}}>×</button>
            </div>
            <div className="mb">
              {err && <div className="al al-e">{err}</div>}
              {/* 유형 선택 */}
              <div style={{display:'flex',gap:8,marginBottom:14}}>

function SalaryView({ user }) {
  const [users, setUsers] = useState([]);
  const [sals, setSals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [selU, setSelU] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
  const [emMsg, setEmMsg] = useState('');

  function load() {
    setLoading(true);
    Promise.all([
      sb.from('users').select('id,name,email,position,team_id').neq('role','contractor').order('name'),
      sb.from('salaries').select('*').eq('month', month),
      sb.from('teams').select('id,name'),
    ]).then(function(results) {
      var ud = results[0].data || [];
      var sd = results[1].data || [];
      var td = results[2].data || [];
      var tmap = {};
      td.forEach(function(t) { tmap[t.id] = t.name; });
      setUsers(ud.map(function(u) { return Object.assign({}, u, {teamName: tmap[u.team_id]||'-'}); }));
      setSals(sd);
      setLoading(false);
    });
  }

  useEffect(function() { load(); }, [month]);

  function getSal(uid) { return sals.find(function(s) { return s.user_id === uid; }); }

  function numV(v) { return Number(String(v||0).replace(/,/g,'')) || 0; }

  function calc(f) {
    var inc = numV(f.base_salary) + numV(f.position_allowance) + numV(f.meal_allowance) +
              numV(f.transport_allowance) + numV(f.overtime_pay) + numV(f.performance_bonus) + numV(f.other_income);
    var ded = numV(f.national_pension) + numV(f.health_insurance) + numV(f.employment_insurance) +
              numV(f.income_tax) + numV(f.local_income_tax) + numV(f.other_deduction);
    return { inc: inc, ded: ded, net: inc - ded };
  }

  function openEdit(u) {
    var s = getSal(u.id) || {};
    setSelU(u);
    setForm({
      base_salary: s.base_salary||'', position_allowance: s.position_allowance||'',
      meal_allowance: s.meal_allowance||'', transport_allowance: s.transport_allowance||'',
      overtime_pay: s.overtime_pay||'', performance_bonus: s.performance_bonus||'',
      other_income: s.other_income||'', national_pension: s.national_pension||'',
      health_insurance: s.health_insurance||'', employment_insurance: s.employment_insurance||'',
      income_tax: s.income_tax||'', local_income_tax: s.local_income_tax||'',
      other_deduction: s.other_deduction||'', memo: s.memo||'',
    });
    setErr(''); setModal(true);
  }

  function saveSal() {
    if (!selU) return;
    setSaving(true); setErr('');
    var c = calc(form);
    var payload = Object.assign({}, {
      user_id: selU.id, month: month, memo: form.memo||'',
      total_income: c.inc, total_deduction: c.ded, net_pay: c.net,
    });
    var fields = ['base_salary','position_allowance','meal_allowance','transport_allowance',
      'overtime_pay','performance_bonus','other_income','national_pension','health_insurance',
      'employment_insurance','income_tax','local_income_tax','other_deduction'];
    fields.forEach(function(k) { payload[k] = numV(form[k]) || null; });
    var existing = getSal(selU.id);
    var p = existing
      ? sb.from('salaries').update(payload).eq('id', existing.id)
      : sb.from('salaries').insert(payload);
    p.then(function(r) {
      setSaving(false);
      if (r.error) { setErr('저장 오류: ' + r.error.message); return; }
      setModal(false); load();
    });
  }

  function sendSlip(u) {
    var s = getSal(u.id);
    if (!s) { alert('급여 데이터를 먼저 입력해주세요.'); return; }
    if (!u.email) { alert('직원 이메일 주소가 없습니다.'); return; }
    if (!window.emailjs || !APP_CONFIG.EMAILJS_SERVICE_ID) {
      alert('EmailJS 설정이 필요합니다.\nconfig.js에 EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, EMAILJS_PUBLIC_KEY를 추가해주세요.');
      return;
    }
    setEmMsg('발송 중...');
    var c = calc(s);
    window.emailjs.send(APP_CONFIG.EMAILJS_SERVICE_ID, APP_CONFIG.EMAILJS_TEMPLATE_ID, {
      to_email: u.email, to_name: u.name, month: month,
      company: APP_CONFIG.COMPANY_KO,
      base_salary: fmtN(s.base_salary),
      total_income: fmtN(c.inc), total_deduction: fmtN(c.ded), net_pay: fmtN(c.net),
    }).then(function() {
      setEmMsg('발송 완료 ✓');
      setTimeout(function() { setEmMsg(''); }, 3000);
    }).catch(function(e) {
      alert('발송 실패: ' + e.message);
      setEmMsg('');
    });
  }

  if (loading) return <div className="page"><div className="loading">로딩 중...</div></div>;

  var totals = sals.reduce(function(acc, s) {
    return { inc: acc.inc + (s.total_income||0), ded: acc.ded + (s.total_deduction||0), net: acc.net + (s.net_pay||0) };
  }, { inc:0, ded:0, net:0 });

  var cv = calc(form);

  return (
    <div className="page">
      <div className="ph" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div><div className="pt">💼 급여 대장</div><div className="ps">관리자 전용</div></div>
        <input type="month" className="fi" value={month} onChange={function(e){setMonth(e.target.value);}} style={{width:'auto'}} />
      </div>

      <div className="g3">
        <div className="stat blue"><div className="stat-l">총 지급액</div><div className="stat-v">{fmtN(totals.inc)}</div><div className="stat-s">원</div></div>
        <div className="stat amber"><div className="stat-l">총 공제액</div><div className="stat-v">{fmtN(totals.ded)}</div><div className="stat-s">원</div></div>
        <div className="stat purple"><div className="stat-l">총 실수령액</div><div className="stat-v">{fmtN(totals.net)}</div><div className="stat-s">원</div></div>
      </div>

      {emMsg && <div className="al al-s">{emMsg}</div>}

      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>직원</th><th>팀</th><th className="tr">기본급</th><th className="tr">총 지급</th><th className="tr">총 공제</th><th className="tr">실수령액</th><th className="tc">상태</th><th className="tc">관리</th></tr></thead>
            <tbody>
              {users.map(function(u) {
                var s = getSal(u.id);
                var c = s ? calc(s) : { inc:0, ded:0, net:0 };
                return (
                  <tr key={u.id}>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background:'#7c3aed',color:'#fff',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{u.name[0]}</div>
                        <div><div style={{fontWeight:600}}>{u.name}</div><div style={{fontSize:11,color:'#94a3b8'}}>{u.position||''}</div></div>
                      </div>
                    </td>
                    <td style={{color:'#64748b'}}>{u.teamName}</td>
                    <td className="tr">{s ? fmtN(s.base_salary)+'원' : '-'}</td>
                    <td className="tr" style={{color:'#1d4ed8',fontWeight:600}}>{s ? fmtN(c.inc)+'원' : '-'}</td>
                    <td className="tr" style={{color:'#dc2626'}}>{s ? fmtN(c.ded)+'원' : '-'}</td>
                    <td className="tr" style={{fontWeight:700,color:'#7c3aed',fontSize:14}}>{s ? fmtN(c.net)+'원' : '-'}</td>
                    <td className="tc">{s ? <span className="badge bg">입력완료</span> : <span className="badge bgr">미입력</span>}</td>
                    <td className="tc">
                      <div style={{display:'flex',gap:4,justifyContent:'center'}}>
                        <button className="btn btn-s btn-sm" onClick={function(){openEdit(u);}}>입력</button>
                        {s && <button className="btn btn-p btn-sm" onClick={function(){sendSlip(u);}}>📧</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {modal && selU && (
        <div className="mbg" onClick={function(){setModal(false);}}>
          <div className="mbox" style={{maxWidth:620}} onClick={function(e){e.stopPropagation();}}>
            <div className="mh">
              <span className="mht">💼 {selU.name} 급여 입력 ({month})</span>
              <button className="mc" onClick={function(){setModal(false);}}>×</button>
            </div>
            <div className="mb">
              {err && <div className="al al-e">{err}</div>}
              <div className="sal-row">
                <div className="sal-sec">
                  <div className="sal-st">지급 항목</div>
                  <FI label="기본급" field="base_salary" form={form} set={setForm} />
                  <FI label="직책수당" field="position_allowance" form={form} set={setForm} />
                  <FI label="식대" field="meal_allowance" form={form} set={setForm} />
                  <FI label="교통비" field="transport_allowance" form={form} set={setForm} />
                  <FI label="초과근무수당" field="overtime_pay" form={form} set={setForm} />
                  <FI label="성과급" field="performance_bonus" form={form} set={setForm} />
                  <FI label="기타 지급" field="other_income" form={form} set={setForm} />
                  <div className="sal-tot"><span className="sal-tl">총 지급액</span><span className="sal-tv">{fmtN(cv.inc)}원</span></div>
                </div>
                <div className="sal-sec">
                  <div className="sal-st">공제 항목</div>
                  <FI label="국민연금" field="national_pension" form={form} set={setForm} />
                  <FI label="건강보험" field="health_insurance" form={form} set={setForm} />
                  <FI label="고용보험" field="employment_insurance" form={form} set={setForm} />
                  <FI label="소득세" field="income_tax" form={form} set={setForm} />
                  <FI label="지방소득세" field="local_income_tax" form={form} set={setForm} />
                  <FI label="기타 공제" field="other_deduction" form={form} set={setForm} />
                  <div className="sal-tot"><span className="sal-tl">총 공제액</span><span className="sal-tv" style={{color:'#dc2626'}}>{fmtN(cv.ded)}원</span></div>
                </div>
              </div>
              <div style={{background:'linear-gradient(135deg,#7c3aed,#6d28d9)',borderRadius:10,padding:'16px 20px',color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <span style={{fontWeight:700}}>실수령액</span>
                <span style={{fontSize:22,fontWeight:800}}>{fmtN(cv.net)}원</span>
              </div>
              <div>
                <label className="fl">메모</label>
                <input className="fi" value={form.memo||''} placeholder="메모" onChange={function(e){setForm(function(p){return Object.assign({},p,{memo:e.target.value});});}} />
