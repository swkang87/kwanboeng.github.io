<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>공정관리 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
html, body, #app, button, input, textarea, select { font-family: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif !important; }
</style>
<script src="config.js"></script>
<script src="sysbar.js?v=20260530"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
input,textarea,select,button{font-family:'Noto Sans KR',sans-serif}
button{cursor:pointer}

/* ── PRINT ── */
@media print{
  .no-print{display:none!important}
  .print-only{display:block!important}
  body{background:#fff}
  #print-area{display:block!important}
}
.print-only{display:none}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal-title{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #f1f5f9}
.form-group{margin-bottom:14px}
/* ── SYS-BAR → sysbar.js가 주입 ── */
.form-label{font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px;display:block}
.form-input{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:7px;font-size:13px;color:#1e293b;outline:none;transition:border .2s}
.form-input:focus{border-color:#2563eb}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:9px 18px;border-radius:7px;border:none;font-size:13px;font-weight:700;transition:all .2s}
.btn-primary{background:var(--theme,#0f172a);color:#fff}
.btn-primary:hover{background:#1e3a5f}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-success{background:#059669;color:#fff}
.btn-success:hover{background:#047857}
.btn-sm{padding:5px 12px;font-size:11px;border-radius:5px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:14px;border-top:1px solid #f1f5f9}

/* ── ALERT ── */
.alert{padding:10px 14px;border-radius:7px;font-size:12px;margin-bottom:12px}
.alert-error{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.alert-success{background:#f0fdf4;color:#059669;border:1px solid #bbf7d0}

/* ── NAV ── */
.navbar{background:linear-gradient(135deg,var(--theme,#0f172a) 0%,#1e3a5f 100%);color:#fff;padding:8px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;z-index:100}
.nav-top{display:flex;align-items:center;justify-content:space-between;width:100%}
.nav-brand{display:flex;align-items:center;gap:8px}
.nav-accent{width:5px;height:22px;background:#ef4444;border-radius:2px;flex-shrink:0}
.nav-title{font-size:13px;font-weight:800;letter-spacing:-.5px}
.nav-sub{font-size:9px;opacity:.45;letter-spacing:1.5px}
.nav-bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%}
.nav-menu{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:7px;padding:2px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.nav-menu::-webkit-scrollbar{display:none}
.nav-btn{padding:5px 10px;border-radius:5px;border:none;background:transparent;color:rgba(255,255,255,.5);font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.nav-btn.active{background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.nav-btn.highlight{background:rgba(239,68,68,.25);color:#fca5a5;font-weight:700}
.nav-btn.highlight.active{background:rgba(239,68,68,.5);color:#fff}
.nav-user{font-size:11px;color:rgba(255,255,255,.6);display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.nav-user span{color:#fff;font-weight:700}
.logout-btn{padding:3px 8px;border-radius:5px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-size:10px;cursor:pointer;white-space:nowrap}

/* ── CARDS & TABLE ── */
.page{max-width:1200px;margin:0 auto;padding:14px 12px}
.section-title{font-size:16px;font-weight:800;color:#0f172a;margin-bottom:12px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-p{padding:16px}
.badge{display:inline-block;padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;color:#fff;line-height:16px;white-space:nowrap}
.pbar-wrap{display:flex;align-items:center;gap:5px}
.pbar-track{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.pbar-fill{height:100%;border-radius:3px;transition:width .4s}
.delta-pos{font-size:10px;font-weight:700;color:#059669}
.delta-neg{font-size:10px;font-weight:700;color:#dc2626}
.delta-zero{font-size:10px;color:#94a3b8}
.tag-관급{background:#2563eb}
.tag-사급{background:#059669}
.tag-기술지원{background:#d97706}
.tag-진행중{background:#2563eb}
.tag-중지{background:#94a3b8}
.tag-완료{background:#6b7280}
.tag-pm{background:var(--theme,#0f172a)}
.tag-support{background:#64748b}
.tag-contractor{background:#d97706}

/* ── PROJECT LIST ── */
.proj-card{background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:7px;border-left:4px solid #e2e8f0;cursor:pointer;transition:transform .15s}
.proj-card:hover{transform:translateX(2px)}
.proj-card.stopped{opacity:.65}
.proj-name{font-size:13px;font-weight:800;color:#0f172a;margin:3px 0}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{padding:7px 5px;text-align:left;font-size:10px;font-weight:700;color:#64748b;border-bottom:2px solid #e2e8f0;background:#f8fafc;white-space:nowrap}
.tbl td{padding:6px 5px;border-bottom:1px solid #f1f5f9;vertical-align:top}
.tbl tr:hover td{background:#fafbfc}
.tbl .tc{text-align:center}
.tbl tr.stopped td{color:#9ca3af;background:#f9fafb}

/* ── MY PROJECTS ── */
.my-proj-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:10px;border-left:4px solid #2563eb}
.my-proj-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ── SUMMARY CARDS ── */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-bottom:12px}
.sum-card{background:#fff;border-radius:9px;padding:11px 13px;box-shadow:0 1px 2px rgba(0,0,0,.05);border-top:3px solid #e2e8f0}
.sum-val{font-size:22px;font-weight:900}
.sum-label{font-size:9px;color:#94a3b8;font-weight:600;margin-bottom:2px}
.sum-unit{font-size:10px;font-weight:400;color:#94a3b8}

/* ── CALENDAR ── */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-head{padding:6px 2px;text-align:center;font-size:10px;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0}
.cal-cell{min-height:64px;padding:2px 3px;border-bottom:1px solid #f1f5f9;border-right:1px solid #f1f5f9;cursor:pointer;transition:background .15s}
.cal-cell:hover{background:#f0f9ff}
.cal-cell.selected{background:#eff6ff}
.cal-cell.today{background:#fffbeb}
.cal-date{font-size:11px;font-weight:500}
.cal-ev{font-size:8px;margin-top:1px;padding:1px 3px;border-radius:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}

/* ── EVENT STYLES ── */
.ev-보고회{background:#dbeafe;color:#1e40af}
.ev-위원회{background:#fce7f3;color:#9d174d}
.ev-협의{background:#fef3c7;color:#92400e}
.ev-측량{background:#ccfbf1;color:#134e4a}
.ev-납품{background:#f3e8ff;color:#6b21a8}
.ev-기타{background:#f1f5f9;color:#334155}

/* ── UPCOMING ── */
.upcoming-card{padding:8px 10px;border-radius:7px;margin-bottom:5px;cursor:pointer;border-left:3px solid}
.timeline{position:relative;padding-left:20px}
.timeline-line{position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:#e2e8f0;border-radius:1px}
.timeline-item{position:relative;margin-bottom:8px;padding-left:12px}
.timeline-dot{position:absolute;left:-16px;top:5px;width:8px;height:8px;border-radius:50%;border:2px solid #fff;z-index:1}

/* ── PRINT LAYOUT ── */
#print-area{display:none}
@media print{
  #print-area{display:block;font-family:'Noto Sans KR',sans-serif}
  @page{size:A3 portrait;margin:8mm}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-header{text-align:center;margin-bottom:6px}
  .print-title{font-size:13pt;font-weight:900;color:#0f172a}
  .print-sub{font-size:8pt;color:#64748b}
  .print-cols{display:block}
  .print-col{width:100%}
  .ptbl{width:100%;border-collapse:collapse;font-size:7pt;table-layout:fixed}
  .ptbl th{padding:3px 2px;background:#e2e8f0;border:0.5px solid #94a3b8;font-size:7pt;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden}
  .ptbl td{padding:2px 3px;border:0.5px solid #ddd;font-size:7pt;vertical-align:middle;word-break:keep-all;overflow-wrap:break-word;line-height:1.3}
  .ptbl .tc{text-align:center}
  .ptbl tr.stopped td{background:#f5f5f5}
  .ptbl tr{page-break-inside:avoid}
}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--theme,#0f172a) 0%,#1e3a5f 100%);padding:16px}
.login-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:0 24px 80px rgba(0,0,0,.4)}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo-accent{width:6px;height:28px;background:#ef4444;border-radius:2px;display:inline-block;margin-right:8px;vertical-align:middle}
.login-logo-text{font-size:15px;font-weight:800;color:#0f172a}
.login-logo-sub{font-size:10px;color:#94a3b8;margin-top:4px}
.login-title{font-size:18px;font-weight:900;color:#0f172a;margin-bottom:4px}

/* ── MOBILE RESPONSIVE ── */
@media(max-width:600px){
  .page{padding:10px 8px}
  .form-row{grid-template-columns:1fr}
  .modal-box{padding:16px}
  .sum-grid{grid-template-columns:1fr 1fr;gap:6px}
  .sum-val{font-size:18px}
  .card-p{padding:12px}
  .proj-card{padding:10px 12px}
  .my-proj-card{padding:12px}
  .cal-cell{min-height:44px}
  .cal-ev{font-size:7px;padding:0 2px}
  .tbl{font-size:10px}
  .tbl th,.tbl td{padding:4px 3px}
  .btn-sm{padding:4px 8px;font-size:10px}
  .admin-edit-grid{grid-template-columns:1fr!important}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="print-area"></div>

<script type="text/babel">

// ── 공휴일 데이터 (하드코딩 폴백 + Nager.Date API 자동 갱신) ──
const HOLIDAYS={
  '2026-01-01':'신정',
  '2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴',
  '2026-03-01':'삼일절',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-03':'임시공휴일(지방선거)',
  '2026-06-06':'현충일',
  '2026-07-17':'제헌절',
  '2026-08-15':'광복절',
  '2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날',
  '2026-12-25':'크리스마스',
  '2025-01-01':'신정',
  '2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날',
  '2025-06-03':'임시공휴일(대통령선거)',
  '2025-06-06':'현충일',
  '2025-07-17':'제헌절',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날',
  '2025-12-25':'크리스마스',
};
const SUBSTITUTE={
  '2025-05-06':'대체공휴일',
  '2026-03-02':'대체공휴일',
  '2026-05-25':'대체공휴일',
  '2026-08-17':'대체공휴일',
  
  '2026-10-05':'대체공휴일',
};
const NAGER_KO={
  "New Year's Day":'신정',"New Year's Eve":'신정연휴',
  'Seollal':'설날','Seollal Holiday':'설날연휴',
  "Independence Movement Day":'삼일절',"Labor Day":'근로자의날',
  "Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',
  "Memorial Day":'현충일',"Liberation Day":'광복절',
  "Chuseok":'추석',"Chuseok Holiday":'추석연휴',
  "National Foundation Day":'개천절',"Hangul Day":'한글날',
  "Christmas Day":'크리스마스',"Constitution Day":'제헌절',
  "Substitute Holiday":'대체공휴일',
};
async function loadNagerHolidays(){
  const yr=new Date().getFullYear();
  const years=[yr-1,yr,yr+1];
  try{
    const results=await Promise.all(
      years.map(y=>fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/KR`)
        .then(r=>r.ok?r.json():[]).catch(()=>[]))
    );
    let count=0;
    results.flat().forEach(h=>{
      if(!h.date)return;
      const name=NAGER_KO[h.localName]||NAGER_KO[h.name]||h.localName||h.name;
      if(name==='대체공휴일'){
        if(!SUBSTITUTE[h.date])SUBSTITUTE[h.date]='대체공휴일';
      } else {
        if(!HOLIDAYS[h.date])HOLIDAYS[h.date]=name;
      }
      count++;
    });
    if(count>0)console.log(`✅ Nager.Date: 공휴일 ${count}건 로드 완료`);
  }catch(e){
    console.warn('Nager.Date API 실패, 하드코딩 데이터 사용');
  }
}
loadNagerHolidays();

const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── Supabase ───
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);

// ─── Constants ───
const CAT_COLOR = { '관급': '#2563eb', '사급': '#059669', '기술지원': '#d97706' };
const STATUS_COLOR = { '진행중': '#2563eb', '중지': '#94a3b8', '완료': '#6b7280' };
const EV_TYPES = ['보고회', '위원회', '협의', '측량', '납품', '기타'];
const EV_ICON = { '보고회': '🚀', '위원회': '🏛️', '협의': '🤝', '측량': '📐', '납품': '📬', '기타': '📌' };
const EV_COLOR = {
  '보고회': { bg: '#dbeafe', bd: '#3b82f6', tx: '#1e40af' },
  '위원회':   { bg: '#fce7f3', bd: '#ec4899', tx: '#9d174d' },
  '협의':     { bg: '#fef3c7', bd: '#f59e0b', tx: '#92400e' },
  '측량':     { bg: '#ccfbf1', bd: '#14b8a6', tx: '#134e4a' },
  '납품':     { bg: '#f3e8ff', bd: '#a855f7', tx: '#6b21a8' },
  '기타':     { bg: '#f1f5f9', bd: '#94a3b8', tx: '#334155' },
};
const ec = (t) => EV_COLOR[t] || EV_COLOR['기타'];
const DK = ['일','월','화','수','목','금','토'];

// PM별 고유 색상 - 이름 기반 고정 배정
const PM_COLOR_MAP = {
  '강승우': { bg: '#d97706', tx: '#fff' }, // 기술지원과 동일 (오렌지)
  '조원범': { bg: '#78350f', tx: '#fff' }, // 짙은 갈색
  '김병용': { bg: '#059669', tx: '#fff' }, // 사급과 동일 (초록)
  '박호진': { bg: '#34d399', tx: '#fff' }, // 옅은 초록
  '장용기': { bg: '#2563eb', tx: '#fff' }, // 관급과 동일 (파랑)
};
const PM_PALETTE_DEFAULT = [
  { bg: 'var(--theme,#0f172a)', tx: '#fff' },
  { bg: '#7c3aed', tx: '#fff' },
  { bg: '#dc2626', tx: '#fff' },
  { bg: '#0891b2', tx: '#fff' },
  { bg: '#be185d', tx: '#fff' },
  { bg: '#4338ca', tx: '#fff' },
];
function buildPmColorMap(users) {
  let defaultIdx = 0;
  const map = {};
  users.forEach(u => {
    if (PM_COLOR_MAP[u.name]) {
      map[u.id] = PM_COLOR_MAP[u.name];
    } else {
      map[u.id] = PM_PALETTE_DEFAULT[defaultIdx % PM_PALETTE_DEFAULT.length];
      defaultIdx++;
    }
  });
  return map;
}

// ─── Utilities ───
const ff = (d) => { if (!d) return ''; const t = new Date(d+'T00:00:00'); return `${t.getFullYear()}.${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`; };
const fs = (d) => { if (!d) return ''; const t = new Date(d+'T00:00:00'); return `${String(t.getMonth()+1).padStart(2,'0')}.${String(t.getDate()).padStart(2,'0')}`; };
const fmt = (d) => { if (!d) return ''; const t = new Date(d+'T00:00:00'); return `${t.getMonth()+1}/${t.getDate()}`; };
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function localDateStr(d){var y=d.getFullYear();var m=String(d.getMonth()+1).padStart(2,'0');var dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}
const thisMonday = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() === 0 ? 6 : d.getDay() - 1)); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const sixMonthsAgo = () => { const d = new Date(); d.setMonth(d.getMonth() - 6); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; };
const thirtyDaysAgo = () => { const d = new Date(); d.setDate(d.getDate()-30); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const reportMonday = () => {
  // 1) 이번 주 월요일 계산 (화~일+월 묶음 기준)
  const d = new Date();
  const dow = d.getDay();
  let add;
  if (dow === 1) add = 0;       // 오늘이 월요일
  else if (dow === 0) add = 1;  // 오늘이 일요일 → 다음날(월)
  else add = 8 - dow;           // 화~토 → 다음 월요일
  d.setDate(d.getDate() + add);

  // 2) 해당 월요일이 공휴일이면 다음 근무일로 순차 탐색
  const toKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
  const isHoliday = (dt) => {
    const k = toKey(dt);
    const weekday = dt.getDay();
    return weekday === 0 || weekday === 6 || !!(HOLIDAYS[k] || SUBSTITUTE[k]);
  };
  // 최대 7일까지 탐색 (무한루프 방지)
  for (let i = 0; i < 7; i++) {
    if (!isHoliday(d)) break;
    d.setDate(d.getDate() + 1);
  }

  return toKey(d);
};
const isMonday = (dateStr) => {
  if (!dateStr) return false;
  return new Date(dateStr + 'T00:00:00').getDay() === 1;
};
const weekLabel = (d) => { const dt = new Date(d+'T00:00:00'); const s = new Date(dt); s.setDate(s.getDate()-(dt.getDay()===0?6:dt.getDay()-1)); const e = new Date(s); e.setDate(e.getDate()+4); return `${s.getFullYear()}년 ${s.getMonth()+1}월 ${Math.ceil(s.getDate()/7)}주차 (${fmt(localDateStr(s))}~${fmt(localDateStr(e))})`; };

// ─── Weekly Report ───
function WeeklyReport({ gp, user, scrollY, setScrollY, appData }) {
  const [projects, setProjects] = useState([]);
  const [reports, setReports] = useState([]);
  const [events, setEvents] = useState([]);
  const [users, setUsers] = useState([]);
  const [allWeeks, setAllWeeks] = useState([]);
  const [selWeek, setSelWeek] = useState('');
  const [loading, setLoading] = useState(true);
  const [allMembers, setAllMembers] = useState([]);
  const [isMobile, setIsMobile] = useState(typeof window !== 'undefined' && window.innerWidth < 768);
  const [openInputId, setOpenInputId] = useState(null);   // PC 인라인 입력 패널
  const [weeklyModal, setWeeklyModal] = useState(null);   // 모바일 모달

  useEffect(() => {
    const handle = () => setIsMobile(window.innerWidth < 768);
    window.addEventListener('resize', handle);
    return () => window.removeEventListener('resize', handle);
  }, []);

  useEffect(() => {
    if (!loading && scrollY) {
      setTimeout(() => window.scrollTo(0, scrollY), 50);
    }
  }, [loading]);

  // appData가 준비되면 사용, 아니면 자체 로드
  useEffect(() => {
    if (appData?.loaded) {
      applyAppData(appData);
    } else if (!appData?.loaded && !loading) {
      // appData 갱신 시 반영
    }
    // appData 객체 식별자로 의존 — reload 시 reports만 바뀌어도(개수 동일) 재반영되게.
    // (기존: projects.length 의존 → 주간보고 수정 저장이 새로고침 전엔 미반영되던 버그)
  }, [appData]);

  useEffect(() => {
    if (!appData?.loaded) loadAll();
  }, []);

  const applyAppData = (d) => {
    const pjs = d.projects;
    setProjects(pjs);
    setReports(d.reports);
    setEvents(d.events);
    setUsers(d.users);
    setAllMembers(d.members);
    const weeks = [...new Set(d.reports.map(r => r.week_date))].sort((a,b) => b.localeCompare(a));
    if (weeks.length === 0) weeks.push(thisMonday());
    setAllWeeks(weeks);
    setSelWeek(prev => prev && weeks.includes(prev) ? prev : weeks[0]);
    setLoading(false);
  };

  const loadAll = async () => {
    setLoading(true);
    const [pj, rp, ev, us, mb] = await Promise.all([
      sb.from('projects').select('*').order('name'),
      sb.from('weekly_reports').select('*').gte('week_date', sixMonthsAgo()).order('week_date', { ascending: false }),
      sb.from('project_events').select('*').gte('event_date', thirtyDaysAgo()),
      sb.from('users').select('id, name, role'),
      sb.from('project_members').select('*'),
    ]);
    setProjects(pj.data || []);
    setReports(rp.data || []);
    setEvents(ev.data || []);
    setUsers(us.data || []);
    setAllMembers(mb.data || []);
    const weeks = [...new Set((rp.data || []).map(r => r.week_date))].sort((a,b) => b.localeCompare(a));
    if (weeks.length === 0) weeks.push(thisMonday());
    setAllWeeks(weeks);
    setSelWeek(weeks[0]);
    setLoading(false);
  };

  const refresh = () => { if (appData?.reload) appData.reload(); else loadAll(); };

  // ── 인덱싱 (렌더 중 find/filter/sort 반복 제거) ──
  const userNameById = useMemo(() => {
    const m = new Map();
    for (const u of users) m.set(u.id, u.name || '');
    return m;
  }, [users]);
  const uName = (id) => userNameById.get(id) || '';

  const pmColorById = useMemo(() => buildPmColorMap(users), [users]);
  const pmColor = (id) => pmColorById[id] || { bg: '#64748b', tx: '#fff' };

  // project_id → 보고 배열(week_date desc)
  const reportsByProject = useMemo(() => {
    const m = new Map();
    for (const r of reports) {
      const arr = m.get(r.project_id);
      if (arr) arr.push(r); else m.set(r.project_id, [r]);
    }
    for (const arr of m.values()) arr.sort((a,b) => b.week_date.localeCompare(a.week_date));
    return m;
  }, [reports]);

  // project_id → 미완료 이벤트(event_date asc)
  // 날짜 기준: 오늘 포함 미래 or 오늘 기준 14일 이내 과거
  const eventsByProject = useMemo(() => {
    const todayStr = today();
    const cutoff = (() => { const d = new Date(todayStr+'T00:00:00'); d.setDate(d.getDate()-14); const y=d.getFullYear(),mo=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return y+'-'+mo+'-'+dd; })();
    const m = new Map();
    for (const e of events) {
      if (e.event_date < cutoff) continue; // 14일 초과 과거 제외
      const arr = m.get(e.project_id);
      if (arr) arr.push(e); else m.set(e.project_id, [e]);
    }
    for (const arr of m.values()) arr.sort((a,b) => a.event_date.localeCompare(b.event_date));
    return m;
  }, [events]);

  // 사용자별 멤버십 project_id Set
  const memberPidsByUser = useMemo(() => {
    const m = new Map();
    for (const mb of allMembers) {
      let s = m.get(mb.user_id);
      if (!s) { s = new Set(); m.set(mb.user_id, s); }
      s.add(mb.project_id);
    }
    return m;
  }, [allMembers]);

  // 기술지원은 배정된 프로젝트만 (컴포넌트 레벨에서 정의)
  const memberPids = user?.role === 'contractor'
    ? (memberPidsByUser.get(user.id) || new Set())
    : null;

  // 주간보고 입력 권한 체크
  const canInput = (p) => {
    if (user?.role === 'admin') return true;
    if (p.pm_id === user?.id) return true;
    const s = memberPidsByUser.get(user?.id);
    if (s && s.has(p.id)) return true;
    return false;
  };

  const sortedProjects = useMemo(() => {
    const catOrder = (c) => c === '사급' ? 0 : c === '관급' ? 1 : 2;
    const PM_ORDER = ['김병용','장용기','박호진','윤종수','이규민'];
    const pmOrder = (pmId) => { const n = userNameById.get(pmId) || ''; const i = PM_ORDER.indexOf(n); return i >= 0 ? i : 99; };
    // 선택 주 기준 progress_pct (week_date <= selWeek 중 최신)
    const getPctById = (pid) => {
      const arr = reportsByProject.get(pid);
      if (!arr) return 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i].week_date <= selWeek) return arr[i].progress_pct || 0;
      }
      return 0;
    };
    const statusOrder = (s) => s === '진행중' ? 0 : s === '중지' ? 1 : 2;

    return projects
      .filter(p => {
        const isLatestWeek = selWeek === allWeeks[0];
        if (!isLatestWeek) {
          const arr = reportsByProject.get(p.id);
          const hasReport = arr && arr.some(r => r.week_date <= selWeek);
          const sunday = (() => {
            const d = new Date(selWeek + 'T00:00:00');
            d.setDate(d.getDate() + 6);
            return localDateStr(d);
          })();
          const hasStarted = p.start_date && p.start_date <= sunday;
          if (!hasReport && !hasStarted) return false;
        }
        // 기술지원: 배정된 프로젝트만
        if (memberPids !== null && !memberPids.has(p.id)) return false;
        // 완료 처리된 용역: 완료된 다음 주부터 숨김
        if (p.status === '완료') {
          if (!p.completed_at) return false;
          return p.completed_at >= selWeek; // 완료된 주는 표시, 다음 주부터 숨김
        }
        // 중지 프로젝트는 무조건 표시
        if (p.status === '중지') return true;
        // 이전 최신 보고가 100%면 제외
        const arr = reportsByProject.get(p.id);
        const thisWeekReport = arr ? arr.find(r => r.week_date === selWeek) : null;
        if (!thisWeekReport && arr) {
          const latestReport = arr.find(r => r.week_date < selWeek);
          if (latestReport?.progress_pct === 100) return false;
        }
        return true;
      })
      .sort((a,b) =>
        catOrder(a.category) - catOrder(b.category) ||
        pmOrder(a.pm_id) - pmOrder(b.pm_id) ||
        statusOrder(a.status) - statusOrder(b.status) ||
        getPctById(b.id) - getPctById(a.id)
      );
  }, [projects, reportsByProject, userNameById, selWeek, memberPids, allWeeks]);

  const getReport = (pid) => {
    const arr = reportsByProject.get(pid);
    if (!arr) return null;
    const r = arr.find(x => x.week_date === selWeek);
    if (r) return { ...r, isThisWeek: true };
    const prev = arr.find(x => x.week_date < selWeek);
    return prev ? { ...prev, isThisWeek: false } : null;
  };

  const getNextEvent = (pid) => {
    const arr = eventsByProject.get(pid);
    return arr ? arr[0] : undefined;
  };

  // 오늘 기준 14일 이내 과거 공정 (취소선 표시용)
  const todayStr = today();

  const activeProjects = sortedProjects.filter(p => p.status !== '완료');
  const thisWeekReports = reports.filter(r => r.week_date === selWeek);
  const avgPct = activeProjects.length > 0 ? Math.round(activeProjects.reduce((s,p) => { const r = getReport(p.id); return s + (r?.progress_pct || 0); }, 0) / activeProjects.length) : 0;
  const issueCount = thisWeekReports.filter(r => r.issues).length;

  const twoWeeksLater = selWeek ? (() => { const d = new Date(selWeek+'T00:00:00'); d.setDate(d.getDate()+14); return localDateStr(d); })() : '';
  const upcomingEvs = events.filter(e =>
    selWeek &&
    e.event_date >= selWeek &&
    e.event_date <= twoWeeksLater &&
    (memberPids === null || memberPids.has(e.project_id))
  ).sort((a,b) => a.event_date.localeCompare(b.event_date));

  const handlePrint = () => {
    const el = document.getElementById('print-area');
    // 이벤트 색상 매핑
    const evColors = {
      '보고회':'#3b82f6',
      '위원회':'#ec4899','협의':'#f59e0b','측량':'#14b8a6','납품':'#a855f7','기타':'#94a3b8'
    };
    const evIcons = {'보고회':'🚀','위원회':'🏛️','협의':'🤝','측량':'📐','납품':'📬','기타':'📌'};
    const colgroup = `<colgroup>
      <col style="width:3%"/><col style="width:5%"/><col style="width:16%"/>
      <col style="width:10%"/><col style="width:5%"/><col style="width:6%"/>
      <col style="width:3%"/><col style="width:3%"/><col style="width:3%"/>
      <col style="width:38%"/><col style="width:8%"/>
    </colgroup>`;
    const tableHead = `<tr><th>번호</th><th>분류</th><th>용역명</th><th>발주처</th><th>PM</th><th>준공일</th><th>전주</th><th>금주</th><th>±</th><th>과업진행사항 / 주요공정</th><th>비고</th></tr>`;
    // XSS 방어 유틸
    const esc = (s) => s == null ? '' : String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

    const rows = sortedProjects.map((p, i) => {
      const r = getReport(p.id);
      const stopped = p.status === '중지';
      const d = r ? r.progress_pct - r.prev_pct : 0;
      const catColor = CAT_COLOR[p.category] || '#64748b';
      const nameStyle = stopped ? 'color:#9ca3af;font-weight:600' : 'font-weight:600';
      const todayForPrint = today();
      const upEv = events.filter(e => e.project_id === p.id && e.event_date >= todayForPrint)
        .sort((a,b) => a.event_date.localeCompare(b.event_date))
        .slice(0, 3);
      const evHtml = upEv.map(e => {
        const c = evColors[e.type] || '#94a3b8';
        const d2 = new Date(e.event_date+'T00:00:00');
        const ds = `${d2.getMonth()+1}/${d2.getDate()}`;
        return `<div style="margin-bottom:2px;font-size:6pt;"><span style="background:${c};color:#fff;padding:0 3px;border-radius:2px;font-weight:700;font-size:5.5pt">${esc(e.type)}</span> ${esc(e.title)} <span style="color:#888">(${ds})</span></div>`;
      }).join('');
        const isOverdue = p.end_date && p.end_date < selWeek && p.status !== '완료';
        const issueText = [
          isOverdue ? '⚠ 준공일 초과' : '',
          r?.issues || ''
        ].filter(Boolean).join(' / ');
        // XSS: DB 입력값(name, client, summary, issues 등) 이스케이프
        return `<tr class="${stopped ? 'stopped' : ''}">
        <td class="tc">${i+1}</td>
        <td class="tc"><span style="background:${catColor};color:#fff;padding:1px 3px;border-radius:2px;font-size:5.5pt;font-weight:700">${esc(p.category)}</span>${stopped?'<br/><span style="font-size:5pt;color:#9ca3af">중지</span>':''}</td>
        <td style="${nameStyle}">${esc(p.name)}</td>
        <td style="font-size:6.5pt">${esc(p.client)||''}${p.client_dept?`<br/><span style="color:#64748b">${esc(p.client_dept)}</span>`:''}${p.client_contact?`<br/><span style="color:#94a3b8">${esc(p.client_contact)}</span>`:''}</td>
        <td class="tc"><span style="background:${pmColor(p.pm_id).bg};color:${pmColor(p.pm_id).tx};padding:1px 4px;border-radius:3px;font-size:6pt;font-weight:700">${esc(uName(p.pm_id))}</span></td>
        <td class="tc" style="font-size:6.5pt;color:${isOverdue?'#dc2626':'#475569'};font-weight:${isOverdue?700:400}">${p.end_date?p.end_date.slice(2).replace(/-/g,'/'):'—'}</td>
        <td class="tc">${r?.prev_pct||0}</td>
        <td class="tc" style="font-weight:700">${r?.progress_pct||0}</td>
        <td class="tc" style="font-weight:700;color:${d>0?'#059669':d<0?'#dc2626':'#999'}">${d>0?('+'+d):d<0?d:'—'}</td>
        <td style="font-size:6.5pt">${r ? (r.isThisWeek ? (esc(r.summary)||'') : `<span style="color:#f59e0b;font-weight:700;font-size:5pt">[${r.week_date.slice(5).replace('-','/')} 기준]</span> ${esc(r.summary)||''}`) : ''}${evHtml?`<div style="margin-top:2px;border-top:0.5px solid #e2e8f0;padding-top:2px">${evHtml}</div>`:''}</td>
        <td style="font-size:6.5pt;color:${(isOverdue||r?.issues)?'#dc2626':'inherit'}">${esc(issueText)||''}</td>
      </tr>`;
    }).join('');
        el.innerHTML = `
      <div class="print-header">
        <div class="print-title">주간 공정 보고서</div>
        <div class="print-sub">${selWeek ? weekLabel(selWeek) : ''} &nbsp;|&nbsp; ${APP_CONFIG.COMPANY_KO} ${APP_CONFIG.COMPANY_EN}</div>
      </div>
      <div class="print-cols">
        <div class="print-col">
          <table class="ptbl">${colgroup}<thead>${tableHead}</thead><tbody>${rows}</tbody></table>
        </div>
      </div>`;
    const body = document.body;
    const allChildren = Array.from(body.children);
    allChildren.forEach(c => { if (c.id !== 'print-area') c.style.display = 'none'; });
    el.style.display = 'block';
    window.print();
    allChildren.forEach(c => { if (c.id !== 'print-area') c.style.display = ''; });
    el.style.display = 'none';
  };

  if (loading) return <Spinner />;

  return (
    <div>
      {/* Header */}
      <div style={{ marginBottom: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <h2 className="section-title" style={{ margin: 0 }}>📋 주간 공정 보고</h2>
          <button className="btn btn-primary btn-sm" onClick={handlePrint}>🖨 A3 인쇄</button>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <button className="btn btn-secondary btn-sm" onClick={() => { const i = allWeeks.indexOf(selWeek); if (i < allWeeks.length - 1) setSelWeek(allWeeks[i+1]); }}>◀</button>
          <span style={{ flex: 1, fontSize: 12, fontWeight: 700, color: '#334155', textAlign: 'center' }}>{selWeek ? weekLabel(selWeek) : ''}</span>
          <button className="btn btn-secondary btn-sm" onClick={() => { const i = allWeeks.indexOf(selWeek); if (i > 0) setSelWeek(allWeeks[i-1]); }}>▶</button>
        </div>
      </div>

      {/* Summary */}
      <div className="sum-grid">
        <div className="sum-card" style={{ borderTopColor: '#2563eb' }}><div className="sum-label">진행 프로젝트</div><div className="sum-val" style={{ color: '#2563eb' }}>{activeProjects.filter(p=>p.status==='진행중').length}<span className="sum-unit"> 건</span></div></div>
        <div className="sum-card" style={{ borderTopColor: thisWeekReports.length === activeProjects.filter(p=>p.status==='진행중').length ? '#059669' : '#f59e0b' }}><div className="sum-label">금주 보고</div><div className="sum-val" style={{ color: '#f59e0b' }}>{thisWeekReports.length}<span className="sum-unit"> / {activeProjects.filter(p=>p.status==='진행중').length}건</span></div></div>
        <div className="sum-card" style={{ borderTopColor: '#6366f1' }}><div className="sum-label">평균 공정률</div><div className="sum-val" style={{ color: '#6366f1' }}>{avgPct}<span className="sum-unit"> %</span></div></div>
        <div className="sum-card" style={{ borderTopColor: issueCount > 0 ? '#dc2626' : '#059669' }}><div className="sum-label">이슈</div><div className="sum-val" style={{ color: issueCount > 0 ? '#dc2626' : '#059669' }}>{issueCount}<span className="sum-unit"> 건</span></div></div>
      </div>

      {/* Upcoming events */}
      {upcomingEvs.length > 0 && (
        <div className="card card-p" style={{ marginBottom: 12, border: '1px solid #fde68a' }}>
          <div style={{ fontSize: 12, fontWeight: 800, color: '#92400e', marginBottom: 8 }}>🔜 향후 2주 주요 공정</div>
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
            {upcomingEvs.map(e => { const s = ec(e.type); const pn = projects.find(p => p.id === e.project_id)?.name || ''; return (
              <div key={e.id} className="upcoming-card" style={{ background: s.bg, borderColor: s.bd, flex: '1 1 260px', maxWidth: 380, cursor: 'pointer' }} onClick={() => { if(setScrollY) setScrollY(window.scrollY); gp(e.project_id)}}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                  <span>{EV_ICON[e.type]}</span>
                  <span style={{ fontWeight: 700, fontSize: 12, color: s.tx }}>{e.title}</span>
                  <Bd bg={s.bd}>{e.type}</Bd>
                  <span style={{ fontSize: 10, color: '#64748b' }}>{fs(e.event_date)}</span>
                </div>
                <div style={{ fontSize: 10, color: '#64748b', marginTop: 2 }}>{pn.length > 28 ? pn.slice(0,28)+'…' : pn}</div>
              </div>
            );})}
          </div>
        </div>
      )}

      {/* 통합 테이블 / 모바일 카드뷰 */}
      {isMobile ? (
        /* ── 모바일 카드 뷰 ── */
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {sortedProjects.map((p, idx) => {
            const r = getReport(p.id);
            const pct = r?.progress_pct || 0, prev = r?.prev_pct || 0;
            const ne = getNextEvent(p.id);
            const stopped = p.status === '중지';
            const d = pct - prev;
            const barColor = pct>=80?'#059669':pct>=50?'#2563eb':'#f59e0b';
            const isOverdue = p.end_date && p.end_date < selWeek && p.status !== '완료';
            return (
              <div key={p.id} style={{ background: '#fff', borderRadius: 10, border: '1px solid #e2e8f0', borderLeft: `4px solid ${CAT_COLOR[p.category]}`, padding: '12px 14px', opacity: stopped ? 0.65 : 1 }}>
                {/* 상단: 분류 + 번호 + PM */}
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 6 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <Bd bg={CAT_COLOR[p.category]}>{p.category}</Bd>
                    {stopped && <span style={{ fontSize: 9, color: '#9ca3af', fontWeight: 600 }}>중지</span>}
                    <span style={{ fontSize: 10, color: '#94a3b8' }}>#{idx+1}</span>
                  </div>
                  <span style={{ background: pmColor(p.pm_id).bg, color: pmColor(p.pm_id).tx, padding: '2px 8px', borderRadius: 4, fontSize: 11, fontWeight: 700 }}>{uName(p.pm_id)}</span>
                </div>
                {/* 용역명 */}
                <div style={{ fontSize: 13, fontWeight: 700, color: '#0f172a', lineHeight: 1.4, marginBottom: 6, cursor: 'pointer' }} onClick={() => { if(setScrollY) setScrollY(window.scrollY); gp(p.id)}}>
                  {p.name}
                </div>
                {/* 발주처 */}
                {p.client && <div style={{ fontSize: 11, color: '#64748b', marginBottom: 6 }}>{p.client}{p.client_dept ? ' / ' + p.client_dept : ''}</div>}
                {/* 공정률 바 */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6 }}>
                  <div style={{ flex: 1, height: 7, background: '#e2e8f0', borderRadius: 4, overflow: 'hidden' }}>
                    <div style={{ width: `${pct}%`, height: '100%', background: barColor, borderRadius: 4 }} />
                  </div>
                  <span style={{ fontSize: 12, fontWeight: 800, color: barColor, minWidth: 36 }}>{pct}%</span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: d>0?'#059669':d<0?'#dc2626':'#94a3b8' }}>
                    {d>0?`▲${d}`:d<0?`▼${Math.abs(d)}`:'—'}
                  </span>
                  <span style={{ fontSize: 10, color: '#94a3b8' }}>전주 {prev}%</span>
                </div>
                {/* 준공일 */}
                {p.end_date && (
                  <div style={{ fontSize: 10, color: isOverdue?'#dc2626':'#94a3b8', fontWeight: isOverdue?700:400, marginBottom: 5 }}>
                    {isOverdue ? '⚠ 준공일 초과 · ' : '📅 준공 · '}{fs(p.end_date)}
                  </div>
                )}
                {/* 과업진행사항 */}
                <div style={{ fontSize: 12, color: '#334155', lineHeight: 1.5, borderTop: '1px solid #f1f5f9', paddingTop: 6, marginTop: 4 }}>
                  {r?.isThisWeek
                    ? (r.summary || <span style={{ color: '#94a3b8' }}>—</span>)
                    : <span>
                          <span style={{ color: '#f59e0b', fontWeight: 600 }}>⚠ 미입력</span>
                          {r?.summary && (
                            <div style={{ marginTop: 4, padding: '5px 8px', background: '#f8fafc', borderRadius: 5, fontSize: 11, color: '#94a3b8', borderLeft: '3px solid #e2e8f0', lineHeight: 1.5 }}>
                              <span style={{ fontWeight: 600, color: '#64748b' }}>{ff(r.week_date)} 기준</span><br/>
                              {r.summary}
                            </div>
                          )}
                        </span>
                  }
                  {(eventsByProject.get(p.id) || []).filter(e => e.event_date >= todayStr).map(e => {
                    const s = ec(e.type);
                    return <div key={e.id} style={{ marginTop: 4, padding: '3px 7px', background: s.bg, borderRadius: 4, fontSize: 11, color: s.tx, display: 'inline-block' }}>{EV_ICON[e.type]} {e.title} ({fs(e.event_date)})</div>;
                  })}
                </div>
                {/* 이슈 */}
                {(isOverdue || r?.issues) && (
                  <div style={{ marginTop: 5, fontSize: 11, color: '#dc2626', fontWeight: 600 }}>
                    {isOverdue && '⚠ 준공일 초과 '}
                    {r?.issues}
                  </div>
                )}
                {/* 모바일 입력 버튼 */}
                {canInput(p) && (
                  <div className="no-print" style={{ marginTop: 8 }}>
                    <button
                      className="btn btn-success btn-sm"
                      style={{ width: '100%' }}
                      onClick={() => setWeeklyModal({ projectId: p.id, prevData: r })}
                    >
                      {r?.isThisWeek ? '✏️ 주간보고 수정' : '📝 주간보고 입력'}
                    </button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ) : (
        /* ── PC 테이블 뷰 ── */
        <div className="card" style={{ overflow: 'auto' }}>
          <table className="tbl" style={{ minWidth: 900 }}>
            <thead>
              <tr>
                <th style={{ width: 28, textAlign: 'center' }} className="no-print"></th>
                <th style={{ width: 28, textAlign: 'center' }}>번호</th>
                <th style={{ width: 44 }}>분류</th>
                <th>용역명</th>
                <th style={{ width: 110 }}>발주처</th>
                <th style={{ width: 52, textAlign: 'center' }}>PM</th>
                <th style={{ width: 60, textAlign: 'center' }}>준공일</th>
                <th style={{ width: 36, textAlign: 'center' }}>전주</th>
                <th style={{ width: 80, textAlign: 'center' }}>공정률</th>
                <th style={{ width: 32, textAlign: 'center' }}>증감</th>
                <th style={{ minWidth: 280 }}>과업진행사항 / 주요공정</th>
                <th style={{ width: 80 }}>비고/이슈</th>
              </tr>
            </thead>
            <tbody>
            {sortedProjects.map((p, idx) => {
              const r = getReport(p.id);
              const pct = r?.progress_pct || 0, prev = r?.prev_pct || 0;
              const ne = getNextEvent(p.id);
              const stopped = p.status === '중지';
              const d = pct - prev;
              const barColor = pct>=80?'#059669':pct>=50?'#2563eb':'#f59e0b';
              return (
                <React.Fragment key={p.id}>
                <tr style={{ opacity: stopped ? 0.55 : 1, background: stopped ? '#fafafa' : 'transparent', borderLeft: `3px solid ${CAT_COLOR[p.category]}` }}>
                  <td className="tc no-print" style={{ padding: '4px 2px', verticalAlign: 'middle' }}>
                    {canInput(p) && (
                      <button
                        onClick={() => setOpenInputId(openInputId === p.id ? null : p.id)}
                        style={{
                          display: 'flex', alignItems: 'center', justifyContent: 'center',
                          width: 22, height: 22, border: 'none', borderRadius: 4, cursor: 'pointer',
                          background: openInputId === p.id ? '#1d4ed8' : (r?.isThisWeek ? '#d1fae5' : '#fef3c7'),
                          color: openInputId === p.id ? '#fff' : (r?.isThisWeek ? '#065f46' : '#92400e'),
                          fontSize: 12,
                        }}
                      >
                        {openInputId === p.id ? '✕' : '📝'}
                      </button>
                    )}
                  </td>
                  <td className="tc" style={{ fontSize: 11, color: '#94a3b8', fontWeight: 700 }}>{idx+1}</td>
                  <td><Bd bg={CAT_COLOR[p.category]}>{p.category}</Bd>{stopped && <div style={{ fontSize: 9, color: '#9ca3af', marginTop: 1 }}>중지</div>}</td>
                  <td style={{ cursor: 'pointer' }} onClick={() => { if(setScrollY) setScrollY(window.scrollY); gp(p.id)}}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: '#0f172a', lineHeight: 1.4 }}>{p.name}</div>
                    <div style={{ fontSize: 10, color: '#94a3b8', marginTop: 1 }}>{fs(p.start_date)}~{fs(p.end_date)}</div>
                  </td>
                  <td style={{ fontSize: 11, color: '#475569', wordBreak: 'keep-all', overflowWrap: 'break-word' }}>
                    <div style={{ fontWeight: 600 }}>{p.client}</div>
                    {p.client_dept && <div style={{ fontSize: 10, color: '#64748b' }}>{p.client_dept}</div>}
                    {p.client_contact && <div style={{ fontSize: 10, color: '#94a3b8' }}>{p.client_contact}</div>}
                  </td>
                  <td className="tc">
                    <span style={{ background: pmColor(p.pm_id).bg, color: pmColor(p.pm_id).tx, padding: '2px 6px', borderRadius: 4, fontSize: 11, fontWeight: 700, whiteSpace: 'nowrap' }}>{uName(p.pm_id)}</span>
                  </td>
                  <td className="tc" style={{ fontSize: 10, color: p.end_date && p.end_date < selWeek && p.status !== '완료' ? '#dc2626' : '#475569', fontWeight: p.end_date && p.end_date < selWeek && p.status !== '완료' ? 700 : 400 }}>
                    {p.end_date ? fs(p.end_date) : '—'}
                  </td>
                  <td className="tc" style={{ fontSize: 11, color: '#64748b' }}>{prev}%</td>
                  <td>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                      <div style={{ width: 48, height: 6, background: '#e2e8f0', borderRadius: 3, overflow: 'hidden', flexShrink: 0 }}>
                        <div style={{ width: `${pct}%`, height: '100%', background: barColor, borderRadius: 3 }} />
                      </div>
                      <span style={{ fontSize: 11, fontWeight: 700, color: barColor, minWidth: 28 }}>{pct}%</span>
                    </div>
                  </td>
                  <td className="tc"><span style={{ fontSize: 11, fontWeight: 700, color: d>0?'#059669':d<0?'#dc2626':'#94a3b8' }}>{d>0?`▲${d}`:d<0?`▼${Math.abs(d)}`:'—'}</span></td>
                  <td style={{ fontSize: 11, color: '#334155', lineHeight: 1.5, wordBreak: 'keep-all', overflowWrap: 'break-word' }}>
                    {r?.isThisWeek
                      ? (r.summary || '—')
                      : <span>
                            <span style={{ color: '#f59e0b', fontWeight: 600 }}>⚠ 미입력</span>
                            {r?.summary && <span style={{ color: '#94a3b8', fontSize: 10, marginLeft: 4 }}>({ff(r.week_date)} 기준: {r.summary.length > 60 ? r.summary.slice(0, 60) + '…' : r.summary})</span>}
                          </span>
                    }
                    {(eventsByProject.get(p.id) || []).filter(e => e.event_date >= todayStr).map(e => {
                      const s = ec(e.type);
                      return <div key={e.id} style={{ marginTop: 3, padding: '2px 5px', background: s.bg, borderRadius: 3, fontSize: 10, color: s.tx, display: 'inline-block' }}>{EV_ICON[e.type]} {e.title} ({fs(e.event_date)})</div>;
                    })}
                  </td>
                  <td style={{ fontSize: 10 }}>
                    {p.end_date && p.end_date < selWeek && p.status !== '완료' && (
                      <div style={{ color: '#f59e0b', fontWeight: 700, marginBottom: r?.issues ? 3 : 0 }}>⚠ 준공일 초과</div>
                    )}
                    {r?.issues && <div style={{ color: '#dc2626' }}>{r.issues}</div>}
                  </td>
                </tr>
                {/* 인라인 입력 패널 */}
                {openInputId === p.id && (
                  <tr className="no-print">
                    <td colSpan={12} style={{ padding: 0, borderBottom: '2px solid #2563eb' }}>
                      <WeeklyInlineForm
                        projectId={p.id}
                        userId={user?.id}
                        selWeek={selWeek}
                        existingReport={r?.isThisWeek ? r : null}
                        prevReport={r?.isThisWeek ? null : r}
                        onClose={() => setOpenInputId(null)}
                        onSaved={() => { setOpenInputId(null); refresh(); }}
                      />
                    </td>
                  </tr>
                )}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      )}

      {/* 모바일 주간보고 모달 */}
      {weeklyModal && (
        <WeeklyReportModal
          projectId={weeklyModal.projectId}
          userId={user?.id}
          prevData={weeklyModal.prevData}
          onClose={() => setWeeklyModal(null)}
          onSaved={() => { setWeeklyModal(null); refresh(); }}
        />
      )}
    </div>
  );
}

// ─── Weekly Inline Form (주간보고 탭 PC 인라인 입력) ───
function WeeklyInlineForm({ projectId, userId, selWeek, existingReport, prevReport, onClose, onSaved }) {
  const defaultWeekDate = selWeek || reportMonday();
  const [weekDate, setWeekDate] = useState(defaultWeekDate);
  const [pct, setPct] = useState(existingReport?.progress_pct ?? prevReport?.progress_pct ?? 0);
  const [prevPct, setPrevPct] = useState(existingReport?.prev_pct ?? prevReport?.progress_pct ?? 0);
  const [summary, setSummary] = useState(existingReport?.summary ?? prevReport?.summary ?? '');
  const [issues, setIssues] = useState(existingReport?.issues ?? '');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const save = async () => {
    if (!summary.trim()) { setErr('과업진행사항을 입력해주세요.'); return; }
    if (!isMonday(weekDate)) { setErr('보고 기준일은 월요일이어야 합니다.'); return; }
    setLoading(true); setErr('');
    const payload = {
      project_id: projectId,
      week_date: weekDate,
      progress_pct: parseInt(pct) || 0,
      prev_pct: parseInt(prevPct) || 0,
      summary: summary.trim(),
      next_plan: '',
      issues: issues.trim(),
      reported_by: userId,
      updated_at: new Date().toISOString()
    };
    const { error } = await sb.from('weekly_reports').upsert(payload, { onConflict: 'project_id,week_date' });
    if (error) { setErr('저장 오류: ' + error.message); setLoading(false); return; }
    const { error: clErr } = await sb.from('change_logs').insert({
      project_id: projectId, field_name: '주간보고',
      old_value: String(prevPct) + '%' + (existingReport?.summary ? ' | ' + existingReport.summary : ''),
      new_value: String(parseInt(pct) || 0) + '% | ' + weekDate + (summary ? ' | ' + summary : ''),
      changed_by: userId, created_at: new Date().toISOString()
    });
    if (clErr) console.error('change_log insert error:', clErr.message);
    onSaved();
  };

  return (
    <div style={{ background: '#f0f9ff', borderTop: '1px solid #bfdbfe', padding: '14px 18px' }}>
      <div style={{ fontSize: 12, fontWeight: 800, color: '#1e40af', marginBottom: 12 }}>
        📝 주간보고 {existingReport ? '수정' : '입력'}
      </div>
      {err && <div className="alert alert-error" style={{ marginBottom: 8 }}>{err}</div>}
      <div style={{ display: 'grid', gridTemplateColumns: '160px 100px 100px 1fr', gap: 10, alignItems: 'end', marginBottom: 10 }}>
        <div>
          <label className="form-label">보고 기준일 (월요일)</label>
          <input
            type="date"
            className="form-input"
            value={weekDate}
            onChange={e => { if (isMonday(e.target.value) || !e.target.value) setWeekDate(e.target.value); else setErr('월요일만 선택 가능합니다.'); }}
          />
        </div>
        <div>
          <label className="form-label">전주 공정률(%)</label>
          <input type="number" className="form-input" min={0} max={100} value={prevPct} onChange={e => setPrevPct(e.target.value)} />
        </div>
        <div>
          <label className="form-label">금주 공정률(%)</label>
          <input type="number" className="form-input" min={0} max={100} value={pct} onChange={e => setPct(e.target.value)} />
        </div>
        <div>
          <label className="form-label">이슈 (선택)</label>
          <input className="form-input" value={issues} onChange={e => setIssues(e.target.value)} placeholder="없으면 비워두세요" />
        </div>
      </div>
      <div style={{ marginBottom: 10 }}>
        <label className="form-label">과업진행사항 *</label>
        <textarea
          className="form-input"
          rows={3}
          value={summary}
          onChange={e => setSummary(e.target.value)}
          placeholder="이번 주 과업 진행사항을 입력하세요"
          style={{ resize: 'vertical' }}
        />
      </div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <button className="btn btn-secondary btn-sm" onClick={onClose}>취소</button>
        <button className="btn btn-primary btn-sm" onClick={save} disabled={loading}>
          {loading ? '저장 중...' : '저장'}
        </button>
      </div>
    </div>
  );
}

// ─── Monthly Calendar ───
function MonthlyCalendar({ gp, calDate, setCalDate, user, appData }) {
  const [events, setEvents] = useState([]);
  const [projects, setProjects] = useState([]);
  const [allMembers, setAllMembers] = useState([]);
  const [selDate, setSelDate] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (appData?.loaded) {
      const mb = appData.members;
      const pjData = appData.projects;
      if (user?.role === 'contractor') {
        const myPids = new Set(mb.filter(m => m.user_id === user.id).map(m => m.project_id));
        setProjects(pjData.filter(p => myPids.has(p.id)));
        setEvents(appData.events.filter(e => myPids.has(e.project_id)));
      } else {
        setProjects(pjData);
        setEvents(appData.events);
      }
      setAllMembers(mb);
      setLoading(false);
    } else if (!appData?.loaded) {
      loadAll();
    }
  }, [appData?.loaded, appData?.events?.length]);

  const loadAll = async () => {
    const [ev, pj, mb] = await Promise.all([
      sb.from('project_events').select('*').gte('event_date', thirtyDaysAgo()),
      sb.from('projects').select('id, name, category, status, start_date, end_date'),
      sb.from('project_members').select('*'),
    ]);
    setAllMembers(mb.data || []);
    const pjData = pj.data || [];
    if (user?.role === 'contractor') {
      const myPids = new Set((mb.data || []).filter(m => m.user_id === user.id).map(m => m.project_id));
      setProjects(pjData.filter(p => myPids.has(p.id)));
      setEvents((ev.data || []).filter(e => myPids.has(e.project_id)));
    } else {
      setProjects(pjData);
      setEvents(ev.data || []);
    }
    setLoading(false);
  };

  // 착수일/준공일을 가상 이벤트로 변환 (auto: true 로 구분)
  const autoEvents = projects.flatMap(p => {
    const evs = [];
    if (p.start_date) evs.push({ id: `auto_start_${p.id}`, project_id: p.id, type: 'auto_start', title: '착수', name: p.name, event_date: p.start_date, auto: true });
    if (p.end_date) evs.push({ id: `auto_end_${p.id}`, project_id: p.id, type: 'auto_end', title: p.status === '완료' ? '준공(완료)' : '준공', name: p.name, event_date: p.end_date, auto: true, done: p.status === '완료' });
    return evs;
  });
  const allCalEvents = [...events, ...autoEvents];

  const y = calDate.getFullYear(), m = calDate.getMonth();
  const fd = new Date(y, m, 1).getDay();
  const dm = new Date(y, m+1, 0).getDate();
  const td = today();
  const cells = [];
  for (let i = 0; i < fd; i++) cells.push(null);
  for (let d = 1; d <= dm; d++) cells.push(d);
  const ds = (d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const selEvents = selDate ? allCalEvents.filter(e => e.event_date === selDate) : [];

  if (loading) return <Spinner />;

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <button className="btn btn-secondary btn-sm" onClick={() => setCalDate(new Date(y, m-1, 1))}>◀</button>
        <h2 className="section-title" style={{ margin: 0 }}>{y}년 {m+1}월</h2>
        <button className="btn btn-secondary btn-sm" onClick={() => setCalDate(new Date(y, m+1, 1))}>▶</button>
      </div>
      <div className="card" style={{ overflow: 'hidden', marginBottom: 12 }}>
        <div className="cal-grid">
          {DK.map((d,i) => <div key={d} className="cal-head" style={{ color: i===0?'#dc2626':i===6?'#2563eb':'#64748b' }}>{d}</div>)}
          {cells.map((d,i) => {
            if (!d) return <div key={`e${i}`} style={{ minHeight: 64, borderBottom: '1px solid #f1f5f9', borderRight: '1px solid #f1f5f9' }} />;
            const dt = ds(d), ev = allCalEvents.filter(e => e.event_date === dt);
            const isT = dt === td, isS = dt === selDate, dw = (fd+d-1)%7;
            const isHoliday = !!(HOLIDAYS[dt] || SUBSTITUTE[dt]);
            const dateColor = (dw===0 || isHoliday) ? '#dc2626' : dw===6 ? '#2563eb' : '#334155';
            return (
              <div key={d} className={`cal-cell ${isS?'selected':''} ${isT?'today':''}`} onClick={() => setSelDate(dt === selDate ? null : dt)}>
                <div className="cal-date" style={{ color: dateColor, fontWeight: isT?800:500 }}>
                  {d}{isT && <span style={{ fontSize: 7, background: '#f59e0b', color: '#fff', borderRadius: 2, padding: '0 2px', marginLeft: 2, fontWeight: 700 }}>TODAY</span>}
                </div>
                {(HOLIDAYS[dt]||SUBSTITUTE[dt]) && (
                  <div style={{ fontSize: 7, color: '#dc2626', lineHeight: 1.2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: 600 }}>
                    {HOLIDAYS[dt]||SUBSTITUTE[dt]}
                  </div>
                )}
                {ev.filter(e => !e.auto).slice(0,2).map(e => (
                  <div key={e.id} className={`cal-ev ev-${e.type}`}>{EV_ICON[e.type]} {e.title}</div>
                ))}
                {ev.filter(e => !e.auto).length > 2 && <div style={{ fontSize: 8, color: '#94a3b8' }}>+{ev.filter(e=>!e.auto).length-2}</div>}
                {ev.filter(e => e.auto && e.type === 'auto_end').map(e => (
                  <div key={e.id} style={{ fontSize: 8, marginTop: 1, padding: '1px 3px', borderRadius: 2, background: '#f3e8ff', color: '#6b21a8', fontWeight: 700, lineHeight: 1.4, wordBreak: 'keep-all' }}>
                    [준공] {e.name && e.name.length > 12 ? e.name.slice(0,12)+'…' : e.name}
                  </div>
                ))}
                {ev.filter(e => e.auto && e.type === 'auto_start').map(e => (
                  <div key={e.id} style={{ fontSize: 8, marginTop: 1, padding: '1px 3px', borderRadius: 2, background: '#dbeafe', color: '#1e40af', fontWeight: 700, lineHeight: 1.4, wordBreak: 'keep-all' }}>
                    [착수] {e.name && e.name.length > 12 ? e.name.slice(0,12)+'…' : e.name}
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>
      {selDate && (
        <div className="card card-p">
          <h3 style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', marginBottom: 10 }}>📅 {ff(selDate)} ({DK[new Date(selDate+'T00:00:00').getDay()]})</h3>
          {selEvents.length === 0 ? (
            <div style={{ fontSize: 13, color: '#94a3b8' }}>등록된 주요 공정이 없습니다.</div>
          ) : selEvents.map(e => {
            const pn = projects.find(p => p.id === e.project_id)?.name || '';
            if (e.auto) {
              const isEnd = e.type === 'auto_end';
              const bg = isEnd ? '#f3e8ff' : '#dbeafe';
              const bd = isEnd ? '#a855f7' : '#3b82f6';
              const tx = isEnd ? '#6b21a8' : '#1e40af';
              const icon = isEnd ? '📅' : '🚀';
              const label = isEnd ? '준공일' : '착수일';
              return (
                <div key={e.id} className="upcoming-card" style={{ background: bg, borderColor: bd, marginBottom: 6, cursor: 'pointer' }} onClick={() => gp(e.project_id)}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <span style={{ fontSize: 15 }}>{icon}</span>
                    <span style={{ fontWeight: 700, fontSize: 12, color: tx }}>{label}</span>
                  </div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: tx, marginTop: 2 }}>{pn}</div>
                </div>
              );
            }
            const s = ec(e.type);
            return (
              <div key={e.id} className="upcoming-card" style={{ background: s.bg, borderColor: s.bd, marginBottom: 6 }} onClick={() => gp(e.project_id)}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
                  <span style={{ fontSize: 15 }}>{EV_ICON[e.type]}</span>
                  <span style={{ fontWeight: 800, fontSize: 13, color: s.tx }}>{e.title}</span>
                  <Bd bg={s.bd}>{e.type}</Bd>
                </div>
                <div style={{ fontSize: 11, color: '#64748b', marginTop: 3 }}>{pn}</div>
              </div>
            );
          })}
        </div>
      )}

      {/* 주간 할일 목록 */}
      <WeeklyTaskList allCalEvents={allCalEvents} projects={projects} gp={gp} />
    </div>
  );
}

// ─── Weekly Task List (달력 안 주간 뷰) ───
function WeeklyTaskList({ allCalEvents, projects, gp }) {
  const getMonday = (d) => { const dt = new Date(d); dt.setDate(dt.getDate() - (dt.getDay() === 0 ? 6 : dt.getDay() - 1)); return dt; };
  const [weekStart, setWeekStart] = useState(() => getMonday(new Date()));

  const weekDates = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekStart); d.setDate(d.getDate() + i);
    return localDateStr(d);
  });
  const weekEnd = weekDates[6];
  const weekLabel = (() => {
    const s = weekDates[0], e = weekDates[6];
    const sd = new Date(s+'T00:00:00'), ed = new Date(e+'T00:00:00');
    return `${sd.getFullYear()}년 ${sd.getMonth()+1}월 ${Math.ceil(sd.getDate()/7)}주 (${sd.getMonth()+1}/${sd.getDate()} ~ ${ed.getMonth()+1}/${ed.getDate()})`;
  })();

  const weekEvents = allCalEvents
    .filter(e => e.event_date >= weekDates[0] && e.event_date <= weekEnd)
    .sort((a,b) => a.event_date.localeCompare(b.event_date));

  return (
    <div className="card card-p" style={{ marginTop: 12 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <h3 style={{ fontSize: 14, fontWeight: 800, color: '#0f172a', margin: 0 }}>📌 주간 일정</h3>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <button className="btn btn-secondary btn-sm" onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate()-7); setWeekStart(d); }}>◀</button>
          <span style={{ fontSize: 12, fontWeight: 700, color: '#334155', minWidth: 180, textAlign: 'center' }}>{weekLabel}</span>
          <button className="btn btn-secondary btn-sm" onClick={() => { const d = new Date(weekStart); d.setDate(d.getDate()+7); setWeekStart(d); }}>▶</button>
          <button className="btn btn-secondary btn-sm" onClick={() => setWeekStart(getMonday(new Date()))} style={{ fontSize: 10 }}>이번주</button>
        </div>
      </div>
      {weekEvents.length === 0 ? (
        <div style={{ fontSize: 13, color: '#94a3b8', padding: '8px 0' }}>이번 주 등록된 일정이 없습니다.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          {weekDates.map(date => {
            const dayEvs = weekEvents.filter(e => e.event_date === date);
            if (dayEvs.length === 0) return null;
            const dt = new Date(date+'T00:00:00');
            const dayLabel = `${dt.getMonth()+1}/${dt.getDate()} (${['일','월','화','수','목','금','토'][dt.getDay()]})`;
            return (
              <div key={date}>
                <div style={{ fontSize: 11, fontWeight: 700, color: '#64748b', marginBottom: 4, paddingBottom: 3, borderBottom: '1px solid #f1f5f9' }}>{dayLabel}</div>
                {dayEvs.map(e => {
                  const pn = projects.find(p => p.id === e.project_id)?.name || '';
                  if (e.auto) {
                    const isEnd = e.type === 'auto_end';
                    return (
                      <div key={e.id} style={{ padding: '6px 10px', borderRadius: 6, background: isEnd?'#f3e8ff':'#dbeafe', borderLeft: `3px solid ${isEnd?'#a855f7':'#3b82f6'}`, marginBottom: 4, cursor: 'pointer' }} onClick={() => gp(e.project_id)}>
                        <div style={{ fontSize: 11, fontWeight: 700, color: isEnd?'#6b21a8':'#1e40af' }}>{isEnd?'📅 준공일':'🚀 착수일'}</div>
                        <div style={{ fontSize: 12, color: '#334155', fontWeight: 600, marginTop: 1 }}>{pn}</div>
                      </div>
                    );
                  }
                  const s = ec(e.type);
                  return (
                    <div key={e.id} style={{ padding: '6px 10px', borderRadius: 6, background: s.bg, borderLeft: `3px solid ${s.bd}`, marginBottom: 4, cursor: 'pointer' }} onClick={() => gp(e.project_id)}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                        <span style={{ fontSize: 13 }}>{EV_ICON[e.type]}</span>
                        <span style={{ fontSize: 11, fontWeight: 700, color: s.tx }}>{e.title}</span>
                        <Bd bg={s.bd}>{e.type}</Bd>
                      </div>
                      <div style={{ fontSize: 12, color: '#475569', marginTop: 2 }}>{pn}</div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Project List ───
function ProjectList({ gp, user, listFilter, setListFilter, appData }) {
  const [projects, setProjects] = useState([]);
  const [reports, setReports] = useState([]);
  const [events, setEvents] = useState([]);
  const [users, setUsers] = useState([]);
  const [members, setMembers] = useState([]);
  const [sf, setSf] = useState(listFilter?.sf || '진행중');
  const [cf, setCf] = useState(listFilter?.cf || 'all');
  const [sortKey, setSortKey] = useState(listFilter?.sortKey || 'default');
  const [sortDir, setSortDir] = useState(listFilter?.sortDir || 1);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    if (setListFilter) setListFilter(p => ({ ...p, sf, cf, sortKey, sortDir }));
  }, [sf, cf, sortKey, sortDir]);

  useEffect(() => {
    if (!loading && listFilter?.scrollY) {
      setTimeout(() => window.scrollTo(0, listFilter.scrollY), 50);
    }
  }, [loading]);

  const handleGp = (id) => {
    if (setListFilter) setListFilter(p => ({ ...p, scrollY: window.scrollY }));
    gp(id);
  };

  useEffect(() => {
    if (appData?.loaded) {
      setProjects(appData.projects);
      setReports(appData.reports);
      setEvents(appData.events);
      setUsers(appData.users);
      setMembers(appData.members);
      setLoading(false);
    } else if (!appData?.loaded) {
      loadAll();
    }
  }, [appData?.loaded, appData?.projects?.length]);

  const loadAll = async () => {
    const [pj, rp, ev, us, mb] = await Promise.all([
      sb.from('projects').select('*, completed_at').order('name'),
      sb.from('weekly_reports').select('project_id, week_date, progress_pct').gte('week_date', sixMonthsAgo()).order('week_date', { ascending: false }),
      sb.from('project_events').select('*').gte('event_date', thirtyDaysAgo()),
      sb.from('users').select('id, name'),
      sb.from('project_members').select('*'),
    ]);
    setProjects(pj.data || []);
    setReports(rp.data || []);
    setEvents(ev.data || []);
    setUsers(us.data || []);
    setMembers(mb.data || []);
    setLoading(false);
  };

  // ── 인덱싱 (렌더 중 find/filter/sort 반복 제거) ──
  const userNameById = useMemo(() => {
    const m = new Map();
    for (const u of users) m.set(u.id, u.name || '');
    return m;
  }, [users]);
  const uName = (id) => userNameById.get(id) || '';

  // project_id → 최신 progress_pct
  const latestPctById = useMemo(() => {
    const best = new Map(); // pid -> {date, pct}
    for (const r of reports) {
      const cur = best.get(r.project_id);
      if (!cur || r.week_date > cur.date) {
        best.set(r.project_id, { date: r.week_date, pct: r.progress_pct || 0 });
      }
    }
    const m = new Map();
    for (const [k, v] of best) m.set(k, v.pct);
    return m;
  }, [reports]);
  const getPct = (pid) => latestPctById.get(pid) || 0;

  // project_id → 다음 이벤트
  const nextEventById = useMemo(() => {
    const todayStr2 = today();
    const m = new Map();
    for (const e of events) {
      if (e.event_date < todayStr2) continue; // 오늘 기준 미래 공정만
      const cur = m.get(e.project_id);
      if (!cur || e.event_date < cur.event_date) m.set(e.project_id, e);
    }
    return m;
  }, [events]);
  const getNext = (pid) => nextEventById.get(pid);

  // project_id → 이번 주 보고 존재 여부
  const reportPidsThisWeek = useMemo(() => {
    const mn = thisMonday();
    const s = new Set();
    for (const r of reports) if (r.week_date >= mn) s.add(r.project_id);
    return s;
  }, [reports]);
  const hasReportThisWeek = (pid) => reportPidsThisWeek.has(pid);

  const PM_ORDER = ['김병용','장용기','박호진','윤종수','이규민'];
  const pmOrder = (pmId) => { const n = userNameById.get(pmId) || ''; const i = PM_ORDER.indexOf(n); return i >= 0 ? i : 99; };
  const catOrder = (c) => c === '사급' ? 0 : c === '관급' ? 1 : 2;

  const handleSort = (key) => {
    if (key === 'default') { setSortKey('default'); setSortDir(1); return; }
    if (sortKey === key) setSortDir(d => d * -1);
    else { setSortKey(key); setSortDir(1); }
  };

  const SORT_OPTIONS = [
    { key: 'default',    label: '기본순',   noToggle: true },
    { key: 'progress',   label: '공정률'  },
    { key: 'start_date', label: '착수일순' },
    { key: 'end_date',   label: '준공일순' },
    { key: 'name',       label: '이름순'  },
    { key: 'unreported', label: '미보고우선' },
    { key: 'client',     label: '발주처순' },
    { key: 'pm',         label: 'PM순'    },
  ];

  const applySort = (list) => {
    if (sortKey === 'default') return list;
    return [...list].sort((a, b) => {
      switch (sortKey) {
        case 'progress':
          return (getPct(b.id) - getPct(a.id)) * sortDir;
        case 'start_date':
          return (a.start_date || '').localeCompare(b.start_date || '') * sortDir;
        case 'end_date':
          return (a.end_date || '').localeCompare(b.end_date || '') * sortDir;
        case 'name':
          return a.name.localeCompare(b.name) * sortDir;
        case 'unreported': {
          const ua = hasReportThisWeek(a.id) ? 1 : 0;
          const ub = hasReportThisWeek(b.id) ? 1 : 0;
          return (ua - ub) * sortDir;
        }
        case 'client':
          return (a.client || '').localeCompare(b.client || '') * sortDir;
        case 'pm':
          return uName(a.pm_id).localeCompare(uName(b.pm_id)) * sortDir;
        default: return 0;
      }
    });
  };

  // 기술지원(contractor)은 배정된 프로젝트만 표시
  const memberProjectIds = useMemo(() => {
    if (user?.role !== 'contractor') return null;
    const s = new Set();
    for (const m of (members || [])) if (m.user_id === user.id) s.add(m.project_id);
    return s;
  }, [members, user?.id, user?.role]);
  const baseFiltered = projects.filter(p =>
    (cf === 'all' || p.category === cf) &&
    (memberProjectIds === null || memberProjectIds.has(p.id))
  );
  const active = applySort(
    baseFiltered
      .filter(p => p.status !== '완료')
      .filter(p => sf === 'all' || p.status === sf)
      .sort((a,b) =>
        sortKey !== 'default' ? 0 :
        catOrder(a.category) - catOrder(b.category) ||
        pmOrder(a.pm_id) - pmOrder(b.pm_id) ||
        (a.status === '중지' ? 1 : 0) - (b.status === '중지' ? 1 : 0) ||
        (getPct(b.id) - getPct(a.id))
      )
  );
  const completed = baseFiltered
    .filter(p => p.status === '완료')
    .sort((a,b) => (b.completed_at || b.end_date || '').localeCompare(a.completed_at || a.end_date || ''));
  const filtered = sf === '완료' ? completed : sf === 'all' ? [...active, ...completed] : active;

  if (loading) return <Spinner />;

  return (
    <div>
      {/* 제목 + 상태/분류 필터 */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8, flexWrap: 'wrap', gap: 6 }}>
        <h2 className="section-title" style={{ margin: 0 }}>📊 프로젝트 목록</h2>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', gap: 2 }}>
            {['all','진행중','중지','완료'].map(s => (
              <button key={s} className="btn btn-sm" style={{ background: sf===s?'var(--theme,#0f172a)':'#fff', color: sf===s?'#fff':'#64748b', border: '1px solid #e2e8f0' }} onClick={() => setSf(s)}>{s==='all'?'전체':s}</button>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 2 }}>
            {['all','관급','사급','기술지원'].map(c => (
              <button key={c} className="btn btn-sm" style={{ background: cf===c?'var(--theme,#0f172a)':'#fff', color: cf===c?'#fff':'#64748b', border: '1px solid #e2e8f0' }} onClick={() => setCf(c)}>{c==='all'?'전체':c}</button>
            ))}
          </div>
        </div>
      </div>

      {/* 정렬 버튼 */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap', marginBottom: 10, padding: '7px 10px', background: '#fff', borderRadius: 8, boxShadow: '0 1px 3px rgba(0,0,0,.05)' }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: '#94a3b8', marginRight: 2, whiteSpace: 'nowrap' }}>정렬</span>
        {SORT_OPTIONS.map(opt => {
          const isActive = sortKey === opt.key;
          const dirIcon = isActive && !opt.noToggle ? (sortDir === 1 ? ' ▲' : ' ▼') : '';
          return (
            <button
              key={opt.key}
              onClick={() => handleSort(opt.key)}
              style={{
                padding: '4px 10px',
                borderRadius: 5,
                border: isActive ? '1.5px solid #2563eb' : '1px solid #e2e8f0',
                background: isActive ? '#eff6ff' : '#f8fafc',
                color: isActive ? '#1d4ed8' : '#64748b',
                fontSize: 11,
                fontWeight: isActive ? 700 : 500,
                cursor: 'pointer',
                whiteSpace: 'nowrap',
                transition: 'all .15s',
                fontFamily: "'Noto Sans KR', sans-serif",
              }}
            >{opt.label}{dirIcon}</button>
          );
        })}
      </div>

      {filtered.map(p => {
        const pct = getPct(p.id), ne = getNext(p.id);
        const stopped = p.status === '중지';
        return (
          <div key={p.id} className={`proj-card ${stopped?'stopped':''}`} style={{ borderLeftColor: stopped ? '#d1d5db' : CAT_COLOR[p.category], opacity: p.status==='완료'?0.55:1 }} onClick={() => handleGp(p.id)}>
            <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 6 }}>
              <div style={{ flex: 1, minWidth: 180 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 4, marginBottom: 2 }}>
                  <Bd bg={CAT_COLOR[p.category]}>{p.category}</Bd>
                  <Bd bg={STATUS_COLOR[p.status]}>{p.status}</Bd>
                </div>
                <div className="proj-name" style={{ color: stopped?'#9ca3af':'var(--theme,#0f172a)' }}>{p.name}</div>
                <div style={{ fontSize: 10, color: '#64748b' }}>{p.client} · PM: {uName(p.pm_id)} · {fs(p.start_date)}~{fs(p.end_date)}</div>
                {ne && <div style={{ fontSize: 10, color: ec(ne.type).tx, marginTop: 2 }}>{EV_ICON[ne.type]} {ne.title} ({fs(ne.event_date)})</div>}
              </div>
              <PBar pct={pct} w={110} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Project Detail ───
function ProjectDetail({ id, user, gb }) {
  const [project, setProject] = useState(null);
  const [members, setMembers] = useState([]);
  const [events, setEvents] = useState([]);
  const [reports, setReports] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editModal, setEditModal] = useState(null);
  const [delEvId, setDelEvId] = useState(null);
  const [editEvData, setEditEvData] = useState(null);

  const deleteEvent = async (evId) => {
    if (delEvId === evId) {
      const evTarget = events.find(e => e.id === evId);
      if (evTarget) { const { error: clErr } = await sb.from('change_logs').insert({ project_id: evTarget.project_id, field_name: '주요공정 삭제', old_value: evTarget.type + ' | ' + evTarget.title + ' | ' + evTarget.event_date, new_value: '', changed_by: user?.id, created_at: new Date().toISOString() }); if (clErr) console.error('change_log insert error:', clErr.message); }
      await sb.from('project_events').delete().eq('id', evId);
      setDelEvId(null); loadAll();
    } else {
      setDelEvId(evId);
      setTimeout(() => setDelEvId(null), 3000);
    }
  };

  useEffect(() => { loadAll(); }, [id]);
  const loadAll = async () => {
    setLoading(true);
    const [pj, mb, ev, rp, us] = await Promise.all([
      sb.from('projects').select('*').eq('id', id).single(),
      sb.from('project_members').select('*').eq('project_id', id),
      sb.from('project_events').select('*').eq('project_id', id).order('event_date'),
      sb.from('weekly_reports').select('*').eq('project_id', id).order('week_date'),
      sb.from('users').select('id, name'),
    ]);
    setProject(pj.data);
    setMembers(mb.data || []);
    setEvents(ev.data || []);
    setReports(rp.data || []);
    setUsers(us.data || []);
    setLoading(false);
  };

  const uName = (uid) => users.find(u => u.id === uid)?.name || '';
  if (loading) return <Spinner />;
  if (!project) return <div style={{ padding: 20, color: '#94a3b8' }}>프로젝트를 찾을 수 없습니다.</div>;

  const p = project;
  const lp = reports.length > 0 ? reports[reports.length-1].progress_pct : 0;
  const todayForDetail = today();
  const ue = events.filter(e => e.event_date >= todayForDetail);
  const de = events.filter(e => e.event_date < todayForDetail);
  const stopped = p.status === '중지';

  // Line chart
  const renderChart = () => {
    if (reports.length < 2) return null;
    const W=520, H=140, PL=32, PR=12, PT=16, PB=24, cw=W-PL-PR, ch=H-PT-PB;
    const pts = reports.map((r,i) => ({ x: PL+(i/(reports.length-1))*cw, y: PT+ch-(r.progress_pct/100)*ch, pct: r.progress_pct, d: fmt(r.week_date) }));
    const ln = pts.map((p,i) => `${i===0?'M':'L'}${p.x},${p.y}`).join(' ');
    const ar = `${ln} L${pts[pts.length-1].x},${PT+ch} L${pts[0].x},${PT+ch} Z`;
    return (
      <div className="card card-p" style={{ marginBottom: 10 }}>
        <div style={{ fontSize: 12, fontWeight: 800, color: '#0f172a', marginBottom: 6 }}>📈 공정률 추이</div>
        <svg viewBox={`0 0 ${W} ${H}`} style={{ width: '100%', height: 'auto' }}>
          {[0,25,50,75,100].map(v => { const y=PT+ch-(v/100)*ch; return <g key={v}><line x1={PL} x2={W-PR} y1={y} y2={y} stroke="#f1f5f9" strokeWidth={1}/><text x={PL-3} y={y+3} textAnchor="end" fontSize={8} fill="#94a3b8">{v}</text></g>; })}
          <path d={ar} fill="url(#pag)" opacity={0.25}/>
          <path d={ln} fill="none" stroke="#3b82f6" strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"/>
          {pts.map((pt,i) => <g key={i}><circle cx={pt.x} cy={pt.y} r={3} fill="#fff" stroke="#3b82f6" strokeWidth={2}/><text x={pt.x} y={pt.y-6} textAnchor="middle" fontSize={8} fontWeight={700} fill="#1d4ed8">{pt.pct}%</text><text x={pt.x} y={PT+ch+12} textAnchor="middle" fontSize={7} fill="#94a3b8">{pt.d}</text></g>)}
          <defs><linearGradient id="pag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3b82f6"/><stop offset="100%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
        </svg>
      </div>
    );
  };

  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
        <button className="btn btn-secondary btn-sm" onClick={gb}>← 목록</button>
        {(user?.role === 'admin' || project?.pm_id === user?.id || members.some(m => m.user_id === user?.id)) && (
          <button className="btn btn-success btn-sm" onClick={() => setEditModal('report')}>📝 주간보고 입력</button>
        )}
        {(user?.role === 'admin' || members.some(m => m.user_id === user?.id && m.role === 'pm')) && (
          <button className="btn btn-secondary btn-sm" onClick={() => setEditModal('event')}>📌 주요공정 등록</button>
        )}
        {(user?.role === 'admin' || project?.pm_id === user?.id) && (
          <button className="btn btn-secondary btn-sm" onClick={() => setEditModal('editProject')}>✏️ 프로젝트 수정</button>
        )}
      </div>
      {/* Header */}
      <div className="card card-p" style={{ marginBottom: 10, borderLeft: `5px solid ${stopped?'#d1d5db':CAT_COLOR[p.category]}` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 5 }}>
          <Bd bg={stopped?'#d1d5db':CAT_COLOR[p.category]}>{p.category}</Bd>
          <Bd bg={STATUS_COLOR[p.status]}>{p.status}</Bd>
        </div>
