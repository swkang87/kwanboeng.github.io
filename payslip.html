<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;color:#0f172a;font-size:14px;overflow-x:hidden;}
.sys-bar{position:sticky;top:0;z-index:300;}
.ps-page{max-width:1100px;margin:0 auto;padding:24px 16px 48px;}
.ps-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.ps-title{font-size:20px;font-weight:800;}
.ps-sub{font-size:12px;color:#64748b;margin-top:2px;}
.ps-body{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start;}
.ps-list{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;position:sticky;top:calc(var(--sysbar-h,38px) + 18px);}
.ps-list-h{font-size:11px;font-weight:700;color:#64748b;padding:10px 14px;border-bottom:1px solid #e2e8f0;background:#f8fafc;}
.ps-item{display:block;width:100%;text-align:left;padding:10px 14px;border:none;border-bottom:1px solid #f1f5f9;background:#fff;cursor:pointer;font-size:13px;color:#0f172a;}
.ps-item:last-child{border-bottom:none;}
.ps-item:hover{background:#f8fafc;}
.ps-item.on{background:#f5f3ff;box-shadow:inset 3px 0 0 #7c3aed;font-weight:700;}
.ps-item small{display:block;font-size:11px;color:#94a3b8;font-weight:400;margin-top:2px;}
.ps-tag{display:inline-block;font-size:10px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:10px;padding:0 6px;margin-left:4px;vertical-align:1px;}
.ps-sel{display:none;width:100%;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-weight:700;background:#fff;margin-bottom:12px;}
.ps-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;background:#7c3aed;color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
.ps-btn.s{background:#fff;color:#475569;border:1px solid #e2e8f0;}
.ps-gate{max-width:380px;margin:40px auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px 24px;text-align:center;}
.ps-gate h2{font-size:17px;font-weight:800;margin-bottom:6px;}
.ps-gate p{font-size:13px;color:#64748b;line-height:1.6;margin-bottom:16px;}
.ps-gate input{width:100%;padding:12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:20px;letter-spacing:8px;text-align:center;margin-bottom:12px;}
.ps-gate .ps-btn{width:100%;justify-content:center;padding:12px;}
.ps-msg{font-size:12px;border-radius:8px;padding:9px 12px;margin-bottom:12px;line-height:1.6;}
.ps-msg.e{background:#fee2e2;color:#991b1b;}
.ps-msg.w{background:#fef3c7;color:#92400e;}
.ps-box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:48px 20px;text-align:center;color:#64748b;font-size:14px;line-height:1.7;}
.ps-box b{color:#0f172a;}
.ps-note{font-size:11px;color:#94a3b8;margin-top:10px;text-align:center;}
@media(max-width:768px){
  .ps-page{padding:14px 10px 40px;}
  .ps-body{grid-template-columns:1fr;}
  .ps-list{display:none;}
  .ps-sel{display:block;}
  .ps-title{font-size:18px;}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// Supabase 클라이언트는 최초 사용 시점에 함수 안에서 생성한다.
var _sb = null;
function getSb() {
  if (!_sb) _sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
  return _sb;
}

var PCFG = (window.APP_CONFIG && APP_CONFIG.PAYROLL) || {};
var PayslipSheet = PayslipRender.createSheet(React);
var PayslipPrintCopy = PayslipRender.createPrintCopy(React, ReactDOM);
var SysBar = Sysbar.createComponent(React);
var LoginScreen = Sysbar.createLoginComponent(React, { subtitle: '급여명세서', blockedRoles: ['contractor'] });

function periodKo(p) { return p.slice(0, 4) + '년 ' + parseInt(p.slice(5, 7), 10) + '월'; }
function queryPeriod() {
  var m = /[?&]period=(\d{4}-\d{2})(?:&|$)/.exec(window.location.search || '');
  return m ? m[1] : '';
}

// ── 생년월일 6자리 확인 ────────────────────────────────────────────
// 명세서·항목은 서버 함수(payslip_list / payslip_lines)로만 받는다. 함수는 이 창이 생년월일 확인을 통과했을 때만 준다.
// 창 토큰: 화면을 열 때마다 새로 만들어 메모리에만 둔다(저장하지 않음) → 다른 메뉴로 갔다 오거나 새로고침하면 다시 입력.
// 화면을 떠날 때(pagehide) payslip_lock 으로 서버 쪽 통과 기록도 끝낸다(실패해도 무시 — 토큰이 사라져 어차피 다시 쓸 수 없다).
// 서버는 토큰의 해시와 로그인 세션을 함께 확인한다 → 로그아웃 후 다시 로그인해도 다시 잠긴다.
// 횟수·잠금·유지 시간은 config PAYROLL.SLIP_VERIFY_* (관리자 급여 화면이 서버로 복사).
function makeSlipToken() {
  var a = new Uint8Array(32);
  window.crypto.getRandomValues(a);
  return Array.prototype.map.call(a, function(b) { return ('0' + b.toString(16)).slice(-2); }).join('');
}
var _slipToken = makeSlipToken();
function slipToken() { return _slipToken; }
function renewSlipToken() { _slipToken = makeSlipToken(); }

// pagehide 때 쓸 로그인 토큰 — 떠나는 순간엔 비동기 조회를 기다릴 수 없어 미리 받아 둔다
var _lockAuth = '';
function rememberLockAuth() {
  getSb().auth.getSession().then(function(r) {
    var s = r && r.data && r.data.session;
    _lockAuth = (s && s.access_token) || '';
  }, function() {});
}
// 화면을 떠날 때 이 창의 통과 기록을 끝낸다. 페이지가 내려가도 요청이 끝나도록 keepalive fetch 로 부른다.
function lockOnLeave() {
  if (!_lockAuth) return;
  try {
    fetch(APP_CONFIG.SUPABASE_URL + '/rest/v1/rpc/payslip_lock', {
      method: 'POST', keepalive: true,
      headers: { 'Content-Type': 'application/json', apikey: APP_CONFIG.SUPABASE_KEY, Authorization: 'Bearer ' + _lockAuth },
      body: JSON.stringify({ p_token: _slipToken }),
    }).catch(function() {});
  } catch (e) {}
}
window.addEventListener('pagehide', lockOnLeave);
function isLockedErr(err) { return !!err && err.code === '42501' && /PAYSLIP_LOCKED/.test(err.message || ''); }
function hhmm(ts) { var d = new Date(ts); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function minutesLeft(ts) { return Math.max(1, Math.ceil((new Date(ts).getTime() - Date.now()) / 60000)); }

// 확인을 통과한 창에만: 본인 확정 지급용 명세서 [{ run, slip }] (최근 귀속월 먼저)
function loadMySlips() {
  return getSb().rpc('payslip_list', { p_token: slipToken() }).then(function(r) {
    if (r.error) throw r.error;
    return (r.data || []).filter(function(e) { return e && e.run && e.slip; });
  });
}

function loadLines(slipId) {
  return getSb().rpc('payslip_lines', { p_token: slipToken(), p_slip_id: slipId }).then(function(r) {
    if (r.error) throw r.error;
    return r.data || [];
  });
}

// 생년월일 입력 화면
function GateBox({ status, onUnlocked }) {
  const [v, setV] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [st, setSt] = useState(status);
  var adminTeam = (window.APP_CONFIG && APP_CONFIG.ADMIN_TEAM_NAME) || '관리자';

  if (!st.has_birth_date) return (
    <div className="ps-gate">
      <h2>🔒 본인 확인</h2>
      <div className="ps-msg w">생년월일이 등록되지 않았습니다. {adminTeam}에 문의하세요.</div>
    </div>
  );

  var locked = st.locked && st.locked_until;
  function submit(e) {
    if (e) e.preventDefault();
    if (!/^\d{6}$/.test(v)) { setMsg({ t: 'e', s: '생년월일 6자리(YYMMDD)를 숫자로 입력하세요.' }); return; }
    setBusy(true); setMsg(null);
    getSb().rpc('payslip_verify', { p_birth6: v, p_token: slipToken() }).then(function(r) {
      setBusy(false); setV('');
      if (r.error) { Sysbar.showError(r.error, '본인 확인'); return; }
      var d = r.data || {};
      if (d.status === 'ok') { rememberLockAuth(); onUnlocked(); return; }
      if (d.status === 'wrong') { setMsg({ t: 'e', s: '생년월일이 맞지 않습니다. 남은 횟수 ' + d.remaining + '회' }); return; }
      if (d.status === 'locked') { setSt(Object.assign({}, st, { locked: true, locked_until: d.locked_until })); setMsg(null); return; }
      if (d.status === 'no_birth_date') { setSt(Object.assign({}, st, { has_birth_date: false })); return; }
      setMsg({ t: 'e', s: '생년월일 6자리(YYMMDD)를 숫자로 입력하세요.' });
    });
  }

  return (
    <form className="ps-gate" onSubmit={submit}>
      <h2>🔒 본인 확인</h2>
      <p>급여명세서를 보려면 생년월일 6자리를 입력하세요.<br/>(예: 1990년 3월 7일 → 900307)</p>
      {locked ? (
        <div className="ps-msg e">입력을 여러 번 틀려 잠겼습니다. {minutesLeft(st.locked_until)}분 뒤({hhmm(st.locked_until)}) 다시 시도하세요.<br/>급한 경우 {adminTeam}에 잠금 해제를 요청하세요.</div>
      ) : (
        <div>
          {msg && <div className={'ps-msg ' + msg.t}>{msg.s}</div>}
          <input type="password" inputMode="numeric" autoComplete="off" maxLength={6} value={v} placeholder="YYMMDD" autoFocus
            onChange={function(ev){ setV(ev.target.value.replace(/[^0-9]/g, '').slice(0, 6)); }} />
          <button type="submit" className="ps-btn" disabled={busy || v.length !== 6}>{busy ? '확인 중...' : '확인'}</button>
        </div>
      )}
    </form>
  );
}

function toModel(entry, lines) {
  var s = entry.slip, r = entry.run;
  function pick(kind) {
    return lines.filter(function(l) { return l.item_kind === kind; })
      .map(function(l) { return { name: l.item_name, amount: l.amount, method: l.method || '' }; });
  }
  return {
    period: r.period, runType: r.run_type, payDate: r.pay_date,
    name: s.name_snap, birthDate: s.birth_date_snap, hireDate: s.hire_date_snap,
    dept: s.dept_snap, position: s.position_snap, employeeNo: s.employee_no_snap,
    earnings: pick('earning'), deductions: pick('deduction'),
    totalEarning: s.total_earning, totalDeduction: s.total_deduction, netPay: s.net_pay,
  };
}

function PayslipPage({ user }) {
  const [gate, setGate] = useState(null);       // payslip_gate_status 결과
  const [opened, setOpened] = useState(false);  // 이 창이 확인을 통과했는지
  const [loading, setLoading] = useState(true);
  const [entries, setEntries] = useState([]);
  const [selId, setSelId] = useState('');
  const [model, setModel] = useState(null);
  const [lineLoading, setLineLoading] = useState(false);
  const [err, setErr] = useState('');

  useEffect(function() {
    rememberLockAuth();
    getSb().rpc('payslip_gate_status', { p_token: slipToken() }).then(function(r) {
      if (r.error) { Sysbar.showError(r.error, '본인 확인 상태'); setGate({ has_birth_date: true }); return; }
      setGate(r.data || {});
      if (r.data && r.data.unlocked) setOpened(true);
    });
  }, []);

  // 뒤로 가기 등으로 보관된 화면이 다시 보이면(bfcache) 새 토큰으로 다시 입력 화면에서 시작
  useEffect(function() {
    function onShow(ev) { if (ev.persisted) { renewSlipToken(); relock(); } }
    window.addEventListener('pageshow', onShow);
    return function() { window.removeEventListener('pageshow', onShow); };
  }, []);

  // 통과 시간이 지나 서버가 거부하면 다시 입력 화면으로
  function relock() {
    setOpened(false); setEntries([]); setSelId(''); setModel(null); setLoading(true);
    getSb().rpc('payslip_gate_status', { p_token: slipToken() }).then(function(r) { setGate(r.data || { has_birth_date: true }); });
  }

  useEffect(function() {
    if (!opened) return;
    loadMySlips().then(function(list) {
      setEntries(list);
      var want = queryPeriod();
      var hit = want ? list.filter(function(e) { return e.run.period === want; })[0] : null;
      if (want && !hit) setErr(periodKo(want) + ' 명세서는 아직 공개되지 않았거나 조회할 수 없습니다.');
      var first = hit || list[0];
      if (first) setSelId(first.slip.id);
      setLoading(false);
    }).catch(function(e) {
      if (isLockedErr(e)) { relock(); return; }
      Sysbar.showError(e, '급여명세서 조회');
      setLoading(false);
    });
  }, [opened]);

  useEffect(function() {
    if (!selId) { setModel(null); return; }
    var entry = entries.filter(function(e) { return e.slip.id === selId; })[0];
    if (!entry) return;
    setLineLoading(true);
    loadLines(selId).then(function(lines) {
      setModel(toModel(entry, lines));
      setLineLoading(false);
    }).catch(function(e) {
      setLineLoading(false);
      if (isLockedErr(e)) { relock(); return; }
      Sysbar.showError(e, '명세서 항목 조회');
    });
  }, [selId]);

  if (!gate) return <div className="ps-page"><div className="ps-box">확인 중...</div></div>;
  if (!opened) return <div className="ps-page"><GateBox status={gate} onUnlocked={function(){ setOpened(true); }} /></div>;
  if (loading) return <div className="ps-page"><div className="ps-box">불러오는 중...</div></div>;

  var cur = entries.filter(function(e) { return e.slip.id === selId; })[0];

  return (
    <div className="ps-page">
      <div className="ps-head">
        <div>
          <div className="ps-title">💰 급여명세서</div>
          <div className="ps-sub">{user.name} 님 · 확정된 지급 명세서만 표시됩니다</div>
        </div>
        {model && <button className="ps-btn" onClick={function(){ window.print(); }}>🖨 인쇄 / PDF 저장</button>}
      </div>
      {err && <div className="ps-box" style={{ padding: '14px 20px', marginBottom: 12, background: '#fef3c7', color: '#92400e', borderColor: '#fde68a' }}>{err}</div>}

      {entries.length === 0 ? (
        <div className="ps-box">
          아직 조회할 수 있는 급여명세서가 없습니다.<br/>
          명세서가 등록·확정되면 이 화면에서 확인할 수 있습니다.
        </div>
      ) : (
        <div className="ps-body">
          <div className="ps-list">
            <div className="ps-list-h">지급월 선택</div>
            {entries.map(function(e) {
              return (
                <button key={e.slip.id} className={e.slip.id === selId ? 'ps-item on' : 'ps-item'}
                  onClick={function(){ setSelId(e.slip.id); }}>
                  {periodKo(e.run.period)}{e.run.revision > 1 && <span className="ps-tag">수정</span>}
                  <small>지급일 {PayslipRender.fmtDate(e.run.pay_date)} · 실지급 {PayslipRender.won(e.slip.net_pay)}원</small>
                </button>
              );
            })}
          </div>
          <div>
            <select className="ps-sel" value={selId} onChange={function(ev){ setSelId(ev.target.value); }}>
              {entries.map(function(e) {
                return <option key={e.slip.id} value={e.slip.id}>{periodKo(e.run.period)} 급여명세서{e.run.revision > 1 ? ' (수정)' : ''}</option>;
              })}
            </select>
            {lineLoading || !model ? <div className="ps-box">불러오는 중...</div> : <PayslipSheet model={model} />}
            {model && cur && cur.run.revision > 1 && <div className="ps-note">관리자가 수정해 다시 확정한 명세서입니다.</div>}
            {model && <PayslipPrintCopy model={model} />}
          </div>
        </div>
      )}
    </div>
  );
}

function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    return (v && v.id && v.role) ? v : null;
  })();
  const [user, setUser] = useState(initialUser);
  const [checked, setChecked] = useState(false);
  const [teamName, setTeamName] = useState('');

  // 상단 메뉴(관리포털 표시)용 팀 이름 — 다른 화면(worklog.html)과 같은 방식
  useEffect(function() {
    if (!user || !user.team_id) { setTeamName(''); return; }
    getSb().from('teams').select('name').eq('id', user.team_id).single()
      .then(function(r) { setTeamName((r.data && r.data.name) || ''); });
  }, [user && user.team_id]);

  // 캐시된 세션의 role 은 믿지 않고 서버 값으로 다시 확인한다 (contractor 차단 포함).
  useEffect(function() {
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated || !initialUser) { if (wasInvalidated) setUser(null); setChecked(true); return; }
    Sysbar.Auth.verifySession(getSb()).then(function(res) {
      if (res && res.ok && res.user) setUser(res.user);
      else if (res && res.reason !== 'auth-error') { Sysbar.Auth.logout(getSb()); setUser(null); }
      setChecked(true);
    });
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }, []);

  function handleLogin(u) {
    setUser(u);
    setChecked(true);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }
  function logout() {
    // 이 창의 생년월일 확인을 서버에서 먼저 해제하고(실패해도 로그아웃은 진행) 창 토큰을 새로 바꾼다.
    var tok = slipToken();
    getSb().rpc('payslip_lock', { p_token: tok }).then(function() {}, function() {}).then(function() {
      renewSlipToken();
      Sysbar.Auth.logout(getSb());
      setUser(null);
    });
  }

  if (!user) return <LoginScreen supabaseClient={getSb()} onLogin={handleLogin} />;
  if (!checked) return <div className="ps-page"><div className="ps-box">확인 중...</div></div>;

  if (user.role === 'contractor') return (
    <div>
      <SysBar sb={getSb()} activeKey="me" activeSub="payslip" user={user} teamName={teamName} onLogout={logout} />
      <div className="ps-page"><div className="ps-box">🚫 <b>급여명세서</b>는 임직원 전용 메뉴입니다.</div></div>
    </div>
  );

  return (
    <div>
      <SysBar sb={getSb()} activeKey="me" activeSub="payslip" user={user} teamName={teamName} onLogout={logout} />
      <PayslipPage user={user} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
