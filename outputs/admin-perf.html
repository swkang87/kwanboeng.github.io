<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
if (window.emailjs && APP_CONFIG.EMAILJS_PUBLIC_KEY) {
  window.emailjs.init({ publicKey: APP_CONFIG.EMAILJS_PUBLIC_KEY });
}

const VIEWS = { WL:'wl', PF:'pf', SL:'sl', AB:'ab', ST:'st' };
const TODAY = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDateKo = (ds) => { const d = new Date(ds + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const DAY_KO = ['일','월','화','수','목','금','토'];

// ── 공휴일 (하드코딩 + Nager.Date API 조합) ──────────────────────────────
const HOLIDAYS = {
  '2025-01-01':'신정',
  '2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날',
  '2025-06-03':'임시공휴일','2025-06-06':'현충일',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날',
  '2025-12-25':'크리스마스',
  '2026-01-01':'신정',
  '2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴',
  '2026-03-01':'삼일절',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-03':'임시공휴일(지방선거)','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절',
  '2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날',
  '2026-12-25':'크리스마스',
};
const SUBSTITUTE = {
  '2025-05-06':'대체공휴일',
  '2025-10-08':'대체공휴일',
  '2026-03-02':'대체공휴일',
  '2026-05-25':'대체공휴일',
  
  '2026-08-17':'대체공휴일',
  
  '2026-10-05':'대체공휴일',
};
const NAGER_KO = {
  "New Year's Day":'신정',"Seollal":'설날',"Seollal Holiday":'설날연휴',
  "Independence Movement Day":'삼일절',"Labor Day":'근로자의날',
  "Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',
  "Memorial Day":'현충일',"Liberation Day":'광복절',
  "Chuseok":'추석',"Chuseok Holiday":'추석연휴',
  "National Foundation Day":'개천절',"Hangul Day":'한글날',
  "Christmas Day":'크리스마스',"Substitute Holiday":'대체공휴일',
};
function isHolidayDate(ds) { return !!(HOLIDAYS[ds] || SUBSTITUTE[ds]); }
function getHolidayName(ds) { return HOLIDAYS[ds] || SUBSTITUTE[ds] || null; }

const _holCache = {};
async function fetchHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const set = new Set([...Object.keys(HOLIDAYS), ...Object.keys(SUBSTITUTE)]
    .filter(d => d.startsWith(String(year))));
  try {
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const data = await r.json();
    data.forEach(h => {
      if (!h.date) return;
      const name = NAGER_KO[h.localName] || NAGER_KO[h.name] || h.localName || h.name;
      set.add(h.date);
      if (name === '대체공휴일') SUBSTITUTE[h.date] = '대체공휴일';
      else if (!HOLIDAYS[h.date]) HOLIDAYS[h.date] = name;
    });
  } catch(e) {}
  _holCache[year] = set;
  return set;
}

// 직전 근무일 계산 (주말·공휴일 건너뜀)
function prevWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() - 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}
// 다음 근무일 계산
function nextWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() + 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}

// ── MiniCalendar ──────────────────────────────────────────────────────────────
function MiniCalendar({ value, onChange, maxDate }) {
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(() => new Date((value || TODAY()) + 'T00:00:00'));
  const [holidays, setHolidays] = useState(new Set());
  const wrapRef = useRef(null);

  useEffect(function() {
    if (!open) return;
    fetchHolidays(viewDate.getFullYear()).then(function(h) { setHolidays(h); });
  }, [open, viewDate.getFullYear()]);

  useEffect(function() {
    if (!open) return;
    function handler(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return function() { document.removeEventListener('mousedown', handler); };
  }, [open]);

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const startWd = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const today = TODAY();

  function prevM() { const d = new Date(viewDate); d.setMonth(d.getMonth() - 1); setViewDate(d); }
  function nextM() { const d = new Date(viewDate); d.setMonth(d.getMonth() + 1); setViewDate(d); }

  function select(ds) {
    if (maxDate && ds > maxDate) return;
    onChange(ds);

  }

  return (
    <div className="mcal-wrap" ref={wrapRef}>
      <button className="mcal-btn" title="달력 선택"
        onClick={function() { setViewDate(new Date((value || TODAY()) + 'T00:00:00')); setOpen(function(v) { return !v; }); }}>📅</button>
      {open && (
        <div className="mcal-popup">
          <div className="mcal-nav">
            <button className="mcal-nav-btn" onClick={prevM}>◀</button>
            <span className="mcal-title">{year}년 {month + 1}월</span>
            <button className="mcal-nav-btn" onClick={nextM}>▶</button>
          </div>
          <div className="mcal-grid">
            {DAY_KO.map(function(d, i) {
              return <div key={d} className={'mcal-dh' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>{d}</div>;
            })}
            {Array.from({ length: startWd }, function(_, i) { return <div key={'e' + i} className="mcal-day empty" />; })}
            {Array.from({ length: lastDay }, function(_, i) {
              const day = i + 1;
              const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
              const wd = new Date(ds + 'T00:00:00').getDay();
              const isHol = holidays.has(ds);
              const isFuture = maxDate && ds > maxDate;
              const cls = ['mcal-day',
                (wd === 0 || isHol) ? 'sun' : wd === 6 ? 'sat' : '',
                ds === today && ds !== value ? 'today' : '',
                ds === value ? 'selected' : '',
                isFuture ? 'future' : '',
              ].filter(Boolean).join(' ');
              return <div key={day} className={cls} onClick={function() { if (!isFuture) select(ds); }}>{day}</div>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}

// 홈택스 다운로드 .xls의 셀 → 표준 값 변환
function parseXlDate(val) {
  if (val === null || val === undefined || val === '') return null;
  // xlsx가 raw:true로 읽으면 날짜가 숫자(엑셀 시리얼)로 옴
  if (typeof val === 'number' && val > 1000) {
    const ms = (val - 25569) * 86400 * 1000; // Excel epoch: 1899-12-30
    const d = new Date(ms);
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
  }
  const s = String(val).trim();
  // "2026-06-30 12:00:00" / "2026/06/30" / "2026.06.30" 모두 대응
  const m = s.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (m) return m[1] + '-' + m[2].padStart(2,'0') + '-' + m[3].padStart(2,'0');
  return null;
}
// 숫자셀 → Number (콤마 제거)
function parseXlNum(val) {
  if (val === null || val === undefined || val === '') return 0;
  const n = Number(String(val).replace(/,/g,'').trim());
  return isNaN(n) ? 0 : n;
}
// 문자셀 → 트림 문자열
function xlStr(val) { return (val === null || val === undefined) ? '' : String(val).trim(); }
// 사업자번호 정규화(숫자만) — 하이픈 유무 무관 비교용
function normBizNo(v) { return String(v||'').replace(/[^0-9]/g,''); }

// ── 수금↔세금계산서 매칭 헬퍼 ──────────────────────────────────────────────
// 거래처명 정규화: 법인 표기 제거 후 한글·영문·숫자만 남김 (포함관계 비교용)
function normCoName(v) {
  if (!v) return '';
  return String(v)
    .replace(/\(주\)|㈜|주식회사|\(유\)|유한회사|\(재\)|재단법인|\(사\)|사단법인/g, '')
    .replace(/[^0-9a-zA-Z가-힣]/g, '')
    .toLowerCase();
}
// 두 날짜(YYYY-MM-DD) 사이 일수 차 절대값
function dayDiffAbs(a, b) {
  var da = new Date(a + 'T00:00:00'), db = new Date(b + 'T00:00:00');
  return Math.abs(Math.round((da.getTime() - db.getTime()) / 86400000));
}
var MATCH_WINDOW_DAYS = 30; // 매칭 허용 오차: 세금계산서 발행일 ± N일 이내 수금일

const getWeekDates = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return Array.from({ length: 5 }, function(_, i) {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return localDateStr(dd);
  });
};

const getMonthInfo = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  return {
    year, month,
    days: last.getDate(),
    startWeekday: first.getDay(),
    firstDate: localDateStr(first),
    lastDate:  localDateStr(last),
  };
};

function PerfModal({ projects, users, year, editItem, initForm, onClose, onSaved }) {
  const [selProjId, setSelProjId] = useState(editItem ? editItem.project_id : '');
  const [rows, setRows]           = useState([]); // [{user_id, name, rate, existing}]
  const [loading, setLoading]     = useState(false);
  const [saving, setSaving]       = useState(false);
  const [err, setErr]             = useState('');

  function uName(id) { var u = users.find(function(x){return x.id===id;}); return u?u.name:'-'; }

  // 프로젝트 선택 시 PM + 참여직원 자동 로드
  function onProjChange(pid) {
    setSelProjId(pid);
    setErr('');
    if (!pid) { setRows([]); return; }
    setLoading(true);
    var proj = projects.find(function(p){return p.id===pid;});
    // project_members 조회
    sb.from('project_members').select('user_id').eq('project_id', pid).then(function(r) {
      var memberIds = (r.data||[]).map(function(m){return m.user_id;});
      // PM이 members에 없으면 추가
      if (proj && proj.pm_id && memberIds.indexOf(proj.pm_id) === -1) {
        memberIds = [proj.pm_id].concat(memberIds);
      }
      // 기존 저장된 기여율 조회
      sb.from('performance').select('*').eq('project_id', pid).eq('year', year).then(function(pr) {
        var existing = pr.data || [];
        var newRows = memberIds
          .filter(function(uid) { return users.find(function(u){return u.id===uid;}); })
          .map(function(uid) {
            var ex = existing.find(function(e){return e.user_id===uid;});
            var isPm = proj && proj.pm_id === uid;
            return {
              user_id: uid,
              name: uName(uid),
              rate: ex ? ex.contribution_rate : (isPm ? 100 : 0),
              existing: !!ex,
            };
          });
        setRows(newRows);
        setLoading(false);
      });
    });
  }

  // 수정 모드일 때 초기 로드
  useEffect(function() {
    if (editItem && editItem.project_id) onProjChange(editItem.project_id);
  }, []);

  function updRate(uid, val) {
    setRows(function(prev) {
      return prev.map(function(r) { return r.user_id === uid ? Object.assign({},r,{rate:val}) : r; });
    });
  }

  function addUser(uid) {
    if (!uid || rows.find(function(r){return r.user_id===uid;})) return;
    setRows(function(prev) { return prev.concat([{user_id:uid, name:uName(uid), rate:0, existing:false}]); });
  }

  function removeRow(uid) {
    setRows(function(prev) { return prev.filter(function(r){return r.user_id!==uid;}); });
  }

  function save() {
    if (!selProjId) { setErr('프로젝트를 선택하세요.'); return; }
    if (rows.length === 0) { setErr('직원이 없습니다.'); return; }
    for (var i=0; i<rows.length; i++) {
      var r = rows[i];
      var v = Number(r.rate);
      if (isNaN(v) || v < 0 || v > 100) { setErr(r.name + '의 기여율은 0~100 사이여야 합니다.'); return; }
    }
    setSaving(true); setErr('');
    var payload = rows.map(function(r) {
      return { project_id: selProjId, user_id: r.user_id, contribution_rate: Number(r.rate), year: year };
    });
    sb.from('performance')
      .upsert(payload, { onConflict: 'project_id,user_id,year' })
      .then(function(res) {
        setSaving(false);
        if (res.error) { setErr('저장 오류: ' + res.error.message); return; }
        onSaved();
      });
  }

  var unselected = users.filter(function(u) { return !rows.find(function(r){return r.user_id===u.id;}); });

  return (
    <div className="mbg" onClick={onClose}>
      <div className="mbox" style={{maxWidth:520}} onClick={function(e){e.stopPropagation();}}>
        <div className="mh">
          <span className="mht">📐 기여율 입력</span>
          <button className="mc" onClick={onClose}>×</button>
        </div>
        <div className="mb">
          {err && <div className="al al-e">{err}</div>}
          <div style={{marginBottom:14}}>
            <label className="fl">프로젝트 *</label>
            <select className="fi" value={selProjId} onChange={function(e){onProjChange(e.target.value);}}>
              <option value="">선택하세요</option>
              {projects.map(function(p){ return <option key={p.id} value={p.id}>{p.name}</option>; })}
            </select>
          </div>

          {loading && <div className="loading">직원 정보 로딩 중...</div>}

          {!loading && selProjId && (
            <>
              <div style={{fontSize:12,color:'#64748b',marginBottom:10}}>
                PM은 기본 100%로 설정됩니다. 기여율을 조정하세요.
              </div>
              <table style={{width:'100%',borderCollapse:'collapse',marginBottom:12}}>
                <thead>
                  <tr style={{background:'#f8fafc'}}>
                    <th style={{padding:'8px 10px',textAlign:'left',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'1px solid #e2e8f0'}}>직원</th>
                    <th style={{padding:'8px 10px',textAlign:'center',fontSize:12,color:'#64748b',fontWeight:600,borderBottom:'1px solid #e2e8f0',width:120}}>기여율 (%)</th>
                    <th style={{width:36,borderBottom:'1px solid #e2e8f0'}}></th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map(function(r) {
                    var proj = projects.find(function(p){return p.id===selProjId;});
                    var isPm = proj && proj.pm_id === r.user_id;
                    return (
                      <tr key={r.user_id} style={{borderBottom:'1px solid #f1f5f9'}}>
                        <td style={{padding:'8px 10px',fontSize:13}}>
                          {r.name}
                          {isPm && <span className="badge bp" style={{marginLeft:6,fontSize:10}}>PM</span>}
                          {r.existing && <span style={{fontSize:10,color:'#94a3b8',marginLeft:4}}>기존</span>}
                        </td>
                        <td style={{padding:'4px 10px'}}>
                          <input type="number" min="0" max="100" className="fi"
                            value={r.rate}
                            style={{textAlign:'center',margin:0}}
                            onChange={function(e){updRate(r.user_id, e.target.value);}} />
                        </td>
                        <td style={{padding:'4px 6px'}}>
                          {!isPm && (
                            <button className="btn btn-d btn-sm" onClick={function(){removeRow(r.user_id);}}>✕</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>

              {unselected.length > 0 && (
                <div style={{display:'flex',gap:8,alignItems:'center'}}>
                  <select className="fi" style={{flex:1}} defaultValue=""
                    onChange={function(e){ if(e.target.value){addUser(e.target.value);e.target.value='';} }}>
                    <option value="">+ 직원 추가</option>
                    {unselected.map(function(u){ return <option key={u.id} value={u.id}>{u.name}</option>; })}
                  </select>
                </div>
              )}
            </>
          )}
        </div>
        <div className="mf">
          <button className="btn btn-s" onClick={onClose}>취소</button>
          <button className="btn btn-p" onClick={save} disabled={saving||!selProjId||rows.length===0}>
            {saving?'저장 중...':'저장'}
          </button>
        </div>
      </div>
    </div>
  );
}

        return { col: col, dir: 'asc' };
      });
    };
  }

  function sortRows(rows, state, getVal) {
    if (!state.col) return rows;
    return rows.slice().sort(function(a, b) {
      var av = getVal(a, state.col);
      var bv = getVal(b, state.col);
      if (av == null) av = '';
      if (bv == null) bv = '';
      var cmp = typeof av === 'number' && typeof bv === 'number'
        ? av - bv
        : String(av).localeCompare(String(bv), 'ko');
      return state.dir === 'asc' ? cmp : -cmp;
    });
  }

  function SortTh({ label, col, state, onSort, className, style }) {
    var active = state.col === col;
    return (
      <th className={className} style={Object.assign({ cursor:'pointer', userSelect:'none', whiteSpace:'nowrap' }, style||{})}
        onClick={function(){ onSort(col); }}>
        {label}
        <span style={{ marginLeft:4, fontSize:10, color: active ? '#7c3aed' : '#cbd5e1' }}>
          {active ? (state.dir === 'asc' ? '▲' : '▼') : '⇅'}
        </span>
      </th>
    );
  }

  // ── 전량 로드: PostgREST 기본 1000행 제한 해제 (range 반복, 반환 < 페이지크기면 종료) ──
  // order2Col: 1차 키 동일값 대비 2차 정렬 키(페이지 경계 중복/누락 방지)
  function fetchAllRows(table, orderCol, ascending, order2Col) {
    var PAGE = 1000;
    var all = [];
    function page(from) {
      var qy = sb.from(table).select('*').order(orderCol, { ascending: ascending });
      if (order2Col) qy = qy.order(order2Col, { ascending: true });
      return qy
        .range(from, from + PAGE - 1)
        .then(function(r) {
          if (r.error) return { data: null, error: r.error };
          all = all.concat(r.data || []);
          if ((r.data || []).length < PAGE) return { data: all, error: null };
          return page(from + PAGE);
        });
    }
    return page(0);
  }

  // ── 세금계산서 업로드(.xls/.xlsx 다중, 순차 처리) ──
  // 홈택스 목록: 헤더=6행(index 5), 데이터=7행(index 6)부터.
  // 컬럼 순서(0-index):
  //  0 작성일자 1 승인번호 2 발급일자 3 전송일자
  //  4 공급자사업자번호 5 공급자종사업장 6 공급자상호 7 공급자대표 8 공급자주소
  //  9 공급받는자사업자번호 10 공급받는자종사업장 11 공급받는자상호 12 공급받는자대표 13 공급받는자주소
  //  14 합계금액 15 공급가액 16 세액 17 분류 18 종류 19 발급유형 20 비고 21 영수/청구
  //  22 공급자이메일 23 공급받는자이메일1 24 공급받는자이메일2
  //  25 품목일자 26 품목명 27 품목규격 28 품목수량 29 품목단가 30 품목공급가액 31 품목세액 32 품목비고
  function parseTaxWorkbook(arrayBuffer) {
    var wb = XLSX.read(arrayBuffer, { type: 'array', raw: true });
    var ws = wb.Sheets[wb.SheetNames[0]];
    var data = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
    var myBiz = normBizNo(APP_CONFIG.COMPANY_BIZ_NO);
    var byApproval = {}; // 승인번호 → { header, items:[] }
    for (var i = 6; i < data.length; i++) {
      var r = data[i];
      if (!r) continue;
      var approvalNo = xlStr(r[1]);
      if (!approvalNo) continue; // 빈 줄·합계 요약 줄 스킵
      var supBiz = normBizNo(r[4]);
      var buyBiz = normBizNo(r[9]);
      var kind = (buyBiz === myBiz) ? '매입' : (supBiz === myBiz) ? '매출' : '';
      if (!kind) continue; // 우리 회사와 무관한 행 스킵(안전장치)
      if (!byApproval[approvalNo]) {
        byApproval[approvalNo] = {
          header: {
            approval_no: approvalNo,
            invoice_type: kind,
            counterpart_name: (kind === '매입') ? xlStr(r[6]) : xlStr(r[11]),
            write_date: parseXlDate(r[0]),
            issue_date: parseXlDate(r[2]),
            send_date: parseXlDate(r[3]),
            supplier_biz_no: xlStr(r[4]),
            supplier_name: xlStr(r[6]),
            supplier_ceo: xlStr(r[7]),
            supplier_address: xlStr(r[8]),
            buyer_biz_no: xlStr(r[9]),
            buyer_name: xlStr(r[11]),
            buyer_ceo: xlStr(r[12]),
            buyer_address: xlStr(r[13]),
            total_amount: parseXlNum(r[14]),
            supply_amount: parseXlNum(r[15]),
            tax_amount: parseXlNum(r[16]),
            invoice_class: xlStr(r[17]),
            invoice_kind: xlStr(r[18]),
            issue_type: xlStr(r[19]),
            note: xlStr(r[20]),
            receipt_type: xlStr(r[21]),
            supplier_email: xlStr(r[22]),
            buyer_email1: xlStr(r[23]),
            buyer_email2: xlStr(r[24]),
          },
          items: [],
        };
      }
      // 품목(품목명이 있는 행만) — 승인번호당 여러 줄이면 각 줄이 품목
      if (xlStr(r[26])) {
        byApproval[approvalNo].items.push({
          item_date: parseXlDate(r[25]),
          item_name: xlStr(r[26]),
          item_spec: xlStr(r[27]),
          item_qty: parseXlNum(r[28]),
          item_unit_price: parseXlNum(r[29]),
          item_supply_amount: parseXlNum(r[30]),
          item_tax_amount: parseXlNum(r[31]),
          item_note: xlStr(r[32]),
        });
      }
    }
    return byApproval;
  }

  function readFileAsArrayBuffer(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function(e) { resolve(e.target.result); };
      reader.onerror = reject;
      reader.readAsArrayBuffer(file);
    });
  }

  async function handleTaxFiles(fileList) {
    var all = Array.prototype.slice.call(fileList || []);
    if (all.length === 0) return;
    // 확장자 검증 — 드롭 포함 모든 경로 공통
    var files = all.filter(function(f) { return /\.(xls|xlsx)$/i.test(f.name); });
    var skipCnt = all.length - files.length;
    if (files.length === 0) {
      setTaxMsg('❌ .xls/.xlsx 파일만 업로드할 수 있습니다');
      if (taxFileRef.current) taxFileRef.current.value = '';
      return;
    }
    setTaxBusy(true); setTaxMsg('');
    var newCnt = 0, updCnt = 0, errCnt = 0, errMsgs = [], savedKinds = {}, savedYears = {};
    function pushErr(prefix, error) {
      var m = prefix + ': ' + (error && error.message ? error.message : String(error)) + (error && error.code ? ' (' + error.code + ')' : '');
      if (errMsgs.indexOf(m) === -1) errMsgs.push(m);
    }
    try {
      for (var f = 0; f < files.length; f++) {
        var buf = await readFileAsArrayBuffer(files[f]);
        var byApproval;
        try { byApproval = parseTaxWorkbook(buf); }
        catch (pe) { errCnt++; pushErr('파싱 실패 ' + files[f].name, pe); continue; }
        var approvals = Object.keys(byApproval);
        // 기존 승인번호 조회(신규/업데이트 판별) — 순차 처리
        for (var a = 0; a < approvals.length; a++) {
          var entry = byApproval[approvals[a]];
          var existing = await sb.from('tax_invoices').select('id').eq('approval_no', entry.header.approval_no).maybeSingle();
          if (existing.error) pushErr('기존 조회 오류', existing.error);
          var wasNew = !(existing.data && existing.data.id);
          // 헤더 upsert (승인번호 기준)
          var up = await sb.from('tax_invoices')
            .upsert(entry.header, { onConflict: 'approval_no' })
            .select('id').single();
          if (up.error || !up.data) { errCnt++; pushErr('저장 실패 ' + entry.header.approval_no.slice(0, 8) + '…', up.error || '저장 결과 없음'); continue; }
          var invoiceId = up.data.id;
          // 품목: 기존 삭제 후 재삽입
          var del = await sb.from('tax_invoice_items').delete().eq('invoice_id', invoiceId);
          if (del.error) pushErr('품목 삭제 오류', del.error);
          if (entry.items.length > 0) {
            var itemPayload = entry.items.map(function(it) { return Object.assign({ invoice_id: invoiceId }, it); });
            var ins = await sb.from('tax_invoice_items').insert(itemPayload);
            if (ins.error) pushErr('품목 저장 오류', ins.error);
          }
          if (wasNew) newCnt++; else updCnt++;
          savedKinds[entry.header.invoice_type] = true;
          if (entry.header.write_date) savedYears[entry.header.write_date.slice(0, 4)] = true;
        }
      }
      var total = newCnt + updCnt;
      // 저장된 데이터의 최신 연도(작성일 기준 — 연도 필터와 동일 컬럼). 여러 연도 혼재 시 최신 연도 대표
      var latestYear = Object.keys(savedYears).sort().pop() || '';
      var moveYear = total > 0 && latestYear !== '' && latestYear !== year;
      var msg = (total === 0 && errCnt > 0 ? '❌ ' : '✅ ')
        + '성공 ' + total + '건 (신규 ' + newCnt + ' / 업데이트 ' + updCnt + ')'
        + (errCnt ? ' · 실패 ' + errCnt + '건' : '')
        + (skipCnt ? ' · 엑셀 외 파일 ' + skipCnt + '개 제외' : '')
        + (moveYear ? ' · ' + latestYear + '년으로 이동' : '');
      if (errMsgs.length > 0) msg += ' — ' + errMsgs.slice(0, 3).join(' / ') + (errMsgs.length > 3 ? ' 외 ' + (errMsgs.length - 3) + '건' : '');
      setTaxMsg(msg);
      if (total > 0) {
        setTaxMonth('전체'); // 월 필터에 걸려 안 보이는 상황 방지
        if (!savedKinds[taxKind]) setTaxKind(savedKinds['매출'] ? '매출' : '매입'); // 저장된 종류 탭으로 전환(매출 우선)
        if (moveYear) setYear(latestYear); // 연도 select 자동 전환 — 연도 변경 useEffect가 월 필터 '전체' 리셋도 수행
      }
      loadTax();
    } catch (e) {
      setTaxMsg('❌ 업로드 오류: ' + (e.message || e));
    } finally {
      setTaxBusy(false);
      if (taxFileRef.current) taxFileRef.current.value = '';
    }
  }

  function deleteTaxInvoice(inv) {
    if (!window.confirm('이 세금계산서(' + inv.counterpart_name + ')를 삭제하시겠습니까?')) return;
    sb.from('tax_invoice_items').delete().eq('invoice_id', inv.id).then(function() {
      sb.from('tax_invoices').delete().eq('id', inv.id).then(function(r) {
        if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
        setTaxDetail(null);
        loadTax();
      });
    });
  }

  // ── 인덱싱 ──
  var userById = (function(){ var m=new Map(); for(var i=0;i<users.length;i++) m.set(users[i].id, users[i]); return m; })();
  var projectById = (function(){ var m=new Map(); for(var i=0;i<projects.length;i++) m.set(projects[i].id, projects[i]); return m; })();
  function uName(id) { var u = userById.get(id); return u ? u.name : '-'; }
  function pName(id) { var p = projectById.get(id); return p ? p.name : '-'; }

  var yCols = cols.filter(function(c) { return c.collected_at && c.collected_at.startsWith(year); });

  // project_id → yCols 그룹 합계 인덱싱
  var yColsByProject = (function(){
    var m = new Map();
    for (var i=0; i<yCols.length; i++) {
      var c = yCols[i];
      var entry = m.get(c.project_id);
      if (!entry) { entry = { tc:0, to:0, items:[] }; m.set(c.project_id, entry); }
      entry.tc += (c.amount||0);
      entry.to += (c.outsource_cost||0);
      entry.items.push(c);
    }
    return m;
  })();

  var totCol = yCols.reduce(function(s,c){ return s + (c.entry_type !== 'outsource_only' ? (c.amount||0) : 0); }, 0);
  var totOut = yCols.reduce(function(s,c) { return s + (c.outsource_cost||0); }, 0);
  var totNet = yCols.reduce(function(s,c) { return s + (c.amount||0) - (c.outsource_cost||0); }, 0);

  // 필터 적용 수금액 계산 (요약 박스용)
  var filteredYCols = (function() {
    if (catFilter === '전체') return yCols;
    if (catFilter === '감리') return yCols.filter(function(c){ return c.entry_type === 'supervision'; });
    return yCols.filter(function(c){
      var proj = projectById.get(c.project_id);
      return proj && proj.category === catFilter;
    });
  })();
  var filtTotCol = filteredYCols.reduce(function(s,c){ return s + (c.entry_type !== 'outsource_only' ? (c.amount||0) : 0); }, 0);
  var filtTotOut = filteredYCols.reduce(function(s,c){ return s+(c.outsource_cost||0); }, 0);
  var filtTotNet = filteredYCols.reduce(function(s,c){ return s+(c.amount||0)-(c.outsource_cost||0); }, 0);

  // 일반 프로젝트 실적 (인덱싱된 합계 재사용)
  var projSummary = projects.map(function(p) {
    var agg = yColsByProject.get(p.id);
    var tc = agg ? agg.tc : 0;
    var to = agg ? agg.to : 0;
    return { id:p.id, name:p.name, client:p.client, pm_id:p.pm_id, category:p.category, tc:tc, to:to, net:tc-to };
  }).filter(function(p) { return p.tc > 0; }).sort(function(a,b) { return b.net - a.net; });

  // 감리 실적 집계 (project_id=NULL, entry_type='supervision')
  var supvCols = yCols.filter(function(c){ return c.entry_type === 'supervision'; });
  var supvByName = supvCols.reduce(function(acc, c) {
    var parsed = (typeof parseSupvMemo === 'function') ? parseSupvMemo(c.memo) : { name: c.memo||'', client:'', note:'' };
    var key = parsed.name || c.memo || '(감리)';
    if (!acc[key]) acc[key] = { name:key, client:parsed.client, tc:0, to:0 };
    acc[key].tc += (c.amount||0);
    return acc;
  }, {});
  var supvSummary = Object.values(supvByName).map(function(s){
    return { id:'supv_'+s.name, name:s.name, client:s.client, pm_id:null, category:'감리', tc:s.tc, to:0, net:s.tc };
  }).sort(function(a,b){ return b.net - a.net; });

  // 프로젝트별 + 감리 합산
  var allProjSummary = projSummary.concat(supvSummary);

  // PM 자동 100% 포함한 유효 기여율 목록 생성 (인덱싱으로 some/find 제거)
  var effectivePerfs = (function() {
    var yearNum = Number(year);
    // 키: project_id|user_id|year 존재 여부
    var perfKey = new Set();
    for (var i=0; i<perfs.length; i++) {
      var pf = perfs[i];
      if (pf.year === yearNum) perfKey.add(pf.project_id + '|' + pf.user_id);
    }
    var result = perfs.slice();
    for (var j=0; j<projects.length; j++) {
      var proj = projects[j];
      if (!proj.pm_id) continue;
      if (perfKey.has(proj.id + '|' + proj.pm_id)) continue;
      if (!yColsByProject.has(proj.id)) continue;
      result.push({ project_id: proj.id, user_id: proj.pm_id, contribution_rate: 100, year: yearNum, _auto: true });
    }
    return result;
  })();

  // user_id → [{project_id, rate}, ...]
  var perfsByUser = (function(){
    var yearNum = Number(year);
    var m = new Map();
    for (var i=0; i<effectivePerfs.length; i++) {
      var pf = effectivePerfs[i];
      if (pf.year !== yearNum) continue;
      var arr = m.get(pf.user_id);
      if (!arr) { arr = []; m.set(pf.user_id, arr); }
      arr.push(pf);
    }
    return m;
  })();

  // contracts 인덱싱 (project_id → contract)
  var contractByProject = (function(){
    var m = new Map();
    for (var i=0; i<contracts.length; i++) m.set(contracts[i].project_id, contracts[i]);
    return m;
  })();

  // net 실적에 계약금액 초과분 제거 헬퍼
  // cap = 계약금 - 기수금 - 예상외주비 (우리 몫의 최대한도)
  function cappedNet(project_id, rawNet) {
    var ct = contractByProject.get(project_id);
    if (!ct || !ct.amount || ct.amount <= 0) return rawNet;
    var cap = ct.amount - (ct.prior_collected || 0) - (ct.expected_outsource || 0);
    return Math.min(rawNet, Math.max(0, cap));
  }

  var userSummary = users.map(function(u) {
    var myP = perfsByUser.get(u.id) || [];
    var total = 0;
    for (var i=0; i<myP.length; i++) {
      var pf = myP[i];
      var agg = yColsByProject.get(pf.project_id);
      var rawNet = agg ? (agg.tc - agg.to) : 0;
      var net = cappedNet(pf.project_id, rawNet);
      total += net * (pf.contribution_rate||0) / 100;
    }
    return { id:u.id, name:u.name, total:total, cnt:myP.length };
  }).filter(function(u) { return u.total > 0; }).sort(function(a,b) { return b.total - a.total; });

  var maxPerf = userSummary.length > 0 ? userSummary[0].total : 1;

  function numV(v) { return Number(String(v||0).replace(/,/g,'')) || 0; }

  function onAmountChange(key, e) {
    var raw = e.target.value.replace(/[^0-9]/g,'');
    var fmt = raw ? Number(raw).toLocaleString('ko-KR') : '';
    setForm(function(p) { var o = Object.assign({}, p); o[key] = fmt; return o; });
  }

  function deleteCol(id) {
    if (!window.confirm('이 수금 내역을 삭제하시겠습니까?')) return;
    sb.from('collections').delete().eq('id', id).then(function(r) {
      if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
      load();
    });
  }

  function deletePerf(pf) {
    if (!window.confirm('이 기여율을 삭제하시겠습니까?')) return;
    sb.from('performance').delete()
      .eq('project_id', pf.project_id).eq('user_id', pf.user_id).eq('year', pf.year)
      .then(function(r) {
        if (r.error) { alert('삭제 오류: ' + r.error.message); return; }
        load();
      });
  }

  // 감리 memo 파싱: "프로젝트명|발주처|메모" 형식
  function parseSupvMemo(memo) {
    if (!memo) return { name:'', client:'', note:'' };
    var parts = memo.split('|');
    return { name: parts[0]||'', client: parts[1]||'', note: parts[2]||'' };
  }
  function buildSupvMemo(name, client, note) {
    // 뒤쪽 빈값 trim
    var arr = [name||'', client||'', note||''];
    while (arr.length > 1 && !arr[arr.length-1]) arr.pop();
    return arr.join('|');
  }

  function saveCol() {
    var isOut  = form.entry_type === 'outsource_only';
    var isSupv = form.entry_type === 'supervision';
    if (isSupv) {
      if (!form.supv_name || !form.supv_name.trim()) { setErr('감리 프로젝트명을 입력해주세요.'); return; }
      if (!form.collected_at) { setErr('수금일을 입력해주세요.'); return; }
      if (!form.amount) { setErr('수금액을 입력해주세요.'); return; }
    } else {
      if (!form.project_id || !form.collected_at) { setErr('프로젝트와 날짜는 필수입니다.'); return; }
      if (!isOut && !form.amount) { setErr('수금액을 입력해주세요.'); return; }
      if (isOut && !form.outsource_cost) { setErr('외주비를 입력해주세요.'); return; }
    }
    setSaving(true); setErr('');
    var payload = {
      project_id: isSupv ? null : form.project_id,
      amount: isOut ? 0 : numV(form.amount),
      outsource_cost: isSupv ? 0 : numV(form.outsource_cost),
      collected_at: form.collected_at,
      memo: isSupv ? buildSupvMemo(form.supv_name, form.supv_client, form.supv_note) : (form.memo || ''),
      entry_type: form.entry_type || 'both',
    };
    var isNew = !editItem;
    var colYear = Number(form.collected_at.slice(0, 4));
    var p = isNew
      ? sb.from('collections').insert(payload)
      : sb.from('collections').update(payload).eq('id', editItem.id);
    p.then(function(r) {
      setSaving(false);
      if (r.error) { setErr('저장 오류: ' + r.error.message); return; }

      // ── 최초 등록 시만 PM 기여율 100% 자동 등록 후 기여율 탭으로 이동 ──
      if (isNew) {
        var proj = projects.find(function(p) { return p.id === form.project_id; });
        if (proj && proj.pm_id) {
          sb.from('performance')
            .select('id')
            .eq('project_id', form.project_id)
            .eq('user_id', proj.pm_id)
            .eq('year', colYear)
            .then(function(chk) {
              if (!chk.data || chk.data.length === 0) {
                sb.from('performance').insert({
                  project_id: form.project_id,
                  user_id: proj.pm_id,
                  contribution_rate: 100,
                  year: colYear,
                }).then(function() {
                  setModal(''); setEditItem(null); setForm({});
                  load();
                });
              } else {
                setModal(''); setEditItem(null); setForm({});
                load();
              }
            });
        } else {
          setModal(''); setEditItem(null); setForm({});
          load();
        }
      } else {
        setModal(''); setEditItem(null); setForm({});
        load();
      }
    });
  }

  if (loading) return <div className="page"><div className="loading">로딩 중...</div></div>;

  return (
    <div className="page">
      <div className="ph" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="pt">📊 실적 관리</div>
          <div className="ps">수금 내역 및 직원별 성과급 기초 데이터</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <label className="fl" style={{margin:0}}>연도</label>
          <select className="fi" value={year} onChange={function(e) { setYear(e.target.value); }} style={{width:100}}>
            {(function(){ var ys=[]; for (var y=new Date().getFullYear(); y>=2010; y--) ys.push(y); return ys; })().map(function(y) { return <option key={y}>{y}</option>; })}
          </select>
        </div>
      </div>

      <div className="itabs">
        <button className={tab==='col'?'itab active':'itab'} onClick={function(){changeTab('col');}}>수금 내역</button>
        <button className={tab==='proj'?'itab active':'itab'} onClick={function(){changeTab('proj');}}>프로젝트별</button>
        <button className={tab==='user'?'itab active':'itab'} onClick={function(){changeTab('user');}}>직원별 실적</button>
        <button className={tab==='contract'?'itab active':'itab'} onClick={function(){changeTab('contract');}}>계약/잔금</button>
        <button className={tab==='expected'?'itab active':'itab'} onClick={function(){changeTab('expected');}}>예상수금</button>
        {canTax && <button className={tab==='tax'?'itab active':'itab'} onClick={function(){changeTab('tax');}}>세금계산서</button>}
        {canTax && <button className={tab==='match'?'itab active':'itab'} onClick={function(){changeTab('match');}}>매칭확인</button>}
      </div>

      {tab === 'col' && (
        <div className="card">
          <div className="sh">
            <span className="st">수금 내역 ({year}년)</span>
            <div style={{display:'flex',gap:6}}>
              <button className="btn btn-p btn-sm" onClick={function(){setModal('col');setEditItem(null);setForm({collected_at:TODAY(),entry_type:'both'});}}>+ 수금 입력</button>
              <button className="btn btn-d btn-sm" style={{background:'#fee2e2',color:'#dc2626',border:'1px solid #fecaca'}} onClick={function(){setModal('col');setEditItem(null);setForm({collected_at:TODAY(),entry_type:'outsource_only'});}}>+ 외주비만</button>
            </div>
          </div>
          {yCols.length === 0 ? (
            <div className="empty"><div className="ei">💰</div><div className="et">수금 내역이 없습니다</div></div>
          ) : (function(){
              var visRows = sortRows(filterByCat(yCols, function(c){
                if (c.entry_type==='supervision') return '감리';
                var proj = projects.find(function(p){ return p.id===c.project_id; });
                return proj ? proj.category : '';
              }), colSort, function(c, col) {
                if (col==='proj')   return pName(c.project_id);
                if (col==='date')   return c.collected_at;
                if (col==='type')   return c.entry_type;
                if (col==='amount') return c.amount||0;
                if (col==='out')    return c.outsource_cost||0;
                if (col==='net')    return (c.amount||0)-(c.outsource_cost||0);
                return '';
              });
              if (isMobile) return (
                <div>
                  <CatFilterBar />
                  <div style={{marginTop:8}}>
                    {visRows.map(function(c){
                      var isOut = c.entry_type === 'outsource_only';
                      var isSupv = c.entry_type === 'supervision';
                      var net = (c.amount||0) - (c.outsource_cost||0);
                      var proj = projects.find(function(p){ return p.id === c.project_id; });
                      var cat = proj ? proj.category : '';
                      var sp = isSupv ? parseSupvMemo(c.memo) : null;
                      var bColor = isSupv ? '#6ee7b7' : (CAT_COLOR[cat]||'#e2e8f0');
                      return (
                        <div key={c.id} style={{borderLeft:'3px solid '+bColor,background:isOut?'#fff5f5':'#fff',border:'1px solid #e2e8f0',borderRadius:8,padding:12,marginBottom:8}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                            <div style={{flex:1,marginRight:8}}>
                              {isSupv ? (
                                <div>
                                  <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:4,background:'#ecfdf5',color:'#065f46',border:'1px solid #6ee7b7'}}>감리</span>
                                  <div style={{fontWeight:600,fontSize:13,marginTop:3}}>{sp&&sp.name ? sp.name : (c.memo||'-')}</div>
                                  {sp&&sp.client && <div style={{fontSize:11,color:'#94a3b8'}}>{sp.client}</div>}
                                </div>
                              ) : (
                                <div>
                                  {cat && <span style={{fontSize:10,fontWeight:700,padding:'1px 5px',borderRadius:4,background:CAT_BG[cat]||'#f1f5f9',color:CAT_TX[cat]||'#475569',border:'1px solid '+(CAT_COLOR[cat]||'#e2e8f0')}}>{cat}</span>}
                                  <div style={{fontWeight:600,fontSize:13,marginTop:3}}>{pName(c.project_id)}</div>
                                  {proj&&proj.client && <div style={{fontSize:11,color:'#94a3b8'}}>{proj.client}</div>}
                                </div>
                              )}
                            </div>
                            <span style={{fontSize:11,color:'#64748b',whiteSpace:'nowrap',flexShrink:0}}>{fmtD(c.collected_at)}</span>
                          </div>
                          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:8}}>
                            <div style={{background:'#eff6ff',borderRadius:6,padding:'6px 8px',textAlign:'center'}}>
                              <div style={{fontSize:10,color:'#94a3b8'}}>수금액</div>
                              <div style={{fontWeight:700,color:'#1d4ed8',fontSize:12}}>{isOut?'—':fmtN(c.amount)+'원'}</div>
                            </div>
                            <div style={{background:'#fff5f5',borderRadius:6,padding:'6px 8px',textAlign:'center'}}>
                              <div style={{fontSize:10,color:'#94a3b8'}}>외주비</div>
                              <div style={{fontWeight:700,color:'#dc2626',fontSize:12}}>{(c.outsource_cost||0)>0?fmtN(c.outsource_cost)+'원':'-'}</div>
                            </div>
                            <div style={{background:'#f5f3ff',borderRadius:6,padding:'6px 8px',textAlign:'center'}}>
                              <div style={{fontSize:10,color:'#94a3b8'}}>순실적</div>
                              <div style={{fontWeight:700,color:net<0?'#dc2626':'#7c3aed',fontSize:12}}>{fmtN(net)}원</div>
                            </div>
                          </div>
                          {c.memo&&!isSupv && <div style={{fontSize:11,color:'#64748b',marginBottom:6,padding:'4px 8px',background:'#f8fafc',borderRadius:4}}>{c.memo}</div>}
                          <div style={{display:'flex',gap:6,justifyContent:'flex-end'}}>
                            <button className="btn btn-s btn-sm" onClick={function(){
                              setEditItem(c);
                              var base = Object.assign({},c,{amount:c.amount?fmtN(c.amount):'',outsource_cost:c.outsource_cost?fmtN(c.outsource_cost):'',entry_type:c.entry_type||'both'});
                              if (c.entry_type === 'supervision') {
                                var parsed = parseSupvMemo(c.memo);
                                base.supv_name = parsed.name;
                                base.supv_client = parsed.client;
                                base.supv_note = parsed.note;
                              }
                              setForm(base); setModal('col');
                            }}>수정</button>
                            <button className="btn btn-d btn-sm" onClick={function(){deleteCol(c.id);}}>삭제</button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
              return (
                <div className="tbl-wrap">
                  <CatFilterBar />
                  <table style={{minWidth:760}}>
                    <thead><tr>
                      <SortTh label="프로젝트" col="proj"   state={colSort} onSort={mkSortHandler(colSort,setColSort)} />
                      <SortTh label="날짜"     col="date"   state={colSort} onSort={mkSortHandler(colSort,setColSort)} />
                      <SortTh label="유형"     col="type"   state={colSort} onSort={mkSortHandler(colSort,setColSort)} />
                      <SortTh label="수금액"   col="amount" state={colSort} onSort={mkSortHandler(colSort,setColSort)} className="tr" />
                      <SortTh label="외주비"   col="out"    state={colSort} onSort={mkSortHandler(colSort,setColSort)} className="tr" />
                      <SortTh label="순 실적"  col="net"    state={colSort} onSort={mkSortHandler(colSort,setColSort)} className="tr" />
                      <th>메모</th><th></th>
                    </tr></thead>
                    <tbody>
                      {visRows.map(function(c) {
                        var isOut = c.entry_type === 'outsource_only';
                        var net   = (c.amount||0) - (c.outsource_cost||0);
                        return (
                          <tr key={c.id} style={{background: isOut ? '#fff5f5' : ''}}>
                            <td style={{verticalAlign:'top',paddingTop:10}}>
                              {(function(){
                                var proj = projects.find(function(p){ return p.id === c.project_id; });
                                var cat  = proj ? proj.category : '';
                                if (c.entry_type === 'supervision') {
                                  var sp = parseSupvMemo(c.memo);
                                  return (
                                    <div style={{display:'flex',alignItems:'flex-start',gap:6}}>
                                      <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'2px 0',borderRadius:4,marginTop:2,
                                        width:36,textAlign:'center',display:'inline-block',
                                        background:'#ecfdf5',color:'#065f46',border:'1px solid #6ee7b7'}}>감리</span>
                                      <span style={{display:'flex',flexDirection:'column',gap:1,minWidth:0}}>
                                        {sp.client && <span style={{fontSize:'80%',color:'#94a3b8',fontWeight:500,lineHeight:1.2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',display:'block'}}>{sp.client}</span>}
                                        <span style={{fontWeight:600,fontSize:12,wordBreak:'keep-all',lineHeight:1.4}}>{sp.name||c.memo||'-'}</span>
                                      </span>
                                    </div>
                                  );
                                }
                                return (
                                  <div style={{display:'flex',alignItems:'flex-start',gap:6}}>
                                    {cat && (
                                      <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'2px 0',borderRadius:4,marginTop:2,
                                        width:36,textAlign:'center',display:'inline-block',
                                        background: CAT_BG[cat]||'#f1f5f9', color: CAT_TX[cat]||'#475569',
                                        border:'1px solid '+(CAT_COLOR[cat]||'#e2e8f0')}}>
                                        {cat}
                                      </span>
                                    )}
                                    <span style={{display:'flex',flexDirection:'column',gap:1,minWidth:0}}>
                                      {proj && proj.client && <span style={{fontSize:'80%',color:'#94a3b8',fontWeight:500,lineHeight:1.2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',display:'block'}}>{proj.client}</span>}
                                      <span style={{fontWeight:600,fontSize:12,wordBreak:'keep-all',lineHeight:1.4,overflowWrap:'anywhere'}}>{pName(c.project_id)}</span>
                                    </span>
                                  </div>
                                );
                              })()}
                            </td>
                            <td style={{whiteSpace:'nowrap',fontSize:12}}>{fmtD(c.collected_at)}</td>
                            <td>
                              {c.entry_type==='supervision'
                                ? <span className="badge" style={{fontSize:10,background:'#ecfdf5',color:'#065f46'}}>감리</span>
                                : isOut
                                  ? <span className="badge bgr" style={{fontSize:10}}>외주비만</span>
                                  : <span className="badge bg" style={{fontSize:10}}>수금</span>
                              }
                            </td>
                            <td className="tr" style={{fontWeight:700,fontSize:12,color: isOut ? '#94a3b8' : '#1d4ed8',whiteSpace:'nowrap'}}>
                              {isOut ? '—' : fmtN(c.amount)+'원'}
                            </td>
                            <td className="tr" style={{color:'#dc2626',fontSize:12,whiteSpace:'nowrap'}}>{c.outsource_cost > 0 ? fmtN(c.outsource_cost)+'원' : '-'}</td>
                            <td className="tr" style={{fontWeight:700,fontSize:12,whiteSpace:'nowrap',color: net < 0 ? '#dc2626' : '#7c3aed'}}>{fmtN(net)}원</td>
                            <td style={{color:'#64748b',fontSize:11,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.entry_type==='supervision' ? (parseSupvMemo(c.memo).note||'') : (c.memo||'-')}</td>
                            <td style={{whiteSpace:'nowrap'}}>
                              <div style={{display:'flex',gap:3}}>
                              <button className="btn btn-s btn-sm" onClick={function(){
                                setEditItem(c);
                                var base = Object.assign({},c,{amount:c.amount?fmtN(c.amount):'',outsource_cost:c.outsource_cost?fmtN(c.outsource_cost):'',entry_type:c.entry_type||'both'});
                                if (c.entry_type === 'supervision') {
                                  var parsed = parseSupvMemo(c.memo);
                                  base.supv_name = parsed.name;
                                  base.supv_client = parsed.client;
                                  base.supv_note = parsed.note;
                                }
                                setForm(base);
                                setModal('col');
                              }}>수정</button>
                              <button className="btn btn-d btn-sm" onClick={function(){deleteCol(c.id);}}>삭제</button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              );
          })()}
        </div>
      )}

      {tab === 'proj' && (
        <div className="card">
          {/* 요약 박스 - 압축형, 필터 연동 */}
          <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
            <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#eff6ff',border:'1px solid #bfdbfe',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
              <span style={{fontSize:11,fontWeight:600,color:'#1d4ed8',whiteSpace:'nowrap'}}>총 수금액</span>
              <span style={{fontSize:13,fontWeight:800,color:'#1d4ed8',whiteSpace:'nowrap'}}>{fmtN(filtTotCol)}원</span>
            </div>
            <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#fff5f5',border:'1px solid #fecaca',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
              <span style={{fontSize:11,fontWeight:600,color:'#dc2626',whiteSpace:'nowrap'}}>총 외주비</span>
              <span style={{fontSize:13,fontWeight:800,color:'#dc2626',whiteSpace:'nowrap'}}>{fmtN(filtTotOut)}원</span>
            </div>
            <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#f5f3ff',border:'1px solid #ddd6fe',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
              <span style={{fontSize:11,fontWeight:600,color:'#7c3aed',whiteSpace:'nowrap'}}>순 실적금액</span>
              <span style={{fontSize:13,fontWeight:800,color:'#7c3aed',whiteSpace:'nowrap'}}>{fmtN(filtTotNet)}원</span>
            </div>
          </div>
          <div className="st" style={{marginBottom:14}}>프로젝트별 실적 ({year}년)</div>
          {allProjSummary.length === 0 ? (
            <div className="empty"><div className="ei">📁</div><div className="et">수금 데이터가 없습니다</div></div>
          ) : (
            <div className="tbl-wrap">
              <CatFilterBar />
              <table>
                <thead><tr>

                  <div style={{marginBottom:12}}>

                      onChange={function(e){setForm(function(p){return Object.assign({},p,{supv_note:e.target.value});});}} />

                      <option value="">선택하세요</option>

      {/* ── 계약/잔금 탭 ── */}
      {tab === 'contract' && (function() {
        var activeProjects = projects.filter(function(p) { return p.status !== '완료'; });
        var allProjects = projects;

        function getContract(pid) { return contracts.find(function(c){ return c.project_id === pid; }); }
        function getTotalCol(pid) {
          return cols.filter(function(c){ return c.project_id === pid; })
            .reduce(function(s,c){ return s + (c.amount||0); }, 0);
        }
        function getTotalOut(pid) {
          return cols.filter(function(c){ return c.project_id === pid; })
            .reduce(function(s,c){ return s + (c.outsource_cost||0); }, 0);
        }

        var rows = sortRows(allProjects
          .filter(function(p){ return getContract(p.id) || p.status !== '완료'; })
          .map(function(p){
            var ct = getContract(p.id);
            var contractAmt    = ct ? (ct.amount||0) : 0;
            var priorCollected = ct ? (ct.prior_collected||0) : 0;
            var expectedOut    = ct ? (ct.expected_outsource||0) : 0;
            var totalCol = getTotalCol(p.id);
            var totalOut = getTotalOut(p.id);
            var netContractAmt = contractAmt;
            var netCol         = totalCol;
            // 잔금 = 계약 − 기수금 − 누적수금 − 예상외주 + 실지급외주누적 (외주잔여 음수 허용, 클램프 없음)
            var remain   = netContractAmt - priorCollected - netCol - expectedOut + totalOut;
            var pct      = contractAmt > 0 ? Math.min(100, Math.round(totalCol / contractAmt * 100)) : 0;
            return { p:p, ct:ct, contractAmt:contractAmt, expectedOut:expectedOut, netContractAmt:netContractAmt, priorCollected:priorCollected, totalCol:totalCol, totalOut:totalOut, remain:remain, pct:pct, startDate:(ct&&ct.start_date)?ct.start_date:(p.start_date||null) };
          })
          .sort(function(a,b){
            var catOrd = function(c){ return c==='사급'?0:c==='관급'?1:2; };
            return catOrd(a.p.category) - catOrd(b.p.category) || a.p.name.localeCompare(b.p.name, 'ko');
          }), ctSort, function(r, col) {
            if (col==='name')      return r.p.name;
            if (col==='startDate') return r.startDate||'';
            if (col==='status')    return r.p.status;
            if (col==='contract')  return r.contractAmt;
            if (col==='netCol')    return r.totalCol;
            if (col==='remain')    return r.remain;
            if (col==='pct')       return r.pct;
            return '';
          });

        var totalContract = rows.reduce(function(s,r){ return s + r.contractAmt; }, 0);
        var totalNetCol   = rows.reduce(function(s,r){ return s + r.totalCol; }, 0);
        var totalRemain   = rows.reduce(function(s,r){ return s + r.remain; }, 0);
        // 외주 관점(2행): 예상 외주비 합 / 실제 지급 누적 / 외주 잔금
        var totalExpectedOut = rows.reduce(function(s,r){ return s + r.expectedOut; }, 0);
        var totalOutPaid     = rows.reduce(function(s,r){ return s + r.totalOut; }, 0);
        var totalOutRemain   = totalExpectedOut - totalOutPaid;

        return (
          <div className="card">
            <div className="sh">
              <span className="st">계약/잔금 현황</span>
              <span style={{fontSize:12,color:'#94a3b8'}}>계약금액 클릭 시 입력/수정</span>
            </div>
            {/* 요약 — 1행: 수금 관점 / 2행: 외주 관점 */}
            <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:16}}>
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                <SummaryBox label="총 계약금액" value={fmtN(totalContract)+'원'} tone={TONE_CONTRACT} />
                <SummaryBox label="누적 수금액" value={fmtN(totalNetCol)+'원'} tone={TONE_COLLECT} />
                <SummaryBox label="총 잔금" value={fmtN(totalRemain)+'원'} tone={TONE_REMAIN} />
              </div>
              <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                <SummaryBox label="총 외주계약금액" value={fmtN(totalExpectedOut)+'원'} tone={TONE_CONTRACT} />
                <SummaryBox label="누적 지급액" value={fmtN(totalOutPaid)+'원'} tone={TONE_COLLECT} />
                <SummaryBox label="총 외주잔금" value={fmtN(totalOutRemain)+'원'} tone={TONE_REMAIN} />
              </div>
            </div>
            <div className="tbl-wrap">
              <CatFilterBar />
              <table>
                <thead>
                  <tr>
                    <SortTh label="용역명"   col="name"      state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} />
                    <SortTh label="착수일"   col="startDate" state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} />
                    <SortTh label="상태"     col="status"    state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} />
                    <SortTh label="계약금액" col="contract"  state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} className="tr" />
                    <SortTh label="수금액"    col="netCol"   state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} className="tr" />
                    <SortTh label="잔금"     col="remain"    state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} className="tr" />
                    <SortTh label="수금률"   col="pct"       state={ctSort} onSort={mkSortHandler(ctSort,setCtSort)} style={{width:90}} />
                  </tr>
                </thead>
                <tbody>
                  {filterByCat(rows, function(r){ return r.p.category; }).map(function(r) {
                    var p = r.p;
                    var isCompleted = p.status === '완료';
                    var subLabel = {fontSize:10,color:'#94a3b8',fontWeight:400,marginTop:1};

                        <td style={{fontSize:12,color:'#475569',whiteSpace:'nowrap'}}>{r.startDate ? fmtD(r.startDate) : <span style={{color:'#cbd5e1'}}>—</span>}</td>

      {/* ── 예상수금 탭 ── */}
      {tab === 'expected' && (function() {
        var today = TODAY();
        var upcoming = expectedCols.filter(function(e){ return !e.is_done; })
          .sort(function(a,b){ return a.expected_date.localeCompare(b.expected_date); });
        var done = expectedCols.filter(function(e){ return e.is_done; })
          .sort(function(a,b){ return b.expected_date.localeCompare(a.expected_date); });
        var totalUpcoming = upcoming.reduce(function(s,e){ return s + (e.amount||0); }, 0);
        var overdueList = upcoming.filter(function(e){ return e.expected_date < today; });
        var overdueAmt  = overdueList.reduce(function(s,e){ return s + (e.amount||0); }, 0);

        // 용역 종료일 기반 자동 잔금 예상
        var autoExpected = projects
          .filter(function(p){ return p.end_date && p.status !== '완료' && p.status !== '중지'; })
          .map(function(p){
            var ct = contracts.find(function(c){ return c.project_id === p.id; });
            if (!ct || !ct.amount) return null;
            var totalCol = cols.filter(function(c){ return c.project_id === p.id; })
              .reduce(function(s,c){ return s+(c.amount||0); }, 0);
            var totalOut = cols.filter(function(c){ return c.project_id === p.id; })
              .reduce(function(s,c){ return s+(c.outsource_cost||0); }, 0);
            var netContractAmt = ct.amount - (ct.expected_outsource||0);
            var netCol = totalCol - totalOut;
            var remain = netContractAmt - (ct.prior_collected||0) - netCol;
            if (remain === 0) return null;  // 완납(0)만 제외, 음수는 표시
            return { p:p, remain:remain, endDate:p.end_date, isPast: p.end_date < today };
          })
          .filter(Boolean)
          .sort(function(a,b){ return a.endDate.localeCompare(b.endDate); });
        var autoTotal = autoExpected.reduce(function(s,r){ return s+r.remain; }, 0);

        function markDone(e) {
          if (!window.confirm('수금 완료로 처리하시겠습니까?')) return;
          sb.from('expected_collections').update({is_done:true, updated_at:new Date().toISOString()})
            .eq('id', e.id).then(function(r){ if (!r.error) load(); });
        }
        function markUndo(e) {
          sb.from('expected_collections').update({is_done:false, updated_at:new Date().toISOString()})
            .eq('id', e.id).then(function(r){ if (!r.error) load(); });
        }
        function deleteExp(id) {
          if (!window.confirm('삭제하시겠습니까?')) return;
          sb.from('expected_collections').delete().eq('id', id).then(function(r){ if (!r.error) load(); });
        }

        return (
          <div className="card">
            <div className="sh">
              <span className="st">예상수금 일정</span>
              <button className="btn btn-p btn-sm" onClick={function(){
                setEditItem(null);
                setForm({expected_date:TODAY(), is_done:false});
                setModal('expected');

            </div>

            {/* 요약 카드 */}
            <div style={{display:'flex',gap:10,marginBottom:16,flexWrap:'wrap'}}>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#eff6ff',border:'1px solid #bfdbfe',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#1d4ed8',whiteSpace:'nowrap'}}>예상 수금 합계</span>
                <span style={{fontSize:13,fontWeight:800,color:'#1d4ed8',whiteSpace:'nowrap'}}>{fmtN(totalUpcoming)}원</span>
              </div>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#fff5f5',border:'1px solid #fecaca',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#dc2626',whiteSpace:'nowrap'}}>연체 금액</span>
                <span style={{fontSize:13,fontWeight:800,color:'#dc2626',whiteSpace:'nowrap'}}>{fmtN(overdueAmt)}원 <span style={{fontSize:10,fontWeight:500}}>({overdueList.length}건)</span></span>
              </div>
              <div style={{flex:1,minWidth:120,padding:'8px 14px',borderRadius:8,background:'#f0fdf4',border:'1px solid #bbf7d0',display:'flex',justifyContent:'space-between',alignItems:'center',gap:8}}>
                <span style={{fontSize:11,fontWeight:600,color:'#15803d',whiteSpace:'nowrap'}}>수금완료</span>
                <span style={{fontSize:13,fontWeight:800,color:'#15803d',whiteSpace:'nowrap'}}>{done.length}건</span>
              </div>
            </div>

            {/* 용역 종료일 기반 자동 잔금 예상 */}
            {autoExpected.length > 0 && (
              <div style={{marginBottom:20}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                  <span className="st">📅 용역 종료일 기준 예상 잔금 ({autoExpected.length}건)</span>
                  <span style={{fontSize:11,color:'#94a3b8'}}>(계약금액 - 예상외주비) - 기수금 - (수금액 - 실외주비)</span>
                  <span style={{marginLeft:'auto',fontSize:13,fontWeight:800,color:'#7c3aed'}}>{fmtN(autoTotal)}원</span>
                </div>
                <div className="tbl-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>용역명</th>
                        <th>종료일</th>
                        <th>D-day</th>
                        <th className="tr">예상 잔금</th>
                        <th className="tr">수금률</th>
                      </tr>
                    </thead>
                    <tbody>
                      {autoExpected.map(function(r) {
                        var daysLeft = Math.round((new Date(r.endDate+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
                        var ct = contracts.find(function(c){ return c.project_id === r.p.id; });
                        var totalCol = cols.filter(function(c){ return c.project_id === r.p.id; })
                          .reduce(function(s,c){ return s+(c.amount||0); }, 0);
                        var pct = ct && ct.amount > 0 ? Math.min(100, Math.round(totalCol / ct.amount * 100)) : 0;
                        return (
                          <tr key={r.p.id} style={{background: r.isPast ? '#fff5f5' : ''}}>
                            <td>
                              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                                {r.p.category && (
                                  <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                    background:CAT_BG[r.p.category]||'#f1f5f9',color:CAT_TX[r.p.category]||'#475569',
                                    border:'1px solid '+(CAT_COLOR[r.p.category]||'#e2e8f0')}}>{r.p.category}</span>
                                )}
                                <span style={{display:'flex',flexDirection:'column',gap:1}}>
                                  {r.p.client && <span style={{fontSize:'80%',color:'#94a3b8',fontWeight:500,lineHeight:1.2}}>{r.p.client}</span>}
                                  <span style={{fontWeight:600}}>{r.p.name}</span>
                                </span>
                              </div>
                            </td>
                            <td style={{whiteSpace:'nowrap',color: r.isPast?'#dc2626':'#475569',fontWeight: r.isPast?700:400}}>
                              {fmtD(r.endDate)}{r.isPast && <span style={{fontSize:10,marginLeft:4}}>⚠ 종료</span>}
                            </td>
                            <td style={{whiteSpace:'nowrap',fontSize:12,color: r.isPast?'#dc2626':daysLeft<=30?'#f59e0b':'#64748b',fontWeight:600}}>
                              {r.isPast ? '+'+Math.abs(daysLeft)+'일 경과' : 'D-'+daysLeft}
                            </td>
                            <td className="tr" style={{fontWeight:800,color: r.remain < 0 ? '#dc2626' : '#7c3aed'}}>{fmtN(r.remain)}원</td>
                            <td className="tr">
                              <div style={{display:'flex',alignItems:'center',gap:6,justifyContent:'flex-end'}}>
                                <div style={{width:50,height:5,background:'#e2e8f0',borderRadius:3,overflow:'hidden'}}>
                                  <div style={{width:pct+'%',height:'100%',background:pct>=100?'#059669':'#7c3aed',borderRadius:3}}></div>
                                </div>
                                <span style={{fontSize:11,fontWeight:700,color:pct>=100?'#059669':'#7c3aed',minWidth:28}}>{pct}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 수동 입력 미수금 목록 */}
            {upcoming.length > 0 && (
              <div style={{marginBottom:20}}>
                <div className="st" style={{marginBottom:8}}>📋 예정 수금 ({upcoming.length}건)</div>
                <div className="tbl-wrap">
                  <table>
                    <thead>
                      <tr><th>용역명</th><th>예상 수금일</th><th className="tr">예상 금액</th><th>메모</th><th></th></tr>
                    </thead>
                    <tbody>
                      {upcoming.map(function(e) {
                        var p = projects.find(function(x){ return x.id === e.project_id; });
                        var isOverdue = e.expected_date < today;
                        var daysLeft = Math.round((new Date(e.expected_date+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
                        return (
                          <tr key={e.id} style={{background: isOverdue ? '#fff5f5' : ''}}>
                            <td>
                              <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                                {p && p.category && (
                                  <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:4,
                                    background:CAT_BG[p.category]||'#f1f5f9',color:CAT_TX[p.category]||'#475569',
                                    border:'1px solid '+(CAT_COLOR[p.category]||'#e2e8f0')}}>{p.category}</span>
                                )}
                                <span style={{fontWeight:600,fontSize:13}}>{p ? p.name : '-'}</span>
                              </div>
                            </td>
                            <td>
                              <div style={{fontWeight:600,color: isOverdue?'#dc2626':'var(--theme,#0f172a)'}}>{fmtD(e.expected_date)}</div>
                              <div style={{fontSize:11,color: isOverdue?'#dc2626':'#94a3b8'}}>
                                {isOverdue ? '⚠ '+Math.abs(daysLeft)+'일 초과' : 'D-'+daysLeft}
                              </div>
                            </td>
                            <td className="tr" style={{fontWeight:700,color:'#7c3aed'}}>{fmtN(e.amount)}원</td>
                            <td style={{color:'#64748b',fontSize:12}}>{e.memo||'-'}</td>
                            <td style={{display:'flex',gap:4}}>
                              <button className="btn btn-s btn-sm" onClick={function(){
                                setEditItem(e);
                                setForm({project_id:e.project_id, amount:fmtN(e.amount), expected_date:e.expected_date, memo:e.memo||'', is_done:e.is_done});
                                setModal('expected');
                              }}>수정</button>
                              <button className="btn btn-p btn-sm" style={{background:'#dcfce7',color:'#15803d',border:'1px solid #bbf7d0'}}
                                onClick={function(){markDone(e);}}>✓완료</button>
                              <button className="btn btn-d btn-sm" onClick={function(){deleteExp(e.id);}}>삭제</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

            {upcoming.length === 0 && (
              <div className="empty" style={{marginBottom:16}}><div className="ei">📭</div><div className="et">예정된 수금이 없습니다</div></div>
            )}

            {/* 완료 목록 */}
            {done.length > 0 && (
              <div>
                <div className="st" style={{marginBottom:8,color:'#94a3b8'}}>✅ 수금완료 ({done.length}건)</div>
                <div className="tbl-wrap">
                  <table>
                    <thead>
                      <tr><th>용역명</th><th>수금일</th><th className="tr">금액</th><th>메모</th><th></th></tr>
                    </thead>
                    <tbody>
                      {done.map(function(e) {
                        var p = projects.find(function(x){ return x.id === e.project_id; });
                        return (
                          <tr key={e.id} style={{opacity:0.6}}>
                            <td style={{fontWeight:600,fontSize:13}}>{p ? p.name : '-'}</td>
                            <td style={{color:'#94a3b8'}}>{fmtD(e.expected_date)}</td>
                            <td className="tr" style={{color:'#059669',fontWeight:600}}>{fmtN(e.amount)}원</td>
                            <td style={{color:'#94a3b8',fontSize:12}}>{e.memo||'-'}</td>
                            <td>
                              <button className="btn btn-s btn-sm" style={{fontSize:10}}
                                onClick={function(){markUndo(e);}}>되돌리기</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* ── 세금계산서 탭 ── */}
      {tab === 'tax' && canTax && (function() {
        // invoice_id → 품목 배열
        var itemsByInvoice = (function(){
          var m = new Map();
          for (var i=0; i<taxItems.length; i++) {
            var it = taxItems[i];
            var arr = m.get(it.invoice_id);
            if (!arr) { arr = []; m.set(it.invoice_id, arr); }
            arr.push(it);
          }
          return m;
        })();
        // 작성일자 기준 월 목록 — 상단 공통 연도 선택에 해당하는 월만
        var monthSet = {};
        taxInvoices.forEach(function(iv){ if (iv.write_date && iv.write_date.slice(0,4) === year) monthSet[iv.write_date.slice(0,7)] = true; });
        var monthOptions = Object.keys(monthSet).sort(function(a,b){ return b.localeCompare(a); });
        // 필터(연도: 작성일 기준 — 월 필터와 기준 통일) + 정렬(발급일자 최신순)
        var rows = taxInvoices
          .filter(function(iv){ return iv.invoice_type === taxKind; })
          .filter(function(iv){ return iv.write_date && iv.write_date.slice(0,4) === year; })
          .filter(function(iv){ return taxMonth === '전체' || (iv.write_date && iv.write_date.slice(0,7) === taxMonth); })
          .slice()
          .sort(function(a,b){
            var cmp = String(b.write_date||'').localeCompare(String(a.write_date||''));
            if (cmp !== 0) return cmp;
            return String(a.id).localeCompare(String(b.id)); // 작성일 동일 시 안정 정렬
          });
        // 헤더 클릭 정렬 — 선택 시 기본 정렬(작성일 desc) 대신 적용
        if (taxSort.col) {
          rows = sortRows(rows, taxSort, function(iv, col) {
            if (col === 'date') return iv.write_date || '';
            if (col === 'name') return iv.counterpart_name || '';
            if (col === 'amount') return iv.total_amount || 0;
            return '';
          });
        }
        var sumTotal = rows.reduce(function(s,iv){ return s + (iv.total_amount||0); }, 0);
        function itemLabel(iv) {
          var its = itemsByInvoice.get(iv.id) || [];
          if (its.length === 0) return '-';
          var first = its[0].item_name || '-';
          return its.length > 1 ? (first + ' 외 ' + (its.length-1) + '건') : first;
        }
        return (
          <div className="card">
            <div className="sh">
              <span className="st">세금계산서 ({taxKind} · {year}년)</span>
              <div style={{display:'flex',gap:6,alignItems:'center'}}>
                <input ref={taxFileRef} type="file" accept=".xls,.xlsx" multiple style={{display:'none'}}
                  onChange={function(e){ handleTaxFiles(e.target.files); }} />
                <button className="btn btn-p btn-sm" disabled={taxBusy}
                  onClick={function(){ if (taxFileRef.current) taxFileRef.current.click(); }}>
                  {taxBusy ? '처리 중...' : '⬆ 홈택스 파일 업로드'}
                </button>
              </div>
            </div>

            {taxMsg && <div className={'al ' + (taxMsg.indexOf('❌')===0 ? 'al-e' : 'al-s')}>{taxMsg}</div>}
            <div
              onDragOver={function(e){ e.preventDefault(); e.stopPropagation(); if (!taxDrag) setTaxDrag(true); }}
              onDragLeave={function(e){ e.preventDefault(); e.stopPropagation(); setTaxDrag(false); }}
              onDrop={function(e){ e.preventDefault(); e.stopPropagation(); setTaxDrag(false); if (!taxBusy) handleTaxFiles(e.dataTransfer.files); }}
              onClick={function(){ if (!taxBusy && taxFileRef.current) taxFileRef.current.click(); }}
              style={{
                border: '2px dashed ' + (taxDrag ? '#7c3aed' : '#e2e8f0'),
                background: taxDrag ? '#f5f3ff' : '#f8fafc',
                borderRadius: 10, padding: '16px 14px', textAlign: 'center',
                cursor: taxBusy ? 'wait' : 'pointer', marginBottom: 12, transition: 'border-color 0.15s, background 0.15s',
                fontSize: 12, color: taxDrag ? '#7c3aed' : '#94a3b8', fontWeight: taxDrag ? 700 : 400,
                pointerEvents: taxBusy ? 'none' : 'auto',
              }}>
              {taxBusy ? '⏳ 처리 중...'
                : taxDrag ? '📂 여기에 파일을 놓으세요'
                : '🧾 홈택스 전자세금계산서 목록(.xls/.xlsx)을 여기에 드래그하거나 클릭하여 업로드 — 매입/매출 자동판별, 여러 파일 동시 가능'}

            {/* 매입/매출 토글 + 월 필터 */}
