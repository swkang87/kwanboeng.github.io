<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>업무일지 시스템</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
html, body, #app, button, input, textarea, select { font-family: 'Pretendard', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif !important; }
</style>
<script src="config.js"></script>
<script src="sysbar.js?v=20260530"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ─── SYSTEM SWITCHER BAR → sysbar.js가 주입 ─── */
@media(max-width:640px) {
  .top-nav-bar { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .top-nav-bar::-webkit-scrollbar { display: none; }
}


/* ─── TOP NAV TAB ────────────────────────────────────── */
.top-nav-bar {
  position: sticky; top: 83px; z-index: 200;
  background: #1e293b; height: 36px;
  display: flex; align-items: center;
  padding: 0 14px; gap: 1px;
  border-bottom: 1px solid var(--theme,#0f172a);
}
.top-nav-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 5px 11px; height: 26px;
  background: transparent; border: none; border-radius: 4px;
  color: #94a3b8; font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px; font-weight: 400; cursor: pointer;
  transition: all .15s; white-space: nowrap;
}
.top-nav-btn:hover { background: rgba(255,255,255,.06); color: #cbd5e1; }
.top-nav-btn.active { background: #1d4ed8; color: #fff; font-weight: 700; }
.top-nav-right {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
}
.top-nav-user { font-size: 11px; color: #94a3b8; }
.top-nav-logout {
  background: transparent; color: #64748b;
  border: 1px solid #334155; border-radius: 4px;
  padding: 3px 10px; font-size: 11px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
}
.top-nav-logout:hover { color: #94a3b8; }

/* ─── WHITE-LABEL VARIABLES ─────────────────────────────── */
/* --theme은 sysbar.js의 injectThemeVars()가 config.COLOR_PRIMARY로 덮어씀 */
/* 아래 값은 sysbar 주입 실패 시 폴백용 */
:root {
  --theme:        #0f172a;
  --accent:       #2563eb;
  --accent-lt:    #eff6ff;
  --accent-hover: #1d4ed8;
  --bg:           #f8fafc;
  --card:         #ffffff;
  --border:       #e2e8f0;
  --border-dark:  #cbd5e1;
  --text:         #1e293b;
  --text-sub:     #64748b;
  --text-muted:   #94a3b8;
  --green:        #16a34a;
  --green-bg:     #dcfce7;
  --green-border: #bbf7d0;
  --amber:        #b45309;
  --amber-bg:     #fef9c3;
  --amber-border: #fef08a;
  --red:          #dc2626;
  --red-bg:       #fee2e2;
  --sidebar-w:    240px;
  --radius:       10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
button { cursor: pointer; font-family: inherit; }
input, textarea, select { font-family: inherit; }
a { text-decoration: none; }

/* ─── LOGIN ─────────────────────────────────────────────── */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--theme); padding: 20px; }
.login-box { background: #fff; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 24px 64px rgba(0,0,0,.35); }
.login-company { font-size: 11px; font-weight: 700; color: var(--text-sub); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.login-title { font-size: 24px; font-weight: 900; color: var(--text); margin-bottom: 28px; }
.login-field { margin-bottom: 12px; }
.login-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text); outline: none; transition: border .2s; }
.login-input:focus { border-color: var(--accent); }
.login-error { font-size: 12px; color: var(--red); margin-bottom: 8px; }
.login-btn { width: 100%; padding: 13px; background: var(--theme); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; margin-top: 4px; transition: background .2s; }
.login-btn:hover { background: var(--accent); }
.login-btn:disabled { opacity: .55; cursor: not-allowed; }
.login-back { margin-top: 16px; text-align: center; }
.login-back a { font-size: 12px; color: var(--text-muted); }
.login-back a:hover { color: var(--accent); }

/* ─── APP LAYOUT ─────────────────────────────────────────── */
.app { display: flex; flex-direction: column; min-height: 100vh; }
.app-inner { display: flex; flex: 1; }

/* ─── SIDEBAR ────────────────────────────────────────────── */
.sidebar { width: var(--sidebar-w); background: var(--theme); color: #fff; display: flex; flex-direction: column; position: fixed; top: 38px; left: 0; height: calc(100vh - 38px); z-index: 100; }
.sidebar-top { padding: 22px 18px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
.sidebar-company { font-size: 10px; font-weight: 700; color: rgba(255,255,255,.45); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
.sidebar-system { font-size: 18px; font-weight: 900; color: #fff; }
.sidebar-nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; border: none; background: transparent; color: rgba(255,255,255,.6); font-size: 13px; font-weight: 500; width: 100%; text-align: left; transition: all .15s; }
.nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-item.active { background: var(--accent); color: #fff; }
.nav-icon { font-size: 15px; flex-shrink: 0; }
.nav-label { flex: 1; }
.sidebar-divider { height: 1px; background: rgba(255,255,255,.08); margin: 8px 0; }
.sidebar-footer { padding: 14px; border-top: 1px solid rgba(255,255,255,.08); }
.sidebar-user { display: flex; align-items: center; gap: 10px; }
.sidebar-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sidebar-user-info { flex: 1; min-width: 0; }
.sidebar-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-role { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; }
.logout-btn { background: none; border: none; color: rgba(255,255,255,.35); font-size: 16px; padding: 5px; border-radius: 5px; transition: color .15s; }
.logout-btn:hover { color: #fff; }

/* ─── MAIN CONTENT ───────────────────────────────────────── */
.main-content { margin-left: 0; flex: 1; min-height: calc(100vh - 38px); }

/* ─── VIEW CONTAINER ─────────────────────────────────────── */
.view-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 40px; }
.view-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
.view-title { font-size: 22px; font-weight: 900; color: var(--text); }
.view-sub { font-size: 13px; color: var(--text-sub); margin-top: 3px; }

/* ─── DATE NAV ───────────────────────────────────────────── */
.date-nav { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.date-nav-btn { padding: 7px 11px; border: 1.5px solid var(--border); background: #fff; border-radius: 6px; font-size: 12px; color: var(--text-sub); transition: all .15s; }
.date-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.date-nav-btn:disabled { opacity: .4; cursor: not-allowed; }
.date-input { padding: 7px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 13px; font-weight: 700; color: var(--text); outline: none; cursor: pointer; transition: border .2s; }
.date-input:focus { border-color: var(--accent); }
.today-btn { padding: 7px 12px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; }
.today-btn:hover { background: var(--accent-hover); }

/* ─── SECTIONS ───────────────────────────────────────────── */
.log-section { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sec-title { font-size: 14px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
.sec-icon { font-size: 16px; }
.add-btn { padding: 6px 14px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--text-sub); transition: all .15s; }
.add-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }

/* ─── TASK ITEM ──────────────────────────────────────────── */
.task-list { display: flex; flex-direction: column; gap: 7px; }
.task-item { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; transition: border .15s; }
.task-item:hover { border-color: var(--border-dark); }
.task-drag { color: var(--text-muted); font-size: 11px; letter-spacing: -1px; cursor: grab; user-select: none; flex-shrink: 0; }
.task-input { flex: 1; border: none; background: transparent; font-size: 13px; color: var(--text); outline: none; min-width: 0; }
.task-input::placeholder { color: var(--text-muted); }
.status-wrap { display: flex; gap: 4px; flex-shrink: 0; }
.status-btn { padding: 3px 9px; border-radius: 4px; border: 1.5px solid var(--border); background: #fff; font-size: 11px; font-weight: 600; color: var(--text-sub); transition: all .15s; white-space: nowrap; }
.status-btn:hover { border-color: var(--border-dark); }
.status-btn.done-active   { background: var(--green-bg);  color: var(--green);  border-color: var(--green-border); }
.status-btn.prog-active   { background: var(--accent-lt); color: var(--accent); border-color: #bfdbfe; }
.status-btn.hold-active   { background: var(--amber-bg);  color: var(--amber);  border-color: var(--amber-border); }
.task-del { background: none; border: none; color: var(--text-muted); font-size: 12px; padding: 4px 5px; border-radius: 4px; transition: all .15s; flex-shrink: 0; }
.task-del:hover { background: var(--red-bg); color: var(--red); }
.empty-hint { padding: 14px; text-align: center; color: var(--text-muted); font-size: 13px; background: var(--bg); border-radius: 7px; border: 1.5px dashed var(--border); }

/* ─── ISSUES TEXTAREA ────────────────────────────────────── */
.issues-ta { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); resize: vertical; outline: none; line-height: 1.7; transition: border .2s; }
.issues-ta:focus { border-color: var(--accent); }
.issues-ta::placeholder { color: var(--text-muted); }

/* ─── SAVE ROW ───────────────────────────────────────────── */
.save-row { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 6px; }
.saved-msg { font-size: 13px; color: var(--green); font-weight: 600; }
.save-btn { padding: 11px 26px; background: var(--theme); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; transition: background .2s; }
.save-btn:hover { background: var(--accent); }
.save-btn:disabled { opacity: .55; cursor: not-allowed; }

/* ─── LOG CARDS (view) ───────────────────────────────────── */
.log-card { background: var(--card); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; transition: border .15s, box-shadow .15s; }
.log-card:hover { border-color: var(--border-dark); }
.log-card.no-entry { opacity: .6; }
.card-head { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; cursor: pointer; user-select: none; }
.card-user { display: flex; align-items: center; gap: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.avatar.muted { background: var(--border); color: var(--text-muted); }
.avatar.sm { width: 28px; height: 28px; font-size: 12px; }
.card-name { font-size: 14px; font-weight: 700; color: var(--text); }
.card-meta { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
.card-done { color: var(--green); font-weight: 600; }
.card-none { color: var(--text-muted); }
.card-toggle { font-size: 11px; color: var(--text-muted); }
.card-body { border-top: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 16px; background: #fcfcfd; }
.card-sec {}
.card-sec-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.view-task { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.view-task:last-child { border-bottom: none; }
.vt-bullet { color: var(--accent); font-weight: 900; font-size: 14px; flex-shrink: 0; line-height: 1; }
.vt-content { flex: 1; font-size: 13px; color: var(--text); line-height: 1.55; }
.vt-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
.vt-done { background: var(--green-bg); color: var(--green); }
.vt-prog { background: var(--accent-lt); color: var(--accent); }
.vt-hold { background: var(--amber-bg); color: var(--amber); }
.issues-view { font-size: 13px; color: var(--text); line-height: 1.75; white-space: pre-wrap; background: #fff; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); }
.card-empty { font-size: 13px; color: var(--text-muted); padding: 6px 0; }

/* ─── CONTROLS ───────────────────────────────────────────── */
.ctrl-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.mode-tabs { display: flex; background: var(--card); border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; }
.mode-tab { padding: 8px 18px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: var(--text-sub); transition: all .15s; }
.mode-tab:hover { color: var(--text); }
.mode-tab.active { background: var(--accent); color: #fff; }
.date-label { font-size: 14px; font-weight: 700; color: var(--text); padding: 7px 12px; min-width: 130px; text-align: center; }

/* ─── WEEK VIEW ──────────────────────────────────────────── */
.week-wrap { overflow-x: auto; border-radius: var(--radius); border: 1.5px solid var(--border); background: var(--card); }
.week-table { min-width: 580px; }
.week-head, .week-row { display: grid; grid-template-columns: 130px repeat(5, 1fr); border-bottom: 1px solid var(--border); }
.week-row:last-child { border-bottom: none; }
.week-cell { padding: 10px 10px; border-right: 1px solid var(--border); font-size: 13px; }
.week-cell:last-child { border-right: none; }
.week-head .week-cell { background: var(--bg); font-size: 12px; font-weight: 700; color: var(--text-sub); text-align: center; }
.week-head .wc-name { text-align: left; }
.wc-day.today { background: var(--accent-lt); }
.wc-day-num { font-size: 16px; font-weight: 900; color: var(--text); }
.wc-day-label { font-size: 10px; color: var(--text-sub); }
.wc-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.week-summary { cursor: pointer; padding: 6px 4px; border-radius: 6px; transition: background .15s; text-align: center; }
.week-summary:hover { background: var(--accent-lt); }
.ws-count { font-size: 15px; font-weight: 700; color: var(--text); }
.ws-done { font-size: 11px; color: var(--green); }
.ws-issue { font-size: 11px; margin-top: 2px; }
.week-none { text-align: center; color: var(--text-muted); font-size: 18px; }

/* ─── MONTH VIEW ─────────────────────────────────────────── */
.month-wrap { border-radius: var(--radius); border: 1.5px solid var(--border); overflow: hidden; }
.month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--border); }
.month-day-hdr { background: var(--bg); padding: 8px 4px; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-sub); }
.month-day { background: var(--card); min-height: 70px; padding: 8px; cursor: pointer; transition: background .15s; }
.month-day:hover { background: #f0f5ff; }
.month-day.empty { background: var(--bg); cursor: default; pointer-events: none; }
.month-day.today { background: var(--accent-lt); }
.month-day.has-logs { border-top: 2.5px solid var(--accent); }
.md-num { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: var(--text); }
.md-num.today { background: var(--accent); color: #fff; }
.md-info { margin-top: 4px; font-size: 10px; color: var(--accent); font-weight: 700; }

/* ─── MY HISTORY ─────────────────────────────────────────── */
.history-list { display: flex; flex-direction: column; }
.history-date-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 16px 0 8px; padding-left: 2px; }

/* ─── EMPTY / LOADING ────────────────────────────────────── */
.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-text { font-size: 16px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
.empty-sub { font-size: 13px; color: var(--text-muted); }
.loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }

/* ─── OVERTIME SECTION ───────────────────────────────────── */
.overtime-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
@media (max-width: 480px) {
  .overtime-grid { grid-template-columns: 1fr; }
}
.overtime-field { display: flex; flex-direction: column; gap: 5px; }
.overtime-label {
  font-size: 11px; font-weight: 700; color: var(--text-sub);
  text-transform: uppercase; letter-spacing: .04em;
}
.overtime-time-input {
  padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--text);
  outline: none; background: #fff; transition: border .2s; width: 100%;
}
.overtime-time-input:focus { border-color: #475569; }
.overtime-time-input.has-value { border-color: #334155; background: #f8fafc; }
.overtime-time-fixed {
  padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--text-sub);
  background: var(--bg); width: 100%; display: flex; align-items: center;
}
.overtime-end-select {
  flex: 1; padding: 9px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 14px; font-weight: 600; color: var(--text);
  background: #fff; outline: none; cursor: pointer; transition: border .2s;
}
.overtime-end-select:focus { border-color: #475569; }
.overtime-end-select.has-value { border-color: #334155; background: #f8fafc; color: #0f172a; }
.overtime-summary {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: 6px;
  background: #1e293b; color: #f1f5f9;
  font-size: 12px; font-weight: 700;
}
.ot-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: #3b82f6; flex-shrink: 0;
}
.overtime-reason-input {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 13px; color: var(--text); outline: none; background: #fff;
  transition: border .2s;
}
.overtime-reason-input:focus { border-color: #475569; }
.overtime-reason-input.has-value { border-color: #334155; }
.overtime-reason-input::placeholder { color: var(--text-muted); }

/* ─── LINKED EVENTS SECTION ──────────────────────────────── */
.linked-event-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: 8px;
  border: 1.5px solid #e9d5ff; background: #faf5ff;
  margin-bottom: 8px;
}
.linked-event-item:last-child { margin-bottom: 0; }
.linked-event-badge {
  font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 4px;
  background: #7c3aed; color: #fff; white-space: nowrap; flex-shrink: 0; margin-top: 1px;
}
.linked-event-content { flex: 1; min-width: 0; }
.linked-event-title {
  font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px;
}
.linked-event-meta { font-size: 12px; color: #7c3aed; }
.linked-event-note-input {
  width: 100%; margin-top: 6px;
  padding: 7px 10px; border: 1.5px solid #e9d5ff; border-radius: 6px;
  font-size: 12px; color: var(--text); outline: none; background: #fff;
  transition: border .2s; resize: vertical;
}
.linked-event-note-input:focus { border-color: #7c3aed; }
.linked-event-note-input::placeholder { color: var(--text-muted); }
.linked-event-view {
  display: flex; align-items: flex-start; gap: 10px;

// ─── CONSTANTS ─────────────────────────────────────────────────────────────
const VIEWS = { MY_LOG: 'my_log', ALL_LOGS: 'all_logs', HISTORY: 'history', LOGS: 'logs' };
const STATUS = ['완료', '진행중', '보류'];
const STATUS_CLS = { '완료': 'done-active', '진행중': 'prog-active', '보류': 'hold-active' };

const ALLOWED_TEAMS = ['설계1팀', '설계2팀', '지반팀'];
const DAY_KR = ['일','월','화','수','목','금','토'];

// ─── 수당 연동 이벤트 유형 (공정관리 project_events.type 기준) ───────────────
const ALLOWANCE_EVENT_TYPES = ['위원회', '보고회', '착수보고', '중간보고', '최종보고'];

// ─── ID 생성 ────────────────────────────────────────────────────────────────
const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ─── 초과근무 종료시각 옵션 (오후 19~23시, 10분단위) ────────────────────────
const OT_HOURS = [18,19,20,21,22,23];
const OT_MINS  = [0,10,20,30,40,50];
const OT_START = '18:30';
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const fmtDate = (d) => {
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일`;
};

const fmtShort = (d) => {
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getMonth()+1}/${dt.getDate()}`;
};

const getWeekDates = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return Array.from({ length: 5 }, (_, i) => {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return localDateStr(dd);
  });
};

const getMonthInfo = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1);
  const last  = new Date(y, m + 1, 0);
  return {
    year: y, month: m,
    firstDate: localDateStr(first),
    lastDate:  localDateStr(last),
    days: last.getDate(),
    startWeekday: first.getDay(),
  };
};

// ─── 공휴일 (하드코딩 + Nager.Date API 조합) ──────────────────────────────
const HOLIDAYS = {
  '2025-01-01':'신정',
  '2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날',
  '2025-06-03':'임시공휴일','2025-06-06':'현충일',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날',
  '2025-12-25':'크리스마스',
  '2026-01-01':'신정',
  '2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴',
  '2026-03-01':'삼일절',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-03':'임시공휴일(지방선거)','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절',
  '2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날',
  '2026-12-25':'크리스마스',
};
const SUBSTITUTE = {
  '2025-05-06':'대체공휴일',
  '2025-10-08':'대체공휴일',
  '2026-03-02':'대체공휴일',
  '2026-05-25':'대체공휴일',  // 부처님오신날(5/24 일)
  
  '2026-08-17':'대체공휴일',
  
  '2026-10-05':'대체공휴일',
};
const NAGER_KO = {
  "New Year's Day":'신정',"Seollal":'설날',"Seollal Holiday":'설날연휴',
  "Independence Movement Day":'삼일절',"Labor Day":'근로자의날',
  "Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',
  "Memorial Day":'현충일',"Liberation Day":'광복절',
  "Chuseok":'추석',"Chuseok Holiday":'추석연휴',
  "National Foundation Day":'개천절',"Hangul Day":'한글날',
  "Christmas Day":'크리스마스',"Substitute Holiday":'대체공휴일',
};

// 날짜 문자열이 공휴일인지 반환 (이름 or null)
function getHolidayName(ds) {
  return HOLIDAYS[ds] || SUBSTITUTE[ds] || null;
}
function isHolidayDate(ds) {
  return !!(HOLIDAYS[ds] || SUBSTITUTE[ds]);
}

const _holCache = {};
async function fetchHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  // 하드코딩 데이터 먼저 적용
  const set = new Set([...Object.keys(HOLIDAYS), ...Object.keys(SUBSTITUTE)]
    .filter(d => d.startsWith(String(year))));
  try {
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const data = await r.json();
    data.forEach(h => {
      if (!h.date) return;
      const name = NAGER_KO[h.localName] || NAGER_KO[h.name] || h.localName || h.name;
      set.add(h.date);
      if (name === '대체공휴일') SUBSTITUTE[h.date] = '대체공휴일';
      else if (!HOLIDAYS[h.date]) HOLIDAYS[h.date] = name;
    });
  } catch(e) { /* API 실패 시 하드코딩 데이터만 사용 */ }
  _holCache[year] = set;
  return set;
}

// 직전 근무일 계산 (주말·공휴일 건너뜀)
function prevWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() - 1);
    const s = localDateStr(d);
    const dow = d.getDay(); // 0=일, 6=토
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}


function MiniCalendar({ value, onChange, maxDate }) {
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(() => new Date((value || todayStr()) + 'T00:00:00'));
  const [holidays, setHolidays] = useState(new Set());
  const wrapRef = useRef(null);

  useEffect(() => {
    if (!open) return;
    fetchHolidays(viewDate.getFullYear()).then(h => setHolidays(h));
  }, [open, viewDate.getFullYear()]);

  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [open]);

  const yr = viewDate.getFullYear(), mo = viewDate.getMonth();
  const startWd = new Date(yr, mo, 1).getDay();
  const lastDay = new Date(yr, mo + 1, 0).getDate();
  const today = todayStr();

  const prevM = () => { const d = new Date(viewDate); d.setMonth(d.getMonth() - 1); setViewDate(d); };
  const nextM = () => { const d = new Date(viewDate); d.setMonth(d.getMonth() + 1); setViewDate(d); };

  const select = (ds) => {
    if (maxDate && ds > maxDate) return;
    onChange(ds);
    setOpen(false);
  };

  return (
    <div className="mcal-wrap" ref={wrapRef} style={{position:'relative',display:'inline-block'}}>
      <button className="date-nav-btn" title="달력 선택"
        onClick={() => { setViewDate(new Date((value || todayStr()) + 'T00:00:00')); setOpen(v => !v); }}
        style={{padding:'4px 8px',fontSize:14}}>📅</button>
      {open && (
        <div style={{position:'absolute',top:'calc(100% + 4px)',right:0,zIndex:500,background:'#fff',
          border:'1.5px solid #e2e8f0',borderRadius:12,boxShadow:'0 8px 32px rgba(0,0,0,.18)',
          padding:12,minWidth:260}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
            <button className="date-nav-btn" onClick={prevM}>◀</button>
            <span style={{fontSize:14,fontWeight:800,color:'#0f172a'}}>{yr}년 {mo+1}월</span>
            <button className="date-nav-btn" onClick={nextM}>▶</button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>
            {DAY_KR.map((d,i) => (
              <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:700,padding:'4px 0',
                color: i===0?'#dc2626':i===6?'#2563eb':'#64748b'}}>{d}</div>
            ))}
            {Array.from({length:startWd},(_,i) => <div key={'e'+i} />)}
            {Array.from({length:lastDay},(_,i) => {
              const day = i+1;
              const ds = yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
              const wd = new Date(ds+'T00:00:00').getDay();
              const isHol = holidays.has(ds);
              const isFuture = maxDate && ds > maxDate;
              const isToday = ds === today;
              const isSel = ds === value;
              return (
                <div key={day} onClick={() => !isFuture && select(ds)}
                  style={{textAlign:'center',fontSize:12,padding:'5px 2px',borderRadius:6,cursor:isFuture?'default':'pointer',
                    fontWeight:500,opacity:isFuture?0.3:1,
                    background: isSel?'var(--theme,#0f172a)':isToday?'#7c3aed':'transparent',
                    color: isSel||isToday?'#fff':(wd===0||isHol)?'#dc2626':wd===6?'#2563eb':'var(--theme,#0f172a)'}}>
                  {day}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

const roleLabel = (r) => r === 'admin' ? '관리자' : r === 'manager' ? '팀장' : '팀원';

// ─── MY LOG VIEW ───────────────────────────────────────────────────────────
function MyLogView({ user, canWrite }) {
  const [date, setDate]             = useState(todayStr());
  const [tasks, setTasks]           = useState([]);
  const [issues, setIssues]         = useState('');
  const [overtimeEnd, setOvertimeEnd]         = useState('');
  const [overtimeReason, setOvertimeReason]   = useState('');
  const [overtimeOpen, setOvertimeOpen]       = useState(false);
  // linkedEvents: [{ eventId, type, title, projectName, note }]
  const [linkedEvents, setLinkedEvents] = useState([]);
  const [saving, setSaving]   = useState(false);
  const [loading, setLoading] = useState(false);
  const [savedMsg, setSavedMsg] = useState('');
  // 공유 할일
  const [todos, setTodos]           = useState([]);
  const [todoLoading, setTodoLoading] = useState(false);
  const [todoInput, setTodoInput]   = useState('');
  const [todoAdding, setTodoAdding] = useState(false);

  // 공정관리에서 해당 날짜 + 본인 PM인 수당 이벤트 조회
  const loadLinkedEvents = useCallback(async (d) => {
    try {
      // project_events 조회: 해당 날짜, 수당 유형
      const { data: evData } = await sb
        .from('project_events')
        .select('id, type, title, project_id')
        .eq('event_date', d)
        .in('type', ALLOWANCE_EVENT_TYPES);
      if (!evData || evData.length === 0) { setLinkedEvents([]); return; }

      // 프로젝트 PM 확인
      const pids = [...new Set(evData.map(e => e.project_id))];
      const { data: projData } = await sb
        .from('projects')
        .select('id, name, pm_id')
        .in('id', pids);

      // 본인이 PM인 이벤트만 필터
      const myEvents = evData.filter(e => {
        const proj = (projData || []).find(p => p.id === e.project_id);
        return proj && proj.pm_id === user.id;
      });

      if (myEvents.length === 0) { setLinkedEvents([]); return; }

      // 기존 업무일지에 저장된 note 불러오기 (있으면)
      const { data: existLog } = await sb.from('work_logs')
        .select('linked_events')
        .eq('user_id', user.id).eq('log_date', d).maybeSingle();
      const savedLinked = existLog?.linked_events || [];

      setLinkedEvents(myEvents.map(e => {
        const proj = (projData || []).find(p => p.id === e.project_id);
        const saved = savedLinked.find(s => s.event_id === e.id);
        return {
          eventId: e.id,
          type: e.type,
          title: e.title || e.type,
          projectName: proj?.name || '',
          note: saved?.note || '',
        };
      }));
    } catch(err) {
      console.error('[linkedEvents]', err);
      setLinkedEvents([]);
    }
  }, [user.id]);

  // ── 공유 할일 ───────────────────────────────────────────────────────────────
  const loadTodos = () => {
    setTodoLoading(true);
    sb.from('shared_todos')
      .select('*,creator:created_by(name),completer:completed_by(name)')
      .eq('scope', 'worklog')
      .neq('status', '완료')
      .order('created_at', { ascending: true })
      .then(r => { setTodos(r.data || []); setTodoLoading(false); });
  };
  const addTodo = () => {
    const title = todoInput.trim();
    if (!title) return;
    setTodoAdding(true);
    sb.from('shared_todos').insert({ title, created_by: user.id, status: '대기', scope: 'worklog' })
      .then(r => { setTodoAdding(false); if (!r.error) { setTodoInput(''); loadTodos(); } });
  };
  const completeTodo = (id) => {
    sb.from('shared_todos').update({
      status: '완료', completed_by: user.id, completed_at: new Date().toISOString()
    }).eq('id', id).then(() => loadTodos());
  };
  const deleteTodo = (id) => {
    sb.from('shared_todos').delete().eq('id', id).then(() => loadTodos());
  };
  const restoreTodo = (id) => {
    sb.from('shared_todos').update({
      status: '대기', completed_by: null, completed_at: null
    }).eq('id', id).then(() => loadTodos());
  };
  const pickTodo = (todo) => {
    setTasks(p => [...p, { id: genId(), content: todo.title, status: '완료', fromTodoId: todo.id }]);
    completeTodo(todo.id);
  };

  const loadLog = useCallback(async (d) => {
    setLoading(true);
    const { data } = await sb.from('work_logs')
      .select('*').eq('user_id', user.id).eq('log_date', d).maybeSingle();
    if (data) {
      setTasks(data.tasks || []);
      setIssues(data.issues || '');
      setOvertimeEnd(data.overtime_end || '');
      setOvertimeReason(data.overtime_reason || '');
      setOvertimeOpen(!!(data.overtime_end && data.overtime_end > OT_START));
    } else {
      // 빈 날짜 → 직전 근무일의 진행중 업무 자동 불러오기
      const prevDs = prevWorkday(d);
      const { data: pd } = await sb.from('work_logs')
        .select('tasks').eq('user_id', user.id).eq('log_date', prevDs).maybeSingle();
      const pending = pd
        ? (pd.tasks || []).filter(t => t.status === '진행중').map(t => ({ ...t, id: genId() }))
        : [];
      setTasks(pending);
      setIssues('');
      setOvertimeEnd('');
      setOvertimeReason('');
      setOvertimeOpen(false);
    }
    // 연동 이벤트는 항상 공정관리에서 최신 조회
    await loadLinkedEvents(d);
    setLoading(false);
  }, [user.id, loadLinkedEvents]);

  useEffect(() => { loadLog(date); }, [date, loadLog]);
  useEffect(() => { loadTodos(); }, []);

  const save = async () => {
    const hasOvertime = !!(overtimeEnd && overtimeEnd > OT_START);
    setSaving(true);

    // 기존 로그 존재 여부 확인 (create vs update 판별)
    const { data: existing } = await sb.from('work_logs')
      .select('id').eq('user_id', user.id).eq('log_date', date).maybeSingle();

    const { error } = await sb.from('work_logs').upsert({
      user_id: user.id,
      log_date: date,
      tasks,
      tomorrow_tasks: [],
      issues,
      overtime: hasOvertime,
      overtime_start: hasOvertime ? OT_START : null,
      overtime_end:   hasOvertime ? overtimeEnd : null,
      overtime_reason: hasOvertime ? overtimeReason : '',
      linked_events: linkedEvents.map(e => ({ event_id: e.eventId, note: e.note })),
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id,log_date' });

    if (!error) {
      // 이력 기록 (fire-and-forget)
      sb.from('work_logs_history').insert({
        work_log_id: existing?.id || null,
        user_id: user.id,
        log_date: date,
        action: existing ? 'update' : 'create',
        saved_at: new Date().toISOString(),
        overtime: hasOvertime,
        overtime_start: hasOvertime ? OT_START : null,
        overtime_end:   hasOvertime ? overtimeEnd : null,
        overtime_reason: hasOvertime ? overtimeReason : '',
        task_count: tasks.length,
        has_issues: !!(issues && issues.trim()),
      }).then(({ error: he }) => { if (he) console.warn('[history]', he); });

      setSavedMsg('저장되었습니다');
      setTimeout(() => setSavedMsg(''), 2500);
    }
    setSaving(false);
  };

  const prevDay = () => setDate(prevWorkday(date));
  const nextDay = () => {
    // 다음 근무일 계산
    const d = new Date(date + 'T00:00:00');
    let next;
    do {
      d.setDate(d.getDate() + 1);
      const s = localDateStr(d);
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) { next = s; break; }
    } while (true);
    if (next <= todayStr()) setDate(next);
  };

  const addTask = () => setTasks(p => [...p, { id: genId(), content: '', status: '진행중' }]);
  const updTask = (id, t) => setTasks(p => p.map(x => x.id === id ? t : x));
  const delTask = (id) => setTasks(p => p.filter(x => x.id !== id));
  const updLinkedNote = (eventId, note) =>
    setLinkedEvents(p => p.map(e => e.eventId === eventId ? { ...e, note } : e));

  const isToday = date === todayStr();
  const dayName = DAY_KR[new Date(date + 'T00:00:00').getDay()];

  // 이벤트 유형별 색상
  const evColor = (type) => {
    if (type === '위원회') return { bg: '#fce7f3', bd: '#ec4899', tx: '#9d174d' };
    if (type === '보고회' || type === '착수보고' || type === '중간보고' || type === '최종보고')
      return { bg: '#eff6ff', bd: '#3b82f6', tx: '#1d4ed8' };
    return { bg: '#f3f4f6', bd: '#9ca3af', tx: '#374151' };
  };

  return (
    <div className="view-wrap">
      <div className="view-header">
        <div>
          <div className="view-title">📝 내 업무일지</div>
          <div className="view-sub">{user.name}님 · {fmtDate(date)} ({dayName})</div>
        </div>
        <div className="date-nav">
          <button className="date-nav-btn" onClick={prevDay}>◀</button>
          <input className="date-input" type="date" value={date}
            max={todayStr()} onChange={e => setDate(e.target.value)} />
          <MiniCalendar value={date} maxDate={todayStr()} onChange={setDate} />
          <button className="date-nav-btn" onClick={nextDay} disabled={isToday}>▶</button>
          {!isToday && <button className="today-btn" onClick={() => setDate(todayStr())}>오늘</button>}
        </div>
      </div>

      {/* 공유 할일 */}
      <div className="log-section">
        <div className="sec-header">
          <div className="sec-title">
            <span className="sec-icon">📋</span>공유 할일
            {todos.length > 0 && <span style={{ fontSize:11, fontWeight:600, color:'var(--text-muted)', marginLeft:4 }}>{todos.length}건 남음</span>}
          </div>
          <div style={{ display:'flex', gap:6, alignItems:'center' }}>
            <input
              style={{ padding:'5px 10px', border:'1.5px solid var(--border)', borderRadius:6,
                fontSize:12, width:180, outline:'none', fontFamily:'inherit' }}
              value={todoInput}
              placeholder="할일 추가"
              onChange={e => setTodoInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') addTodo(); }}
            />
            <button
              style={{ padding:'5px 12px', background:'var(--accent)', color:'#fff', border:'none',
                borderRadius:6, fontSize:12, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap',
                opacity: (todoAdding || !todoInput.trim()) ? 0.5 : 1 }}
              onClick={addTodo}
              disabled={todoAdding || !todoInput.trim()}>
              {todoAdding ? '...' : '+ 추가'}
            </button>
          </div>
        </div>
        {todoLoading ? (
          <div style={{ fontSize:12, color:'var(--text-muted)', padding:'6px 0' }}>불러오는 중...</div>
        ) : todos.length === 0 ? (
          <div style={{ fontSize:12, color:'var(--text-muted)', padding:'6px 0' }}>등록된 할일이 없습니다</div>
        ) : (
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
            {todos.map(todo => (
              <div key={todo.id} style={{ display:'flex', alignItems:'center', gap:8,
                padding:'7px 10px', background:'var(--bg)', borderRadius:8,
                border:'1.5px solid var(--border)', minWidth:0 }}>
                <span style={{ fontSize:12, color:'var(--text-muted)', flexShrink:0 }}>☐</span>
                <span style={{ flex:1, fontSize:12, color:'var(--text)', fontWeight:500,
                  overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}
                  title={todo.title}>{todo.title}</span>
                {todo.creator && (
                  <span style={{ fontSize:10, color:'var(--text-muted)', flexShrink:0 }}>{todo.creator.name}</span>
                )}
                <button onClick={() => pickTodo(todo)}
                  style={{ flexShrink:0, padding:'2px 8px', background:'#ede9fe',
                    color:'#6d28d9', border:'none', borderRadius:6,
                    fontSize:11, fontWeight:700, cursor:'pointer', whiteSpace:'nowrap' }}>
                  가져오기
                </button>
                <button onClick={() => deleteTodo(todo.id)}
                  style={{ flexShrink:0, background:'transparent', border:'none',
                    color:'var(--text-muted)', cursor:'pointer', fontSize:13, lineHeight:1, padding:'0 2px' }}
                  title="삭제">✕</button>
              </div>
            ))}
          </div>
        )}
      </div>

      {loading ? <div className="loading">불러오는 중...</div> : (<>
        {/* 오늘 한 일 */}
        <div className="log-section">
          <div className="sec-header">
            <div className="sec-title"><span className="sec-icon">✅</span>오늘 한 일</div>
            <button className="add-btn" onClick={addTask}>+ 업무 추가</button>
          </div>
          {tasks.length === 0
            ? <div className="empty-hint">아직 업무가 없습니다. '+ 업무 추가'를 눌러 기록하세요.</div>
            : <div className="task-list">
                {tasks.map(t => (
                  <TaskItem key={t.id} task={t} showStatus={true}
                    onChange={u => updTask(t.id, u)}
                    onDelete={() => { if (t.fromTodoId) restoreTodo(t.fromTodoId); delTask(t.id); }} />
                ))}
              </div>
          }
        </div>

        {/* 위원회 / 보고회 자동 연동 */}
        {linkedEvents.length > 0 && (
          <div className="log-section">
            <div className="sec-header">
              <div className="sec-title">
                <span className="sec-icon">🏛️</span>
                공정관리 연동 일정
                <span style={{ fontSize:11, fontWeight:600, padding:'2px 8px', borderRadius:4,
                  background:'#ede9fe', color:'#7c3aed', marginLeft:4 }}>자동</span>
              </div>
            </div>
            <div style={{ fontSize:12, color:'var(--text-sub)', marginBottom:10 }}>
              공정관리에 등록된 일정입니다. 메모를 추가할 수 있습니다.
            </div>
            {linkedEvents.map(ev => {
              const col = evColor(ev.type);
              return (
                <div key={ev.eventId} className="linked-event-item"
                  style={{ borderColor: col.bd, background: col.bg }}>
                  <span className="linked-event-badge"
                    style={{ background: col.tx }}>{ev.type}</span>
                  <div className="linked-event-content">
                    <div className="linked-event-title">{ev.title}</div>
                    <div className="linked-event-meta">📁 {ev.projectName}</div>
                    <textarea
                      className="linked-event-note-input"
                      rows={2}
                      placeholder="메모 (선택사항)"
                      value={ev.note}
                      onChange={e => updLinkedNote(ev.eventId, e.target.value)}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* 이슈 / 공유사항 */}
        <div className="log-section">
          <div className="sec-header">
            <div className="sec-title"><span className="sec-icon">💬</span>이슈 / 공유사항</div>
          </div>
          <textarea className="issues-ta" rows={4} value={issues}
            placeholder="공유할 이슈, 리소스 요청, 협업 필요사항 등을 자유롭게 적으세요"
            onChange={e => setIssues(e.target.value)} />
        </div>

        {/* 초과근무 */}
        <div className="log-section" style={{ padding:0, overflow:'hidden' }}>
          <div className="sec-header"
            style={{ padding:'14px 20px', cursor:'pointer', marginBottom:0 }}
            onClick={() => {
              setOvertimeOpen(o => {
                if (!o && !overtimeEnd) setOvertimeEnd(OT_START);
                return !o;
              });
            }}>
            <div className="sec-title">
              <span className="sec-icon">⏰</span>초과근무
              {overtimeEnd && overtimeEnd > OT_START && (
                <span className="overtime-summary">
                  <span className="ot-dot"></span> 오후 18:30 ~ 오후 {overtimeEnd.replace(':','시 ')}분
                </span>
              )}
            </div>
            <span style={{ fontSize:12, color:'var(--text-muted)', userSelect:'none' }}>
              {overtimeOpen ? '▲' : '▼'}
            </span>
          </div>
          {overtimeOpen && (
            <div style={{ padding:'0 20px 16px', borderTop:'1px solid var(--border)' }}>
              <div style={{ display:'flex', alignItems:'flex-end', gap:0, marginTop:14 }}>
                {/* 시작 시각 */}
                <div className="overtime-field" style={{ flex:'0 0 auto' }}>
                  <span className="overtime-label">시작 시각</span>
                  <div className="overtime-time-fixed" style={{ width:'fit-content', whiteSpace:'nowrap', paddingLeft:14, paddingRight:14 }}>
                    오후 18:30
                  </div>
                </div>
                {/* ~ 구분자 */}
                <div style={{ display:'flex', alignItems:'center', padding:'0 10px', paddingBottom:10 }}>
                  <span style={{ fontSize:16, fontWeight:700, color:'var(--text-muted)' }}>~</span>
                </div>
                {/* 종료 시각 */}
                <div className="overtime-field" style={{ flex:'0 0 auto' }}>
                  <span className="overtime-label">종료 시각</span>
                  {(() => {
                    const [endH, endM] = (overtimeEnd || OT_START).split(':').map(Number);
                    const setH = (h) => setOvertimeEnd(`${String(h).padStart(2,'0')}:${String(endM).padStart(2,'0')}`);
                    const setM = (m) => setOvertimeEnd(`${String(endH).padStart(2,'0')}:${String(m).padStart(2,'0')}`);
                    const isActive = overtimeEnd && overtimeEnd > OT_START;
                    return (
                      <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                        <select className={`overtime-end-select ${isActive ? 'has-value' : ''}`}
                          style={{ width:110 }}
                          value={endH} onChange={e => setH(parseInt(e.target.value))}>
                          {OT_HOURS.map(h => <option key={h} value={h}>오후 {h}시</option>)}
                        </select>
                        <span style={{ fontWeight:800, color:'var(--text-sub)', flexShrink:0 }}>:</span>
                        <select className={`overtime-end-select ${isActive ? 'has-value' : ''}`}
                          style={{ width:80 }}
                          value={endM} onChange={e => setM(parseInt(e.target.value))}>
                          {OT_MINS.map(m => <option key={m} value={m}>{String(m).padStart(2,'0')}분</option>)}
                        </select>
                      </div>
                    );
                  })()}
                </div>
              </div>
              <input
                className={`overtime-reason-input ${overtimeReason ? 'has-value' : ''}`}
                type="text" placeholder="초과근무 사유"
                value={overtimeReason}
                style={{ marginTop:10 }}
                onChange={e => setOvertimeReason(e.target.value)}
              />
            </div>
          )}
        </div>

        <div className="save-row">
          {!canWrite && <span style={{ fontSize:12, color:'#f59e0b', fontWeight:600 }}>⚠️ 조회 전용 계정입니다 (작성 권한 없음)</span>}
          {savedMsg && <span className="saved-msg">✓ {savedMsg}</span>}
          <button className="save-btn" onClick={save} disabled={saving || !canWrite}
            title={!canWrite ? '작성 권한이 없습니다' : ''}>
            {saving ? '저장 중...' : '💾 저장'}
          </button>
        </div>
      </>)}
    </div>
  );
}

// ─── LOG CARD (열람용) ─────────────────────────────────────────────────────
function LogCard({ log, name, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen || false);
  const done  = (log.tasks || []).filter(t => t.status === '완료').length;
  const total = (log.tasks || []).length;
  const hasOvertime = log.overtime === true;
  const linkedEvs = log.linked_events || [];

  // 이벤트 유형별 색상
  const evColor = (type) => {
    if (type === '위원회') return { bg: '#fce7f3', bd: '#ec4899', tx: '#9d174d' };
    if (['보고회','착수보고','중간보고','최종보고'].includes(type))
      return { bg: '#eff6ff', bd: '#3b82f6', tx: '#1d4ed8' };
    return { bg: '#f3f4f6', bd: '#9ca3af', tx: '#374151' };
  };

  return (
    <div className={`log-card ${!log ? 'no-entry' : ''}`}>
      <div className="card-head" onClick={() => setOpen(o => !o)}>
        <div className="card-user">
          <div className="avatar">{name[0]}</div>
          <div>
            <div className="card-name">{name}</div>
            <div className="card-meta">
              업무 {total}건
              {total > 0 && <span className="card-done"> · 완료 {done}건</span>}
              {hasOvertime && <span style={{ color:'#1d4ed8', fontWeight:700 }}> · <span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:'#3b82f6',marginRight:3,verticalAlign:'middle'}}></span>초과근무</span>}
              {linkedEvs.length > 0 && <span style={{ color:'#7c3aed', fontWeight:700 }}> · 🏛️ {linkedEvs.length}건</span>}
            </div>
          </div>
        </div>
        <span className="card-toggle">{open ? '▲' : '▼'}</span>
      </div>
      {open && (
        <div className="card-body">
          <div className="card-sec">
            <div className="card-sec-title">✅ 오늘 한 일</div>
            {(log.tasks || []).length === 0
              ? <div className="card-empty">업무 내역 없음</div>
              : (log.tasks || []).map((t, i) => (
                  <div key={i} className="view-task">
                    <span className="vt-bullet">·</span>
                    <span className="vt-content">{t.content}</span>
                    <span className={`vt-badge ${STATUS_BADGE[t.status] || ''}`}>{t.status}</span>
                  </div>
                ))
            }
          </div>
          {linkedEvs.length > 0 && (
            <div className="card-sec">
              <div className="card-sec-title">🏛️ 공정관리 연동 일정</div>
              {linkedEvs.map((e, i) => {
                const col = evColor(e.type || '');
                return (
                  <div key={i} className="linked-event-view"
                    style={{ borderColor: col.bd, background: col.bg, marginBottom: i < linkedEvs.length-1 ? 6 : 0 }}>
                    <span style={{ fontSize:11, fontWeight:800, padding:'2px 8px', borderRadius:4,
                      background: col.tx, color:'#fff', whiteSpace:'nowrap', flexShrink:0, marginTop:1 }}>
                      {e.type}
                    </span>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13, fontWeight:700, color:'var(--text)' }}>
                        {e.project_name || '프로젝트'}
                      </div>
                      {e.note && <div style={{ fontSize:12, color:'#475569', marginTop:3 }}>{e.note}</div>}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          {hasOvertime && (
            <div className="card-sec">
              <div className="card-sec-title">⏰ 초과근무</div>
              <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                <span className="overtime-badge">
                  <span className="ot-dot"></span> {log.overtime_start && log.overtime_end
                    ? `${log.overtime_start} ~ ${log.overtime_end}`
                    : '초과근무'}
                </span>
                {log.overtime_reason && (
                  <span style={{ fontSize:13, color:'var(--text)' }}>{log.overtime_reason}</span>
                )}

          {(log.tomorrow_tasks || []).length > 0 && (
            <div className="card-sec">

                <div key={i} className="view-task">

                  <span className="vt-content">{t.content}</span>
                </div>
              ))}

          )}
          {log.issues && (
            <div className="card-sec">
              <div className="card-sec-title">💬 이슈 / 공유사항</div>
              <div className="issues-view">{log.issues}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── ALL LOGS VIEW ─────────────────────────────────────────────────────────
function AllLogsView({ user }) {
  const [mode, setMode] = useState('day');
  const [selDate, setSelDate] = useState(todayStr());
  const [logs, setLogs] = useState([]);
  const [users, setUsers] = useState([]);
  const [teams, setTeams] = useState([]);
  const [loading, setLoading] = useState(false);
  const [usersLoaded, setUsersLoaded] = useState(false);

  const changeMode = (newMode, date) => {
    history.pushState({ mode: newMode, selDate: date || selDate }, '', '');
    if (date) setSelDate(date);
    setMode(newMode);
  };

  useEffect(() => {
    history.replaceState({ mode: 'day', selDate: selDate }, '', '');
    const onPop = (e) => {
      if (e.state && e.state.mode) {
        setMode(e.state.mode);
        if (e.state.selDate) setSelDate(e.state.selDate);
      }
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  useEffect(() => {
    setUsersLoaded(false);
    const load = async () => {
      try {
        const { data: teamData, error: teamErr } = await sb.from('teams').select('id, name');
        if (teamErr) console.error('[AllLogs] teams fetch error:', teamErr);
        const allTeams = teamData || [];
        setTeams(allTeams);
        const { data: userData, error: userErr } = await sb.from('users').select('id, name, team_id, role').order('name');
        if (userErr) console.error('[AllLogs] users fetch error:', userErr);
        const allUsers = userData || [];
        const allowedTeamIds = allTeams.filter(t => ALLOWED_TEAMS.includes(t.name)).map(t => t.id);

        // ── 역할별 조회 범위 ─────────────────────────────────
        // admin: 전체
        // manager: 관리팀 제외 전체 (모든 팀원 + 타팀 팀장)
        // employee: 관리팀 제외 + 팀장 전체 제외 (팀원끼리만)
        let filtered = allUsers.filter(u => u.role !== 'contractor');
        if (user.role === 'admin') {
          // 전체 허용 (contractor만 제외)
        } else if (user.role === 'manager') {
          // 관리팀 제외
          filtered = filtered.filter(u => allowedTeamIds.includes(u.team_id));
        } else {
          // employee: 관리팀 제외 + 팀장 전체 제외
          filtered = filtered.filter(u =>
            allowedTeamIds.includes(u.team_id) && u.role !== 'manager'
          );
        }
        setUsers(filtered);
      } catch(e) {
        console.error('[AllLogs] load error:', e);
      } finally {
        setUsersLoaded(true);
      }
    };
    load();
  }, [user.id]);

  useEffect(() => {
    if (!usersLoaded) return;
    const fetchLogs = async () => {
      setLoading(true);
      let start, end;
      if (mode === 'day') { start = end = selDate; }
      else if (mode === 'week') { const w = getWeekDates(selDate); start = w[0]; end = w[4]; }
      else { const m = getMonthInfo(selDate); start = m.firstDate; end = m.lastDate; }
      const { data, error } = await sb.from('work_logs').select('*').gte('log_date', start).lte('log_date', end);
      if (error) console.error('[AllLogs] work_logs fetch error:', error);
      setLogs(data || []);
      setLoading(false);
    };
    fetchLogs();
  }, [selDate, mode, usersLoaded]);

  // 인덱싱: (user_id|log_date) → log
  const logIndex = useMemo(() => {
    const m = new Map();
    for (const l of logs) m.set(l.user_id + '|' + l.log_date, l);
    return m;
  }, [logs]);
  const logFor = (uid, d) => logIndex.get(uid + '|' + d);

  const shift = (dir) => {
    const d = new Date(selDate + 'T00:00:00');
    if (mode === 'day')       d.setDate(d.getDate() + dir);
    else if (mode === 'week') d.setDate(d.getDate() + dir * 7);
    else                      d.setMonth(d.getMonth() + dir);
    setSelDate(localDateStr(d));
  };

  const rangeLabel = () => {
    if (mode === 'day')  return fmtDate(selDate);
    if (mode === 'week') {
      const d = new Date(selDate + 'T00:00:00');
      const y = d.getFullYear();
      const m = d.getMonth();
      const firstDay = new Date(y, m, 1);
      const weekNum = Math.ceil((d.getDate() + ((firstDay.getDay()+6)%7)) / 7);
      return `${y}년 ${m+1}월 ${weekNum}주`;
    }
    const { year, month } = getMonthInfo(selDate);
    return year + '년 ' + (month+1) + '월';
  };

  const weekDates = getWeekDates(selDate);
  const mInfo = getMonthInfo(selDate);
  const STATUS_COLOR = { '완료': '#059669', '진행중': '#2563eb', '보류': '#d97706' };

  return (
    <div className="view-wrap">
      <div className="view-header">
        <div>
          <div className="view-title">👥 전체 업무일지</div>
          <div className="view-sub">모든 팀원의 업무를 확인합니다</div>
        </div>
      </div>
      <div className="ctrl-row">
        <div className="mode-tabs">
          {[['day','일별'],['week','주별'],['month','월별']].map(([k,l]) => (
            <button key={k} className={'mode-tab ' + (mode===k?'active':'')}
              onClick={() => changeMode(k)}>{l}</button>
          ))}
        </div>
        <div className="date-nav">
          <button className="date-nav-btn" onClick={() => shift(-1)}>◀</button>
          <span className="date-label" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:1}}>
            <span>{rangeLabel()}</span>
            {mode === 'week' && (function(){
              const w = getWeekDates(selDate);
              return <span style={{fontSize:11,fontWeight:500,color:'var(--text-sub)'}}>{fmtShort(w[0])} ~ {fmtShort(w[4])}</span>;
            })()}
          </span>
          <button className="date-nav-btn" onClick={() => shift(1)}>▶</button>
          {mode !== 'month' && <MiniCalendar value={selDate} onChange={v => setSelDate(v)} />}
          <button className="today-btn" onClick={() => setSelDate(todayStr())}>오늘</button>
        </div>
      </div>

      {loading ? <div className="loading">불러오는 중...</div> : (<>

        {mode === 'day' && (
          <div>
            {users.map(u => {
              const log = logFor(u.id, selDate);
              return log
                ? <LogCard key={u.id} log={log} name={u.name} defaultOpen={false} />
                : (
                  <div key={u.id} className="log-card no-entry">
                    <div className="card-head" style={{ cursor:'default' }}>
                      <div className="card-user">
                        <div className="avatar muted">{u.name[0]}</div>
                        <div>
                          <div className="card-name">{u.name}</div>
                          <div className="card-meta card-none">업무일지 미작성</div>
                        </div>
                      </div>
                    </div>
                  </div>
                );
            })}
            {usersLoaded && !users.length && <div className="empty-state"><div className="empty-icon">👥</div><div className="empty-text">표시할 팀원이 없습니다</div><div className="empty-sub">업무일지 대상 팀에 속한 직원이 없습니다</div></div>}
          </div>
        )}

        {mode === 'week' && (
          <div>
            {users.map(u => {
              const weekLogs = weekDates.map(d => ({ date: d, log: logFor(u.id, d) })).filter(x => x.log);
              if (weekLogs.length === 0) return (
                <div key={u.id} className="log-card no-entry" style={{ marginBottom:10 }}>
                  <div className="card-head" style={{ cursor:'default' }}>
                    <div className="card-user">
                      <div className="avatar muted">{u.name[0]}</div>
                      <div>
                        <div className="card-name">{u.name}</div>
                        <div className="card-meta card-none">이번 주 미작성</div>
                      </div>
                    </div>
                  </div>
                </div>
              );
              return (
                <div key={u.id} className="log-card" style={{ marginBottom:12 }}>
                  <div className="card-head" style={{ cursor:'default' }}>
                    <div className="card-user">
                      <div className="avatar">{u.name[0]}</div>
                      <div>
                        <div className="card-name">{u.name}</div>
                        <div className="card-meta">{weekLogs.length}일 작성</div>
                      </div>
                    </div>
                  </div>
                  <div style={{ padding:'0 14px 14px' }}>
                    {weekLogs.map(({ date: wdate, log }) => {
                      const dt = new Date(wdate + 'T00:00:00');
                      const dayLabel = (dt.getMonth()+1) + '/' + dt.getDate() + '(' + DAY_KR[dt.getDay()] + ')';
                      return (
                        <div key={wdate} style={{ marginBottom:12 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:6,
                            padding:'4px 8px', background:'#f8fafc', borderRadius:6, cursor:'pointer' }}
                            onClick={() => changeMode('day', wdate)}>
                            <span style={{ fontSize:12, fontWeight:700, color:'#475569' }}>{dayLabel}</span>
                            <span style={{ fontSize:11, color:'#94a3b8' }}>업무 {(log.tasks||[]).length}건</span>
                            <span style={{ fontSize:11, color:'#7c3aed', marginLeft:'auto' }}>상세보기 →</span>
                          </div>
                          {(log.tasks||[]).map((t, i) => (
                            <div key={i} style={{ display:'flex', alignItems:'flex-start', gap:8,
                              padding:'4px 0', borderBottom:'1px solid #f1f5f9', fontSize:13 }}>
                              <span style={{ flexShrink:0, fontSize:11, fontWeight:700,
                                color: STATUS_COLOR[t.status]||'#64748b',
                                background: (STATUS_COLOR[t.status]||'#64748b')+'18',
                                padding:'1px 6px', borderRadius:4 }}>{t.status}</span>
                              <span style={{ color:'#334155', lineHeight:1.5 }}>{t.content}</span>
                            </div>
                          ))}
                          {log.issues && (
                            <div style={{ marginTop:4, padding:'4px 8px', background:'#fef3c7',
                              borderRadius:5, fontSize:12, color:'#92400e' }}>💬 {log.issues}</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {mode === 'month' && (
          <div className="month-wrap">
            <div className="month-grid">
              {DAY_KR.map(d => <div key={d} className="month-day-hdr">{d}</div>)}
              {Array.from({ length: mInfo.startWeekday }, (_, i) => (
                <div key={'e'+i} className="month-day empty" />
              ))}
              {Array.from({ length: mInfo.days }, (_, i) => {
                const day = i + 1;
                const ds  = mInfo.year + '-' + String(mInfo.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
                const cnt = logs.filter(l => l.log_date === ds).length;
                const otCnt = logs.filter(l => l.log_date === ds && l.overtime === true).length;
                const isT = ds === todayStr();
                return (
                  <div key={day} className={'month-day ' + (isT?'today ':' ') + (cnt>0?'has-logs':'')}
                    onClick={() => changeMode('day', ds)}>
                    <div className={'md-num ' + (isT?'today':'')}>{day}</div>
                    {cnt > 0 && <div className="md-info">{cnt}명 작성</div>}
                    {otCnt > 0 && <div style={{ fontSize:9, color:'#1d4ed8', fontWeight:700, marginTop:1 }}>● 초과 {otCnt}명</div>}
                  </div>
                );
              })}
            </div>
          </div>
        )}

      </>)}
    </div>
  );
}

// ─── LOGS VIEW (admin 전용 — 작성/수정 이력) ───────────────────────────────
function LogsView({ user }) {
  const [logs, setLogs]       = useState([]);
  const [users, setUsers]     = useState([]);
  const [teams, setTeams]     = useState([]);
  const [loading, setLoading] = useState(false);

  // 필터
  const [selMonth, setSelMonth] = useState(() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  });
  const [selTeam, setSelTeam]   = useState('all');
  const [selUser, setSelUser]   = useState('all');
  const [selAction, setSelAction] = useState('all'); // all / create / update

  // 유저/팀 목록 로드
  useEffect(() => {
    const load = async () => {
      const { data: td } = await sb.from('teams').select('id, name').order('name');
      const { data: ud } = await sb.from('users').select('id, name, team_id, role')
        .neq('role', 'contractor').order('name');
      setTeams(td || []);
      setUsers(ud || []);
    };
    load();
  }, []);

  // 이력 로드
  useEffect(() => {
    const load = async () => {
      setLoading(true);
      const start = selMonth + '-01';
      const d = new Date(selMonth + '-01T00:00:00');
      d.setMonth(d.getMonth() + 1); d.setDate(0);
      const end = localDateStr(d);
      const { data } = await sb.from('work_logs_history')
        .select('*')
        .gte('log_date', start)
        .lte('log_date', end)
        .order('saved_at', { ascending: false });
      setLogs(data || []);
      setLoading(false);
    };
    load();
  }, [selMonth]);

  // 필터 적용
  const teamUserIds = selTeam === 'all' ? null
    : new Set(users.filter(u => u.team_id === selTeam).map(u => u.id));

  const filtered = logs.filter(l => {
    if (selTeam !== 'all' && teamUserIds && !teamUserIds.has(l.user_id)) return false;
    if (selUser !== 'all' && l.user_id !== selUser) return false;
    if (selAction !== 'all' && l.action !== selAction) return false;
    return true;
  });

  // 인덱싱
  const userById = useMemo(() => { const m = new Map(); for (const u of users) m.set(u.id, u); return m; }, [users]);
  const teamById = useMemo(() => { const m = new Map(); for (const t of teams) m.set(t.id, t); return m; }, [teams]);
  const userName = (uid) => userById.get(uid)?.name || uid;
  const teamName = (uid) => {
    const u = userById.get(uid);
    return teamById.get(u?.team_id)?.name || '-';
  };
  const fmtSavedAt = (ts) => {
    if (!ts) return '-';
    // KST 변환
    const ms = new Date(ts).getTime() + 32400000;
    const d = new Date(ms);
    return `${d.getUTCFullYear()}.${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCDate()).padStart(2,'0')} `
      + `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}:${String(d.getUTCSeconds()).padStart(2,'0')}`;
  };

  const actionBadge = (action) => action === 'create'
    ? <span style={{ fontSize:11, fontWeight:800, padding:'2px 8px', borderRadius:4, background:'#dcfce7', color:'#16a34a' }}>최초작성</span>
    : <span style={{ fontSize:11, fontWeight:800, padding:'2px 8px', borderRadius:4, background:'#eff6ff', color:'#2563eb' }}>수정</span>;

  // 팀 필터 변경 시 직원 필터 초기화
  const onTeamChange = (v) => { setSelTeam(v); setSelUser('all'); };

  const filteredUsers = selTeam === 'all'
    ? users
    : users.filter(u => u.team_id === selTeam);

  return (
    <div className="view-wrap">
      <div className="view-header">
        <div>
          <div className="view-title">🗒️ 작성 이력</div>
          <div className="view-sub">업무일지 작성·수정 기록 (관리자 전용)</div>
        </div>
      </div>

      {/* 필터 */}
      <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginBottom:20 }}>
        <input type="month"
          style={{ padding:'7px 10px', border:'1.5px solid var(--border)', borderRadius:6,
            fontSize:13, fontWeight:700, color:'var(--text)', outline:'none', cursor:'pointer' }}
          value={selMonth} onChange={e => setSelMonth(e.target.value)} />
        <select
          style={{ padding:'7px 10px', border:'1.5px solid var(--border)', borderRadius:6,
            fontSize:13, color:'var(--text)', background:'#fff', outline:'none', cursor:'pointer' }}
          value={selTeam} onChange={e => onTeamChange(e.target.value)}>
          <option value="all">전체 팀</option>
          {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
        </select>
        <select
          style={{ padding:'7px 10px', border:'1.5px solid var(--border)', borderRadius:6,
            fontSize:13, color:'var(--text)', background:'#fff', outline:'none', cursor:'pointer' }}
          value={selUser} onChange={e => setSelUser(e.target.value)}>
          <option value="all">전체 직원</option>
          {filteredUsers.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
        </select>
        <select
          style={{ padding:'7px 10px', border:'1.5px solid var(--border)', borderRadius:6,
            fontSize:13, color:'var(--text)', background:'#fff', outline:'none', cursor:'pointer' }}
          value={selAction} onChange={e => setSelAction(e.target.value)}>
          <option value="all">전체 구분</option>
          <option value="create">최초작성</option>
          <option value="update">수정</option>
        </select>
        <span style={{ display:'flex', alignItems:'center', fontSize:12, color:'var(--text-sub)' }}>
          총 {filtered.length}건
        </span>
      </div>

      {/* 테이블 */}
      {loading ? <div className="loading">불러오는 중...</div> : (
        filtered.length === 0
          ? <div className="empty-state">
              <div className="empty-icon">🗒️</div>
              <div className="empty-text">이력이 없습니다</div>
              <div className="empty-sub">해당 기간에 작성된 업무일지가 없습니다</div>
            </div>
          : <div style={{ background:'var(--card)', border:'1.5px solid var(--border)', borderRadius:'var(--radius)', overflow:'hidden' }}>
              {/* 헤더 */}
              <div style={{ display:'grid', gridTemplateColumns:'80px 70px 90px 1fr 140px 70px', gap:0,
                background:'var(--bg)', borderBottom:'1.5px solid var(--border)', padding:'8px 14px',
                fontSize:11, fontWeight:800, color:'var(--text-sub)', textTransform:'uppercase', letterSpacing:'.04em' }}>
                <span>팀</span>
                <span>이름</span>
                <span>일지 날짜</span>
                <span>저장 시각</span>
                <span style={{ textAlign:'center' }}>구분</span>
                <span style={{ textAlign:'center' }}>초과근무</span>
              </div>
              {/* 행 */}
              {filtered.map((l, i) => (
                <div key={l.id} style={{ display:'grid', gridTemplateColumns:'80px 70px 90px 1fr 140px 70px', gap:0,
                  padding:'9px 14px', borderBottom: i < filtered.length-1 ? '1px solid var(--border)' : 'none',
                  fontSize:13, alignItems:'center',
                  background: i % 2 === 0 ? '#fff' : '#fafafa' }}>
                  <span style={{ color:'var(--text-sub)', fontSize:12 }}>{teamName(l.user_id)}</span>
                  <span style={{ fontWeight:700 }}>{userName(l.user_id)}</span>
                  <span style={{ color:'var(--text-sub)' }}>{l.log_date}</span>
                  <span style={{ fontSize:12, color:'var(--text)', fontFamily:'monospace' }}>{fmtSavedAt(l.saved_at)}</span>
                  <span style={{ textAlign:'center' }}>{actionBadge(l.action)}</span>
                  <span style={{ textAlign:'center' }}>
                    {l.overtime
                      ? <span style={{ fontSize:11, fontWeight:700, color:'#1d4ed8' }}>
                          <span style={{ display:'inline-block', width:7, height:7, borderRadius:'50%',
                            background:'#3b82f6', marginRight:4, verticalAlign:'middle' }}></span>
                          {l.overtime_end}
                        </span>
                      : <span style={{ fontSize:11, color:'var(--text-muted)' }}>-</span>
                    }
                  </span>
                </div>
              ))}
            </div>
      )}
    </div>
  );
}

function MyHistoryView({ user }) {

// ─── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);
function App() {
  // 통합 세션에서 user 객체 즉시 복원 (DB 조회 불필요한 경우)
  const initialUser = (() => {
    try {
      const raw = sessionStorage.getItem(((window.APP_CONFIG && APP_CONFIG.SESSION_PREFIX) || 'kwanbo') + '_session');
      if (!raw) return null;
      const v = JSON.parse(raw);
      // 신규: user 객체 전체
      if (v && v.id && v.role) {
        if (v.password) { delete v.password; sessionStorage.setItem(((window.APP_CONFIG && APP_CONFIG.SESSION_PREFIX) || 'kwanbo') + '_session', JSON.stringify(v)); }
        return v;
      }
      return null;
    } catch(e) { return null; }
  })();
  const [user, setUser] = useState(initialUser);
  const [view, setView] = useState(VIEWS.MY_LOG);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [userTeamName, setUserTeamName] = useState('');

  // 탭 전환 — pushState
  const nv = (v) => {
    history.pushState({ view: v }, '', '');
    setView(v);
  };
  useEffect(() => {
    history.replaceState({ view: VIEWS.MY_LOG }, '', '');
    const onPop = (e) => {
      if (e.state && e.state.view) setView(e.state.view);
    };
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);

  // checkOnLoad — 렌더 후 실행
  useEffect(() => {
    const wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { setUser(null); }
  }, []);

  // 비로그인 상태 확정 (신규 세션은 initialUser에서 이미 복원됨)
  useEffect(() => {
    if (initialUser) return;
    setSsoChecked(true);
  }, []);

  // 팀명 조회 — canWrite 판단용
  useEffect(() => {
    if (!user || !user.team_id) return;
    sb.from('teams').select('name').eq('id', user.team_id).single()
      .then(({ data }) => { if (data) setUserTeamName(data.name); });
  }, [user && user.team_id]);

  const handleLogin = (u) => {
    setUser(u);
    Sysbar.SessionManager.onLogin(() => logout());
  };

  const logout = () => {
    Sysbar.Auth.logout(sb);
    setUser(null);
    setView(VIEWS.MY_LOG);
  };

  // SSO 복원 시 SessionManager 시작
  useEffect(() => {
    if (initialUser && ssoChecked) { Sysbar.SessionManager.onLogin(() => logout()); }
  }, []);

  if (!ssoChecked) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', background:'var(--theme,#0f172a)', color:'#94a3b8', fontSize:14 }}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen supabaseClient={sb} onLogin={handleLogin} />;

  // ── 기술지원(contractor) 접근 차단 ────────────────────────
  if (user.role === 'contractor') {
    return (
      <div style={{ minHeight:'100vh', background:'linear-gradient(135deg,var(--theme,#0f172a) 0%,#1e3a5f 50%,#1d4ed8 100%)', display:'flex', alignItems:'center', justifyContent:'center', padding:20, fontFamily:"'Noto Sans KR',sans-serif" }}>
        <div style={{ background:'#fff', borderRadius:18, padding:'40px 32px', width:'100%', maxWidth:360, boxShadow:'0 25px 70px rgba(0,0,0,.45)', textAlign:'center' }}>
          <div style={{ fontSize:48, marginBottom:16 }}>🚫</div>
          <p style={{ margin:'0 0 8px', fontSize:17, fontWeight:800, color:'#0f172a' }}>접근 권한 없음</p>
          <p style={{ margin:'0 0 24px', fontSize:13, color:'#64748b', lineHeight:1.6 }}>기술지원 계정은 업무일지 시스템을<br/>이용할 수 없습니다.</p>
          <a href="project.html" style={{ display:'inline-block', padding:'11px 28px', background:'var(--theme,#0f172a)', color:'#fff', borderRadius:8, fontSize:13, fontWeight:700, textDecoration:'none' }}>공정관리로 돌아가기</a>
        </div>
      </div>
    );
  }

  const canWrite = (user && user.role === 'admin') || ALLOWED_TEAMS.includes(userTeamName);

  return (
    <div className="app">
      {/* 시스템 전환 바 */}
      <SysBar
        activeKey="worklog"
        user={user}
        teamName={userTeamName}
        onLogout={logout}
      />
      {/* 시스템 제목 바 */}
      <div style={{ background:'var(--theme,#0f172a)', padding:'6px 18px 8px', flexShrink:0, borderBottom:'2px solid #1d4ed8', position:'sticky', top:38, zIndex:250 }}>
        <p style={{ margin:0, fontSize:9, lineHeight:'1.2', color:'#475569', letterSpacing:1, textTransform:'uppercase', fontWeight:600 }}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{ margin:0, fontSize:14, lineHeight:'1.3', fontWeight:800, color:'white', letterSpacing:-0.3 }}>업무일지 시스템</p>
      </div>
      {/* 상단 네비탭 */}
      <TopNavBar view={view} setView={nv} user={user} onLogout={logout} canWrite={canWrite} />
      <div className="app-inner">
        <main className="main-content">
          {view === VIEWS.MY_LOG   && <MyLogView user={user} canWrite={canWrite} />}
          {view === VIEWS.ALL_LOGS && <AllLogsView user={user} />}
          {view === VIEWS.HISTORY  && <MyHistoryView user={user} />}
          {view === VIEWS.LOGS     && user.role === 'admin' && <LogsView user={user} />}
        </main>
        <MobileNav view={view} setView={nv} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
