            </div>
          </div>
        </div>
      )}

      {/* ── 예상수금 모달 ── */}
      {modal === 'expected' && (
        <div className="mbg">
          <div className="mbox" onClick={function(e){e.stopPropagation();}}>
            <div className="mh"><span className="mht">📅 예상수금 입력</span><button className="mc" onClick={function(){setModal('');}}>×</button></div>
            <div className="mb">
              {err && <div className="al al-e">{err}</div>}
              <div style={{marginBottom:12}}>
                <label className="fl">용역 *</label>
                <select className="fi" value={form.project_id||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{project_id:e.target.value});});}}>
                  <option value="">선택하세요</option>
                  {projects.filter(function(p){return p.status!=='완료';}).map(function(p){
                    return <option key={p.id} value={p.id}>{p.name}</option>;
                  })}
                </select>
              </div>
              <div className="g2">
                <div>
                  <label className="fl">예상 수금일 *</label>
                  <input type="date" className="fi" value={form.expected_date||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{expected_date:e.target.value});});}} />
                </div>
                <div>
                  <label className="fl">예상 금액 (원) *</label>
                  <input className="fi" value={form.amount||''} placeholder="0" style={{textAlign:'right'}}
                    onChange={function(e){onAmountChange('amount',e);}} />
                </div>
              </div>
              <div style={{marginTop:12}}>
                <label className="fl">메모</label>
                <input className="fi" value={form.memo||''} placeholder="잔금, 중도금, 선금 등"
                  onChange={function(e){setForm(function(p){return Object.assign({},p,{memo:e.target.value});});}} />
              </div>
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setModal('');}}>취소</button>
              <button className="btn btn-p" onClick={function(){
                if (!form.project_id || !form.expected_date || !form.amount) { setErr('필수 항목을 입력해주세요.'); return; }
                setSaving(true); setErr('');
                var payload = { project_id:form.project_id, amount:numV(form.amount), expected_date:form.expected_date, memo:form.memo||'', is_done:false, updated_at:new Date().toISOString() };
                var q = editItem
                  ? sb.from('expected_collections').update(payload).eq('id', editItem.id)
                  : sb.from('expected_collections').insert(payload);
                q.then(function(r){
                  setSaving(false);
                  if (r.error) { setErr('저장 오류: '+r.error.message); return; }
                  setModal(''); setEditItem(null); setForm({});
                  load();
                });
              }} disabled={saving}>{saving?'저장 중...':'저장'}</button>
            </div>
          </div>
        </div>
      )}
      {modal === 'pf' && (
        <PerfModal
          projects={projects}
          users={users}
          year={Number(year)}
          editItem={editItem}
          onClose={function(){setModal('');setEditItem(null);setForm({});}}
          onSaved={function(){setModal('');setEditItem(null);setForm({});load();}}
        />
      )}
    </div>
  );
}

function SalaryView({ user }) {
  const [users, setUsers] = useState([]);
  const [sals, setSals] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(false);
  const [selU, setSelU] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState('');
  const [month, setMonth] = useState(new Date().toISOString().slice(0,7));
  const [emMsg, setEmMsg] = useState('');
  const [salTab, setSalTab] = useState('tax');
  const [salSort, setSalSort] = useState({col:'default', dir:'asc'});
  const [prevSals, setPrevSals] = useState([]);
  const [copying, setCopying] = useState(false);
  const [copyModal, setCopyModal] = useState(false);
  const [copySrcMonth, setCopySrcMonth] = useState('');
  const [copySrcTab, setCopySrcTab] = useState('');
  const [slipModal, setSlipModal] = useState(false);
  const [slipTarget, setSlipTarget] = useState(null);
  const [salaryItems, setSalaryItems] = useState([]);
  const [details, setDetails] = useState([]); // salary_details for current month
  const [prevDetails, setPrevDetails] = useState([]);
  const [itemModal, setItemModal] = useState(false); // 항목관리 모달
  const [itemForm, setItemForm] = useState({label:'',type:'income'});
  const [delMonthModal, setDelMonthModal] = useState(false);
  const [delMonthIng, setDelMonthIng] = useState(false);

  var EXCEL_ORDER = ['강호갑','이수금','강승우','김병용','장용기','조원범','박호진','윤종수','유현수','이규민','이창환','이다빈','안소영','신재호','신병호','송성익','안구환','윤성원','박상철','황보경','한예은','임수혁','한동우','최상민','안명만','현나경','김동현','송영환'];

  function load() {
    setLoading(true);
    var prevMonth = (function(){
      var d = new Date(month + '-01');
      d.setMonth(d.getMonth()-1);
      return d.toISOString().slice(0,7);
    })();
    Promise.all([
      sb.from('users').select('id,name,email,position,team_id,birth_date').neq('role','contractor').order('name'),
      sb.from('salaries').select('*').eq('month', month).eq('sal_type', salTab),
      sb.from('teams').select('id,name'),
      sb.from('salary_members').select('id,name,hire_date,leave_date,birth_date').order('name'),
      sb.from('salaries').select('*').eq('month', prevMonth).eq('sal_type', salTab),
      sb.from('salary_items').select('*').order('order_no'),
      sb.from('salary_details').select('*'),
    ]).then(function(results) {
      var ud = results[0].data || [];
      var sd = results[1].data || [];
      var td = results[2].data || [];
      var sm = results[3].data || [];
      var pd = results[4].data || [];
      var si = results[5].data || [];
      var dets = results[6].data || [];
      setPrevSals(pd);
      setSalaryItems(si);
      // 현재 월 salary_ids
      var curSalIds = sd.map(function(s){ return s.id; });
      var prevSalIds = pd.map(function(s){ return s.id; });
      setDetails(dets.filter(function(d){ return curSalIds.indexOf(d.salary_id) !== -1; }));
      setPrevDetails(dets.filter(function(d){ return prevSalIds.indexOf(d.salary_id) !== -1; }));
      var tmap = {};
      td.forEach(function(t) { tmap[t.id] = t.name; });
      var systemUsers = ud.map(function(u) {
        return Object.assign({}, u, {teamName: tmap[u.team_id]||'-', isMemberOnly: false});
      });
      var systemNames = ud.map(function(u){ return u.name; });
      var extraMembers = sm.filter(function(m){ return systemNames.indexOf(m.name) === -1; })
        .map(function(m){ return {id: m.id, name: m.name, email: null, position: '', teamName: '-', isMemberOnly: true}; });
      // 선택 월 기준 재직자 필터링
      function isActive(u) {
        var monthStart = new Date(month + '-01');
        var monthEnd = new Date(monthStart.getFullYear(), monthStart.getMonth()+1, 0);
        var hire = u.hire_date ? new Date(u.hire_date) : null;
        var leave = u.leave_date ? new Date(u.leave_date) : null;
        if (hire && hire > monthEnd) return false;
        if (leave && leave < monthStart) return false;
        return true;
      }
      var allUsers = systemUsers.concat(extraMembers).filter(isActive);
      // 엑셀 순서 정렬, 목록에 없는 사람은 뒤에 추가
      allUsers.sort(function(a,b){
        var ai = EXCEL_ORDER.indexOf(a.name);
        var bi = EXCEL_ORDER.indexOf(b.name);
        if (ai === -1 && bi === -1) return a.name.localeCompare(b.name, 'ko');
        if (ai === -1) return 1;
        if (bi === -1) return -1;
        return ai - bi;
      });
      setUsers(allUsers);
      setSals(sd);
      setLoading(false);
    });
  }

  function moveMonth(d) {
    var dt = new Date(month + '-01');
    dt.setMonth(dt.getMonth() + d);
    setMonth(dt.toISOString().slice(0,7));
  }

  async function copyFromSrc(overwrite) {
    setCopying(true); setCopyModal(false);
    // 소스 월/탭 데이터 조회
    var srcR = await sb.from('salaries').select('*').eq('month', copySrcMonth).eq('sal_type', copySrcTab);
    var srcSals = srcR.data || [];
    var srcIds = srcSals.map(function(s){ return s.id; });
    var srcDetsR = srcIds.length > 0
      ? await sb.from('salary_details').select('*').in('salary_id', srcIds)
      : { data: [] };
    var srcDets = srcDetsR.data || [];

    for (var i=0; i<srcSals.length; i++) {
      var ps = srcSals[i];
      var existing = sals.find(function(s){ return s.user_id === ps.user_id; });
      if (existing && !overwrite) continue;
      var pDets = srcDets.filter(function(d){ return d.salary_id === ps.id; });
      var c = calcFromDetails(pDets);
      var salId;
      if (existing) {
        await sb.from('salaries').update({ memo: ps.memo||'', total_income: c.inc, total_deduction: c.ded, net_pay: c.net }).eq('id', existing.id);
        salId = existing.id;
      } else {
        var r = await sb.from('salaries').insert({ user_id: ps.user_id, month: month, sal_type: salTab, memo: ps.memo||'', total_income: c.inc, total_deduction: c.ded, net_pay: c.net }).select();
        if (r.error || !r.data[0]) continue;
        salId = r.data[0].id;
      }
      if (pDets.length > 0) {
        var newDets = pDets.map(function(d){ return { salary_id: salId, item_id: d.item_id, amount: d.amount||0 }; });
        await sb.from('salary_details').upsert(newDets, { onConflict: 'salary_id,item_id' });
      }
    }
    setCopying(false);
    load();
  }

  useEffect(function() { load(); }, [month, salTab]);

  function getSal(uid) { return sals.find(function(s) { return s.user_id === uid; }); }
  function getDetails(salId) { return details.filter(function(d){ return d.salary_id === salId; }); }
  function getPrevDetails(salId) { return prevDetails.filter(function(d){ return d.salary_id === salId; }); }

  function numV(v) { return Number(String(v||0).replace(/,/g,'')) || 0; }

  function calcFromDetails(dets) {
    var inc = 0, ded = 0;
    dets.forEach(function(d) {
      var item = salaryItems.find(function(i){ return i.id === d.item_id; });
      if (!item) return;
      if (item.type === 'income') inc += d.amount||0;
      else ded += d.amount||0;
    });
    return { inc: inc, ded: ded, net: inc - ded };
  }

  function calcFromForm(f) {
    var inc = 0, ded = 0;
    salaryItems.forEach(function(item) {
      var v = numV(f[item.id]||0);
      if (item.type === 'income') inc += v;
      else ded += v;
    });
    return { inc: inc, ded: ded, net: inc - ded };
  }

  function openEdit(u) {
    var s = getSal(u.id);
    setSelU(u);
    var initForm = { memo: s ? (s.memo||'') : '' };
    salaryItems.forEach(function(item) { initForm[item.id] = ''; });
    if (s) {
      var dets = getDetails(s.id);
      dets.forEach(function(d) { initForm[d.item_id] = d.amount||''; });
    }
    setForm(initForm);
    setErr(''); setModal(true);
  }

  async function saveSal() {
    if (!selU) return;
    setSaving(true); setErr('');
    var c = calcFromForm(form);
    var existing = getSal(selU.id);
    var salId;
    if (existing) {
      var r = await sb.from('salaries').update({
        memo: form.memo||'', total_income: c.inc, total_deduction: c.ded, net_pay: c.net,
      }).eq('id', existing.id);
      if (r.error) { setErr('저장 오류: ' + r.error.message); setSaving(false); return; }
      salId = existing.id;
    } else {
      var r2 = await sb.from('salaries').insert({
        user_id: selU.id, month: month, sal_type: salTab,
        memo: form.memo||'', total_income: c.inc, total_deduction: c.ded, net_pay: c.net,
      }).select();
      if (r2.error) { setErr('저장 오류: ' + r2.error.message); setSaving(false); return; }
      salId = r2.data[0].id;
    }
    // salary_details upsert
    var detailPayloads = salaryItems.map(function(item) {
      return { salary_id: salId, item_id: item.id, amount: numV(form[item.id])||0 };
    });
    await sb.from('salary_details').upsert(detailPayloads, { onConflict: 'salary_id,item_id' });
    setSaving(false);
    setModal(false);
    load();
  }

  async function deleteMonthData() {
    setDelMonthIng(true); setDelMonthModal(false);
    // 이번 달 salaries id 목록
    var salIds = sals.map(function(s){ return s.id; });
    if (salIds.length > 0) {
      // salary_details 먼저 삭제 (CASCADE가 있지만 명시적으로)
      await sb.from('salary_details').delete().in('salary_id', salIds);
      await sb.from('salaries').delete().in('id', salIds);
    }
    setDelMonthIng(false);
    load();
  }

  async function deleteSalaryItem(item) {
    if (!window.confirm('[' + item.label + '] 항목을 삭제합니다.\n관련 급여 데이터도 모두 삭제됩니다. 계속할까요?')) return;
    await sb.from('salary_details').delete().eq('item_id', item.id);
    await sb.from('salary_items').delete().eq('id', item.id);
    load();
  }

  async function addSalaryItem() {
    if (!itemForm.label) return;
    var maxOrder = salaryItems.filter(function(i){ return i.type===itemForm.type; })
      .reduce(function(m,i){ return Math.max(m, i.order_no); }, 0);
    await sb.from('salary_items').insert({ label: itemForm.label, type: itemForm.type, order_no: maxOrder+1, active: true });
    setItemForm({label:'',type:'income'});
    load();
  }

  async function moveItem(item, dir) {
    // 같은 type 내에서 order_no 기준 정렬
    var sameType = salaryItems.filter(function(i){ return i.type === item.type; })
      .slice().sort(function(a,b){ return a.order_no - b.order_no; });
    var idx = sameType.findIndex(function(i){ return i.id === item.id; });
    var swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= sameType.length) return;
    var swapItem = sameType[swapIdx];
    // order_no 교환
    await sb.from('salary_items').update({ order_no: swapItem.order_no }).eq('id', item.id);
    await sb.from('salary_items').update({ order_no: item.order_no }).eq('id', swapItem.id);
    load();
  }

  async function toggleItem(item) {
    await sb.from('salary_items').update({ active: !item.active }).eq('id', item.id);
    load();
  }

  function sendSlip(u) {
    var s = getSal(u.id);
    if (!s) { alert('급여 데이터를 먼저 입력해주세요.'); return; }
    if (!u.email) { alert('직원 이메일 주소가 없습니다.'); return; }
    if (!window.emailjs || !APP_CONFIG.EMAILJS_SERVICE_ID) {
      alert('EmailJS 설정이 필요합니다.');
      return;
    }
    setSlipTarget(u);
    setSlipModal(true);
  }

  async function doSendSlip() {
    var u = slipTarget;
    var s = getSal(u.id);
    setSlipModal(false);
    setEmMsg('발송 중...');

    // 토큰 생성 (랜덤 32자)
    var token = Array.from(crypto.getRandomValues(new Uint8Array(20)))
      .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');

    // 만료일: 7일 후
    var expires = new Date();
    expires.setDate(expires.getDate() + 7);

    // salary_slips INSERT
    var r = await sb.from('salary_slips').insert({
      token: token,
      salary_id: s.id,
      user_id: u.id,
      expires_at: expires.toISOString(),
    });
    if (r.error) {
      setEmMsg('❌ 발송 실패: ' + r.error.message);
      setTimeout(function(){ setEmMsg(''); }, 5000);
      return;
    }

    // 명세서 링크
    var slipUrl = window.location.origin + '/slip.html?token=' + token;

    // 이메일 발송
    window.emailjs.send(APP_CONFIG.EMAILJS_SERVICE_ID, APP_CONFIG.EMAILJS_TEMPLATE_ID, {
      to_email: u.email,
      name: u.name,
      month: month,
      company_name: APP_CONFIG.COMPANY_KO,
      company_tel: APP_CONFIG.TEL,
      slip_url: slipUrl,
    }).then(function() {
      setEmMsg('📧 ' + u.name + ' 님께 발송 완료 ✓');
      setTimeout(function(){ setEmMsg(''); }, 3000);
    }).catch(function(e) {
      setEmMsg('❌ 발송 실패: ' + (e.text || e.message || JSON.stringify(e)));
      setTimeout(function(){ setEmMsg(''); }, 5000);
    });
  }

  if (loading) return <div className="page"><div className="loading">로딩 중...</div></div>;

  var totals = sals.reduce(function(acc, s) {
    return { inc: acc.inc + (s.total_income||0), ded: acc.ded + (s.total_deduction||0), net: acc.net + (s.net_pay||0) };
  }, { inc:0, ded:0, net:0 });

  return (
    <div className="page">
      <div className="ph" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div><div className="pt">💼 급여 관리</div><div className="ps">관리자 전용</div></div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          <button className="btn btn-s btn-sm" onClick={function(){moveMonth(-1);}}>◀</button>
          <input type="month" className="fi" value={month} onChange={function(e){setMonth(e.target.value);}} style={{width:'auto'}} />
          <button className="btn btn-s btn-sm" onClick={function(){moveMonth(1);}}>▶</button>
        </div>
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div style={{display:'flex',gap:8}}>
          <button className={salTab==='tax'?'itab active':'itab'} onClick={function(){setSalTab('tax');}}>🏛 급여신고</button>
          <button className={salTab==='pay'?'itab active':'itab'} onClick={function(){setSalTab('pay');}}>💵 급여지급</button>
        </div>
        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-s btn-sm" onClick={function(){setItemModal(true);}} style={{fontSize:12}}>⚙️ 항목관리</button>
          <button className="btn btn-sm" onClick={function(){setDelMonthModal(true);}} style={{fontSize:12,background:'transparent',color:'#ef4444',border:'1px solid #ef4444',borderRadius:4,padding:'3px 10px',cursor:'pointer',fontFamily:"'Noto Sans KR',sans-serif",fontWeight:600}}>🗑 데이터 삭제</button>
          <button className="btn btn-s btn-sm" onClick={function(){
            var d = new Date(month + '-01');
            d.setMonth(d.getMonth()-1);
            setCopySrcMonth(d.toISOString().slice(0,7));
            setCopySrcTab(salTab);
            setCopyModal(true);
          }} disabled={copying} style={{fontSize:12}}>
            {copying ? '복사 중...' : '📋 급여 복사'}
          </button>
        </div>
      </div>

      {emMsg && <div className="al al-s">{emMsg}</div>}

      <div className="card">
        <div className="tbl-wrap">
          <table>
            <thead><tr>
                {(function(){
                  function Sh(col, label, cls) {
                    var active = salSort.col === col;
                    var next = active && salSort.dir==='asc' ? 'desc' : 'asc';
                    return (
                      <th className={cls||''} style={{cursor:'pointer',userSelect:'none',whiteSpace:'nowrap'}}
                        onClick={function(){setSalSort({col:col,dir:next});}}>
                        {label} {active ? (salSort.dir==='asc'?'↑':'↓') : '↕'}
                      </th>
                    );
                  }
                  return [
                    Sh('name','직원',null),
                    Sh('team','팀',null),
                    Sh('base','기본급','tr'),
                    Sh('inc','총 지급','tr'),
                    Sh('ded','총 공제','tr'),
                    Sh('net','실수령액','tr'),
                    <th key="diff" className="tr">전월대비</th>,
                    <th key="st" className="tc">상태</th>,
                    <th key="mg" className="tc">관리</th>,
                  ];
                })()}
              </tr></thead>
            <tbody>
              {(function(){
                // 엑셀 기본 순서 저장 (load 시 순서 그대로)
                var sorted = users.slice();
                if (salSort.col !== 'default') {
                  sorted.sort(function(a, b) {
                    var sa = getSal(a.id); var sb2 = getSal(b.id);
                    var ca = sa ? calcFromDetails(getDetails(sa.id)) : {inc:0,ded:0,net:0};
                    var cb = sb2 ? calcFromDetails(getDetails(sb2.id)) : {inc:0,ded:0,net:0};
                    var va, vb;
                    if (salSort.col==='name')  { va=a.name; vb=b.name; }
                    else if (salSort.col==='team')  { va=a.teamName; vb=b.teamName; }
                    else if (salSort.col==='base')  { va=sa?sa.base_salary||0:0; vb=sb2?sb2.base_salary||0:0; }
                    else if (salSort.col==='inc')   { va=ca.inc; vb=cb.inc; }
                    else if (salSort.col==='ded')   { va=ca.ded; vb=cb.ded; }
                    else if (salSort.col==='net')   { va=ca.net; vb=cb.net; }
                    else { va=0; vb=0; }
                    if (typeof va==='string') return salSort.dir==='asc' ? va.localeCompare(vb,'ko') : vb.localeCompare(va,'ko');
                    return salSort.dir==='asc' ? va-vb : vb-va;
                  });
                }
                return sorted;
              })().map(function(u) {
                var s = getSal(u.id);
                var dets = s ? getDetails(s.id) : [];
                var c = s ? calcFromDetails(dets) : { inc:0, ded:0, net:0 };
                var ps = prevSals.find(function(x){ return x.user_id === u.id; });
                var diff = (s && ps) ? (s.net_pay||0) - (ps.net_pay||0) : null;
                return (
                  <tr key={u.id}>
                    <td>
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <div style={{width:28,height:28,borderRadius:'50%',background: u.isMemberOnly ? '#94a3b8' : '#7c3aed',color:'#fff',fontSize:11,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>{u.name[0]}</div>
                        <div>
                          <div style={{fontWeight:600}}>{u.name}</div>
                          {u.isMemberOnly
                            ? <div style={{fontSize:10,color:'#94a3b8'}}>급여전용</div>
                            : <div style={{fontSize:11,color:'#94a3b8'}}>{u.position||''}</div>
                          }
                        </div>
                      </div>
                    </td>
                    <td style={{color:'#64748b'}}>{u.teamName}</td>
                    <td className="tr">{s ? fmtN(s.base_salary)+'원' : '-'}</td>
                    <td className="tr" style={{color:'#1d4ed8',fontWeight:600}}>{s ? fmtN(c.inc)+'원' : '-'}</td>
                    <td className="tr" style={{color:'#dc2626'}}>{s ? fmtN(c.ded)+'원' : '-'}</td>
                    <td className="tr" style={{fontWeight:700,color:'#7c3aed',fontSize:14}}>{s ? fmtN(c.net)+'원' : '-'}</td>
                    <td className="tr" style={{fontSize:12,fontWeight:600,color: diff===null?'#94a3b8': diff>0?'#059669': diff<0?'#dc2626':'#64748b'}}>
                      {diff===null ? '-' : (diff>0?'+':'')+fmtN(diff)+'원'}
                    </td>
                    <td className="tc">{s ? <span className="badge bg">입력완료</span> : <span className="badge bgr">미입력</span>}</td>
                    <td className="tc">
                      <div style={{display:'flex',gap:4,justifyContent:'center'}}>
                        <button className="btn btn-s btn-sm" onClick={function(){openEdit(u);}}>입력</button>
                        {s && !u.isMemberOnly && <button className="btn btn-p btn-sm" onClick={function(){sendSlip(u);}}>📧</button>}
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {slipModal && slipTarget && (
        <div className="mbg" onClick={function(){setSlipModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:380}}>
            <div className="mh"><span className="mht">📧 급여명세서 발송</span><button className="mc" onClick={function(){setSlipModal(false);}}>×</button></div>
            <div className="mb">
              <p style={{fontSize:13,color:'#475569',marginBottom:8}}>
                아래 직원에게 급여명세서를 발송합니다.
              </p>
              <div style={{background:'#f8fafc',borderRadius:8,padding:'12px 16px',marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:15}}>{slipTarget.name}</div>
                <div style={{fontSize:12,color:'#64748b',marginTop:4}}>{slipTarget.email}</div>
              </div>
              <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                <button className="btn btn-s" onClick={function(){setSlipModal(false);}}>취소</button>
                <button className="btn btn-p" onClick={doSendSlip}>발송</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {delMonthModal && (
        <div className="mbg" onClick={function(){setDelMonthModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:360}}>
            <div className="mh"><span className="mht" style={{color:'#ef4444'}}>🗑 데이터 삭제</span><button className="mc" onClick={function(){setDelMonthModal(false);}}>×</button></div>
            <div className="mb">
              <p style={{fontSize:13,color:'#475569',marginBottom:8}}>
                <b>{month}</b> [{salTab==='tax'?'급여신고':'급여지급'}] 데이터를 전부 삭제합니다.
              </p>
              <div className="al al-e" style={{fontSize:12,marginBottom:0}}>이 작업은 되돌릴 수 없습니다.</div>
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setDelMonthModal(false);}}>취소</button>
              <button className="btn btn-d" onClick={deleteMonthData} disabled={delMonthIng}>{delMonthIng?'삭제 중...':'삭제 확인'}</button>
            </div>
          </div>
        </div>
      )}

      {itemModal && (
        <div className="mbg" onClick={function(){setItemModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:480}}>
            <div className="mh"><span className="mht">⚙️ 급여 항목 관리</span><button className="mc" onClick={function(){setItemModal(false);}}>×</button></div>
            <div className="mb">
              <div style={{marginBottom:16}}>
                <div style={{fontWeight:700,fontSize:12,color:'#475569',marginBottom:8}}>새 항목 추가</div>
                <div style={{display:'flex',gap:8}}>
                  <select className="fi" style={{width:100,flexShrink:0}} value={itemForm.type} onChange={function(e){setItemForm(function(p){return Object.assign({},p,{type:e.target.value});});}}>
                    <option value="income">지급</option>
                    <option value="deduction">공제</option>
                  </select>
                  <input className="fi" placeholder="항목명" value={itemForm.label} onChange={function(e){setItemForm(function(p){return Object.assign({},p,{label:e.target.value});});}} />
                  <button className="btn btn-p btn-sm" onClick={addSalaryItem} style={{flexShrink:0}}>추가</button>
                </div>
              </div>
              <div style={{fontSize:11,color:'#94a3b8',marginBottom:10}}>
                항목을 숨기면 급여 입력 모달에서 표시되지 않습니다. 기존 데이터는 유지됩니다.
              </div>
              <div style={{display:'flex',gap:16}}>
                {['income','deduction'].map(function(type){
                  var items = salaryItems.filter(function(i){ return i.type===type; });
                  return (
                    <div key={type} style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:12,color:'#475569',marginBottom:8}}>{type==='income'?'■ 지급 항목':'■ 공제 항목'}</div>
                      {items.map(function(item){
                        var sameType = salaryItems.filter(function(i){ return i.type===item.type; })
                          .slice().sort(function(a,b){ return a.order_no - b.order_no; });
                        var idx = sameType.findIndex(function(i){ return i.id===item.id; });
                        var isFirst = idx === 0;
                        var isLast  = idx === sameType.length - 1;
                        return (
                          <div key={item.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 10px',background:item.active?'#f8fafc':'#fef2f2',borderRadius:6,marginBottom:4,border:'1px solid '+(item.active?'#e2e8f0':'#fecaca')}}>
                            <div style={{display:'flex',alignItems:'center',gap:4}}>
                              <div style={{display:'flex',flexDirection:'column',gap:1}}>
                                <button onClick={function(){moveItem(item,-1);}} disabled={isFirst}
                                  style={{fontSize:9,padding:'1px 5px',border:'1px solid #e2e8f0',borderRadius:3,cursor:isFirst?'default':'pointer',background:'#fff',color:isFirst?'#cbd5e1':'#475569',lineHeight:1}}>▲</button>
                                <button onClick={function(){moveItem(item,1);}} disabled={isLast}
                                  style={{fontSize:9,padding:'1px 5px',border:'1px solid #e2e8f0',borderRadius:3,cursor:isLast?'default':'pointer',background:'#fff',color:isLast?'#cbd5e1':'#475569',lineHeight:1}}>▼</button>
                              </div>
                              <span style={{fontSize:13,color:item.active?'#1e293b':'#94a3b8',textDecoration:item.active?'none':'line-through'}}>{item.label}</span>
                            </div>
                            <div style={{display:'flex',gap:4}}>
                              <button onClick={function(){toggleItem(item);}}
                                style={{fontSize:11,padding:'3px 10px',borderRadius:4,border:'none',cursor:'pointer',
                                  background:item.active?'#e2e8f0':'#dcfce7',
                                  color:item.active?'#475569':'#16a34a',fontWeight:700,whiteSpace:'nowrap'}}>
                                {item.active?'숨기기':'나타내기'}
                              </button>
                              <button onClick={function(){deleteSalaryItem(item);}}
                                style={{fontSize:11,padding:'3px 8px',borderRadius:4,border:'none',cursor:'pointer',
                                  background:'#fee2e2',color:'#dc2626',fontWeight:700}}>
                                삭제
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>
            </div>
            <div className="mf"><button className="btn btn-s" onClick={function(){setItemModal(false);}}>닫기</button></div>
          </div>
        </div>
      )}

      {copyModal && (
        <div className="mbg" onClick={function(){setCopyModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:400}}>
            <div className="mh"><span className="mht">📋 급여 복사</span><button className="mc" onClick={function(){setCopyModal(false);}}>×</button></div>
            <div className="mb">
              <div style={{marginBottom:16}}>
                <label className="fl" style={{marginBottom:6,display:'block'}}>복사할 원본 선택</label>
                <div style={{display:'flex',gap:8}}>
                  <input type="month" className="fi" value={copySrcMonth}
                    onChange={function(e){setCopySrcMonth(e.target.value);}}
                    style={{flex:1}} />
                  <select className="fi" value={copySrcTab}
                    onChange={function(e){setCopySrcTab(e.target.value);}}
                    style={{width:100,flexShrink:0}}>
                    <option value="tax">급여신고</option>
                    <option value="pay">급여지급</option>
                  </select>
                </div>
                <div style={{fontSize:11,color:'#94a3b8',marginTop:6}}>
                  → <b>{month}</b> [{salTab==='tax'?'급여신고':'급여지급'}] 으로 복사됩니다
                </div>
              </div>
              <p style={{fontSize:13,color:'#475569',marginBottom:12}}>이미 입력된 직원 데이터는 어떻게 처리할까요?</p>
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                <button className="btn btn-p" style={{width:'100%',padding:'10px 0'}} onClick={function(){copyFromSrc(true);}}>
                  덮어쓰기 — 기존 데이터 포함 전체 복사
                </button>
                <button className="btn btn-s" style={{width:'100%',padding:'10px 0'}} onClick={function(){copyFromSrc(false);}}>
                  스킵 — 미입력 직원만 복사
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {modal && selU && (
        <div className="mbg" onClick={function(){setModal(false);}}>
          <div className="mbox" style={{maxWidth:680}} onClick={function(e){e.stopPropagation();}}>
            <div className="mh">
              <span className="mht">💼 {selU.name} 급여 입력 ({month})</span>
              <button className="mc" onClick={function(){setModal(false);}}>×</button>
            </div>
            <div className="mb">
              {err && <div className="al al-e">{err}</div>}
              {(function(){
                var cv = calcFromForm(form);
                var incItems = salaryItems.filter(function(i){ return i.type==='income' && i.active; });
                var dedItems = salaryItems.filter(function(i){ return i.type==='deduction' && i.active; });
                return (
                  <div style={{display:'flex',gap:20,marginBottom:12}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,fontWeight:700,color:'#64748b',letterSpacing:'.3px',marginBottom:6,paddingBottom:6,borderBottom:'2px solid var(--theme,#0f172a)'}}>지급 항목</div>
                      {incItems.map(function(item){
                        return <FI key={item.id} label={item.label} field={item.id} form={form} set={setForm} />;
                      })}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:8,marginTop:4,borderTop:'2px solid var(--theme,#0f172a)'}}>
                        <span style={{fontSize:13,fontWeight:800}}>총 지급액</span>
                        <span style={{fontSize:15,fontWeight:800,color:'#1d4ed8'}}>{fmtN(cv.inc)}원</span>
                      </div>
                    </div>
                    <div style={{width:1,background:'#e2e8f0',flexShrink:0}} />
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,fontWeight:700,color:'#64748b',letterSpacing:'.3px',marginBottom:6,paddingBottom:6,borderBottom:'2px solid var(--theme,#0f172a)'}}>공제 항목</div>
                      {dedItems.map(function(item){
                        return <FI key={item.id} label={item.label} field={item.id} form={form} set={setForm} />;
                      })}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:8,marginTop:4,borderTop:'2px solid var(--theme,#0f172a)'}}>
                        <span style={{fontSize:13,fontWeight:800}}>총 공제액</span>
                        <span style={{fontSize:15,fontWeight:800,color:'#dc2626'}}>{fmtN(cv.ded)}원</span>
                      </div>
                    </div>
                  </div>
                );
              })()}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:8,padding:'12px 16px',marginBottom:12}}>
                <span style={{fontWeight:700,fontSize:14,color:'#1e293b'}}>실수령액</span>
                <span style={{fontWeight:800,fontSize:18,color:'#7c3aed'}}>{fmtN((function(){var cv=calcFromForm(form);return cv.net;})())}원</span>
              </div>
              <div>
                <label className="fl">메모</label>
                <input className="fi" value={form.memo||''} placeholder="메모" onChange={function(e){setForm(function(p){return Object.assign({},p,{memo:e.target.value});});}} />
              </div>
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setModal(false);}}>취소</button>

      )}

  );
}

function AccountBookView({ user }) {
  var CATEGORIES = ['메일','설계/민원','면허/인증','입찰','금융/세무'];
  var isAdmin = true; // 계정관리는 관리팀 전체 동일 권한

  const [accounts, setAccounts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [selCat, setSelCat] = useState('전체');
  const [modal, setModal] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [form, setForm] = useState({});
  const [saving, setSaving] = useState(false);
  const [showPw, setShowPw] = useState({});
  const [catModal, setCatModal] = useState(false);
  const [newCat, setNewCat] = useState('');
  const [categories, setCategories] = useState(CATEGORIES);
  const [inlineEdit, setInlineEdit] = useState(null); // 인라인 편집 id
  const [inlineForm, setInlineForm] = useState({});

  function load() {
    setLoading(true);
    sb.from('account_book').select('*').order('category').order('order_no').then(function(r) {
      setAccounts(r.data || []);
      // 실제 DB의 카테고리 목록 추출
      var cats = [];
      (r.data || []).forEach(function(a) {
        if (cats.indexOf(a.category) === -1) cats.push(a.category);
      });
      // CATEGORIES 순서 유지 + 신규 카테고리 뒤에 추가
      var ordered = CATEGORIES.filter(function(c){ return cats.indexOf(c) !== -1; });
      cats.forEach(function(c){ if (ordered.indexOf(c) === -1) ordered.push(c); });
      setCategories(ordered);
      setLoading(false);
    });
  }

  useEffect(function() { load(); }, []);

  function openNew() {
    setEditItem(null);
    setForm({category: categories[0]||'', site_name:'', url:'', account_id:'', password:'', memo:''});
    setModal(true);
  }

  function openEdit(a) {
    setEditItem(a);
    setForm({category:a.category, site_name:a.site_name, url:a.url||'', account_id:a.account_id||'', password:a.password||'', memo:a.memo||''});
    setModal(true);
  }

  async function save() {
    if (!form.site_name) return;
    setSaving(true);
    var payload = {category:form.category, site_name:form.site_name, url:form.url||null,
      account_id:form.account_id||null, password:form.password||null, memo:form.memo||null};
    if (editItem) {
      await sb.from('account_book').update(payload).eq('id', editItem.id);
    } else {
      var maxOrder = accounts.filter(function(a){ return a.category===form.category; })
        .reduce(function(m,a){ return Math.max(m, a.order_no||0); }, 0);
      payload.order_no = maxOrder + 1;
      await sb.from('account_book').insert(payload);
    }
    setSaving(false); setModal(false); load();
  }

  async function del(a) {
    if (!window.confirm('['+a.site_name+'] 삭제할까요?')) return;
    await sb.from('account_book').delete().eq('id', a.id);
    load();
  }

  function startInline(a) {
    setInlineEdit(a.id);
    setInlineForm({category:a.category, site_name:a.site_name, url:a.url||'', account_id:a.account_id||'', password:a.password||'', memo:a.memo||''});
  }

  async function saveInline(a) {
    await sb.from('account_book').update({
      category:inlineForm.category, site_name:inlineForm.site_name,
      url:inlineForm.url||null, account_id:inlineForm.account_id||null,
      password:inlineForm.password||null, memo:inlineForm.memo||null,
    }).eq('id', a.id);
    setInlineEdit(null); load();
  }

  async function addCategory() {
    if (!newCat.trim()) return;
    setCategories(function(prev){ return prev.concat([newCat.trim()]); });
    setNewCat(''); setCatModal(false);
  }

  var filtered = selCat === '전체' ? accounts : accounts.filter(function(a){ return a.category === selCat; });
  var grouped = {};
  filtered.forEach(function(a) {
    if (!grouped[a.category]) grouped[a.category] = [];
    grouped[a.category].push(a);
  });

  var iStyle = {padding:'3px 6px',border:'1px solid #e2e8f0',borderRadius:4,fontSize:12,fontFamily:"'Noto Sans KR',sans-serif",width:'100%'};

        <div style={{display:'flex',gap:6}}>
          <button className="btn btn-s btn-sm" onClick={function(){setCatModal(true);}}>+ 분류 추가</button>

        </div>

                    <th style={{padding:'7px 10px',fontSize:11,color:'#64748b',textAlign:'left',fontWeight:700}}>비밀번호</th>
                    <th style={{padding:'7px 10px',fontSize:11,color:'#64748b',textAlign:'left',fontWeight:700}}>링크</th>
                    <th style={{padding:'7px 10px',fontSize:11,color:'#64748b',textAlign:'left',fontWeight:700}}>메모</th>
                    {isAdmin && <th></th>}
                  </tr>
                </thead>
                <tbody>
                  {grouped[cat].map(function(a) {

                    return (

                            <td key="sn" style={{padding:'4px 6px'}}><input style={iStyle} value={inlineForm.site_name} onChange={function(e){setInlineForm(function(p){return Object.assign({},p,{site_name:e.target.value});});}} /></td>,
                            <td key="id" style={{padding:'4px 6px'}}><input style={iStyle} value={inlineForm.account_id} onChange={function(e){setInlineForm(function(p){return Object.assign({},p,{account_id:e.target.value});});}} /></td>,
                            <td key="pw" style={{padding:'4px 6px'}}><input style={iStyle} value={inlineForm.password} onChange={function(e){setInlineForm(function(p){return Object.assign({},p,{password:e.target.value});});}} /></td>,
                            <td key="url" style={{padding:'4px 6px'}}><input style={iStyle} value={inlineForm.url} onChange={function(e){setInlineForm(function(p){return Object.assign({},p,{url:e.target.value});});}} /></td>,
                            <td key="memo" style={{padding:'4px 6px'}}><input style={iStyle} value={inlineForm.memo} onChange={function(e){setInlineForm(function(p){return Object.assign({},p,{memo:e.target.value});});}} /></td>,

              </table>
            </div>

        })

      {catModal && (

          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:360}}>
            <div className="mh"><span className="mht">+ 분류 추가</span><button className="mc" onClick={function(){setCatModal(false);}}>×</button></div>
            <div className="mb">
              <label className="fl">분류명</label>
              <input className="fi" value={newCat} onChange={function(e){setNewCat(e.target.value);}} placeholder="예: 보험, 협회 등" />

            <div className="mf">

              <button className="btn btn-p" onClick={addCategory}>추가</button>

          </div>

      {modal && (

          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:480}}>

            <div className="mb">
              <div style={{marginBottom:10}}><label className="fl">분류</label>
                <select className="fi" value={form.category||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{category:e.target.value});});}}>

              <div style={{marginBottom:10}}><label className="fl">사이트명 *</label><input className="fi" value={form.site_name||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{site_name:e.target.value});});}} /></div>
              <div style={{marginBottom:10}}><label className="fl">URL</label><input className="fi" value={form.url||''} placeholder="https://" onChange={function(e){setForm(function(p){return Object.assign({},p,{url:e.target.value});});}} /></div>
              <div className="g2" style={{marginBottom:10}}>
                <div><label className="fl">아이디</label><input className="fi" value={form.account_id||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{account_id:e.target.value});});}} /></div>
                <div><label className="fl">비밀번호</label><input className="fi" value={form.password||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{password:e.target.value});});}} /></div>
              </div>
              <div style={{marginBottom:10}}><label className="fl">메모</label><input className="fi" value={form.memo||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{memo:e.target.value});});}} /></div>
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setModal(false);}}>취소</button>
              <button className="btn btn-p" onClick={save} disabled={saving}>{saving?'저장 중...':'저장'}</button>
            </div>

        </div>
      )}
    </div>
  );
}

  const [pwResetErr, setPwResetErr] = useState('');

  var ROLE_ORDER = {admin:0, manager:1, employee:2, staff:2, contractor:3};

  function load() {
    setLoading(true);
    Promise.all([
      sb.from('users').select('*').order('name'),
      sb.from('teams').select('*').order('name'),
      sb.from('salary_members').select('*').order('name'),
    ]).then(function(r) {
      setUsers(r[0].data||[]);
      setTeams(r[1].data||[]);
      setSalaryMembers(r[2].data||[]);
      setLoading(false);
    });

  useEffect(function() { load(); }, []);

  const TEAM_ORDER = {'관리팀':0,'설계1팀':1,'설계2팀':2,'지반팀':3,'기술지원':4};
  const ROLE_ORDER2 = {admin:0, manager:1, employee:2, staff:2, contractor:3};

  function tName(u) {
    if (u.role === 'contractor') return '기술지원';
    var t = teams.find(function(x){return x.id===u.team_id;});
    return t ? t.name : '-';
  }
  function roleL(r) { return ({admin:'관리자',manager:'팀장',staff:'팀원',employee:'팀원',contractor:'기술지원'})[r]||r; }
  function roleCls(r) { return ({admin:'bp',manager:'bb',staff:'bg',employee:'bg',contractor:'ba'})[r]||'bgr'; }

  function openEdit(u) {
    setEditU(u);
    setForm({name:u.name,phone:u.phone,email:u.email||'',position:u.position||'',team_id:u.team_id||'',role:u.role,memo:u.memo||'',hire_date:u.hire_date||'',leave_date:u.leave_date||''});
    setErr(''); setModal(true);
  }
  function openNew() {
    setEditU(null);
    setForm({name:'',phone:'',email:'',position:'',team_id:'',role:'staff',memo:'',hire_date:'',leave_date:''});
    setErr(''); setModal(true);
  }
  function openSmEdit(m) {
    setSmEdit(m);
    setSmForm({name:m.name,hire_date:m.hire_date||'',leave_date:m.leave_date||''});
    setSmErr(''); setSmModal(true);
  }
  function openSmNew() {
    setSmEdit(null);
    setSmForm({name:'',hire_date:'',leave_date:''});
    setSmErr(''); setSmModal(true);
  }
  async function saveSm() {
    if (!smForm.name) { setSmErr('이름은 필수입니다.'); return; }
    setSmSaving(true); setSmErr('');
    var payload = {name:smForm.name, hire_date:smForm.hire_date||null, leave_date:smForm.leave_date||null};

      : await sb.from('salary_members').insert(payload);

  async function deleteSm(m) {

      await sb.from('salary_members').delete().eq('id', m.id);
      setDelConfirm(null); load();

    setPwResetErr('');
    setPwResetModal(true);
  }

  async function savePwReset() {
    setPwResetSaving(true); setPwResetErr('');
    try {
      var sess = Sysbar.Auth.getSession() || {};
      var res = await fetch(
        APP_CONFIG.SUPABASE_URL + '/functions/v1/reset-user-password',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': APP_CONFIG.SUPABASE_KEY,
            'Authorization': 'Bearer ' + APP_CONFIG.SUPABASE_KEY,
            'x-user-id': sess.id || '',
            'x-user-role': sess.role || '',
          },
          body: JSON.stringify({ user_id: pwResetTarget.id }),
        }
      );
      var data = await res.json();
      if (!res.ok || data.error) { setPwResetErr(data.error || '초기화 실패'); setPwResetSaving(false); return; }
      setPwResetModal(false);
    } catch(e) {
      setPwResetErr('네트워크 오류: ' + e.message);
    }
    setPwResetSaving(false);
  }

  function openPhoneChange(u) {
    setPhoneTarget(u);
    setNewPhone(u.username || '');  // username이 있으면 표시, 없으면 빈칸
    setPhoneErr('');
    setPhoneModal(true);
  }

  async function savePhone() {
    var trimmed = newPhone.trim();
    var currentId = phoneTarget.username || phoneTarget.phone || '';
    if (trimmed === currentId) { setPhoneErr('현재 아이디와 동일합니다.'); return; }
    setPhoneSaving(true); setPhoneErr('');
    try {
      var sess = Sysbar.Auth.getSession() || {};
      var res = await fetch(
        APP_CONFIG.SUPABASE_URL + '/functions/v1/update-user-phone',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': APP_CONFIG.SUPABASE_KEY,
            'Authorization': 'Bearer ' + APP_CONFIG.SUPABASE_KEY,
            'x-user-id': sess.id || '',
            'x-user-role': sess.role || '',
          },
          // trimmed가 빈칸이면 username null 처리 (전화번호로 초기화)
          body: JSON.stringify({ user_id: phoneTarget.id, new_username: trimmed || null }),
        }
      );
      var data = await res.json();
      if (!res.ok || data.error) { setPhoneErr(data.error || '변경 실패'); setPhoneSaving(false); return; }
      setPhoneModal(false);
      load();
    } catch(e) {
      setPhoneErr('네트워크 오류: ' + e.message);
    }
    setPhoneSaving(false);
  }

  async function save() {
    if (!form.name||!form.phone) { setErr('이름과 전화번호는 필수입니다.'); return; }
    setSaving(true); setErr('');
    try {
      // memo는 users 테이블에 없는 컬럼이므로 제외
      var { memo: _memo, ...formWithoutMemo } = form;
      if (!formWithoutMemo.hire_date) formWithoutMemo.hire_date = null;
      if (!formWithoutMemo.leave_date) formWithoutMemo.leave_date = null;
      var p;
      if (editU) {
        p = sb.from('users').update(formWithoutMemo).eq('id', editU.id);
      } else {
        // Auth 계정 생성 (초기 비밀번호: 전화번호)
        const phoneDigits = (form.phone||'').replace(/\D/g,'');
        const emailLocal = phoneDigits.length > 0 ? phoneDigits : form.phone;
        const authId = null; // Auth 계정은 Supabase 대시보드에서 직접 생성
        p = sb.from('users').insert(Object.assign({}, formWithoutMemo, {auth_id: authId}));
      }
      var r = await p;
      setSaving(false);
      if (r.error) { setErr('저장 오류: ' + r.error.message); return; }
      setModal(false); load();
    } catch (e) {
      setSaving(false);
      setErr('저장 중 오류가 발생했습니다.');
    }
  }

  var filtered = users.filter(function(u) { return (u.name||'').includes(q)||(u.phone||'').includes(q); });

  function handleSort(key) {
    if (sortBy === key) setSortDir(function(d){return d*-1;});
    else { setSortBy(key); setSortDir(1); }
  }
  function sortIcon(key) { return sortBy===key ? (sortDir===1?' ▲':' ▼') : ' ↕'; }

    var av, bv, tc;
    if (sortBy === 'role') {
      av = ROLE_ORDER2[a.role] ?? 9;
      bv = ROLE_ORDER2[b.role] ?? 9;
      if (av !== bv) return (av - bv) * sortDir;
      return (a.name||'').localeCompare(b.name||'', 'ko');
    }
    if (sortBy === 'name') {
      return (a.name||'').localeCompare(b.name||'', 'ko') * sortDir;
    }
    if (sortBy === 'team') {
      av = tName(a); bv = tName(b);
      var ta = TEAM_ORDER[av] ?? 9, tb = TEAM_ORDER[bv] ?? 9;
      tc = (ta - tb) * sortDir;
      return tc !== 0 ? tc : (a.name||'').localeCompare(b.name||'', 'ko');
    }
    if (sortBy === 'position') {
      av = a.position||''; bv = b.position||'';
      tc = av.localeCompare(bv, 'ko') * sortDir;
      return tc !== 0 ? tc : (a.name||'').localeCompare(b.name||'', 'ko');
    }
    return 0;
  });

// ── 로그인 ────────────────────────────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [locked, setLocked] = useState(false);
  const [remain, setRemain] = useState(0);

  // 잠금 상태 카운트다운
  useEffect(function() {
    const bf = Sysbar.Auth.checkBruteForce();
    if (bf.locked) { setLocked(true); setRemain(bf.remainSec); }
    const timer = setInterval(function() {
      const bf2 = Sysbar.Auth.checkBruteForce();
      if (bf2.locked) { setLocked(true); setRemain(bf2.remainSec); }
      else { setLocked(false); setRemain(0); }
    }, 1000);
    return function() { clearInterval(timer); };
  }, []);

  async function doLogin() {
    if (locked) return;
    if (!phone.trim()||!pw) { setErr('아이디와 비밀번호를 입력하세요.'); return; }
    setLoading(true); setErr('');
    // allowedRoles: contractor만 차단 (팀 권한은 hasAccess로 판단)
    const result = await Sysbar.Auth.doLogin(sb, phone, pw, {
        allowedRoles: ['admin', 'manager', 'staff', 'employee'],
      });
    setLoading(false);
    if (result.ok) {
      onLogin(result.user);
    } else {
      if (result.locked) { setLocked(true); setRemain(result.remainSec); }
      setErr(result.reason);
    }
  }

  return (
    <div className="lwrap">
      <div className="lbox">
        <div className="llogo">🏢</div>
        <div className="ltit">{APP_CONFIG.COMPANY_SHORT}</div>
        <div className="lsub">관리포털 · 관리팀/관리자 전용</div>
        {err && <div className="al al-e">{err}</div>}
        <div style={{marginBottom:12}}>
          <label className="fl">아이디 (전화번호)</label>
          <input className="fi" value={phone} placeholder="전화번호 입력" disabled={locked}
            onChange={function(e){setPhone(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')document.getElementById('ap-pw').focus();}} />
        </div>
        <div style={{marginBottom:20}}>
          <label className="fl">비밀번호</label>
          <input id="ap-pw" type="password" className="fi" value={pw} placeholder="비밀번호 입력" disabled={locked}
            onChange={function(e){setPw(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')doLogin();}} />
        </div>
        <button className="btn btn-p" onClick={doLogin} disabled={loading || locked} style={{width:'100%',justifyContent:'center',padding:'12px'}}>
          {locked ? `잠금 ${remain}초` : (loading ? '로그인 중...' : '로그인')}
        </button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);
function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    if (v && v.id && v.role) return v;
    return null;
  })();
  const [user, setUser] = useState(initialUser);
  const [view, setView] = useState(VIEWS.WL);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [teamName, setTeamName] = useState('');
  const [hasAccess, setHasAccess] = useState(false);
  const [accessChecked, setAccessChecked] = useState(false);

  // 상위탭 전환 — pushState로 히스토리 기록
  function nv(v) {
    history.pushState({ apView: v }, '', '');
    setView(v);
  }

  // 뒤로가기 — 상위탭 복원
  useEffect(function() {
    history.replaceState({ apView: VIEWS.WL }, '', '');
    function onPop(e) {
      if (e.state && e.state.apView) setView(e.state.apView);
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);

  useEffect(function() {
    if (initialUser) return;
    // checkOnLoad: 렌더 후 실행 (Babel 컴파일 완료 이후 → NAV_WINDOW 오인 방지)
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { setUser(null); return; }
    // 신규 세션은 initialUser에서 이미 복원됨 → ssoChecked 확정만
    setSsoChecked(true);
  }, []);

  // 세션 즉시 복원된 경우 checkOnLoad + SessionManager 시작
  useEffect(function() {
    if (!initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { logout(); return; }
    if (ssoChecked) { Sysbar.SessionManager.onLogin(function() { logout(); }); }
  }, []);

  useEffect(function() {
    if (!user) return;
    if (user.role === 'admin') { setTeamName('관리자'); setHasAccess(true); setAccessChecked(true); return; }
    if (!user.team_id) { setHasAccess(false); setAccessChecked(true); return; }
    sb.from('teams').select('name').eq('id', user.team_id).single().then(function(r) {
      var name = r.data ? r.data.name : '';
      setTeamName(name);
      setHasAccess(name === '관리팀');
      setAccessChecked(true);
    });
  }, [user ? user.id : null]);

  function handleLogin(u) {
    setUser(u);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }

  function logout() {
    Sysbar.Auth.logout(sb);
    setUser(null); setTeamName(''); setHasAccess(false);
  }

  if (!ssoChecked || (user && !accessChecked)) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--theme,#0f172a)',color:'#94a3b8',fontSize:14}}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  if (user.role !== 'admin' && !hasAccess) return (
    <div className="lwrap">
      <div className="lbox" style={{textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>🚫</div>
        <div className="ltit" style={{marginBottom:8}}>접근 권한 없음</div>
        <p style={{fontSize:13,color:'#64748b',lineHeight:1.6,marginBottom:24}}>관리포털은 관리팀 및 관리자만<br/>이용할 수 있습니다.</p>
        <a href="project.html" className="btn btn-s" style={{justifyContent:'center'}}>공정관리로 돌아가기</a>
      </div>
    </div>
  );

  var canSal = user.role === 'admin';
  var canAb  = user.role === 'admin' || teamName === '관리팀';

  return (
    <div>
      <SysBar
        activeKey="admin"
        user={user}
        teamName={teamName}
        onLogout={logout}
      />
      {/* 시스템 제목 바 */}
      <div style={{background:'var(--theme,#0f172a)',padding:'6px 18px 8px',flexShrink:0,borderBottom:'2px solid #7c3aed',position:'sticky',top:38,zIndex:250}}>
        <p style={{margin:0,fontSize:9,lineHeight:'1.2',color:'#475569',letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{margin:0,fontSize:14,lineHeight:'1.3',fontWeight:800,color:'white',letterSpacing:-0.3}}>관리 포털</p>
      </div>
      <div className="top-nav">
        <button className={view===VIEWS.WL?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.WL);}}>📝 업무일지</button>
        <button className={view===VIEWS.PF?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.PF);}}>📊 실적관리</button>
        {canSal && <button className={view===VIEWS.SL?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.SL);}}>💼 급여관리</button>}
        {canAb  && <button className={view===VIEWS.AB?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.AB);}}>🔑 계정관리</button>}
        <button className={view===VIEWS.ST?'nav-btn active':'nav-btn'} onClick={function(){nv(VIEWS.ST);}}>👥 직원관리</button>
      </div>
      {view === VIEWS.WL && <WorklogView user={user} />}
      {view === VIEWS.PF && <PerfView user={user} />}
      {view === VIEWS.SL && canSal && <SalaryView user={user} />}
      {view === VIEWS.AB && canAb  && <AccountBookView user={user} />}
      {view === VIEWS.ST && <StaffView user={user} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
