                <button className={taxKind==='매입'?'itab active':'itab'} onClick={function(){setTaxKind('매입');}}>매입</button>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <label className="fl" style={{margin:0}}>월</label>
                <select className="fi" style={{width:130}} value={taxMonth} onChange={function(e){setTaxMonth(e.target.value);}}>
                  <option value="전체">전체</option>
                  {monthOptions.map(function(m){ return <option key={m} value={m}>{m}</option>; })}
                </select>
              </div>
              <div style={{marginLeft:'auto',fontSize:12,color:'#64748b'}}>
                {rows.length}건 · 합계 <b style={{color:'#7c3aed'}}>{fmtN(sumTotal)}원</b>
              </div>
            </div>

            {taxLoading ? (
              <div className="loading">로딩 중...</div>
            ) : rows.length === 0 ? (
              <div className="empty"><div className="ei">🧾</div><div className="et">{taxKind} 세금계산서가 없습니다</div><div className="es">홈택스 파일을 업로드하세요</div></div>
            ) : (
              <div className="tbl-wrap">
                <table>
                  <thead>
                    <tr>
                      <SortTh label="작성일자" col="date"   state={taxSort} onSort={mkSortHandler(taxSort,setTaxSort)} />
                      <SortTh label="거래처"   col="name"   state={taxSort} onSort={mkSortHandler(taxSort,setTaxSort)} />
                      <SortTh label="합계금액" col="amount" state={taxSort} onSort={mkSortHandler(taxSort,setTaxSort)} className="tr" />
                      <th>품목명</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map(function(iv) {
                      return (
                        <tr key={iv.id} style={{cursor:'pointer'}} onClick={function(){ setTaxDetail(iv); }}>
                          <td className="tc">{fmtD(iv.write_date)}</td>
                          <td style={{fontWeight:600}}>{iv.counterpart_name || '-'}</td>
                          <td className="tr" style={{fontWeight:700}}>{fmtN(iv.total_amount)}원</td>
                          <td style={{color:'#475569',fontSize:12}}>{itemLabel(iv)}</td>
                          <td>
                            <button className="btn btn-s btn-sm" onClick={function(e){ e.stopPropagation(); setTaxDetail(iv); }}>자세히</button>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      })()}

      {/* ── 매칭확인 탭: 수금 ↔ 매출 세금계산서 자동 대사 + 수동매칭/확인완료 ── */}
      {tab === 'match' && canTax && (function() {
        // DB 기록 기반 제외 집합: 매칭 등록(자동/수동 무관) + 확인완료
        var dbInvUsed = {}, dbColUsed = {};
        icMatches.forEach(function(m) { dbInvUsed[m.tax_invoice_id] = true; dbColUsed[m.collection_id] = true; });
        var revInv = {}, revCol = {}, revNoteInv = {}, revNoteCol = {};
        icReviews.forEach(function(rv) {
          if (rv.status !== 'confirmed_ok') return;
          if (rv.item_type === 'tax_invoice') { revInv[rv.item_id] = true; if (rv.note) revNoteInv[rv.item_id] = rv.note; }
          else if (rv.item_type === 'collection') { revCol[rv.item_id] = true; if (rv.note) revNoteCol[rv.item_id] = rv.note; }
        });
        // 대상: 매출 세금계산서 ↔ 수금 건(외주비만 입력 건 제외), DB 기록된 건 제외
        var salesInvs = taxInvoices.filter(function(iv) {
          return iv.invoice_type === '매출' && !dbInvUsed[iv.id] && !revInv[iv.id];
        });
        var payCols = cols.filter(function(c) {
          return c.entry_type !== 'outsource_only' && (c.amount || 0) > 0 && !dbColUsed[c.id] && !revCol[c.id];
        });
        // 수금 건의 거래처명: 감리는 memo 파싱, 그 외는 프로젝트의 발주처 (매칭 조건 아님, 표시 참고용)
        function colClient(c) {
          if (c.entry_type === 'supervision') return parseSupvMemo(c.memo).client;
          var p = projectById.get(c.project_id);
          return p ? (p.client || '') : '';
        }
        function projLabel(c) {
          if (c.entry_type === 'supervision') return c.memo || '-';
          return pName(c.project_id);
        }
        // 후보쌍 수집: 금액 완전일치 + 발행일 ±MATCH_WINDOW_DAYS일 (2조건 — 거래처명은 조건에서 제외)
        var pairs = [];
        for (var i = 0; i < payCols.length; i++) {
          var c = payCols[i];
          if (!c.collected_at) continue;
          for (var j = 0; j < salesInvs.length; j++) {
            var iv = salesInvs[j];
            if (!iv.issue_date) continue;
            if ((c.amount || 0) !== (iv.total_amount || 0)) continue;
            var dd = dayDiffAbs(c.collected_at, iv.issue_date);
            if (dd > MATCH_WINDOW_DAYS) continue;
            pairs.push({ ci: i, ii: j, dd: dd });
          }
        }
        // greedy 1:1 매칭 — 날짜차 작은 쌍부터 확정, 확정된 건 재사용 금지
        // (자동매칭은 화면 표시용 재계산만 — DB 저장 안 함. 수동매칭만 icMatches에 영속.)
        pairs.sort(function(a, b) { return a.dd - b.dd; });
        var colUsed = {}, invUsed = {}, matchedPairs = [];
        pairs.forEach(function(p) {
          if (colUsed[p.ci] || invUsed[p.ii]) return;
          colUsed[p.ci] = true; invUsed[p.ii] = true;
          matchedPairs.push(p);
        });
        // 미매칭 전체(연도 무관) — 수동매칭 모달의 상대 후보 풀 (처리완료 건 미포함)
        var unpaidAll = salesInvs.filter(function(iv, j) { return !invUsed[j]; });
        var unissuedAll = payCols.filter(function(c, i) { return !colUsed[i]; });
        var invById = (function() { var m = new Map(); taxInvoices.forEach(function(iv) { m.set(iv.id, iv); }); return m; })();
        var colById = (function() { var m = new Map(); cols.forEach(function(c) { m.set(c.id, c); }); return m; })();
        // 처리완료(수동매칭/확인완료) 항목 — 표시 리스트에만 status 플래그로 합류
        // (salesInvs/payCols에서는 계속 제외 → greedy·후보 풀에 재참여하지 않음)
        var resolvedInvs = taxInvoices.filter(function(iv) {
          return iv.invoice_type === '매출' && (dbInvUsed[iv.id] || revInv[iv.id]);
        }).map(function(iv) { return { item: iv, status: dbInvUsed[iv.id] ? 'manual' : 'reviewed' }; });
        var resolvedCols = cols.filter(function(c) {
          return c.entry_type !== 'outsource_only' && (c.amount || 0) > 0 && (dbColUsed[c.id] || revCol[c.id]);
        }).map(function(c) { return { item: c, status: dbColUsed[c.id] ? 'manual' : 'reviewed' }; });
        // 표시 필터: 연도(상단 공통 선택) + 거래처명 검색 → 이후 숨기기 토글 적용
        var q = normCoName(matchSearch);
        var unpaidEntries = unpaidAll.map(function(iv) { return { item: iv, status: 'none' }; })
          .concat(resolvedInvs)
          .filter(function(e) {
            var iv = e.item;
            if (!iv.issue_date || !String(iv.issue_date).startsWith(year)) return false;
            if (q && normCoName(iv.counterpart_name).indexOf(q) === -1) return false;
            return true;
          }).sort(function(a, b) { return String(b.item.issue_date).localeCompare(String(a.item.issue_date)); });
        var unissuedEntries = unissuedAll.map(function(c) { return { item: c, status: 'none' }; })
          .concat(resolvedCols)
          .filter(function(e) {
            var c = e.item;
            if (!c.collected_at || !String(c.collected_at).startsWith(year)) return false;
            if (q && normCoName(colClient(c)).indexOf(q) === -1) return false;
            return true;
          }).sort(function(a, b) { return String(b.item.collected_at).localeCompare(String(a.item.collected_at)); });
        var unpaidOpen = unpaidEntries.filter(function(e) { return e.status === 'none'; }).length;
        var unissuedOpen = unissuedEntries.filter(function(e) { return e.status === 'none'; }).length;
        var unpaidResolved = unpaidEntries.length - unpaidOpen;
        var unissuedResolved = unissuedEntries.length - unissuedOpen;
        var unpaid = hideResolved ? unpaidEntries.filter(function(e) { return e.status === 'none'; }) : unpaidEntries;
        var unissued = hideResolved ? unissuedEntries.filter(function(e) { return e.status === 'none'; }) : unissuedEntries;
        // 매칭된 건: 자동(재계산 1:1) + 수동(DB) — connected component 그룹핑
        // (분할입금으로 1계산서↔N수금, 1수금↔N계산서가 연결되면 한 그룹으로 묶어 표시)
        var edges = matchedPairs.map(function(p) {
          return { inv: salesInvs[p.ii], col: payCols[p.ci], manual: false };
        });
        icMatches.forEach(function(m) {
          var iv = invById.get(m.tax_invoice_id), c = colById.get(m.collection_id);
          if (!iv || !c) return; // 원본이 삭제된 기록은 표시 생략
          edges.push({ inv: iv, col: c, manual: (m.match_type || 'manual') !== 'auto' });
        });
        var ufParent = {};
        function ufFind(x) { while (ufParent[x] !== x) { ufParent[x] = ufParent[ufParent[x]]; x = ufParent[x]; } return x; }
        edges.forEach(function(e) {
          var a = 'I' + e.inv.id, b = 'C' + e.col.id;
          if (!(a in ufParent)) ufParent[a] = a;
          if (!(b in ufParent)) ufParent[b] = b;
          var ra = ufFind(a), rb = ufFind(b);
          if (ra !== rb) ufParent[rb] = ra;
        });
        var groupMap = {};
        edges.forEach(function(e) {
          var root = ufFind('I' + e.inv.id);
          var g = groupMap[root];
          if (!g) { g = { invMap: {}, colMap: {}, manual: false }; groupMap[root] = g; }
          g.invMap[e.inv.id] = e.inv;
          g.colMap[e.col.id] = e.col;
          if (e.manual) g.manual = true;
        });
        var matchGroups = Object.keys(groupMap).map(function(k) {
          var g = groupMap[k];
          var invs = Object.keys(g.invMap).map(function(id) { return g.invMap[id]; })
            .sort(function(a, b) { return String(b.issue_date || '').localeCompare(String(a.issue_date || '')); });
          var gCols = Object.keys(g.colMap).map(function(id) { return g.colMap[id]; })
            .sort(function(a, b) { return String(b.collected_at || '').localeCompare(String(a.collected_at || '')); });
          return {
            invs: invs, cols: gCols, manual: g.manual,
            invSum: invs.reduce(function(s, iv) { return s + (iv.total_amount || 0); }, 0),
            colSum: gCols.reduce(function(s, c) { return s + (c.amount || 0); }, 0),
          };
        }).filter(function(g) {
          var inYear = g.invs.some(function(iv) { return iv.issue_date && String(iv.issue_date).startsWith(year); })
                    || g.cols.some(function(c) { return c.collected_at && String(c.collected_at).startsWith(year); });
          if (!inYear) return false;
          if (q) {
            var hit = g.invs.some(function(iv) { return normCoName(iv.counterpart_name).indexOf(q) !== -1; })
                   || g.cols.some(function(c) { return normCoName(colClient(c)).indexOf(q) !== -1; });
            if (!hit) return false;
          }
          return true;
        }).sort(function(a, b) {
          var da = a.invs.length ? String(a.invs[0].issue_date || '') : '';
          var db2 = b.invs.length ? String(b.invs[0].issue_date || '') : '';
          return db2.localeCompare(da);
        });
        function SectionHead({ icon, label, cls, count, sub }) {
          return (
            <div style={{display:'flex',alignItems:'center',gap:8,margin:'16px 0 8px'}}>
              <span style={{fontWeight:700,fontSize:13,color:'#334155'}}>{icon} {label}</span>
              <span className={'badge ' + cls}>{count}건</span>
              {sub > 0 && <span className="badge bgr">처리 {sub}건</span>}
            </div>
          );
        }
        return (
          <div className="card">
            <div className="sh">
              <span className="st">수금 ↔ 세금계산서 매칭확인 ({year}년)</span>
            </div>
            <div style={{fontSize:11,color:'#94a3b8',marginBottom:12}}>
              매출 세금계산서와 수금내역을 금액(완전일치)·날짜(발행일 ±{MATCH_WINDOW_DAYS}일) 기준으로 1:1 자동 매칭합니다.
              거래처명은 참고 표시(오매칭 육안 확인용). 외주비만 입력된 수금 건은 제외. 연도는 상단 연도 선택을 따릅니다.
              확인완료·수동매칭 처리한 건은 회색으로 표시되며 "처리완료 항목 숨기기"로 감출 수 있습니다.
              분할입금은 수동매칭에서 여러 건을 체크해 합산 매칭하세요.
            </div>
            {matchMsg && <div className={'al ' + (matchMsg.indexOf('❌') === 0 ? 'al-e' : 'al-s')}>{matchMsg}</div>}
            <div style={{display:'flex',gap:12,alignItems:'center',flexWrap:'wrap',marginBottom:4}}>
              <input className="fi" style={{width:220}} placeholder="거래처명 검색"
                value={matchSearch} onChange={function(e) { setMatchSearch(e.target.value); }} />
              <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'#64748b',cursor:'pointer'}}>
                <input type="checkbox" checked={showMatched} onChange={function(e) { setShowMatched(e.target.checked); }} />
                매칭된 건 보기 <span className="badge bg">{matchGroups.length}건</span>
              </label>
              <label style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'#64748b',cursor:'pointer'}}>
                <input type="checkbox" checked={hideResolved} onChange={function(e) { setHideResolved(e.target.checked); }} />
                처리완료 항목 숨기기
              </label>
            </div>

            {(loading || taxLoading) ? (
              <div className="loading">로딩 중...</div>
            ) : (
              <div>
                {/* 미수금 의심: 세금계산서만 있고 매칭 수금 없음 */}
                <SectionHead icon="⚠" label="미수금 의심 — 세금계산서 발행 후 매칭 수금 없음" cls="br" count={unpaidOpen} sub={unpaidResolved} />
                {unpaid.length === 0 ? (
                  <div style={{fontSize:12,color:'#94a3b8',padding:'8px 4px'}}>해당 건이 없습니다.</div>
                ) : (
                  <div className="tbl-wrap">
                    <table>
                      <thead>
                        <tr><th>거래처명</th><th>프로젝트명</th><th className="tr">합계금액</th><th>발행일</th><th className="tc">액션</th></tr>
                      </thead>
                      <tbody>
                        {unpaid.map(function(e) {
                          var iv = e.item, st = e.status;
                          return (
                            <tr key={iv.id} style={st === 'none' ? undefined : {opacity:0.55}}>
                              <td style={{fontWeight:600}}>{iv.counterpart_name || '-'}</td>
                              <td style={{color:'#94a3b8',fontSize:12}}>-</td>
                              <td className="tr" style={{fontWeight:700,color:'#dc2626'}}>{fmtN(iv.total_amount)}원</td>
                              <td className="tc">{fmtD(iv.issue_date)}</td>
                              <td className="tc" style={{whiteSpace:'nowrap'}}>
                                {st === 'none' ? (
                                  <span>
                                    <button className="btn btn-p btn-sm" style={{marginRight:4}}
                                      onClick={function() { setMatchPick({ type: 'invoice', item: iv }); setPickSearch(''); setPickSel({}); }}>수동매칭</button>
                                    <button className="btn btn-s btn-sm"
                                      onClick={function() { setReviewPick({ itemType: 'tax_invoice', itemId: iv.id, label: iv.counterpart_name || '-' }); setReviewNote(''); }}>확인완료</button>
                                  </span>
                                ) : (
                                  <span style={{display:'inline-flex',alignItems:'center',gap:4}}>
                                    <span className={'badge ' + (st === 'manual' ? 'bp' : 'bgr')}>{st === 'manual' ? '수동매칭' : '확인완료'}</span>
                                    {st === 'reviewed' && revNoteInv[iv.id] && (
                                      <button className="btn btn-s btn-sm" title="메모 보기"
                                        onClick={function() { setNoteView(revNoteInv[iv.id]); }}>📝</button>
                                    )}
                                    <button className="btn btn-s btn-sm"
                                      onClick={function() {
                                        if (st === 'manual') removeMatchByItem('tax_invoice', iv.id);
                                        else removeReview('tax_invoice', iv.id);
                                      }}>해제</button>
                                  </span>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 미발행 의심: 수금만 있고 매칭 세금계산서 없음 */}
                <SectionHead icon="🧾" label="미발행 의심 — 수금 후 매칭 세금계산서 없음" cls="ba" count={unissuedOpen} sub={unissuedResolved} />
                {unissued.length === 0 ? (
                  <div style={{fontSize:12,color:'#94a3b8',padding:'8px 4px'}}>해당 건이 없습니다.</div>
                ) : (
                  <div className="tbl-wrap">
                    <table>
                      <thead>
                        <tr><th>거래처명</th><th>프로젝트명</th><th className="tr">수금액</th><th>수금일</th><th className="tc">액션</th></tr>
                      </thead>
                      <tbody>
                        {unissued.map(function(e) {
                          var c = e.item, st = e.status;
                          return (
                            <tr key={c.id} style={st === 'none' ? undefined : {opacity:0.55}}>
                              <td style={{fontWeight:600}}>{colClient(c) || '-'}</td>
                              <td style={{color:'#475569',fontSize:12}}>{projLabel(c)}</td>
                              <td className="tr" style={{fontWeight:700,color:'#d97706'}}>{fmtN(c.amount)}원</td>
                              <td className="tc">{fmtD(c.collected_at)}</td>
                              <td className="tc" style={{whiteSpace:'nowrap'}}>
                                {st === 'none' ? (
                                  <span>
                                    <button className="btn btn-p btn-sm" style={{marginRight:4}}
                                      onClick={function() { setMatchPick({ type: 'collection', item: c }); setPickSearch(''); setPickSel({}); }}>수동매칭</button>
                                    <button className="btn btn-s btn-sm"
                                      onClick={function() { setReviewPick({ itemType: 'collection', itemId: c.id, label: colClient(c) || '-' }); setReviewNote(''); }}>확인완료</button>
                                  </span>
                                ) : (
                                  <span style={{display:'inline-flex',alignItems:'center',gap:4}}>
                                    <span className={'badge ' + (st === 'manual' ? 'bp' : 'bgr')}>{st === 'manual' ? '수동매칭' : '확인완료'}</span>
                                    {st === 'reviewed' && revNoteCol[c.id] && (
                                      <button className="btn btn-s btn-sm" title="메모 보기"
                                        onClick={function() { setNoteView(revNoteCol[c.id]); }}>📝</button>
                                    )}
                                    <button className="btn btn-s btn-sm"
                                      onClick={function() {
                                        if (st === 'manual') removeMatchByItem('collection', c.id);
                                        else removeReview('collection', c.id);
                                      }}>해제</button>
                                  </span>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {/* 매칭된 건 (토글) */}
                {showMatched && (
                  <div>
                    <SectionHead icon="✅" label="매칭된 건" cls="bg" count={matchGroups.length} />
                    {matchGroups.length === 0 ? (
                      <div style={{fontSize:12,color:'#94a3b8',padding:'8px 4px'}}>해당 건이 없습니다.</div>
                    ) : (
                      <div className="tbl-wrap">
                        <table>
                          <thead>
                            <tr><th className="tc">구분</th><th>거래처명</th><th>세금계산서</th><th>수금</th><th className="tr">합계 비교</th></tr>
                          </thead>
                          <tbody>
                            {matchGroups.map(function(g, k) {
                              var same = g.invSum === g.colSum;
                              var firstName = g.invs.length ? (g.invs[0].counterpart_name || '-') : '-';
                              var nameLabel = g.invs.length > 1 ? firstName + ' 외 ' + (g.invs.length - 1) : firstName;
                              return (
                                <tr key={k}>
                                  <td className="tc"><span className={'badge ' + (g.manual ? 'bp' : 'bg')}>{g.manual ? '수동' : '자동'}</span></td>
                                  <td style={{fontWeight:600}}>{nameLabel}</td>
                                  <td style={{fontSize:12}}>
                                    {g.invs.map(function(iv) {
                                      return <div key={iv.id} style={{whiteSpace:'nowrap'}}>{fmtD(iv.issue_date)} · <b>{fmtN(iv.total_amount)}원</b></div>;
                                    })}
                                  </td>
                                  <td style={{fontSize:12}}>
                                    {g.cols.map(function(c) {
                                      return (
                                        <div key={c.id} style={{whiteSpace:'nowrap'}}>
                                          {fmtD(c.collected_at)} · <b>{fmtN(c.amount)}원</b> <span style={{color:'#94a3b8'}}>{projLabel(c)}</span>
                                        </div>
                                      );
                                    })}
                                  </td>
                                  <td className="tr" style={{whiteSpace:'nowrap',fontWeight:700,color: same ? '#059669' : '#64748b'}}>
                                    {fmtN(g.invSum)} / {fmtN(g.colSum)}{same ? ' ✓' : ''}

              var isInv = matchPick.type === 'invoice';

              var tAmt = isInv ? (t.total_amount || 0) : (t.amount || 0);
              var tDate = isInv ? t.issue_date : t.collected_at;

              function candDd(d) { return (d && tDate) ? dayDiffAbs(d, tDate) : 99999; }
              var qq = normCoName(pickSearch);
              var cands = (isInv ? unissuedAll : unpaidAll).filter(function(x) {

          onSaved={function(){setModal('');setEditItem(null);setForm({});load();}}
        />
      )}
    </div>
  );
}


function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [locked, setLocked] = useState(false);
  const [remain, setRemain] = useState(0);

  // 잠금 상태 카운트다운
  useEffect(function() {
    const bf = Sysbar.Auth.checkBruteForce();
    if (bf.locked) { setLocked(true); setRemain(bf.remainSec); }
    const timer = setInterval(function() {
      const bf2 = Sysbar.Auth.checkBruteForce();
      if (bf2.locked) { setLocked(true); setRemain(bf2.remainSec); }
      else { setLocked(false); setRemain(0); }
    }, 1000);
    return function() { clearInterval(timer); };
  }, []);

  async function doLogin() {
    if (locked) return;
    if (!phone.trim()||!pw) { setErr('아이디와 비밀번호를 입력하세요.'); return; }
    setLoading(true); setErr('');
    // allowedRoles: contractor만 차단 (팀 권한은 hasAccess로 판단)
    const result = await Sysbar.Auth.doLogin(sb, phone, pw, {
        allowedRoles: ['admin', 'manager', 'staff', 'employee'],
      });
    setLoading(false);
    if (result.ok) {
      onLogin(result.user);
    } else {
      if (result.locked) { setLocked(true); setRemain(result.remainSec); }
      setErr(result.reason);
    }
  }

  return (
    <div className="lwrap">
      <div className="lbox">
        <div className="llogo">🏢</div>
        <div className="ltit">{APP_CONFIG.COMPANY_SHORT}</div>
        <div className="lsub">관리포털 · 관리팀/관리자 전용</div>
        {err && <div className="al al-e">{err}</div>}
        <div style={{marginBottom:12}}>
          <label className="fl">아이디 (전화번호)</label>
          <input className="fi" value={phone} placeholder="전화번호 입력" disabled={locked}
            onChange={function(e){setPhone(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')document.getElementById('ap-pw').focus();}} />
        </div>
        <div style={{marginBottom:20}}>
          <label className="fl">비밀번호</label>
          <input id="ap-pw" type="password" className="fi" value={pw} placeholder="비밀번호 입력" disabled={locked}
            onChange={function(e){setPw(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')doLogin();}} />
        </div>
        <button className="btn btn-p" onClick={doLogin} disabled={loading || locked} style={{width:'100%',justifyContent:'center',padding:'12px'}}>
          {locked ? `잠금 ${remain}초` : (loading ? '로그인 중...' : '로그인')}
        </button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);


const CURRENT_PAGE = 'pf';
const PageView = PerfView;

// ── 관리포털 페이지 정의 (네비게이션) ──────────────────────────────────────
// 각 페이지 파일은 상단에서 CURRENT_PAGE 를 지정한다.
//   admin-worklog.html  → 'wl'
//   admin-perf.html     → 'pf'
//   admin-salary.html   → 'sl'
//   admin-account.html  → 'ab'
//   admin-staff.html    → 'st'
const PORTAL_PAGES = [
  { key:'wl', label:'📝 업무일지', href:'admin-worklog.html', need:'access' },
  { key:'pf', label:'📊 실적관리', href:'admin-perf.html',    need:'access' },
  { key:'sl', label:'💼 급여관리', href:'admin-salary.html',  need:'sal'    },
  { key:'ab', label:'🔑 계정관리', href:'admin-account.html', need:'ab'     },
  { key:'st', label:'👥 직원관리', href:'admin-staff.html',   need:'access' },
];

function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    if (v && v.id && v.role) return v;
    return null;
  })();
  const [user, setUser] = useState(initialUser);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [teamName, setTeamName] = useState('');
  const [hasAccess, setHasAccess] = useState(false);
  const [accessChecked, setAccessChecked] = useState(false);

  useEffect(function() {
    if (initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { setUser(null); return; }
    setSsoChecked(true);
  }, []);

  useEffect(function() {
    if (!initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { logout(); return; }
    if (ssoChecked) { Sysbar.SessionManager.onLogin(function() { logout(); }); }
  }, []);

  useEffect(function() {
    if (!user) return;
    if (user.role === 'admin') { setTeamName('관리자'); setHasAccess(true); setAccessChecked(true); return; }
    if (!user.team_id) { setHasAccess(false); setAccessChecked(true); return; }
    sb.from('teams').select('name').eq('id', user.team_id).single().then(function(r) {
      var name = r.data ? r.data.name : '';
      setTeamName(name);
      setHasAccess(name === (APP_CONFIG.ADMIN_TEAM_NAME || '관리팀'));
      setAccessChecked(true);
    });
  }, [user ? user.id : null]);

  function handleLogin(u) {
    setUser(u);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }

  function logout() {
    Sysbar.Auth.logout(sb);
    setUser(null); setTeamName(''); setHasAccess(false);
  }

  if (!ssoChecked || (user && !accessChecked)) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--theme,#0f172a)',color:'#94a3b8',fontSize:14}}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  if (user.role !== 'admin' && !hasAccess) return (
    <div className="lwrap">
      <div className="lbox" style={{textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>🚫</div>
        <div className="ltit" style={{marginBottom:8}}>접근 권한 없음</div>
        <p style={{fontSize:13,color:'#64748b',lineHeight:1.6,marginBottom:24}}>관리포털은 관리팀 및 관리자만<br/>이용할 수 있습니다.</p>
        <a href="project.html" className="btn btn-s" style={{justifyContent:'center'}}>공정관리로 돌아가기</a>
      </div>
    </div>
  );

  var canSal = user.role === 'admin';
  var canAb  = user.role === 'admin' || teamName === '관리팀';

  // 현재 페이지가 권한이 없는 페이지면 업무일지로 리다이렉트
  if (CURRENT_PAGE === 'sl' && !canSal) { location.replace('admin-worklog.html'); return null; }
  if (CURRENT_PAGE === 'ab' && !canAb)  { location.replace('admin-worklog.html'); return null; }

  function canShow(need) {
    if (need === 'sal') return canSal;
    if (need === 'ab')  return canAb;
    return true;
  }

  return (
    <div>
      <SysBar
        activeKey="admin"
        user={user}
        teamName={teamName}
        onLogout={logout}
      />
      {/* 시스템 제목 바 */}
      <div style={{background:'var(--theme,#0f172a)',padding:'6px 18px 8px',flexShrink:0,borderBottom:'2px solid #7c3aed',position:'sticky',top:38,zIndex:250}}>
        <p style={{margin:0,fontSize:9,lineHeight:'1.2',color:'#475569',letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{margin:0,fontSize:14,lineHeight:'1.3',fontWeight:800,color:'white',letterSpacing:-0.3}}>관리 포털</p>
      </div>
      <div className="top-nav">
        {PORTAL_PAGES.filter(function(pg){ return canShow(pg.need); }).map(function(pg) {
          return (
            <button key={pg.key}
              className={CURRENT_PAGE===pg.key?'nav-btn active':'nav-btn'}
              onClick={function(){ if (CURRENT_PAGE!==pg.key) location.href = pg.href; }}>
              {pg.label}
            </button>
          );
        })}
      </div>
      <PageView user={user} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
