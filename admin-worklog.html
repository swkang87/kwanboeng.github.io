<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
if (window.emailjs && APP_CONFIG.EMAILJS_PUBLIC_KEY) {
  window.emailjs.init({ publicKey: APP_CONFIG.EMAILJS_PUBLIC_KEY });
}

const VIEWS = { WL:'wl', PF:'pf', SL:'sl', AB:'ab', ST:'st' };
const TODAY = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDateKo = (ds) => { const d = new Date(ds + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const DAY_KO = ['일','월','화','수','목','금','토'];

// ── 공휴일 (하드코딩 + Nager.Date API 조합) ──────────────────────────────
const HOLIDAYS = {
  '2025-01-01':'신정',
  '2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날',
  '2025-06-03':'임시공휴일','2025-06-06':'현충일',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날',
  '2025-12-25':'크리스마스',
  '2026-01-01':'신정',
  '2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴',
  '2026-03-01':'삼일절',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-03':'임시공휴일(지방선거)','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절',
  '2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날',
  '2026-12-25':'크리스마스',
};
const SUBSTITUTE = {
  '2025-05-06':'대체공휴일',
  '2025-10-08':'대체공휴일',
  '2026-03-02':'대체공휴일',
  '2026-05-25':'대체공휴일',
  
  '2026-08-17':'대체공휴일',
  
  '2026-10-05':'대체공휴일',
};
const NAGER_KO = {
  "New Year's Day":'신정',"Seollal":'설날',"Seollal Holiday":'설날연휴',
  "Independence Movement Day":'삼일절',"Labor Day":'근로자의날',
  "Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',
  "Memorial Day":'현충일',"Liberation Day":'광복절',
  "Chuseok":'추석',"Chuseok Holiday":'추석연휴',
  "National Foundation Day":'개천절',"Hangul Day":'한글날',
  "Christmas Day":'크리스마스',"Substitute Holiday":'대체공휴일',
};
function isHolidayDate(ds) { return !!(HOLIDAYS[ds] || SUBSTITUTE[ds]); }
function getHolidayName(ds) { return HOLIDAYS[ds] || SUBSTITUTE[ds] || null; }

const _holCache = {};
async function fetchHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const set = new Set([...Object.keys(HOLIDAYS), ...Object.keys(SUBSTITUTE)]
    .filter(d => d.startsWith(String(year))));
  try {
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const data = await r.json();
    data.forEach(h => {
      if (!h.date) return;
      const name = NAGER_KO[h.localName] || NAGER_KO[h.name] || h.localName || h.name;
      set.add(h.date);
      if (name === '대체공휴일') SUBSTITUTE[h.date] = '대체공휴일';
      else if (!HOLIDAYS[h.date]) HOLIDAYS[h.date] = name;
    });
  } catch(e) {}
  _holCache[year] = set;
  return set;
}

// 직전 근무일 계산 (주말·공휴일 건너뜀)
function prevWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() - 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}
// 다음 근무일 계산
function nextWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() + 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}

// ── MiniCalendar ──────────────────────────────────────────────────────────────
function MiniCalendar({ value, onChange, maxDate }) {
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(() => new Date((value || TODAY()) + 'T00:00:00'));
  const [holidays, setHolidays] = useState(new Set());
  const wrapRef = useRef(null);

  useEffect(function() {
    if (!open) return;
    fetchHolidays(viewDate.getFullYear()).then(function(h) { setHolidays(h); });
  }, [open, viewDate.getFullYear()]);

  useEffect(function() {
    if (!open) return;
    function handler(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return function() { document.removeEventListener('mousedown', handler); };
  }, [open]);

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const startWd = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const today = TODAY();

  function prevM() { const d = new Date(viewDate); d.setMonth(d.getMonth() - 1); setViewDate(d); }
  function nextM() { const d = new Date(viewDate); d.setMonth(d.getMonth() + 1); setViewDate(d); }

  function select(ds) {
    if (maxDate && ds > maxDate) return;
    onChange(ds);
    setOpen(false);
  }

  return (
    <div className="mcal-wrap" ref={wrapRef}>
      <button className="mcal-btn" title="달력 선택"
        onClick={function() { setViewDate(new Date((value || TODAY()) + 'T00:00:00')); setOpen(function(v) { return !v; }); }}>📅</button>
      {open && (
        <div className="mcal-popup">
          <div className="mcal-nav">
            <button className="mcal-nav-btn" onClick={prevM}>◀</button>
            <span className="mcal-title">{year}년 {month + 1}월</span>
            <button className="mcal-nav-btn" onClick={nextM}>▶</button>
          </div>
          <div className="mcal-grid">
            {DAY_KO.map(function(d, i) {
              return <div key={d} className={'mcal-dh' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>{d}</div>;
            })}
            {Array.from({ length: startWd }, function(_, i) { return <div key={'e' + i} className="mcal-day empty" />; })}
            {Array.from({ length: lastDay }, function(_, i) {
              const day = i + 1;
              const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
              const wd = new Date(ds + 'T00:00:00').getDay();
              const isHol = holidays.has(ds);
              const isFuture = maxDate && ds > maxDate;
              const cls = ['mcal-day',
                (wd === 0 || isHol) ? 'sun' : wd === 6 ? 'sat' : '',
                ds === today && ds !== value ? 'today' : '',
                ds === value ? 'selected' : '',
                isFuture ? 'future' : '',
              ].filter(Boolean).join(' ');
              return <div key={day} className={cls} onClick={function() { if (!isFuture) select(ds); }}>{day}</div>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}
const fmtN = (n) => n ? Number(n).toLocaleString('ko-KR') : '0';
const fmtD = (d) => {
  if (!d) return '-';
  const dt = new Date(d + 'T00:00:00');
  return dt.getFullYear() + '.' + String(dt.getMonth()+1).padStart(2,'0') + '.' + String(dt.getDate()).padStart(2,'0');
};
const genId = () => Math.random().toString(36).slice(2, 10);
const WSTATUS = ['완료','진행중','보류'];
const SCLS = { '완료':'bg','진행중':'bb','보류':'ba' };
const CAT_COLOR = { '관급': '#2563eb', '사급': '#059669', '기술지원': '#d97706' };
const CAT_BG    = { '관급': '#dbeafe', '사급': '#dcfce7', '기술지원': '#fef3c7' };
const CAT_TX    = { '관급': '#1e40af', '사급': '#15803d', '기술지원': '#92400e' };

const fmtShort = (ds) => { const d = new Date(ds + 'T00:00:00'); return (d.getMonth()+1) + '/' + d.getDate(); };

const getWeekDates = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return Array.from({ length: 5 }, function(_, i) {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return localDateStr(dd);
  });
};

const getMonthInfo = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  return {
    year, month,
    days: last.getDate(),
    startWeekday: first.getDay(),
    firstDate: localDateStr(first),
    lastDate:  localDateStr(last),
  };
};

// ── 인풋 컴포넌트 ─────────────────────────────────────────────────────────
function FI({ label, field, form, set }) {
  function fmtInput(v) {
    var n = String(v||'').replace(/,/g,'');
    if (n==='' || n==='-') return n;
    var num = Number(n);
    if (isNaN(num)) return n;
    return num.toLocaleString('ko-KR');
  }
  function handleChange(e) {
    var raw = e.target.value.replace(/,/g,'');
    set(function(p) { var o = Object.assign({}, p); o[field] = raw; return o; });
  }
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #f1f5f9'}}>
      <span style={{fontSize:13,color:'#64748b',flexShrink:0,minWidth:110}}>{label}</span>
      <input
        className="fi"
        style={{width:140,textAlign:'right',padding:'4px 8px',fontSize:13,height:'auto'}}
        value={fmtInput(form[field])}
        placeholder="0"
        onChange={handleChange}
      />
    </div>
  );
}

function WorklogView({ user }) {
  const { useCallback } = React;
  const [tab, setTab]         = useState('my');
  const [allMode, setAllMode] = useState('day');
  // 내 업무일지
  const [date, setDate]       = useState(TODAY());
  const [tasks, setTasks]     = useState([]);
  const [issues, setIssues]   = useState('');
  const [saving, setSaving]   = useState(false);
  const [msg, setMsg]         = useState('');
  const [loading, setLoading] = useState(false);
  // 공유 할일
  const [todos, setTodos]           = useState([]);
  const [todoLoading, setTodoLoading] = useState(false);
  const [todoInput, setTodoInput]   = useState('');
  const [todoAdding, setTodoAdding] = useState(false);
  // 전체 조회
  const [selDate, setSelDate]     = useState(TODAY());
  const [allUsers, setAllUsers]   = useState([]);
  const [allLogs, setAllLogs]     = useState([]);
  const [allLoading, setAllLoading] = useState(false);

  // 하위탭 전환 — pushState
  function changeTab(newTab) {
    history.pushState({ wlTab: newTab, allMode: allMode, selDate: selDate }, '', '');
    setTab(newTab);
  }

  // 전체조회 모드 전환 — pushState
  function changeAllMode(newMode, date) {
    history.pushState({ wlTab: 'all', allMode: newMode, selDate: date || selDate }, '', '');
    if (date) setSelDate(date);
    setAllMode(newMode);
  }

  // 뒤로가기 감지
  useEffect(function() {
    history.replaceState({ wlTab: tab, allMode: allMode, selDate: selDate }, '', '');
    function onPop(e) {
      if (e.state && e.state.wlTab !== undefined) {
        setTab(e.state.wlTab);
        if (e.state.allMode) setAllMode(e.state.allMode);
        if (e.state.selDate) setSelDate(e.state.selDate);
      }
    }
    window.addEventListener('popstate', onPop);
    return function() { window.removeEventListener('popstate', onPop); };
  }, []);

  // ── 공유 할일 로드/추가/완료 ─────────────────────────────────────────────
  function loadTodos() {
    setTodoLoading(true);
    sb.from('shared_todos').select('*,creator:created_by(name),completer:completed_by(name)')
      .neq('status', '완료')
      .order('created_at', { ascending: true })
      .then(function(r) {
        setTodos(r.data || []);
        setTodoLoading(false);
      });
  }

  function addTodo() {
    var title = todoInput.trim();
    if (!title) return;
    setTodoAdding(true);
    sb.from('shared_todos').insert({ title: title, created_by: user.id, status: '대기' })
      .then(function(r) {
        setTodoAdding(false);
        if (!r.error) { setTodoInput(''); loadTodos(); }
      });
  }

  function completeTodo(id) {
    sb.from('shared_todos').update({
      status: '완료',
      completed_by: user.id,
      completed_at: new Date().toISOString()
    }).eq('id', id).then(function() { loadTodos(); });
  }

  function deleteTodo(id) {
    sb.from('shared_todos').delete().eq('id', id).then(function() { loadTodos(); });
  }

  function restoreTodo(id) {
    sb.from('shared_todos').update({
      status: '대기',
      completed_by: null,
      completed_at: null
    }).eq('id', id).then(function() { loadTodos(); });
  }

  // 업무일지 작성폼에서 할일 선택 → 항목 추가 + 완료처리
  function pickTodo(todo) {
    setTasks(function(p) { return p.concat([{ id: genId(), content: todo.title, status: '완료', fromTodoId: todo.id }]); });
    completeTodo(todo.id);
  }

  useEffect(function() { loadTodos(); }, []);

  // ── 내 업무일지 로드 ──────────────────────────────────────────────────────
  const loadMyLog = useCallback(async function(d) {
    setLoading(true);
    const { data } = await sb.from('admin_work_logs')
      .select('*').eq('user_id', user.id).eq('log_date', d).maybeSingle();
    if (data) {
      setTasks(data.tasks || []);
      setIssues(data.issues || '');
    } else {
      // 빈 날짜 → 직전 근무일 진행중 업무 자동 불러오기
      const prevDs = prevWorkday(d);
      const { data: pd } = await sb.from('admin_work_logs')
        .select('tasks').eq('user_id', user.id).eq('log_date', prevDs).maybeSingle();
      const pending = pd
        ? (pd.tasks || []).filter(function(t) { return t.status === '진행중'; })
            .map(function(t) { return Object.assign({}, t, { id: genId() }); })
        : [];
      setTasks(pending);
      setIssues('');
    }
    setLoading(false);
  }, [user.id]);

  useEffect(function() {
    if (tab === 'my') loadMyLog(date);
  }, [date, tab]);

  // ── 전체 조회 로드 ────────────────────────────────────────────────────────
  useEffect(function() {
    if (tab !== 'all') return;
    setAllLoading(true);
    sb.from('teams').select('id,name').then(function(tr) {
      const teams = tr.data || [];
      const mgmt = teams.find(function(t) { return t.name === '관리팀'; });
      sb.from('users').select('id,name,team_id').then(function(ur) {
        const filtered = (ur.data || []).filter(function(u) {
          return mgmt && u.team_id === mgmt.id;
        });
        setAllUsers(filtered);
        var start, end;
        if (allMode === 'day') { start = end = selDate; }
        else if (allMode === 'week') { const w = getWeekDates(selDate); start = w[0]; end = w[4]; }
        else { const m = getMonthInfo(selDate); start = m.firstDate; end = m.lastDate; }
        sb.from('admin_work_logs').select('*').gte('log_date', start).lte('log_date', end).then(function(lr) {
          setAllLogs(lr.data || []);
          setAllLoading(false);
        });
      });
    });
  }, [tab, selDate, allMode]);

  // ── 저장 ──────────────────────────────────────────────────────────────────
  function save() {
    setSaving(true);
    sb.from('admin_work_logs').upsert({
      user_id: user.id, log_date: date,
      tasks: tasks, tomorrow_tasks: [], issues: issues,
      updated_at: new Date().toISOString(),
    }, { onConflict: 'user_id,log_date' }).then(function(r) {
      setSaving(false);
      if (r.error) {
        setMsg('❌ 저장 실패: ' + (r.error.message || JSON.stringify(r.error)));
      } else {
        setMsg('저장됐습니다');
        setTimeout(function() { setMsg(''); }, 2500);
      }
    });
  }

  // ── 날짜 이동 헬퍼 ────────────────────────────────────────────────────────
  function shiftDate(ds, dir, setter, max) {
    const next = dir < 0 ? prevWorkday(ds) : nextWorkday(ds);
    if (max && next > max) return;
    setter(next);
  }
  function shiftAllDate(dir) {
    const d = new Date(selDate + 'T00:00:00');
    if (allMode === 'day')        d.setDate(d.getDate() + dir);
    else if (allMode === 'week')  d.setDate(d.getDate() + dir * 7);
    else                          d.setMonth(d.getMonth() + dir);
    setSelDate(localDateStr(d));
  }
  function allRangeLabel() {
    if (allMode === 'day')  return fmtDateKo(selDate) + ' (' + DAY_KO[new Date(selDate+'T00:00:00').getDay()] + ')';
    if (allMode === 'week') { const w = getWeekDates(selDate); return fmtShort(w[0]) + ' ~ ' + fmtShort(w[4]); }
    const m = getMonthInfo(selDate); return m.year + '년 ' + (m.month+1) + '월';
  }

      </div>
      <div className="itabs">
        <button className={tab === 'my' ? 'itab active' : 'itab'} onClick={function() { changeTab('my'); }}>내 업무일지</button>
        <button className={tab === 'all' ? 'itab active' : 'itab'} onClick={function() { changeTab('all'); }}>전체 조회</button>
      </div>

      {/* ── 내 업무일지 (공유 할일 통합) ── */}
      {tab === 'my' && (
        <div className="card">

          {/* 날짜 헤더 */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:8}}>
            <span style={{fontSize:15,fontWeight:800}}>✏️ {user.name}님 · {fmtDateKo(date)} ({dayNameOf(date)})</span>
            <div className="wl-date-nav">
              <button className="wl-date-btn" onClick={function() { shiftDate(date, -1, setDate, null); }}>◀</button>
              <input type="date" className="fi" value={date} max={TODAY()}
                onChange={function(e) { setDate(e.target.value); }}
                style={{width:'auto',maxWidth:140}} />
              <MiniCalendar value={date} maxDate={TODAY()} onChange={setDate} />
              <button className="wl-date-btn" onClick={function() { shiftDate(date, 1, setDate, TODAY()); }}
                disabled={date >= TODAY()}>▶</button>

                <button className="wl-today-btn" onClick={function() { setDate(TODAY()); }}>오늘</button>
              )}
            </div>
          </div>

          {/* ── 공유 할일 영역 ── */}
          <div style={{marginBottom:20,paddingBottom:20,borderBottom:'1.5px solid #f1f5f9'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>

                <div style={{display:'flex',gap:6}}>
                  <input className="fi" value={todoInput} placeholder="할일 추가"

                        })}
                        {log.issues && (
                          <div style={{marginTop:8,padding:'6px 10px',background:'#fef3c7',borderRadius:6,fontSize:12,color:'#92400e'}}>
                            💬 {log.issues}
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
              {allMode === 'day' && !allLoading && allUsers.length === 0 && (
                <div style={{color:'#94a3b8',fontSize:13,textAlign:'center',padding:'20px 0'}}>관리팀 직원 정보를 불러오는 중...</div>
              )}

              {/* ── 주별 ── */}
              {allMode === 'week' && (function() {
                const weekDates = getWeekDates(selDate);
                return (
                  <div>
                    {allUsers.map(function(u) {
                      const weekLogs = weekDates.map(function(d) {
                        return { date: d, log: allLogs.find(function(l) { return l.user_id === u.id && l.log_date === d; }) };
                      }).filter(function(x) { return x.log; });
                      if (weekLogs.length === 0) return (
                        <div key={u.id} className="lc" style={{marginBottom:8}}>
                          <div className="lu">
                            <div className="lav" style={{opacity:.5}}>{u.name[0]}</div>
                            <div>
                              <div className="ln">{u.name}</div>
                              <div className="lm">이번 주 미작성</div>
                            </div>
                          </div>
                        </div>
                      );
                      return (
                        <div key={u.id} className="lc" style={{marginBottom:12}}>
                          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
                            <div className="lu">
                              <div className="lav">{u.name[0]}</div>
                              <div>
                                <div className="ln">{u.name}</div>
                                <div className="lm">{weekLogs.length}일 작성</div>
                              </div>
                            </div>
                          </div>
                          {weekLogs.map(function(item) {
                            const dt = new Date(item.date + 'T00:00:00');
                            const dayLabel = (dt.getMonth()+1) + '/' + dt.getDate() + '(' + DAY_KO[dt.getDay()] + ')';
                            return (
                              <div key={item.date} style={{marginBottom:10}}>
                                {/* 날짜 헤더 - 클릭 시 일별로 이동 */}
                                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:5,
                                  padding:'4px 8px',background:'#f8fafc',borderRadius:6,cursor:'pointer'}}
                                  onClick={function(){changeAllMode('day', item.date);}}>
                                  <span style={{fontSize:12,fontWeight:700,color:'#475569'}}>{dayLabel}</span>
                                  <span style={{fontSize:11,color:'#94a3b8'}}>업무 {(item.log.tasks||[]).length}건</span>
                                  <span style={{fontSize:11,color:'#7c3aed',marginLeft:'auto'}}>상세보기 →</span>
                                </div>
                                {/* 업무 목록 전체 */}
                                {(item.log.tasks||[]).map(function(t, i) {
                                  var sColor = t.status==='완료'?'#059669':t.status==='진행중'?'#2563eb':'#d97706';
                                  return (
                                    <div key={i} style={{display:'flex',alignItems:'flex-start',gap:8,
                                      padding:'4px 0',borderBottom:'1px solid #f1f5f9',fontSize:13}}>
                                      <span style={{flexShrink:0,fontSize:11,fontWeight:700,
                                        color:sColor,background:sColor+'18',
                                        padding:'1px 6px',borderRadius:4}}>{t.status}</span>
                                      <span style={{color:'#334155',lineHeight:1.5}}>{t.content}</span>
                                    </div>
                                  );
                                })}
                                {item.log.issues && (
                                  <div style={{marginTop:4,padding:'4px 8px',background:'#fef3c7',
                                    borderRadius:5,fontSize:12,color:'#92400e'}}>
                                    💬 {item.log.issues}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

              {/* ── 월별 ── */}
              {allMode === 'month' && (function() {
                const mInfo = getMonthInfo(selDate);
                return (
                  <div className="wl-month-grid">
                    {DAY_KO.map(function(d, i) {
                      return <div key={d} className={'wl-month-hdr' + (i===0?' sun':i===6?' sat':'')}>{d}</div>;
                    })}
                    {Array.from({length:mInfo.startWeekday}, function(_,i) {
                      return <div key={'e'+i} className="wl-month-day empty" />;
                    })}
                    {Array.from({length:mInfo.days}, function(_,i) {
                      const day = i + 1;
                      const ds  = mInfo.year + '-' + String(mInfo.month+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
                      const wd  = new Date(ds + 'T00:00:00').getDay();
                      const cnt = allLogs.filter(function(l){ return l.log_date === ds; }).length;
                      const isToday = ds === TODAY();
                      return (
                        <div key={day} className={'wl-month-day' + (isToday?' today':'')}
                          onClick={function(){changeAllMode('day', ds);}}>
                          <div className={'wl-month-num' + (wd===0?' sun':wd===6?' sat':'') + (isToday?' today':'')}>{day}</div>
                          {cnt > 0 && <div className="wl-month-cnt">{cnt}명</div>}
                        </div>
                      );
                    })}
                  </div>
                );
              })()}

            </div>
          )}
        </div>
      )}

    </div>
  );
}

// ── 기여율 모달 (프로젝트 선택 시 PM+참여직원 자동 등록) ─────────────────

function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [locked, setLocked] = useState(false);
  const [remain, setRemain] = useState(0);

  // 잠금 상태 카운트다운
  useEffect(function() {
    const bf = Sysbar.Auth.checkBruteForce();
    if (bf.locked) { setLocked(true); setRemain(bf.remainSec); }
    const timer = setInterval(function() {
      const bf2 = Sysbar.Auth.checkBruteForce();
      if (bf2.locked) { setLocked(true); setRemain(bf2.remainSec); }
      else { setLocked(false); setRemain(0); }
    }, 1000);
    return function() { clearInterval(timer); };
  }, []);

  async function doLogin() {
    if (locked) return;
    if (!phone.trim()||!pw) { setErr('아이디와 비밀번호를 입력하세요.'); return; }
    setLoading(true); setErr('');
    // allowedRoles: contractor만 차단 (팀 권한은 hasAccess로 판단)
    const result = await Sysbar.Auth.doLogin(sb, phone, pw, {
        allowedRoles: ['admin', 'manager', 'staff', 'employee'],
      });
    setLoading(false);
    if (result.ok) {
      onLogin(result.user);
    } else {
      if (result.locked) { setLocked(true); setRemain(result.remainSec); }
      setErr(result.reason);
    }
  }

  return (
    <div className="lwrap">
      <div className="lbox">
        <div className="llogo">🏢</div>
        <div className="ltit">{APP_CONFIG.COMPANY_SHORT}</div>
        <div className="lsub">관리포털 · 관리팀/관리자 전용</div>
        {err && <div className="al al-e">{err}</div>}
        <div style={{marginBottom:12}}>
          <label className="fl">아이디 (전화번호)</label>
          <input className="fi" value={phone} placeholder="전화번호 입력" disabled={locked}
            onChange={function(e){setPhone(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')document.getElementById('ap-pw').focus();}} />
        </div>
        <div style={{marginBottom:20}}>
          <label className="fl">비밀번호</label>
          <input id="ap-pw" type="password" className="fi" value={pw} placeholder="비밀번호 입력" disabled={locked}
            onChange={function(e){setPw(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')doLogin();}} />
        </div>
        <button className="btn btn-p" onClick={doLogin} disabled={loading || locked} style={{width:'100%',justifyContent:'center',padding:'12px'}}>
          {locked ? `잠금 ${remain}초` : (loading ? '로그인 중...' : '로그인')}
        </button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);


const CURRENT_PAGE = 'wl';
const PageView = WorklogView;

// ── 관리포털 페이지 정의 (네비게이션) ──────────────────────────────────────
// 각 페이지 파일은 상단에서 CURRENT_PAGE 를 지정한다.
//   admin-worklog.html  → 'wl'
//   admin-perf.html     → 'pf'
//   admin-salary.html   → 'sl'
//   admin-account.html  → 'ab'
//   admin-staff.html    → 'st'
const PORTAL_PAGES = [
  { key:'wl', label:'📝 업무일지', href:'admin-worklog.html', need:'access' },
  { key:'pf', label:'📊 실적관리', href:'admin-perf.html',    need:'access' },
  { key:'sl', label:'💼 급여관리', href:'admin-salary.html',  need:'sal'    },
  { key:'ab', label:'🔑 계정관리', href:'admin-account.html', need:'ab'     },
  { key:'st', label:'👥 직원관리', href:'admin-staff.html',   need:'access' },
];

function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    if (v && v.id && v.role) return v;
    return null;
  })();
  const [user, setUser] = useState(initialUser);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [teamName, setTeamName] = useState('');
  const [hasAccess, setHasAccess] = useState(false);
  const [accessChecked, setAccessChecked] = useState(false);

  useEffect(function() {
    if (initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { setUser(null); return; }
    setSsoChecked(true);
  }, []);

  useEffect(function() {
    if (!initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { logout(); return; }
    if (ssoChecked) { Sysbar.SessionManager.onLogin(function() { logout(); }); }
  }, []);

  useEffect(function() {
    if (!user) return;
    if (user.role === 'admin') { setTeamName('관리자'); setHasAccess(true); setAccessChecked(true); return; }
    if (!user.team_id) { setHasAccess(false); setAccessChecked(true); return; }
    sb.from('teams').select('name').eq('id', user.team_id).single().then(function(r) {
      var name = r.data ? r.data.name : '';
      setTeamName(name);
      setHasAccess(name === (APP_CONFIG.ADMIN_TEAM_NAME || '관리팀'));
      setAccessChecked(true);
    });
  }, [user ? user.id : null]);

  function handleLogin(u) {
    setUser(u);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }

  function logout() {
    Sysbar.Auth.logout(sb);
    setUser(null); setTeamName(''); setHasAccess(false);
  }

  if (!ssoChecked || (user && !accessChecked)) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--theme,#0f172a)',color:'#94a3b8',fontSize:14}}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  if (user.role !== 'admin' && !hasAccess) return (
    <div className="lwrap">
      <div className="lbox" style={{textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>🚫</div>
        <div className="ltit" style={{marginBottom:8}}>접근 권한 없음</div>
        <p style={{fontSize:13,color:'#64748b',lineHeight:1.6,marginBottom:24}}>관리포털은 관리팀 및 관리자만<br/>이용할 수 있습니다.</p>
        <a href="project.html" className="btn btn-s" style={{justifyContent:'center'}}>공정관리로 돌아가기</a>
      </div>
    </div>
  );

  var canSal = user.role === 'admin';
  var canAb  = user.role === 'admin' || teamName === '관리팀';

  // 현재 페이지가 권한이 없는 페이지면 업무일지로 리다이렉트
  if (CURRENT_PAGE === 'sl' && !canSal) { location.replace('admin-worklog.html'); return null; }
  if (CURRENT_PAGE === 'ab' && !canAb)  { location.replace('admin-worklog.html'); return null; }

  function canShow(need) {
    if (need === 'sal') return canSal;
    if (need === 'ab')  return canAb;
    return true;
  }

  return (
    <div>
      <SysBar
        activeKey="admin"
        user={user}
        teamName={teamName}
        onLogout={logout}
      />
      {/* 시스템 제목 바 */}
      <div style={{background:'var(--theme,#0f172a)',padding:'6px 18px 8px',flexShrink:0,borderBottom:'2px solid #7c3aed',position:'sticky',top:38,zIndex:250}}>
        <p style={{margin:0,fontSize:9,lineHeight:'1.2',color:'#475569',letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{margin:0,fontSize:14,lineHeight:'1.3',fontWeight:800,color:'white',letterSpacing:-0.3}}>관리 포털</p>
      </div>
      <div className="top-nav">
        {PORTAL_PAGES.filter(function(pg){ return canShow(pg.need); }).map(function(pg) {
          return (
            <button key={pg.key}
              className={CURRENT_PAGE===pg.key?'nav-btn active':'nav-btn'}
              onClick={function(){ if (CURRENT_PAGE!==pg.key) location.href = pg.href; }}>
              {pg.label}
            </button>
          );
        })}
      </div>
      <PageView user={user} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
