<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
if (window.emailjs && APP_CONFIG.EMAILJS_PUBLIC_KEY) {
  window.emailjs.init({ publicKey: APP_CONFIG.EMAILJS_PUBLIC_KEY });
}

const VIEWS = { WL:'wl', PF:'pf', SL:'sl', AB:'ab', ST:'st' };
const TODAY = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmtDateKo = (ds) => { const d = new Date(ds + 'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`; };
const DAY_KO = ['일','월','화','수','목','금','토'];

// ── 공휴일 (하드코딩 + Nager.Date API 조합) ──────────────────────────────
const HOLIDAYS = {
  '2025-01-01':'신정',
  '2025-01-28':'설날연휴','2025-01-29':'설날','2025-01-30':'설날연휴',
  '2025-03-01':'삼일절',
  '2025-05-05':'어린이날',
  '2025-06-03':'임시공휴일','2025-06-06':'현충일',
  '2025-08-15':'광복절',
  '2025-10-03':'개천절',
  '2025-10-05':'추석','2025-10-06':'추석연휴','2025-10-07':'추석연휴',
  '2025-10-09':'한글날',
  '2025-12-25':'크리스마스',
  '2026-01-01':'신정',
  '2026-02-16':'설날연휴','2026-02-17':'설날','2026-02-18':'설날연휴',
  '2026-03-01':'삼일절',
  '2026-05-05':'어린이날','2026-05-24':'부처님오신날',
  '2026-06-03':'임시공휴일(지방선거)','2026-06-06':'현충일','2026-07-17':'제헌절',
  '2026-08-15':'광복절',
  '2026-09-24':'추석연휴','2026-09-25':'추석','2026-09-26':'추석연휴',
  '2026-10-03':'개천절','2026-10-09':'한글날',
  '2026-12-25':'크리스마스',
};
const SUBSTITUTE = {
  '2025-05-06':'대체공휴일',
  '2025-10-08':'대체공휴일',
  '2026-03-02':'대체공휴일',
  '2026-05-25':'대체공휴일',
  
  '2026-08-17':'대체공휴일',
  
  '2026-10-05':'대체공휴일',
};
const NAGER_KO = {
  "New Year's Day":'신정',"Seollal":'설날',"Seollal Holiday":'설날연휴',
  "Independence Movement Day":'삼일절',"Labor Day":'근로자의날',
  "Children's Day":'어린이날',"Buddha's Birthday":'부처님오신날',
  "Memorial Day":'현충일',"Liberation Day":'광복절',
  "Chuseok":'추석',"Chuseok Holiday":'추석연휴',
  "National Foundation Day":'개천절',"Hangul Day":'한글날',
  "Christmas Day":'크리스마스',"Substitute Holiday":'대체공휴일',
};
function isHolidayDate(ds) { return !!(HOLIDAYS[ds] || SUBSTITUTE[ds]); }
function getHolidayName(ds) { return HOLIDAYS[ds] || SUBSTITUTE[ds] || null; }

const _holCache = {};
async function fetchHolidays(year) {
  if (_holCache[year]) return _holCache[year];
  const set = new Set([...Object.keys(HOLIDAYS), ...Object.keys(SUBSTITUTE)]
    .filter(d => d.startsWith(String(year))));
  try {
    const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/KR`);
    const data = await r.json();
    data.forEach(h => {
      if (!h.date) return;
      const name = NAGER_KO[h.localName] || NAGER_KO[h.name] || h.localName || h.name;
      set.add(h.date);
      if (name === '대체공휴일') SUBSTITUTE[h.date] = '대체공휴일';
      else if (!HOLIDAYS[h.date]) HOLIDAYS[h.date] = name;
    });
  } catch(e) {}
  _holCache[year] = set;
  return set;
}

// 직전 근무일 계산 (주말·공휴일 건너뜀)
function prevWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() - 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}
// 다음 근무일 계산
function nextWorkday(ds) {
  const d = new Date(ds + 'T00:00:00');
  do {
    d.setDate(d.getDate() + 1);
    const s = localDateStr(d);
    const dow = d.getDay();
    if (dow !== 0 && dow !== 6 && !isHolidayDate(s)) return s;
  } while (true);
}

// ── MiniCalendar ──────────────────────────────────────────────────────────────
function MiniCalendar({ value, onChange, maxDate }) {
  const [open, setOpen] = useState(false);
  const [viewDate, setViewDate] = useState(() => new Date((value || TODAY()) + 'T00:00:00'));
  const [holidays, setHolidays] = useState(new Set());
  const wrapRef = useRef(null);

  useEffect(function() {
    if (!open) return;
    fetchHolidays(viewDate.getFullYear()).then(function(h) { setHolidays(h); });
  }, [open, viewDate.getFullYear()]);

  useEffect(function() {
    if (!open) return;
    function handler(e) { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }
    document.addEventListener('mousedown', handler);
    return function() { document.removeEventListener('mousedown', handler); };
  }, [open]);

  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const startWd = new Date(year, month, 1).getDay();
  const lastDay = new Date(year, month + 1, 0).getDate();
  const today = TODAY();

  function prevM() { const d = new Date(viewDate); d.setMonth(d.getMonth() - 1); setViewDate(d); }
  function nextM() { const d = new Date(viewDate); d.setMonth(d.getMonth() + 1); setViewDate(d); }

  function select(ds) {
    if (maxDate && ds > maxDate) return;
    onChange(ds);
    setOpen(false);
  }

  return (
    <div className="mcal-wrap" ref={wrapRef}>
      <button className="mcal-btn" title="달력 선택"
        onClick={function() { setViewDate(new Date((value || TODAY()) + 'T00:00:00')); setOpen(function(v) { return !v; }); }}>📅</button>
      {open && (
        <div className="mcal-popup">
          <div className="mcal-nav">
            <button className="mcal-nav-btn" onClick={prevM}>◀</button>
            <span className="mcal-title">{year}년 {month + 1}월</span>
            <button className="mcal-nav-btn" onClick={nextM}>▶</button>
          </div>
          <div className="mcal-grid">
            {DAY_KO.map(function(d, i) {
              return <div key={d} className={'mcal-dh' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '')}>{d}</div>;
            })}
            {Array.from({ length: startWd }, function(_, i) { return <div key={'e' + i} className="mcal-day empty" />; })}
            {Array.from({ length: lastDay }, function(_, i) {
              const day = i + 1;
              const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
              const wd = new Date(ds + 'T00:00:00').getDay();
              const isHol = holidays.has(ds);
              const isFuture = maxDate && ds > maxDate;
              const cls = ['mcal-day',
                (wd === 0 || isHol) ? 'sun' : wd === 6 ? 'sat' : '',
                ds === today && ds !== value ? 'today' : '',
                ds === value ? 'selected' : '',
                isFuture ? 'future' : '',
              ].filter(Boolean).join(' ');
              return <div key={day} className={cls} onClick={function() { if (!isFuture) select(ds); }}>{day}</div>;
            })}
          </div>
        </div>
      )}
    </div>
  );
}
const fmtN = (n) => n ? Number(n).toLocaleString('ko-KR') : '0';
const fmtD = (d) => {
  if (!d) return '-';
  const dt = new Date(d + 'T00:00:00');
  return dt.getFullYear() + '.' + String(dt.getMonth()+1).padStart(2,'0') + '.' + String(dt.getDate()).padStart(2,'0');
};
const genId = () => Math.random().toString(36).slice(2, 10);
const WSTATUS = ['완료','진행중','보류'];
const SCLS = { '완료':'bg','진행중':'bb','보류':'ba' };
const CAT_COLOR = { '관급': '#2563eb', '사급': '#059669', '기술지원': '#d97706' };
const CAT_BG    = { '관급': '#dbeafe', '사급': '#dcfce7', '기술지원': '#fef3c7' };
const CAT_TX    = { '관급': '#1e40af', '사급': '#15803d', '기술지원': '#92400e' };

const fmtShort = (ds) => { const d = new Date(ds + 'T00:00:00'); return (d.getMonth()+1) + '/' + d.getDate(); };

const getWeekDates = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  const mon = new Date(d);
  mon.setDate(d.getDate() + diff);
  return Array.from({ length: 5 }, function(_, i) {
    const dd = new Date(mon);
    dd.setDate(mon.getDate() + i);
    return localDateStr(dd);
  });
};

const getMonthInfo = (dateStr) => {
  const d = new Date(dateStr + 'T00:00:00');
  const year = d.getFullYear(), month = d.getMonth();
  const first = new Date(year, month, 1);
  const last  = new Date(year, month + 1, 0);
  return {
    year, month,
    days: last.getDate(),
    startWeekday: first.getDay(),
    firstDate: localDateStr(first),
    lastDate:  localDateStr(last),
  };
};

function FI({ label, field, form, set }) {
  function fmtInput(v) {
    var n = String(v||'').replace(/,/g,'');
    if (n==='' || n==='-') return n;
    var num = Number(n);
    if (isNaN(num)) return n;
    return num.toLocaleString('ko-KR');
  }
  function handleChange(e) {
    var raw = e.target.value.replace(/,/g,'');
    set(function(p) { var o = Object.assign({}, p); o[field] = raw; return o; });
  }
  return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #f1f5f9'}}>
      <span style={{fontSize:13,color:'#64748b',flexShrink:0,minWidth:110}}>{label}</span>
      <input
        className="fi"
        style={{width:140,textAlign:'right',padding:'4px 8px',fontSize:13,height:'auto'}}
        value={fmtInput(form[field])}
        placeholder="0"
        onChange={handleChange}
      />
    </div>
  );
}

          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:420}}>
            <div className="mh">
              <span className="mht">🔑 로그인 아이디 변경</span>
              <button className="mc" onClick={function(){setPhoneModal(false);}}>×</button>
            </div>
            <div className="mb">
              {phoneErr && <div className="al al-e">{phoneErr}</div>}
              <div style={{marginBottom:14,padding:'10px 12px',background:'#f8fafc',borderRadius:8,fontSize:12,color:'#64748b',lineHeight:1.7}}>
                <strong style={{color:'#1e293b'}}>{phoneTarget && phoneTarget.name}</strong> 님의 로그인 아이디를 변경합니다.<br/>
                전화번호는 그대로 유지되며, 변경 후 새 아이디로 로그인해야 합니다.
              </div>
              <div style={{marginBottom:10}}>
                <label className="fl">현재 아이디</label>
                <input className="fi" value={phoneTarget ? (phoneTarget.username || phoneTarget.phone || '') : ''} disabled
                  style={{background:'#f1f5f9',color:'#94a3b8',cursor:'not-allowed'}} />
              </div>
              <div style={{marginBottom:10}}>
                <label className="fl">새 아이디 *</label>
                <input className="fi" value={newPhone} placeholder="새 로그인 아이디 입력"
                  onChange={function(e){setNewPhone(e.target.value);}}
                  onKeyDown={function(e){if(e.key==='Enter')savePhone();}} />
              </div>
              <div style={{padding:'8px 10px',background:'#fffbeb',border:'1px solid #fcd34d',borderRadius:6,fontSize:11,color:'#92400e'}}>
                💡 아이디를 초기화(전화번호로 되돌리기)하려면 빈칸으로 저장하세요.
              </div>
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setPhoneModal(false);}}>취소</button>
              <button className="btn btn-p" onClick={savePhone} disabled={phoneSaving}>
                {phoneSaving ? '변경 중...' : '변경'}
              </button>
            </div>
          </div>
        </div>
      )}

      {smModal && (
        <div className="mbg" onClick={function(){setSmModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}} style={{maxWidth:400}}>
            <div className="mh"><span className="mht">{smEdit?'급여전용 인원 수정':'급여전용 인원 추가'}</span><button className="mc" onClick={function(){setSmModal(false);}}>×</button></div>
            <div className="mb">
              {smErr && <div className="al al-e">{smErr}</div>}
              <div style={{marginBottom:12}}><label className="fl">이름 *</label><input className="fi" value={smForm.name||''} onChange={function(e){setSmForm(function(p){return Object.assign({},p,{name:e.target.value});});}} /></div>
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">입사일</label><input className="fi" type="date" value={smForm.hire_date||''} onChange={function(e){setSmForm(function(p){return Object.assign({},p,{hire_date:e.target.value});});}} /></div>
                <div><label className="fl">퇴사일</label><input className="fi" type="date" value={smForm.leave_date||''} onChange={function(e){setSmForm(function(p){return Object.assign({},p,{leave_date:e.target.value});});}} /></div>
              </div>
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setSmModal(false);}}>취소</button>
              <button className="btn btn-p" onClick={saveSm} disabled={smSaving}>{smSaving?'저장 중...':'저장'}</button>
            </div>
          </div>
        </div>
      )}

      {modal && (
        <div className="mbg" onClick={function(){setModal(false);}}>
          <div className="mbox" onClick={function(e){e.stopPropagation();}}>
            <div className="mh"><span className="mht">{editU?'직원 정보 수정':'직원 등록'}</span><button className="mc" onClick={function(){setModal(false);}}>×</button></div>
            <div className="mb">
              {err && <div className="al al-e">{err}</div>}
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">이름 *</label><input className="fi" value={form.name||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{name:e.target.value});});}} /></div>
                <div><label className="fl">전화번호 *</label><input className="fi" value={form.phone||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{phone:e.target.value});});}} /></div>
              </div>
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">팀</label>
                  <select className="fi" value={form.team_id||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{team_id:e.target.value});});}}>
                    <option value="">선택</option>
                    {teams.map(function(t){return <option key={t.id} value={t.id}>{t.name}</option>;})}
                  </select>
                </div>
                <div><label className="fl">직책</label><input className="fi" value={form.position||''} placeholder="실장, 팀장 등" onChange={function(e){setForm(function(p){return Object.assign({},p,{position:e.target.value});});}} /></div>
              </div>
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">역할</label>
                  <select className="fi" value={form.role||'staff'} onChange={function(e){setForm(function(p){return Object.assign({},p,{role:e.target.value});});}}>
                    <option value="staff">팀원</option><option value="manager">팀장</option>
                    <option value="admin">관리자</option><option value="contractor">기술지원</option>
                  </select>
                </div>
                <div><label className="fl">이메일</label><input className="fi" type="email" value={form.email||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{email:e.target.value});});}} /></div>
              </div>
              <div className="g2" style={{marginBottom:12}}>
                <div><label className="fl">입사일</label><input className="fi" type="date" value={form.hire_date||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{hire_date:e.target.value});});}} /></div>
                <div><label className="fl">퇴사일</label><input className="fi" type="date" value={form.leave_date||''} onChange={function(e){setForm(function(p){return Object.assign({},p,{leave_date:e.target.value});});}} /></div>
              </div>
              {!editU && <div className="al al-i" style={{fontSize:12}}>초기 비밀번호는 전화번호로 설정됩니다.</div>}
            </div>
            <div className="mf">
              <button className="btn btn-s" onClick={function(){setModal(false);}}>취소</button>
              <button className="btn btn-p" onClick={save} disabled={saving}>{saving?'저장 중...':'저장'}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── 로그인 ────────────────────────────────────────────────────────────────

function LoginScreen({ onLogin }) {
  const [phone, setPhone] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const [locked, setLocked] = useState(false);
  const [remain, setRemain] = useState(0);

  // 잠금 상태 카운트다운
  useEffect(function() {
    const bf = Sysbar.Auth.checkBruteForce();
    if (bf.locked) { setLocked(true); setRemain(bf.remainSec); }
    const timer = setInterval(function() {
      const bf2 = Sysbar.Auth.checkBruteForce();
      if (bf2.locked) { setLocked(true); setRemain(bf2.remainSec); }
      else { setLocked(false); setRemain(0); }
    }, 1000);
    return function() { clearInterval(timer); };
  }, []);

  async function doLogin() {
    if (locked) return;
    if (!phone.trim()||!pw) { setErr('아이디와 비밀번호를 입력하세요.'); return; }
    setLoading(true); setErr('');
    // allowedRoles: contractor만 차단 (팀 권한은 hasAccess로 판단)
    const result = await Sysbar.Auth.doLogin(sb, phone, pw, {
        allowedRoles: ['admin', 'manager', 'staff', 'employee'],
      });
    setLoading(false);
    if (result.ok) {
      onLogin(result.user);
    } else {
      if (result.locked) { setLocked(true); setRemain(result.remainSec); }
      setErr(result.reason);
    }
  }

  return (
    <div className="lwrap">
      <div className="lbox">
        <div className="llogo">🏢</div>
        <div className="ltit">{APP_CONFIG.COMPANY_SHORT}</div>
        <div className="lsub">관리포털 · 관리팀/관리자 전용</div>
        {err && <div className="al al-e">{err}</div>}
        <div style={{marginBottom:12}}>
          <label className="fl">아이디 (전화번호)</label>
          <input className="fi" value={phone} placeholder="전화번호 입력" disabled={locked}
            onChange={function(e){setPhone(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')document.getElementById('ap-pw').focus();}} />
        </div>
        <div style={{marginBottom:20}}>
          <label className="fl">비밀번호</label>
          <input id="ap-pw" type="password" className="fi" value={pw} placeholder="비밀번호 입력" disabled={locked}
            onChange={function(e){setPw(e.target.value);}}
            onKeyDown={function(e){if(e.key==='Enter')doLogin();}} />
        </div>
        <button className="btn btn-p" onClick={doLogin} disabled={loading || locked} style={{width:'100%',justifyContent:'center',padding:'12px'}}>
          {locked ? `잠금 ${remain}초` : (loading ? '로그인 중...' : '로그인')}
        </button>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
const SysBar = Sysbar.createComponent(React);


const CURRENT_PAGE = 'st';
const PageView = StaffView;

// ── 관리포털 페이지 정의 (네비게이션) ──────────────────────────────────────
// 각 페이지 파일은 상단에서 CURRENT_PAGE 를 지정한다.
//   admin-worklog.html  → 'wl'
//   admin-perf.html     → 'pf'
//   admin-salary.html   → 'sl'
//   admin-account.html  → 'ab'
//   admin-staff.html    → 'st'
const PORTAL_PAGES = [
  { key:'wl', label:'📝 업무일지', href:'admin-worklog.html', need:'access' },
  { key:'pf', label:'📊 실적관리', href:'admin-perf.html',    need:'access' },
  { key:'sl', label:'💼 급여관리', href:'admin-salary.html',  need:'sal'    },
  { key:'ab', label:'🔑 계정관리', href:'admin-account.html', need:'ab'     },
  { key:'st', label:'👥 직원관리', href:'admin-staff.html',   need:'access' },
];

function App() {
  var initialUser = (function() {
    var v = Sysbar.Auth.getSession();
    if (v && v.id && v.role) return v;
    return null;
  })();
  const [user, setUser] = useState(initialUser);
  const [ssoChecked, setSsoChecked] = useState(!!initialUser);
  const [teamName, setTeamName] = useState('');
  const [hasAccess, setHasAccess] = useState(false);
  const [accessChecked, setAccessChecked] = useState(false);

  useEffect(function() {
    if (initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { setUser(null); return; }
    setSsoChecked(true);
  }, []);

  useEffect(function() {
    if (!initialUser) return;
    var wasInvalidated = Sysbar.SessionManager.checkOnLoad();
    if (wasInvalidated) { logout(); return; }
    if (ssoChecked) { Sysbar.SessionManager.onLogin(function() { logout(); }); }
  }, []);

  useEffect(function() {
    if (!user) return;
    if (user.role === 'admin') { setTeamName('관리자'); setHasAccess(true); setAccessChecked(true); return; }
    if (!user.team_id) { setHasAccess(false); setAccessChecked(true); return; }
    sb.from('teams').select('name').eq('id', user.team_id).single().then(function(r) {
      var name = r.data ? r.data.name : '';
      setTeamName(name);
      setHasAccess(name === '관리팀');
      setAccessChecked(true);
    });
  }, [user ? user.id : null]);

  function handleLogin(u) {
    setUser(u);
    Sysbar.SessionManager.onLogin(function() { logout(); });
  }

  function logout() {
    Sysbar.Auth.logout(sb);
    setUser(null); setTeamName(''); setHasAccess(false);
  }

  if (!ssoChecked || (user && !accessChecked)) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',background:'var(--theme,#0f172a)',color:'#94a3b8',fontSize:14}}>
      로딩 중...
    </div>
  );

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  if (user.role !== 'admin' && !hasAccess) return (
    <div className="lwrap">
      <div className="lbox" style={{textAlign:'center'}}>
        <div style={{fontSize:48,marginBottom:16}}>🚫</div>
        <div className="ltit" style={{marginBottom:8}}>접근 권한 없음</div>
        <p style={{fontSize:13,color:'#64748b',lineHeight:1.6,marginBottom:24}}>관리포털은 관리팀 및 관리자만<br/>이용할 수 있습니다.</p>
        <a href="project.html" className="btn btn-s" style={{justifyContent:'center'}}>공정관리로 돌아가기</a>
      </div>
    </div>
  );

  var canSal = user.role === 'admin';
  var canAb  = user.role === 'admin' || teamName === '관리팀';

  // 현재 페이지가 권한이 없는 페이지면 업무일지로 리다이렉트
  if (CURRENT_PAGE === 'sl' && !canSal) { location.replace('admin-worklog.html'); return null; }
  if (CURRENT_PAGE === 'ab' && !canAb)  { location.replace('admin-worklog.html'); return null; }

  function canShow(need) {
    if (need === 'sal') return canSal;
    if (need === 'ab')  return canAb;
    return true;
  }

  return (
    <div>
      <SysBar
        activeKey="admin"
        user={user}
        teamName={teamName}
        onLogout={logout}
      />
      {/* 시스템 제목 바 */}
      <div style={{background:'var(--theme,#0f172a)',padding:'6px 18px 8px',flexShrink:0,borderBottom:'2px solid #7c3aed',position:'sticky',top:38,zIndex:250}}>
        <p style={{margin:0,fontSize:9,lineHeight:'1.2',color:'#475569',letterSpacing:1,textTransform:'uppercase',fontWeight:600}}>{APP_CONFIG.COMPANY_EN}</p>
        <p style={{margin:0,fontSize:14,lineHeight:'1.3',fontWeight:800,color:'white',letterSpacing:-0.3}}>관리 포털</p>
      </div>
      <div className="top-nav">
        {PORTAL_PAGES.filter(function(pg){ return canShow(pg.need); }).map(function(pg) {
          return (
            <button key={pg.key}
              className={CURRENT_PAGE===pg.key?'nav-btn active':'nav-btn'}
              onClick={function(){ if (CURRENT_PAGE!==pg.key) location.href = pg.href; }}>
              {pg.label}
            </button>
          );
        })}
      </div>
      <PageView user={user} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
