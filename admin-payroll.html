<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#f8fafc;color:#0f172a;font-size:14px;overflow-x:hidden;}

.tc{text-align:center;white-space:nowrap;}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}

.ba{background:#fef3c7;color:#92400e;}

  .page{padding:12px;}
  .g2{grid-template-columns:1fr;}

}
.lwrap{min-height:100vh;background:linear-gradient(135deg,var(--theme,#0f172a) 0%,#1e1b4b 50%,#4c1d95 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
.lbox{background:#fff;border-radius:20px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 32px 80px rgba(0,0,0,.5);}

.ltit{font-size:18px;font-weight:800;color:#0f172a;text-align:center;margin-bottom:4px;}
.lsub{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:24px;}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Supabase 클라이언트는 최초 사용 시점에 함수 안에서 생성한다.
var _sb = null;
function getSb() {
  if (!_sb) _sb = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
  return _sb;
}

// ── 설정 (화이트라벨: config.js 의 PAYROLL) ─────────────────────────────
var PCFG = (window.APP_CONFIG && APP_CONFIG.PAYROLL) || {};
var PAY_DAY = PCFG.PAY_DAY || 9;
var PAY_MONTH_OFFSET = (PCFG.PAY_MONTH_OFFSET == null) ? 1 : PCFG.PAY_MONTH_OFFSET;
var TYPE_LABELS = PCFG.TYPE_LABELS || { pay:'지급용', report:'신고용' };
var REF_REPORT_ITEM = PCFG.REF_REPORT_ITEM || '';
var REF_OVERTIME_ITEM = PCFG.REF_OVERTIME_ITEM || '';
var ALLOWANCE_EVENT_TYPES = PCFG.ALLOWANCE_EVENT_TYPES || (window.APP_CONFIG && APP_CONFIG.ALLOWANCE_EVENT_TYPES) || ['보고회','위원회'];
var ADMIN_TEAM = (window.APP_CONFIG && APP_CONFIG.ADMIN_TEAM_NAME) || '';

// ── 날짜·금액 헬퍼 (toISOString 날짜 변환 금지 — 로컬 기준) ─────────────
function pad2(n) { return String(n).padStart(2, '0'); }
function localDateStr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function today() { return localDateStr(new Date()); }
function periodOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }
function shiftPeriod(p, n) {
  var y = parseInt(p.slice(0, 4), 10), m = parseInt(p.slice(5, 7), 10);
  return periodOf(new Date(y, m - 1 + n, 1));
}
function defaultPeriod() {
  var d = new Date();
  var p = periodOf(d);
  // 다음 달 지급 구조면, 지급일 전까지는 전월 급여를 작업 중인 것으로 본다.
  return (PAY_MONTH_OFFSET > 0 && d.getDate() <= PAY_DAY) ? shiftPeriod(p, -1) : p;
}
function defaultPayDate(p) {
  var y = parseInt(p.slice(0, 4), 10), m = parseInt(p.slice(5, 7), 10);
  var first = new Date(y, m - 1 + PAY_MONTH_OFFSET, 1);
  var last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return localDateStr(new Date(first.getFullYear(), first.getMonth(), Math.min(PAY_DAY, last)));
}
function fmtPeriodKo(p) { return p.slice(0, 4) + '년 ' + parseInt(p.slice(5, 7), 10) + '월'; }
function fmtDateTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  return localDateStr(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function won(n) { return (Number(n) || 0).toLocaleString('ko-KR'); }
function amt(v) { var n = parseInt(v, 10); return isNaN(n) ? 0 : n; }
function cleanAmt(raw) {
  var s = String(raw || '').trim();
  var neg = s.charAt(0) === '-';
  var dg = s.replace(/[^0-9]/g, '').replace(/^0+(?=\d)/, '');
  return (neg ? '-' : '') + dg;
}
function showAmt(v) {
  if (v === '' || v == null) return '';
  if (v === '-') return '-';
  return amt(v).toLocaleString('ko-KR');
}
function fmtDur(min) {
  var h = Math.floor(min / 60), m = min % 60;
  if (h > 0 && m > 0) return h + '시간 ' + m + '분';
  if (h > 0) return h + '시간';
  return m + '분';
}
function parseMinutes(t) {
  if (!t || t.indexOf(':') === -1) return null;
  var parts = t.split(':');
  var h = parseInt(parts[0], 10), m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return null;
  return h * 60 + m;
}
function useIsMobile() {
  const [m, setM] = useState(window.innerWidth <= ((window.APP_CONFIG && APP_CONFIG.MOBILE_MAX_WIDTH) || 768));
  useEffect(function() {
    function onR() { setM(window.innerWidth <= ((window.APP_CONFIG && APP_CONFIG.MOBILE_MAX_WIDTH) || 768)); }
    window.addEventListener('resize', onR);
    return function() { window.removeEventListener('resize', onR); };
  }, []);
  return m;
}

// ── 월별수당 집계 (구 admin-salary.html AllowanceView 로직 이전) ─────────
// 참석 = 해당 프로젝트 PM 기준, 초과근무 = 업무일지 overtime_start~end 합계
function loadAllowance(period) {
  var sb = getSb();
  var y = parseInt(period.slice(0, 4), 10), mo = parseInt(period.slice(5, 7), 10);
  var start = localDateStr(new Date(y, mo - 1, 1));
  var end = localDateStr(new Date(y, mo, 0));
  return Promise.all([
    sb.from('users').select('id,name,team_id').neq('role', 'contractor').order('name'),
    sb.from('teams').select('id,name'),
    sb.from('projects').select('id,pm_id'),
    sb.from('project_events').select('id,type,event_date,project_id')
      .in('type', ALLOWANCE_EVENT_TYPES).gte('event_date', start).lte('event_date', end),
    sb.from('work_logs').select('user_id,log_date,overtime,overtime_start,overtime_end')
      .eq('overtime', true).gte('log_date', start).lte('log_date', end),
  ]).then(function(res) {
    var pmMap = {};
    (res[2].data || []).forEach(function(p) { pmMap[p.id] = p.pm_id; });
    var att = {};
    (res[3].data || []).forEach(function(e) {
      var pm = pmMap[e.project_id];
      if (!pm) return;
      if (!att[pm]) att[pm] = {};
      att[pm][e.type] = (att[pm][e.type] || 0) + 1;
    });
    var ot = {};
    (res[4].data || []).forEach(function(l) {
      var s = parseMinutes(l.overtime_start), en = parseMinutes(l.overtime_end);
      if (s === null || en === null || en <= s) return;
      if (!ot[l.user_id]) ot[l.user_id] = { days: 0, minutes: 0 };
      ot[l.user_id].days += 1;
      ot[l.user_id].minutes += (en - s);
    });
    return { users: res[0].data || [], teams: res[1].data || [], att: att, ot: ot };
  });
}
function attText(a, sep) {
  if (!a) return '';
  return ALLOWANCE_EVENT_TYPES.filter(function(tp) { return a[tp]; })
    .map(function(tp) { return tp + ' ' + a[tp] + '회'; }).join(sep || ', ');
}

// ── 대상자 표시 정보 (계정 연결 → users, 계정 없음 → payroll_employees) ─────
function personOf(emp, usersMap) {
  if (emp.user_id) {
    var u = usersMap[emp.user_id] || {};
    return { name: u.name || '(계정 없음)', birth_date: u.birth_date || null, hire_date: u.hire_date || null, linked: true, user: u };
  }
  return { name: emp.name || '', birth_date: emp.birth_date || null, hire_date: emp.hire_date || null, linked: false, user: null };
}
function sortEmployees(list, usersMap) {
  return list.slice().sort(function(a, b) {
    if ((a.sort_order || 0) !== (b.sort_order || 0)) return (a.sort_order || 0) - (b.sort_order || 0);
    return personOf(a, usersMap).name.localeCompare(personOf(b, usersMap).name, 'ko');
  });
}
function sortItems(items) {
  return items.slice().sort(function(a, b) {
    if (a.kind !== b.kind) return a.kind === 'earning' ? -1 : 1;
    return (a.sort_order || 0) - (b.sort_order || 0);
  });
}

// ── 명세서 모델 (payslip-render.js 입력) ─────────────────────────────
function lineMethod(cell, item) {
  var m = cell && cell.m ? String(cell.m).trim() : '';
  if (m) return m;
  return (cell && amt(cell.v) !== 0 && item.default_method) ? item.default_method : '';
}
function buildModel(opts) {
  // opts: { period, runType, payDate, person:{name,birth_date,hire_date}, emp, cols, cellsRow, slip }
  var earnings = [], deductions = [], te = 0, td = 0;
  opts.cols.forEach(function(it) {
    var c = opts.cellsRow[it.id];
    var a = c ? amt(c.v) : 0;
    if (a === 0) return;
    var row = { name: (opts.locked && c && c.n) || it.name, amount: a, method: lineMethod(c, it) };
    if (it.kind === 'earning') { earnings.push(row); te += a; } else { deductions.push(row); td += a; }
  });
  var s = opts.slip;
  var useSnap = !!(s && opts.locked);
  return {
    period: opts.period, runType: opts.runType, payDate: opts.payDate,
    name: useSnap ? s.name_snap : opts.person.name,
    birthDate: useSnap ? s.birth_date_snap : opts.person.birth_date,
    hireDate: useSnap ? s.hire_date_snap : opts.person.hire_date,
    dept: useSnap ? s.dept_snap : opts.emp.dept_label,
    position: useSnap ? s.position_snap : opts.emp.position_label,
    employeeNo: useSnap ? s.employee_no_snap : opts.emp.employee_no,
    earnings: earnings, deductions: deductions,
    totalEarning: te, totalDeduction: td, netPay: te - td,
  };
}
function rowTotals(cols, cellsRow) {
  var te = 0, td = 0;
  cols.forEach(function(it) {
    var c = cellsRow[it.id];
    var a = c ? amt(c.v) : 0;
    if (it.kind === 'earning') te += a; else td += a;
  });
  return { te: te, td: td, net: te - td };
}

// 오류 전달용: then 체인 안에서 throw 하고 마지막 catch 에서 Sysbar.showError 로 알린다.
function must(label, opts) {
  return function(res) {
    if (!res || res.error) throw { ctx: label, err: (res && res.error) || { message: 'no response' } };
    if (opts && opts.expectRows) {
      var d = res.data, n = d == null ? 0 : (d.length == null ? 1 : d.length);
      if (n === 0) throw { ctx: label, err: { code: '42501', message: APP_CONFIG.ERROR_NO_ROWS || '변경되지 않았습니다.' } };
    }
    return res;
  };
}
function reportErr(e) {
  if (e && e.ctx) Sysbar.showError(e.err, e.ctx);
  else Sysbar.showError(e, '급여관리');
}

// ── 알림 메일 (5단계) ─────────────────────────────────────────────
// 자동 발송(서버 예약 작업)은 config.js 를 읽을 수 없으므로, 급여 화면이 열릴 때
// config.js 값을 payroll_mail_settings 로 복사해 둔다. 기준은 항상 config.js 다.
var MAIL_FIELDS = [
  { k: 'from_name',    label: '발신자 이름' },
  { k: 'from_address', label: '발신 주소' },
  { k: 'reply_to',     label: '회신 주소' },
  { k: 'site_url',     label: '사이트 주소' },
  { k: 'slip_page',    label: '명세서 화면' },
  { k: 'auto_send',    label: '자동 발송' },
  { k: 'leaver_view_months', label: '퇴사자 명세서 열람(개월)' },
  { k: 'slip_verify_max_fails', label: '명세서 확인 잠금 횟수' },
  { k: 'slip_verify_lock_minutes', label: '명세서 확인 잠금 시간(분)' },
  { k: 'slip_verify_unlock_minutes', label: '명세서 확인 유지 시간(분)' },
];
var MAIL_EMAIL_RE = /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/;
var MAIL_FN = 'payroll-mail';
// 자동 발송(지급일 09:00) 사용 여부. false 면 관리자가 [알림 메일 발송]을 눌러야만 발송된다.
// 서버도 같은 값(payroll_mail_settings.auto_send)을 보고 자동 발송을 막는다.
var MAIL_AUTO_SEND = PCFG.AUTO_SEND === true;
// 동기화 변경 내역 표시용 (true/false 는 켜짐/꺼짐으로)
function mailFieldText(v) {
  if (v === true) return '켜짐';
  if (v === false) return '꺼짐';
  return v == null ? '' : String(v);
}

function mailConfig() {
  var C = window.APP_CONFIG || {};
  var company = (C.COMPANY_SHORT || '').trim();
  return {
    from_name: (PCFG.MAIL_FROM_NAME || '').trim() || (company ? company + ' 급여' : ''),
    from_address: (PCFG.MAIL_FROM_ADDRESS || '').trim(),
    reply_to: (C.EMAIL_CONTRACT || '').trim() || null,
    // 이 화면이 열린 주소의 폴더 = 명세서 화면이 있는 곳
    site_url: window.location.href.split(/[?#]/)[0].replace(/[^/]*$/, '').replace(/\/+$/, ''),
    slip_page: PCFG.SLIP_PAGE || 'payslip.html',
    auto_send: MAIL_AUTO_SEND,
    // 퇴사일 이후 본인 명세서 열람 허용 개월 수 — DB 함수 payroll_my_employee_ids 가 이 값을 쓴다
    leaver_view_months: (PCFG.LEAVER_VIEW_MONTHS == null) ? 3 : PCFG.LEAVER_VIEW_MONTHS,
    // 급여명세서 생년월일 확인 — DB 함수 payslip_verify / payslip_is_unlocked 가 이 값을 쓴다
    slip_verify_max_fails: (PCFG.SLIP_VERIFY_MAX_FAILS == null) ? 5 : PCFG.SLIP_VERIFY_MAX_FAILS,
    slip_verify_lock_minutes: (PCFG.SLIP_VERIFY_LOCK_MINUTES == null) ? 10 : PCFG.SLIP_VERIFY_LOCK_MINUTES,
    slip_verify_unlock_minutes: (PCFG.SLIP_VERIFY_UNLOCK_MINUTES == null) ? 10 : PCFG.SLIP_VERIFY_UNLOCK_MINUTES,
  };
}

// 반환: { row, changes:[{label,before,after}], created, problems:[], synced }
function syncMailSettings(userId) {
  var cfg = mailConfig();
  var sb = getSb();
  return sb.from('payroll_mail_settings').select('*').eq('id', 1).maybeSingle().then(must('메일 설정 조회')).then(function(r) {
    var cur = r.data || null;
    var problems = [];
    if (!cfg.from_name) problems.push('발신자 이름이 비어 있습니다 (config.js COMPANY_SHORT).');
    if (!MAIL_EMAIL_RE.test(cfg.from_address)) problems.push('발신 주소가 올바르지 않습니다 (config.js PAYROLL.MAIL_FROM_ADDRESS).');
    if (cfg.reply_to && !MAIL_EMAIL_RE.test(cfg.reply_to)) problems.push('회신 주소가 올바르지 않습니다 (config.js EMAIL_CONTRACT).');
    if (!(Number.isInteger(cfg.leaver_view_months) && cfg.leaver_view_months >= 0 && cfg.leaver_view_months <= 120))
      problems.push('퇴사자 명세서 열람 개월 수는 0~120 정수여야 합니다 (config.js PAYROLL.LEAVER_VIEW_MONTHS).');
    [['slip_verify_max_fails', 1, 20, 'SLIP_VERIFY_MAX_FAILS'], ['slip_verify_lock_minutes', 1, 1440, 'SLIP_VERIFY_LOCK_MINUTES'],
     ['slip_verify_unlock_minutes', 1, 240, 'SLIP_VERIFY_UNLOCK_MINUTES']].forEach(function(x) {
      var v = cfg[x[0]];
      if (!(Number.isInteger(v) && v >= x[1] && v <= x[2])) problems.push('명세서 확인 설정은 ' + x[1] + '~' + x[2] + ' 정수여야 합니다 (config.js PAYROLL.' + x[3] + ').');
    });
    if (!/^https:\/\//.test(cfg.site_url)) problems.push('https 주소로 연 화면이 아니라 동기화하지 않았습니다 (로컬 실행 등).');
    if (problems.length) return { row: cur, changes: [], created: false, problems: problems, synced: false };
    var changes = [];
    if (cur) MAIL_FIELDS.forEach(function(f) {
      var before = mailFieldText(cur[f.k]), after = mailFieldText(cfg[f.k]);
      if (before !== after) changes.push({ label: f.label, before: before, after: after });
    });
    var payload = Object.assign({ id: 1, synced_at: new Date().toISOString(), synced_by: userId || null }, cfg);
    var q = cur ? sb.from('payroll_mail_settings').update(payload).eq('id', 1).select()
                : sb.from('payroll_mail_settings').insert(payload).select();
    return q.then(must('메일 설정 동기화', { expectRows: true })).then(function(w) {
      return { row: w.data[0], changes: changes, created: !cur, problems: [], synced: true };
    });
  });
}

function maskEmail(e) {
  var at = (e || '').indexOf('@');
  if (at < 1) return '-';
  return e.slice(0, Math.min(2, at)) + '***' + e.slice(at);
}
function payDateKo(d) {
  return d ? d.slice(0, 4) + '년 ' + parseInt(d.slice(5, 7), 10) + '월 ' + parseInt(d.slice(8, 10), 10) + '일' : '';
}
// 지급일 09:00 KST = 지급일 00:00 UTC (서버 예약 작업 기준과 동일)
function autoSendCutoff(payDate) { return payDate ? new Date(payDate + 'T00:00:00Z').getTime() : null; }

// 자동 발송 안내 문구 { t: 'i'|'w', s }
function autoSendInfo(run) {
  // 자동 발송 꺼짐(기본): 관리자 수동 발송만
  if (!MAIL_AUTO_SEND) {
    return run.status !== 'confirmed'
      ? { t: 'i', s: '확정 후 [알림 메일 발송] 버튼을 눌러야 직원에게 메일이 갑니다.' }
      : { t: 'i', s: '[알림 메일 발송] 버튼을 눌러야 직원에게 메일이 갑니다. 자동으로는 발송되지 않습니다.' };
  }
  var cutoff = autoSendCutoff(run.pay_date);
  if (!cutoff) return { t: 'w', s: '지급일이 없어 자동 발송되지 않습니다.' };
  var when = payDateKo(run.pay_date) + ' 오전 9시';
  if (run.status !== 'confirmed') {
    return Date.now() < cutoff
      ? { t: 'i', s: '확정하면 ' + when + '에 자동 발송됩니다.' }
      : { t: 'w', s: '지급일 오전 9시가 지나 확정해도 자동 발송되지 않습니다. 확정 후 [알림 메일 발송] 버튼으로 보내세요.' };
  }
  if (new Date(run.confirmed_at).getTime() >= cutoff) {
    return { t: 'w', s: '지급일 오전 9시 이후에 확정되어 자동 발송 대상이 아닙니다. [알림 메일 발송] 버튼으로 보내세요.' };
  }
  return Date.now() < cutoff
    ? { t: 'i', s: when + '에 미발송 대상자에게 자동 발송됩니다.' }
    : { t: 'i', s: when + ' 자동 발송 시각이 지났습니다. 결과는 아래 표에서 확인하고, 실패·미발송자는 버튼으로 보내세요.' };
}

// 대상자별 발송 상태. 서버(payroll-mail)의 대상 판정과 같은 규칙.
//   nolink 계정 없음 · contractor 용역직 · noemail 이메일 없음 → 대상 아님
//   sent 현재 확정본 발송됨 · old 이전 확정본만 발송됨(수정본 대상) · failed 실패 · pending 미발송
function mailRecipients(run, empIds, empMap, usersMap, logs) {
  return empIds.map(function(id) {
    var emp = empMap[id] || {};
    var u = emp.user_id ? usersMap[emp.user_id] : null;
    var email = (emp.notify_email || '').trim();
    var mine = logs.filter(function(l) { return l.employee_id === id; });
    var sent = mine.filter(function(l) { return l.status === 'sent'; });
    var last = mine.length ? mine[mine.length - 1] : null;
    var st;
    if (!u) st = 'nolink';
    else if (u.role === 'contractor') st = 'contractor';
    else if (!MAIL_EMAIL_RE.test(email)) st = 'noemail';
    else if (sent.length) st = sent.some(function(l) { return l.revision >= run.revision; }) ? 'sent' : 'old';
    else st = (last && last.status === 'failed') ? 'failed' : 'pending';
    return { id: id, name: personOf(emp, usersMap).name, masked: maskEmail(email), st: st, last: last,
             lastSent: sent.length ? sent[sent.length - 1] : null };
  });
}

// ── 저장 (작성중 묶음만) ───────────────────────────────────────────
// 묶음 확보 → 제외 대상 명세서 삭제 → 대상자별 명세서 upsert → 항목 upsert → 빠진 항목 삭제
function persistRun(ctx) {
  var sb = getSb();
  var nowIso = new Date().toISOString();
  var runP = ctx.run
    ? sb.from('payroll_runs').update({ pay_date: ctx.payDate || null, updated_at: nowIso }).eq('id', ctx.run.id).select().then(must('급여 묶음 저장', { expectRows: true }))
    : sb.from('payroll_runs').insert({ period: ctx.period, run_type: ctx.runType, pay_date: ctx.payDate || null }).select().then(must('급여 묶음 생성', { expectRows: true }));
  return runP.then(function(res) {
    var run = res.data[0];
    if (run.status !== 'draft') throw { ctx: '저장', err: { message: '확정된 묶음은 수정할 수 없습니다. 확정 취소 후 수정하세요.' } };
    var p = Promise.resolve();
    var delIds = Object.keys(ctx.excluded).filter(function(id) { return ctx.excluded[id] && ctx.slipByEmp[id]; })
      .map(function(id) { return ctx.slipByEmp[id].id; });
    if (delIds.length) {
      p = p.then(function() { return sb.from('payroll_slips').delete().in('id', delIds).select('id').then(must('제외 대상 명세서 삭제')); });
    }
    ctx.rows.forEach(function(empId) {
      if (ctx.excluded[empId]) return;
      p = p.then(function() { return saveOneSlip(sb, ctx, run, empId, nowIso); });
    });
    return p.then(function() { return run; });
  });
}
function saveOneSlip(sb, ctx, run, empId, nowIso) {
  var emp = ctx.empMap[empId];
  var per = personOf(emp, ctx.usersMap);
  var cellsRow = ctx.cells[empId] || {};
  var t = rowTotals(ctx.cols, cellsRow);
  var slipPayload = {
    run_id: run.id, employee_id: empId,
    name_snap: per.name, birth_date_snap: per.birth_date, hire_date_snap: per.hire_date,
    dept_snap: emp.dept_label || null, position_snap: emp.position_label || null, employee_no_snap: emp.employee_no || null,
    total_earning: t.te, total_deduction: t.td, net_pay: t.net, updated_at: nowIso,
  };
  var who = per.name || '대상자';
  return sb.from('payroll_slips').upsert(slipPayload, { onConflict: 'run_id,employee_id' }).select('id')
    .then(must(who + ' 명세서 저장', { expectRows: true }))
    .then(function(res) {
      var slipId = res.data[0].id;
      var lines = [];
      ctx.cols.forEach(function(it) {
        var c = cellsRow[it.id];
        var a = c ? amt(c.v) : 0;
        var m = c && c.m ? String(c.m).trim() : '';
        if (a === 0 && !m) return;
        lines.push({ slip_id: slipId, item_id: it.id, item_name: it.name, item_kind: it.kind,
                     sort_order: it.sort_order || 0, amount: a, method: lineMethod(c, it) || null });
      });
      var keep = lines.map(function(l) { return l.item_id; });
      var up = lines.length
        ? sb.from('payroll_slip_lines').upsert(lines, { onConflict: 'slip_id,item_id' }).select('id').then(must(who + ' 항목 저장'))
        : Promise.resolve();
      return up.then(function() {
        var q = sb.from('payroll_slip_lines').delete().eq('slip_id', slipId);
        if (keep.length) q = q.not('item_id', 'in', '(' + keep.join(',') + ')');
        return q.then(must(who + ' 빠진 항목 정리'));
      });
    });
}

// ── 산출방법 입력 모달 ────────────────────────────────────────────
function MethodModal({ title, cols, cellsRow, locked, onSave, onClose }) {
  var init = {};
  cols.forEach(function(it) { var c = cellsRow[it.id]; init[it.id] = c && c.m ? c.m : ''; });
  const [draft, setDraft] = useState(init);
  var targets = cols.filter(function(it) {
    var c = cellsRow[it.id];
    return (c && amt(c.v) !== 0) || (draft[it.id] && draft[it.id].trim());
  });
  return (
    <div className="mbg" onClick={onClose}>
      <div className="mbox" onClick={function(e){ e.stopPropagation(); }}>
        <div className="mh"><span className="mht">산출방법 · {title}</span><button className="mc" onClick={onClose}>×</button></div>
        <div className="mb">
          <div className="al al-i">금액이 입력된 항목만 표시됩니다. 비워 두면 항목의 기본 산출방법이 쓰입니다(설정 탭).</div>
          {targets.length === 0 && <div className="loading">금액이 입력된 항목이 없습니다.</div>}
          {targets.map(function(it) {
            return (
              <div key={it.id} style={{ marginBottom: 10 }}>
                <label className="fl">{it.name} <span className="pr-sub">{won(amt((cellsRow[it.id] || {}).v))}원</span></label>
                <input className="fi" value={draft[it.id] || ''} disabled={locked}
                  placeholder={it.default_method || '예) 시간 × 단가'}
                  onChange={function(e){ var v = e.target.value; setDraft(function(p){ var n = Object.assign({}, p); n[it.id] = v; return n; }); }} />
              </div>
            );
          })}
        </div>
        <div className="mf">
          <button className="btn btn-s" onClick={onClose}>닫기</button>
          {!locked && <button className="btn btn-p" onClick={function(){ onSave(draft); }}>적용</button>}
        </div>
      </div>
    </div>
  );
}

// ── 확정 취소 경고 모달 ───────────────────────────────────────────

// ── 알림 메일: 테스트 발송 모달 (정확히 1명, 발송 기록 없음) ─────────────
function MailTestModal({ run, recips, onClose }) {
  const [sel, setSel] = useState('');
  const [ok, setOk] = useState(false);
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  var cands = recips.filter(function(r) { return r.st !== 'nolink' && r.st !== 'contractor' && r.st !== 'noemail'; });
  var cur = cands.filter(function(r) { return r.id === sel; })[0] || null;

  function send() {
    if (!cur || !ok || busy) return;
    setBusy(true); setRes(null);
    Sysbar.invokeAuthed(getSb(), MAIL_FN, { mode: 'test', run_id: run.id, employee_id: cur.id }).then(function(r) {
      setBusy(false);
      var d = r && r.data;
      var err = (d && d.error) || (r && r.error && r.error.message);
      if (err || !d || !d.ok) { setRes({ t: 'e', s: '테스트 발송 실패: ' + (err || '응답 없음') }); return; }
      setRes({ t: 's', s: d.email_masked + ' 로 테스트 메일 1통을 보냈습니다. 받은편지함(없으면 스팸함)을 확인하세요.' });
    });
  }

  return (
    <div className="mbg" onClick={onClose}>
      <div className="mbox" onClick={function(e){ e.stopPropagation(); }} style={{ maxWidth: 460 }}>
        <div className="mh"><span className="mht">🧪 알림 메일 테스트 발송</span><button className="mc" onClick={onClose}>×</button></div>
        <div className="mb">
          <div className="al al-i">
            고른 <b>1명</b>에게만 제목에 [테스트]가 붙은 메일을 보냅니다. 발송 기록에 남지 않아 실제 발송(자동·수동)에는 영향이 없습니다.
            {run.status !== 'confirmed' && <span><br/>작성중 명세서라 메일 링크로 들어가면 명세서가 보이지 않는 것이 정상입니다.</span>}
          </div>
          <label className="fl">받는 사람</label>
          <select className="fi" value={sel} disabled={busy} onChange={function(e){ setSel(e.target.value); setOk(false); setRes(null); }}>
            <option value="">선택...</option>
            {cands.map(function(r) { return <option key={r.id} value={r.id}>{r.name}</option>; })}
          </select>
          {cur && (
            <div style={{ marginTop: 12, fontSize: 13 }}>
              받는 주소: <b>{cur.masked}</b>
              <label style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 8, fontSize: 12, color: '#475569', cursor: 'pointer' }}>
                <input type="checkbox" checked={ok} disabled={busy} onChange={function(e){ setOk(e.target.checked); }} />
                받는 주소가 맞습니다
              </label>
            </div>
          )}
          {res && <div className={'al ' + (res.t === 'e' ? 'al-e' : 'al-s')} style={{ marginTop: 12, marginBottom: 0 }}>{res.s}</div>}
        </div>
        <div className="mf">
          <button className="btn btn-s" onClick={onClose}>닫기</button>
          <button className="btn btn-p" disabled={!cur || !ok || busy} onClick={send}>{busy ? '보내는 중...' : '테스트 1통 보내기'}</button>
        </div>
      </div>
    </div>
  );
}

// ── 알림 메일 패널 (지급용 묶음) ──────────────────────────────────
function MailPanel({ run, empIds, empMap, usersMap, onSentCount }) {
  const [logs, setLogs] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const [testOpen, setTestOpen] = useState(false);

  function loadLogs() {
    return getSb().from('payroll_mail_logs').select('employee_id,status,revision,kind,error,sent_at')
      .eq('run_id', run.id).order('sent_at', { ascending: true })
      .then(must('발송 이력 조회'))
      .then(function(r) {
        var list = r.data || [];
        setLogs(list);
        var s = {}; list.forEach(function(l) { if (l.status === 'sent') s[l.employee_id] = true; });
        if (onSentCount) onSentCount(Object.keys(s).length);
      })
      .catch(function(e) { reportErr(e); setLogs([]); });
  }
  useEffect(function() { loadLogs(); }, [run.id, run.revision, run.status]);

  if (!logs) return <div className="card"><div className="loading">알림 메일 상태 불러오는 중...</div></div>;

  var confirmed = run.status === 'confirmed';
  var recips = mailRecipients(run, empIds, empMap, usersMap, logs);
  var cnt = function(st) { return recips.filter(function(r) { return r.st === st; }).length; };
  var pendingN = cnt('pending') + cnt('failed');
  var oldN = cnt('old');
  var outN = cnt('nolink') + cnt('contractor') + cnt('noemail');
  var info = autoSendInfo(run);

  function send(revised) {
    var n = revised ? oldN : pendingN;
    var what = revised ? '수정된 명세서 안내 메일' : '알림 메일';
    if (!window.confirm(what + '을 ' + n + '명에게 지금 보냅니다. 계속할까요?')) return;
    setBusy(true); setMsg(null);
    Sysbar.invokeAuthed(getSb(), MAIL_FN, { mode: 'send', run_id: run.id, revised: !!revised }).then(function(r) {
      setBusy(false);
      var d = r && r.data;
      var err = (d && d.error) || (r && r.error && r.error.message);
      // 결과와 관계없이 발송 시도를 기록한다(받는 사람별 결과는 payroll_mail_logs)
      Sysbar.logPayrollAccess(getSb(), 'mail_send', { period: run.period, runType: run.run_type,
        detail: { revised: !!revised, targets: n, ok: !err && !!(d && d.ok), sent: (d && d.sent) || 0, failed: (d && d.failed) || 0 } });
      if (err || !d || !d.ok) { setMsg({ t: 'e', s: '발송하지 못했습니다: ' + (err || '응답 없음') }); loadLogs(); return; }
      setMsg({ t: d.failed ? 'w' : 's',
               s: d.note ? d.note : ('발송 ' + d.sent + '명' + (d.failed ? ' · 실패 ' + d.failed + '명 — 아래 표에서 사유를 확인한 뒤 다시 보내세요.' : ' 완료')) });
      loadLogs();
    });
  }

  function stBadge(r) {
    if (r.st === 'sent')       return <span className="badge bg">발송됨</span>;
    if (r.st === 'old')        return <span className="badge ba">이전 확정본 발송</span>;
    if (r.st === 'failed')     return <span className="badge br">실패</span>;
    if (r.st === 'pending')    return <span className="badge bgr">미발송</span>;
    if (r.st === 'noemail')    return <span className="badge br">이메일 없음</span>;
    return <span className="badge bgr">대상 아님</span>;
  }
  function stNote(r) {
    if (r.st === 'failed' && r.last) return r.last.error || '';
    if ((r.st === 'sent' || r.st === 'old') && r.lastSent) return fmtDateTime(r.lastSent.sent_at) + (r.lastSent.kind === 'revised' ? ' (수정본)' : '');
    if (r.st === 'nolink') return '계정 없는 대상자 — 인쇄·PDF 로 전달';
    if (r.st === 'contractor') return '용역직 계정 — 명세서 화면 접근 불가';
    if (r.st === 'noemail') return '[설정] 탭 → 대상자 관리에서 수신 이메일 입력';
    return '';
  }

  return (
    <div className="card">
      <div className="pr-bar">
        <span style={{ fontWeight: 700 }}>📧 알림 메일</span>
        <span className="badge bg">발송 {cnt('sent')}</span>
        {pendingN > 0 && <span className="badge bgr">미발송·실패 {pendingN}</span>}
        {oldN > 0 && <span className="badge ba">수정본 대상 {oldN}</span>}
        {outN > 0 && <span className="badge br">대상 아님·이메일 없음 {outN}</span>}
        <span className="sep" />
        <button className="btn btn-s btn-sm" disabled={busy} onClick={function(){ setTestOpen(true); }}>🧪 테스트 발송</button>
        {confirmed && pendingN > 0 && <button className="btn btn-p btn-sm" disabled={busy} onClick={function(){ send(false); }}>{busy ? '보내는 중...' : '📧 알림 메일 발송 (' + pendingN + '명)'}</button>}
        {confirmed && oldN > 0 && <button className="btn btn-s btn-sm" disabled={busy} onClick={function(){ send(true); }} style={{ borderColor: '#d97706', color: '#92400e' }}>✉ 수정본 안내 발송 ({oldN}명)</button>}
      </div>
      <div className={'al ' + (info.t === 'w' ? 'al-w' : 'al-i')}>{info.s}</div>
      {msg && <div className={'al ' + (msg.t === 'e' ? 'al-e' : (msg.t === 'w' ? 'al-w' : 'al-s'))}>{msg.s}</div>}
      <div className="tbl-wrap">
        <table>
          <thead><tr><th>대상자</th><th>수신 이메일</th><th className="tc">상태</th><th>기록</th></tr></thead>
          <tbody>
            {recips.map(function(r) {
              return (
                <tr key={r.id}>
                  <td style={{ fontWeight: 600 }}>{r.name}</td>
                  <td style={{ fontSize: 12 }}>{r.masked}</td>
                  <td className="tc">{stBadge(r)}</td>
                  <td style={{ fontSize: 11, color: r.st === 'failed' ? '#991b1b' : '#64748b' }}>{stNote(r)}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {testOpen && <MailTestModal run={run} recips={recips} onClose={function(){ setTestOpen(false); }} />}
    </div>
  );
}

// ── 급여대장 엑셀 내려받기 ─────────────────────────────────────────
// 화면 상태가 아니라 DB 에 저장된 명세서로 만든다(그래서 저장하지 않은 변경이 있으면 막는다).
// 시트 구성·파일명은 payroll-excel.js + config.js PAYROLL.EXCEL_*.
// 넣지 않는 것: 계좌번호·생년월일·이메일·월별수당 참고값.

// PostgREST 기본 1000행 제한을 넘는 조회(연간 항목 등)를 나눠 받는다.
function fetchAllPaged(makeQuery, ctx) {
  var size = 1000, out = [];
  function page(from) {
    return makeQuery().range(from, from + size - 1).then(must(ctx)).then(function(r) {
      var d = r.data || [];
      out = out.concat(d);
      return d.length < size ? out : page(from + size);
    });
  }
  return page(0);
}
function chunkList(arr, n) {
  var out = [];
  for (var i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

// kind: 'month'(key 'YYYY-MM' — 지급용·신고용) | 'year'(key 'YYYY' — 1~12월, 데이터 있는 달만)
// 반환: Promise<{ empty } | { file, sheets:[{name, rows, sum}], warnings }>
function exportPayrollExcel(kind, key) {
  if (!window.XLSX || !window.PayrollExcel) return Promise.reject(new Error('엑셀 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.'));
  var sb = getSb();
  var q = sb.from('payroll_runs').select('id,period,run_type,status');
  q = kind === 'month' ? q.eq('period', key) : q.gte('period', key + '-01').lte('period', key + '-12');
  return q.then(must('급여 묶음 조회')).then(function(rr) {
    var runs = (rr.data || []).slice().sort(function(a, b) {
      if (a.period !== b.period) return a.period < b.period ? -1 : 1;
      return a.run_type === b.run_type ? 0 : (a.run_type === 'pay' ? -1 : 1);
    });
    if (!runs.length) return { empty: true };
    var runIds = runs.map(function(r) { return r.id; });
    return Promise.all([
      fetchAllPaged(function() {
        return sb.from('payroll_slips')
          .select('id,run_id,employee_id,name_snap,dept_snap,position_snap,total_earning,total_deduction,net_pay')
          .in('run_id', runIds).order('id');
      }, '명세서 조회'),
      sb.from('payroll_items').select('*').then(must('항목 조회')),
      sb.from('payroll_employees').select('id,sort_order').then(must('대상자 조회')),
    ]).then(function(res) {
      var slips = res[0];
      var slipIds = slips.map(function(s) { return s.id; });
      return Promise.all(chunkList(slipIds, 100).map(function(ids) {
        return fetchAllPaged(function() {
          return sb.from('payroll_slip_lines')
            .select('slip_id,item_id,item_name,item_kind,sort_order,amount,method')
            .in('slip_id', ids).order('id');
        }, '명세서 항목 조회');
      })).then(function(parts) {
        var lines = [].concat.apply([], parts);
        var empOrder = {};
        (res[2].data || []).forEach(function(e) { empOrder[e.id] = e.sort_order; });
        var slipRun = {};
        slips.forEach(function(s) { slipRun[s.id] = s.run_id; });

        var built = [], anyDraft = false, warnings = [];
        runs.forEach(function(run) {
          var ss = slips.filter(function(s) { return s.run_id === run.id; });
          if (!ss.length) return;   // 명세서 없는 묶음(데이터 없는 달)은 시트를 만들지 않는다
          var b = PayrollExcel.buildSheet({
            run: run, slips: ss, items: res[1].data || [], empOrder: empOrder,
            lines: lines.filter(function(l) { return slipRun[l.slip_id] === run.id; }),
          });
          if (run.status !== 'confirmed') anyDraft = true;
          b.warnings.forEach(function(w) { warnings.push(b.sheetName + ' — ' + w); });
          built.push(b);
        });
        if (!built.length) return { empty: true };

        var wb = XLSX.utils.book_new();
        built.forEach(function(b) { XLSX.utils.book_append_sheet(wb, PayrollExcel.toWorksheet(XLSX, b), b.sheetName); });
        var file = PayrollExcel.fileName(kind, key, anyDraft);
        XLSX.writeFile(wb, file);
        return {
          file: file, warnings: warnings,
          sheets: built.map(function(b) { return { name: b.sheetName, rows: b.rows.length, sum: b.sum }; }),
        };
      });
    });
  });
}

// ── 급여 송금내역 (송금 계좌 · 추가 송금 줄 · 내려받기) ─────────────────
// 계좌번호 전체는 화면이 읽지 못한다(DB 컬럼 권한). 목록은 뒤 4자리만, 전체 번호는 내려받기 함수에서만 받는다.
var BANKS = PCFG.BANKS || [];
var RETIRE_ITEM = PCFG.RETIREMENT_ITEM || '';
var TR_DEPOSITOR = PCFG.TRANSFER_DEPOSITOR || {};

];

var ACCOUNT_COLS = 'id,owner_type,employee_id,label,bank_code,bank_name,account_tail,holder,is_default,active,sort_order';

function acctText(a) {

// 보관용 .xlsx(비밀번호) 생성 라이브러리 — 송금내역을 내려받을 때만 불러온다(계좌번호를 다루므로 무결성 해시 고정).
var XP_SRC = 'https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js';
var XP_SRI = 'sha384-YnsK3VaaV54M5EcU58Pt9SdJqzL0iZpQzQAcav+18Kgn5tbwk16y/3g6FpT2d83h';
var _xpLoading = null;
function loadXlsxPopulate() {
  if (window.XlsxPopulate) return Promise.resolve(window.XlsxPopulate);
  if (_xpLoading) return _xpLoading;
  _xpLoading = new Promise(function(resolve, reject) {
    var s = document.createElement('script');
    s.src = XP_SRC; s.integrity = XP_SRI; s.crossOrigin = 'anonymous'; s.async = true;
    s.onload = function() { window.XlsxPopulate ? resolve(window.XlsxPopulate) : reject(new Error('xlsx-populate 를 불러오지 못했습니다.')); };
    s.onerror = function() { _xpLoading = null; reject(new Error('xlsx-populate 를 불러오지 못했습니다(네트워크 또는 무결성 확인 실패).')); };
    document.head.appendChild(s);
  });
  return _xpLoading;
}
function saveBlob(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}
function transferErrText(err) {
  if (!err) return '';
  if (err.code === '55000') return '확정된 지급용 묶음만 송금내역을 내려받을 수 있습니다. 먼저 확정하세요.';
  if (err.code === 'P0002') return '이 달 지급용 묶음이 없습니다.';
  if (err.code === '42501') return '급여 관리 권한이 있는 사용자만 송금내역을 볼 수 있습니다.';
  return err.message || String(err);
}

// 이 달 지급용 명세서의 퇴직금(config RETIREMENT_ITEM) 합계 — 퇴직금 적립 기본 금액
function loadRetireSum(period) {
  var sb = getSb();
  if (!RETIRE_ITEM) return Promise.resolve(null);
  return sb.from('payroll_runs').select('id').eq('period', period).eq('run_type', 'pay').maybeSingle()
    .then(must('지급용 묶음 조회')).then(function(r) {
      if (!r.data) return null;
      return sb.from('payroll_slip_lines').select('amount,payroll_slips!inner(run_id)')
        .eq('payroll_slips.run_id', r.data.id).eq('item_name', RETIRE_ITEM).eq('item_kind', 'deduction')
        .then(must('퇴직금 합계 조회')).then(function(lr) {
          return (lr.data || []).reduce(function(t, x) { return t + (Number(x.amount) || 0); }, 0);
        });
    });
}

// ── 급여 편집 탭(지급용) 아래: 추가 송금 줄 ─────────────────────────
// 출장비·퇴직금 적립·현금·기타. 확정 후에도 고칠 수 있다(입력·수정·삭제는 변경 기록에 남는다).
function TransferLinesPanel({ period, empMap, usersMap }) {
  const [lines, setLines] = useState([]);
  const [orig, setOrig] = useState({});
  const [accounts, setAccounts] = useState([]);
  const [retire, setRetire] = useState(null);
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [msg, setMsg] = useState(null);
  var keySeq = useRef(0);

  function toRow(x) {
    keySeq.current += 1;
    return { key: 'k' + keySeq.current, id: x.id || null, kind: x.kind || 'travel', employee_id: x.employee_id || '',
             account_id: x.account_id || '', amount: x.amount != null ? String(x.amount) : '',
             depositor: x.depositor || '', memo: x.memo || '', sort_order: x.sort_order || 0 };
  }
  function load() {
    setLoading(true);
    var sb = getSb();
    Promise.all([
      sb.from('payroll_transfer_lines').select('*').eq('period', period).order('sort_order').order('created_at'),
      sb.from('payroll_accounts').select(ACCOUNT_COLS),
      loadRetireSum(period).catch(function(e) { reportErr(e); return null; }),
    ]).then(function(r) {
      if (r[0].error) Sysbar.showError(r[0].error, '추가 송금 조회');
      if (r[1].error) Sysbar.showError(r[1].error, '송금 계좌 조회');
      var o = {};
      (r[0].data || []).forEach(function(x) { o[x.id] = x; });
      setOrig(o);
      setLines((r[0].data || []).map(toRow));
      setAccounts(r[1].data || []);
      setRetire(r[2]);
      setDirty(false); setLoading(false);
    });
  }
  useEffect(function() { load(); }, [period]);

  var empList = sortEmployees(Object.keys(empMap).map(function(id) { return empMap[id]; }), usersMap);
  var acctMap = {}; accounts.forEach(function(a) { acctMap[a.id] = a; });
  function acctOptions(row) {
    return accounts.filter(function(a) {
      if (a.id === row.account_id) return true;
      if (!a.active) return false;
      return a.owner_type === 'company' || (row.employee_id && a.employee_id === row.employee_id);
    });
  }
  function defaultAccountFor(empId) {
    var d = accounts.filter(function(a) { return a.active && a.employee_id === empId && a.is_default; })[0];
    return d ? d.id : '';
  }
  function firstCompanyAccount() {
    var d = accounts.filter(function(a) { return a.active && a.owner_type === 'company'; })[0];
    return d ? d.id : '';
  }
  function setRow(key, patch) {
    setLines(function(prev) { return prev.map(function(r) { return r.key === key ? Object.assign({}, r, patch) : r; }); });
    setDirty(true); setMsg(null);
  }
  function addRow(kind) {
    var row = toRow({ kind: kind || 'travel' });
    if (kind === 'retirement') { row.amount = retire != null ? String(retire) : ''; row.account_id = firstCompanyAccount(); }
    setLines(function(prev) { return prev.concat([row]); });
    setDirty(true); setMsg(null);
  }
  function removeRow(key) {
    setLines(function(prev) { return prev.filter(function(r) { return r.key !== key; }); });
    setDirty(true); setMsg(null);
  }
  function copyPrev() {
    var prev = shiftPeriod(period, -1);
    if (lines.length && !window.confirm('이미 ' + lines.length + '줄이 있습니다. ' + fmtPeriodKo(prev) + ' 줄을 아래에 추가로 복사할까요?')) return;
    getSb().from('payroll_transfer_lines').select('*').eq('period', prev).order('sort_order').order('created_at')
      .then(function(r) {
        if (r.error) { Sysbar.showError(r.error, '전월 추가 송금 조회'); return; }
        var src = r.data || [];
        if (!src.length) { setMsg({ t: 'w', s: fmtPeriodKo(prev) + ' 추가 송금 줄이 없습니다.' }); return; }
        var copied = src.map(function(x) {
          var row = toRow(Object.assign({}, x, { id: null }));
          if (x.kind === 'retirement' && retire != null) row.amount = String(retire);   // 이번 달 퇴직금 합계로 다시 계산
          return row;
        });
        setLines(function(p) { return p.concat(copied); });
        setDirty(true);
        setMsg({ t: 'i', s: fmtPeriodKo(prev) + ' 줄 ' + copied.length + '개를 복사했습니다. 금액을 확인하고 저장하세요.' });
      });
  }

  function save() {
    setMsg(null);
    for (var i = 0; i < lines.length; i++) {
      var r = lines[i];
      if (!/^\d+$/.test(String(r.amount).replace(/,/g, ''))) { setMsg({ t: 'e', s: (i + 1) + '번째 줄 금액을 확인하세요(0 이상 정수).' }); return; }
    }
    var sb = getSb();
    var nowIso = new Date().toISOString();
    function payloadOf(r, idx) {
      return { period: period, kind: r.kind, employee_id: r.employee_id || null,
               account_id: r.kind === 'cash' ? null : (r.account_id || null),
               amount: parseInt(String(r.amount).replace(/,/g, ''), 10) || 0,
               depositor: r.kind === 'cash' ? null : (r.depositor.trim() || null),
               memo: r.memo.trim() || null, sort_order: idx };
    }
    var keep = {}; lines.forEach(function(r) { if (r.id) keep[r.id] = true; });
    var delIds = Object.keys(orig).filter(function(id) { return !keep[id]; });
    var updates = [], inserts = [];
    lines.forEach(function(r, idx) {
      var p = payloadOf(r, idx);
      if (!r.id) { inserts.push(p); return; }
      var o = orig[r.id];
      var changed = ['kind', 'employee_id', 'account_id', 'amount', 'depositor', 'memo', 'sort_order'].some(function(k) {
        return String(o[k] == null ? '' : o[k]) !== String(p[k] == null ? '' : p[k]);
      });
      if (changed) updates.push({ id: r.id, p: Object.assign(p, { updated_at: nowIso }) });
    });
    setBusy(true);
    var chain = Promise.resolve();
    if (delIds.length) chain = chain.then(function() {
      return sb.from('payroll_transfer_lines').delete().in('id', delIds).select('id').then(must('추가 송금 삭제', { expectRows: true }));
    });
    updates.forEach(function(u) {
      chain = chain.then(function() {
        return sb.from('payroll_transfer_lines').update(u.p).eq('id', u.id).select('id').then(must('추가 송금 수정', { expectRows: true }));
      });
    });
    if (inserts.length) chain = chain.then(function() {
      return sb.from('payroll_transfer_lines').insert(inserts).select('id').then(must('추가 송금 등록', { expectRows: true }));
    });
    chain.then(function() {
      setBusy(false);
      setMsg({ t: 's', s: '추가 송금을 저장했습니다.' });
      load();
    }).catch(function(e) { setBusy(false); reportErr(e); });
  }

  if (loading) return <div className="card"><div className="loading">추가 송금 불러오는 중...</div></div>;
  var trTotal = 0, cashTotal = 0;
  lines.forEach(function(r) { var v = parseInt(String(r.amount).replace(/,/g, ''), 10) || 0; if (r.kind === 'cash') cashTotal += v; else trTotal += v; });

  return (
    <div className="card">
      <div className="sh">
        <div className="st">💸 추가 송금 ({fmtPeriodKo(period)})</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <button className="btn btn-s btn-sm" disabled={busy} onClick={function(){ addRow('travel'); }}>+ 출장비</button>
          <button className="btn btn-s btn-sm" disabled={busy} onClick={function(){ addRow('retirement'); }}>+ 퇴직금 적립</button>
          <button className="btn btn-s btn-sm" disabled={busy} onClick={function(){ addRow('cash'); }}>+ 현금</button>
          <button className="btn btn-s btn-sm" disabled={busy} onClick={function(){ addRow('other'); }}>+ 기타</button>
          <button className="btn btn-s btn-sm" disabled={busy} onClick={copyPrev}>전월 복사</button>
          <button className="btn btn-p btn-sm" disabled={busy || !dirty} onClick={save}>{busy ? '저장 중...' : (dirty ? '💾 추가 송금 저장' : '저장됨')}</button>
        </div>
      </div>
      {msg && <div className={'al ' + ({ e: 'al-e', w: 'al-w', s: 'al-s', i: 'al-i' })[msg.t]}>{msg.s}</div>}
      {dirty && <div className="al al-w">저장하지 않은 추가 송금 변경이 있습니다. 송금내역은 저장된 값으로 만들어집니다.</div>}
      {lines.length === 0 ? <div className="loading">추가 송금 줄이 없습니다.</div> : (
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>구분</th><th>대상자</th><th>송금 계좌</th><th className="tr">금액</th><th>입금자명</th><th>메모</th><th></th></tr></thead>
            <tbody>
              {lines.map(function(r) {
                var isCash = r.kind === 'cash';
                var opts = acctOptions(r);
                return (
                  <tr key={r.key}>
                    <td>
                      <select className="fi" style={{ minWidth: 100 }} value={r.kind}
                        onChange={function(e){ var k = e.target.value; setRow(r.key, k === 'cash' ? { kind: k, account_id: '' } : { kind: k }); }}>
                        {TR_KINDS.map(function(x) { return <option key={x.k} value={x.k}>{x.l}</option>; })}
                      </select>
                    </td>
                    <td>
                      <select className="fi" style={{ minWidth: 110 }} value={r.employee_id}
                        onChange={function(e){
                          var id = e.target.value;
                          var patch = { employee_id: id };
                          if (!isCash && id && !r.account_id) patch.account_id = defaultAccountFor(id);
                          setRow(r.key, patch);
                        }}>
                        <option value="">(없음)</option>
                        {empList.map(function(emp) { return <option key={emp.id} value={emp.id}>{personOf(emp, usersMap).name}{emp.active ? '' : ' (사용중지)'}</option>; })}
                      </select>
                    </td>
                    <td>
                      {isCash ? <span style={{ color: '#94a3b8', fontSize: 12 }}>계좌 없음(현금)</span> : (
                        <select className="fi" style={{ minWidth: 180 }} value={r.account_id}
                          onChange={function(e){ setRow(r.key, { account_id: e.target.value }); }}>
                          <option value="">(계좌 선택)</option>
                          {opts.map(function(a) { return <option key={a.id} value={a.id}>{acctText(a)}{a.active ? '' : ' [사용중지]'}</option>; })}
                        </select>
                      )}
                    </td>
                    <td className="tr">
                      <input className="fi" style={{ width: 120, textAlign: 'right' }} inputMode="numeric" value={showAmt(r.amount)}
                        onChange={function(e){ setRow(r.key, { amount: cleanAmt(e.target.value).replace('-', '') }); }} />
                      {r.kind === 'retirement' && retire != null && (
                        <div className="pr-sub">명세서 {RETIRE_ITEM} 합계 {won(retire)}</div>
                      )}
                    </td>
                    <td>
                      {isCash ? <span style={{ color: '#94a3b8' }}>-</span> : (
                        <input className="fi" style={{ width: 110 }} value={r.depositor} placeholder={trDepositorDefault(r.kind)}
                          onChange={function(e){ setRow(r.key, { depositor: e.target.value }); }} />
                      )}
                    </td>
                    <td>
                      <input className="fi" style={{ minWidth: 140 }} value={r.memo} placeholder={isCash ? '누구에게 얼마' : ''}
                        onChange={function(e){ setRow(r.key, { memo: e.target.value }); }} />
                    </td>
                    <td className="tc"><button className="btn btn-d btn-sm" disabled={busy} onClick={function(){ removeRow(r.key); }}>삭제</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
      <div style={{ fontSize: 12, color: '#475569', marginTop: 8 }}>
        추가 송금 {lines.filter(function(r){ return r.kind !== 'cash'; }).length}줄 · {won(trTotal)}원
        {' '}/ 현금 {lines.filter(function(r){ return r.kind === 'cash'; }).length}줄 · {won(cashTotal)}원
      </div>
      <div style={{ fontSize: 11, color: '#94a3b8', marginTop: 6, lineHeight: 1.6 }}>
        · 급여 송금 줄은 확정 명세서의 실지급액으로 자동으로 만들어지므로 여기에 넣지 않습니다.<br/>
        · 현금 줄은 송금내역에 금액만 나오고 메모는 나오지 않습니다. 계좌는 ⚙ 설정 → 🏦 송금 계좌에서 등록합니다.
      </div>
    </div>
  );
}

function ExportModal({ period, onClose }) {
  var y0 = parseInt(period.slice(0, 4), 10);
  const [kind, setKind] = useState('month');
  const [year, setYear] = useState(String(y0));
  const [busy, setBusy] = useState(false);
  const [res, setRes] = useState(null);
  // 송금내역
  const [tp, setTp] = useState(null);        // { loading } | { err } | { model }
  const [fmt, setFmt] = useState('xls');
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');

  useEffect(function() {
    if (kind !== 'transfer') return;
    setTp({ loading: true });
    getSb().rpc('payroll_transfer_export', { p_period: period, p_format: null, p_preview: true }).then(function(r) {
      if (r.error) { setTp({ err: transferErrText(r.error) }); return; }
      setTp({ model: PayrollTransfer.build(r.data) });
    });
  }, [kind, period]);

  function run() {
    if (kind === 'transfer') { runTransfer(); return; }
    setBusy(true); setRes(null);
    exportPayrollExcel(kind, kind === 'month' ? period : year).then(function(r) {
      setBusy(false);
      if (r.empty) { setRes({ t: 'w', s: '내려받을 급여 데이터가 없습니다.' }); return; }
      Sysbar.logPayrollAccess(getSb(), 'excel_download', { period: kind === 'month' ? period : year,
        detail: { kind: kind === 'month' ? 'ledger_month' : 'ledger_year', file: r.file, sheets: r.sheets.length } });
      setRes({ t: r.warnings.length ? 'w' : 's', file: r.file, sheets: r.sheets, warnings: r.warnings });
    }).catch(function(e) {
      setBusy(false);
      if (e && e.ctx) reportErr(e);
      setRes({ t: 'e', s: '내려받지 못했습니다: ' + ((e && e.err && e.err.message) || (e && e.message) || e) });
    });
  }

  function runTransfer() {
    setRes(null);
    if (fmt === 'xlsx') {
      if (pw.length < 4) { setRes({ t: 'e', s: '파일 비밀번호를 4자 이상 입력하세요.' }); return; }
      if (pw !== pw2) { setRes({ t: 'e', s: '파일 비밀번호 두 칸이 서로 다릅니다.' }); return; }
    }
    setBusy(true);
    var name = PayrollTransfer.fileName(period, fmt);
    // .xlsx 라이브러리를 먼저 불러온 뒤에 전체 계좌번호를 받는다(불러오기 실패 시 내려받기 기록이 남지 않게).
    (fmt === 'xlsx' ? loadXlsxPopulate() : Promise.resolve(null)).then(function(XP) {
      return getSb().rpc('payroll_transfer_export', { p_period: period, p_format: fmt, p_preview: false }).then(function(r) {
        if (r.error) throw { transfer: true, err: r.error };
        var model = PayrollTransfer.build(r.data);
        if (fmt === 'xls') {
          XLSX.writeFile(PayrollTransfer.toXlsWorkbook(XLSX, model), name, { bookType: 'biff8' });
          return model;
        }
        return PayrollTransfer.toXlsxBlob(XP, model, pw, 'blob').then(function(blob) { saveBlob(blob, name); return model; });
      });
    }).then(function(model) {
      setBusy(false); setPw(''); setPw2('');
      setRes({ t: model.missing.length ? 'w' : 's', tfile: name, model: model });
    }).catch(function(e) {
      setBusy(false);
      setRes({ t: 'e', s: '내려받지 못했습니다: ' + (e && e.transfer ? transferErrText(e.err) : ((e && e.message) || e)) });
    });
  }

  var years = [y0 - 2, y0 - 1, y0, y0 + 1];
  var tm = tp && tp.model;
  var canRun = kind !== 'transfer' || (tm && !tp.loading);
  return (
    <div className="mbg" onClick={onClose}>
      <div className="mbox" onClick={function(e){ e.stopPropagation(); }} style={{ maxWidth: 520 }}>
        <div className="mh"><span className="mht">📥 엑셀 내려받기</span><button className="mc" onClick={onClose}>×</button></div>
        <div className="mb">
          <label style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginBottom: 10, cursor: 'pointer' }}>
            <input type="radio" checked={kind === 'month'} onChange={function(){ setKind('month'); setRes(null); }} style={{ marginTop: 3 }} />
            <span><b>급여대장 · 이번 달</b> — {fmtPeriodKo(period)} 지급용·신고용 (시트 2개)<br/>
              <span style={{ fontSize: 11, color: '#64748b' }}>{PayrollExcel.fileName('month', period, false)}</span></span>
          </label>
          <label style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginBottom: 10, cursor: 'pointer' }}>
            <input type="radio" checked={kind === 'year'} onChange={function(){ setKind('year'); setRes(null); }} style={{ marginTop: 3 }} />
            <span><b>급여대장 · 연간</b> —
              <select className="fi" value={year} disabled={kind !== 'year'} onChange={function(e){ setYear(e.target.value); }}
                style={{ width: 90, padding: '3px 6px', margin: '0 6px', display: 'inline-block' }}>
                {years.map(function(y) { return <option key={y} value={String(y)}>{y}년</option>; })}
              </select>
              1~12월 (데이터 있는 달만, 월별 시트)<br/>
              <span style={{ fontSize: 11, color: '#64748b' }}>{PayrollExcel.fileName('year', year, false)}</span></span>
          </label>
          {Sysbar.can('payroll_bank') && (   /* 송금내역 = 기능 권한 'payroll_bank' */
          <label style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginBottom: 12, cursor: 'pointer' }}>
            <input type="radio" checked={kind === 'transfer'} onChange={function(){ setKind('transfer'); setRes(null); }} style={{ marginTop: 3 }} />
            <span><b>송금내역</b> — {fmtPeriodKo(period)} 지급용 확정분 (은행 대량이체용)<br/>
              <span style={{ fontSize: 11, color: '#64748b' }}>{PayrollTransfer.fileName(period, fmt)}</span></span>
          </label>
          )}

          {kind !== 'transfer' && (
            <div className="al al-i" style={{ fontSize: 12 }}>
              저장된 명세서 기준입니다. 작성중인 묶음도 포함되며, 제목과 파일명에 "작성중"이 표시됩니다.<br/>
              계좌번호·생년월일·이메일·월별수당 참고값은 넣지 않습니다.
            </div>
          )}

          {kind === 'transfer' && (
            <div>
